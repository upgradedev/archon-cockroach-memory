        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-metadata.outputs.name }}
          path: supply-chain-reports/sbom/
          if-no-files-found: error
          retention-days: 90

  upload-sarif:
    name: Publish trusted SARIF evidence
    needs:
      - shell-and-workflows
      - infrastructure-policy
      - sbom
    if: >-
      always() &&
      needs.shell-and-workflows.result == 'success' &&
      needs.infrastructure-policy.result == 'success' &&
      needs.sbom.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download static-analysis evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.shell-and-workflows.outputs.artifact-name }}
          path: retrieved/static

      - name: Download infrastructure evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.infrastructure-policy.outputs.artifact-name }}
          path: retrieved/iac

      - name: Download SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sbom.outputs.artifact-name }}
          path: retrieved/sbom

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: retrieved/static/zizmor.sarif
          category: zizmor/workflows

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: retrieved/iac/trivy-iac.sarif
          category: trivy/iac

      - name: Upload Trivy backend SARIF
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: retrieved/sbom/trivy-backend.sarif
          category: trivy/backend

      - name: Upload Trivy frontend SARIF
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: retrieved/sbom/trivy-frontend.sarif
          category: trivy/frontend

  release-evidence:
    name: Bind exact-SHA supply-chain release evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - shell-and-workflows
      - infrastructure-policy
      - sbom
      - upload-sarif
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Bind ephemeral release-evidence paths
        shell: bash
        run: |
          {
            echo "EVIDENCE_ROOT=$RUNNER_TEMP/archon-supply-chain-release-inputs"
            echo "RELEASE_ROOT=$RUNNER_TEMP/archon-supply-chain-release"
          } >>"$GITHUB_ENV"

      - name: Download exact-run static-analysis evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.shell-and-workflows.outputs.artifact-name }}
          path: ${{ runner.temp }}/archon-supply-chain-release-inputs/static

      - name: Download exact-run infrastructure evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.infrastructure-policy.outputs.artifact-name }}
          path: ${{ runner.temp }}/archon-supply-chain-release-inputs/iac

      - name: Download exact-run SBOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sbom.outputs.artifact-name }}
          path: ${{ runner.temp }}/archon-supply-chain-release-inputs/sbom

      - name: Create fail-closed exact-SHA release receipt
        id: receipt
        shell: bash
        env:
          STATIC_ARTIFACT: ${{ needs.shell-and-workflows.outputs.artifact-name }}
          IAC_ARTIFACT: ${{ needs.infrastructure-policy.outputs.artifact-name }}
          SBOM_ARTIFACT: ${{ needs.sbom.outputs.artifact-name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test -d "$EVIDENCE_ROOT/static"
          test -d "$EVIDENCE_ROOT/iac"
          test -d "$EVIDENCE_ROOT/sbom"
          test -z "$(find "$EVIDENCE_ROOT" -type l -print -quit)"

          for required in \
            static/shellcheck-status.json \
            static/actionlint.raw.json \
            static/actionlint-all.json \
            static/actionlint-blocking-findings.json \
            static/actionlint-queue-compatibility.json \
            static/actionlint-status.json \
            static/zizmor-status.json \
            static/waiver-ledger.sha256 \
            iac/cfn-lint-status.json \
            iac/cfn-lint-finops.json \
            iac/guard-current-status.json \
            iac/guard-edge-waf.txt \
            iac/guard-finops.txt \
            iac/trivy-iac-status.json \
            iac/trivy-iac.json \
            iac/trivy-iac.sarif \
            iac/trivy-iac-compatibility-findings.json \
            iac/trivy-iac-blocking-findings.json \
            iac/trivy-version.txt \
            sbom/provenance.json \
            sbom/trivy-sbom-status.json \
            sbom/trivy-backend-policy.json \
            sbom/trivy-frontend-policy.json \
            sbom/trivy-lambda-content-policy.json \
            sbom/trivy-sbom-compatibility-findings.json \
            sbom/trivy-sbom-blocking-findings.json \
            sbom/trivy-version.txt \
            sbom/waiver-ledger.sha256 \
            sbom/lambda-zip-content.sha256 \
            sbom/sbom-inputs-and-documents.sha256 \
            sbom/backend.spdx.json \
            sbom/backend.syft.json \
            sbom/frontend.spdx.json \
            sbom/frontend.syft.json \
            sbom/lambda-content.spdx.json; do
            test -s "$EVIDENCE_ROOT/$required"
          done

          jq -e \
            --arg sourceSha "$SOURCE_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" '
              .schemaVersion == 1 and
              .sourceSha == $sourceSha and
              .runId == $runId and
              .runAttempt == $runAttempt and
              .enforcement == "blocking" and
              .canonicalArtifact ==
                "SAM ArchonFunction Lambda ZIP content" and
              .containerPath == "retired-non-release"
            ' "$EVIDENCE_ROOT/sbom/provenance.json" >/dev/null
          jq -e \
            '.mode == "blocking" and .exitCode == 0' \
            "$EVIDENCE_ROOT/static/shellcheck-status.json" >/dev/null
          jq -e \
            '.mode == "blocking-exact-parser-compatibility" and
             .effectiveExitCode == 0 and
             .rawExitCode == 1 and
             .rawFindings == 6 and
             .blockingFindings == 0 and
             .compatibility.analyzer == "actionlint" and
             .compatibility.version == "1.7.12" and
             .compatibility.feature == "concurrency.queue" and
             .compatibility.diagnostic ==
               "unexpected key \"queue\" for \"concurrency\" section. expected one of \"cancel-in-progress\", \"group\"" and
             .compatibility.acceptedDiagnostics == 6 and
             .compatibility.expectedPaths == [
               ".github/workflows/bootstrap-aws.yml",
               ".github/workflows/deploy-aws.yml",
               ".github/workflows/foundation-migration.yml",
               ".github/workflows/recover-aws.yml"
             ] and
             (.compatibility.expectedDiagnostics | length) == 6 and
             ([.compatibility.expectedDiagnostics[].filepath] | unique) ==
               .compatibility.expectedPaths and
             (.compatibility.sourceAnchors | length) == 5 and
             ([.compatibility.sourceAnchors[].count] | add) == 6' \
            "$EVIDENCE_ROOT/static/actionlint-status.json" >/dev/null
          jq --slurp -e \
            --slurpfile status \
              "$EVIDENCE_ROOT/static/actionlint-status.json" '
            length == 1 and
            (.[0] | type) == "array" and
            (.[0] | length) == 6 and
            (.[0] as $findings |
              all($status[0].compatibility.expectedDiagnostics[];
                . as $site |
                any($findings[];
                  .kind == "syntax-check" and
                  .message == $status[0].compatibility.diagnostic and
                  .filepath == $site.filepath and
                  .line == $site.line and
                  .column == $site.column and
                  .end_column == $site.endColumn and
                  .snippet == $site.snippet
                )
              )
            )
          ' "$EVIDENCE_ROOT/static/actionlint.raw.json" >/dev/null
          jq -e \
            --slurpfile status \
              "$EVIDENCE_ROOT/static/actionlint-status.json" '
            . as $findings |
            length == 6 and
            all($status[0].compatibility.expectedDiagnostics[];
              . as $site |
              any($findings[];
                .kind == "syntax-check" and
                .message == $status[0].compatibility.diagnostic and
                .filepath == $site.filepath and
                .line == $site.line and
                .column == $site.column and
                .end_column == $site.endColumn and
                .snippet == $site.snippet
              )
            )
          ' \
            "$EVIDENCE_ROOT/static/actionlint-queue-compatibility.json" \
            >/dev/null
          jq -e 'length == 6' \
            "$EVIDENCE_ROOT/static/actionlint-all.json" >/dev/null
          jq -e 'length == 0' \
            "$EVIDENCE_ROOT/static/actionlint-blocking-findings.json" \
            >/dev/null
          jq -e \
            '.mode == "blocking" and
             .jsonExitCode == 0 and
             .sarifExitCode == 0' \
            "$EVIDENCE_ROOT/static/zizmor-status.json" >/dev/null
          expected_templates='[
            "aws/template.yaml",
            "aws/bootstrap-oidc.yaml",
            "aws/edge-waf.yaml",
            "aws/finops.yaml"
          ]'
          for status_file in \
            "$EVIDENCE_ROOT/iac/cfn-lint-status.json" \
            "$EVIDENCE_ROOT/iac/guard-current-status.json"; do
            jq -e \
              --argjson templates "$expected_templates" '
                .mode == "blocking" and
                .applicationExitCode == 0 and
                .foundationExitCode == 0 and
                .edgeWafControlPlaneExitCode == 0 and
                .finopsControlPlaneExitCode == 0 and
                .templates == $templates
              ' "$status_file" >/dev/null
          done
          jq -e \
            '.schema == "archon.trivy-iac.compatibility" and
             .version == 2 and
             .mode ==
               "blocking-exact-source-validated-parser-compatibilities" and
             .scanner == "Trivy" and
             .scannerVersion == "0.72.0" and
             .versionEvidence == {
               "toolLock":"0.72.0",
               "capturedCli":"0.72.0",
               "sarifDriver":"0.72.0"
             } and
             .thresholdSeverities == ["MEDIUM","HIGH","CRITICAL"] and
             .rawFindings == 3 and
             .compatibilityFindings == 3 and
             .blockingFindings == 0 and
             .acceptedWaivers == 0 and
