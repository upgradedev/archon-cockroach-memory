            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg mode blocking \
            '{
              schemaVersion: 1,
              sourceSha: $sourceSha,
              runId: $runId,
              runAttempt: $runAttempt,
              enforcement: $mode,
              canonicalArtifact: "SAM ArchonFunction Lambda ZIP content",
              containerPath: "retired-non-release"
