                ($run.results | length) == 3 and
                ([$run.results[].ruleId] | sort) ==
                  ["AWS-0011","AWS-0013","AWS-0132"] and
                all($run.results[];
                  . as $result |
                  ($status[0].compatibilities |
                    map(select(.ruleId == $result.ruleId)) | .[0]) as $contract |
                  $result.level == "error" and
                  ($result.locations | length) == 1 and
