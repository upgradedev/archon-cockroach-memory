              .dev == true and
              (.location | startswith("/node_modules/")))
          ' "$REPORT_DIR/trivy-sbom-compatibility-findings.json" >/dev/null
          jq -e 'length == 0' \
            "$REPORT_DIR/trivy-sbom-blocking-findings.json" >/dev/null
          test -s "$REPORT_DIR/waiver-ledger.sha256"
          {
