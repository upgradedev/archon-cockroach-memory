name: Foundation Storage Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, apply, verify, abort safely, or retire after migration.
        required: true
        type: choice
        options:
          - plan
          - apply
          - verify
          - abort
          - retire
      target_sha:
        description: Exact 40-character current main SHA proven by CI, CodeQL, and Supply Chain.
        required: true
        type: string
      confirmation:
        description: Use the exact apply, abort, or retire confirmation phrase.
        required: false
        type: string

concurrency:
  group: aws-foundation-migration
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read

env:
  APP_NAME: ${{ vars.AWS_APP_NAME || 'archon-memory' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_FOUNDATION_MIGRATION_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_APP_NAME || 'archon-memory' }}-github-foundation-migration
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  GITHUB_OIDC_PROVIDER_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:oidc-provider/token.actions.githubusercontent.com
  GITHUB_ORGANIZATION: upgradedev
  GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
  GITHUB_REPOSITORY_NAME: archon-cockroach-memory
  GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
  OPERATION: ${{ inputs.operation }}
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  authorize:
    name: Authorize exact green main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the approved incremental fixed-cost contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            def cents: (. * 100 | round);
            .incrementalFixedCostContract as $cost
            | [
                "initial",
                "afterFirstBilledKmsRotation",
                "afterSecondBilledKmsRotation"
              ] as $scenarioIds
            | (
                reduce $cost.lineItems[] as $item (
                  {};
                  reduce $scenarioIds[] as $scenario (
                    .;
                    .[$scenario] = (
                      (.[$scenario] // 0)
                      + ($item.monthlyUsdByScenario[$scenario] | cents)
                    )
                  )
                )
              ) as $computedScenarioCents
            | (
                [
                  $cost.scenarios[]
                  | {
                      key: .id,
                      value: (.expectedMonthlyUsd | cents)
                    }
                ] | from_entries
              ) as $declaredScenarioCents
            | (
                $declaredScenarioCents
                | to_entries
                | map(.value)
                | max
              ) as $computedMaximumCents
            | $cost.schema
                == "archon.aws.incremental-fixed-monthly-cost-contract"
            and $cost.schemaVersion == 1
            and $cost.scope
              == "incremental foundation + two edge stacks; not total application cost"
            and $cost.currency == "USD"
            and $cost.billingPeriod == "month"
            and $cost.pricingAsOf == "2026-08-03"
            and $cost.officialPricingUrls == {
              awsCloudWatch: "https://aws.amazon.com/cloudwatch/pricing/",
              awsKms: "https://aws.amazon.com/kms/pricing/",
              awsSecretsManager:
                "https://aws.amazon.com/secrets-manager/pricing/",
              awsWaf: "https://aws.amazon.com/waf/pricing/"
            }
            and ($cost.lineItems | length) == 5
            and (
              [$cost.lineItems[].id] | sort
            ) == ([
              "application-customer-managed-kms-key",
              "cloudfront-web-acls",
              "secrets-manager-secrets",
              "standard-cloudwatch-alarm-metrics",
              "web-acl-rules"
            ] | sort)
            and (
              [
                $cost.lineItems[]
                | {
                    key: .id,
                    value: {
                      quantity: .quantity,
                      unitMonthlyUsd: .unitMonthlyUsd,
                      pricingSource: .pricingSource,
                      billedUnitsByScenario:
                        (.billedUnitsByScenario // null)
                    }
                  }
              ] | from_entries
            ) == {
              "application-customer-managed-kms-key": {
                quantity: 1,
                unitMonthlyUsd: 1.00,
                pricingSource: "awsKms",
                billedUnitsByScenario: {
                  initial: 1,
                  afterFirstBilledKmsRotation: 2,
                  afterSecondBilledKmsRotation: 3
                }
              },
              "cloudfront-web-acls": {
                quantity: 2,
                unitMonthlyUsd: 5.00,
                pricingSource: "awsWaf",
                billedUnitsByScenario: null
              },
              "secrets-manager-secrets": {
                quantity: 2,
                unitMonthlyUsd: 0.40,
                pricingSource: "awsSecretsManager",
                billedUnitsByScenario: null
              },
              "standard-cloudwatch-alarm-metrics": {
                quantity: 6,
                unitMonthlyUsd: 0.10,
                pricingSource: "awsCloudWatch",
                billedUnitsByScenario: null
              },
              "web-acl-rules": {
                quantity: 10,
                unitMonthlyUsd: 1.00,
                pricingSource: "awsWaf",
                billedUnitsByScenario: null
              }
            }
            and all(
              $cost.lineItems[] as $item;
              ($item.quantity | type) == "number"
              and $item.quantity > 0
              and ($item.unitMonthlyUsd | type) == "number"
              and $item.unitMonthlyUsd > 0
              and (
                $item.monthlyUsdByScenario | keys | sort
              ) == ($scenarioIds | sort)
              and all(
                $scenarioIds[] as $scenario;
                ($item.monthlyUsdByScenario[$scenario] | type)
                  == "number"
                and $item.monthlyUsdByScenario[$scenario] >= 0
              )
              and (
                ($item | has("billedUnitsByScenario"))
                == (
                  $item.id
                    == "application-customer-managed-kms-key"
                )
              )
              and (
                if ($item | has("billedUnitsByScenario"))
                then (
                  $item.billedUnitsByScenario | keys | sort
                ) == ($scenarioIds | sort)
                and all(
                  $scenarioIds[] as $scenario;
                  ($item.billedUnitsByScenario[$scenario] | type)
                    == "number"
                  and $item.billedUnitsByScenario[$scenario] > 0
                  and (
                    $item.monthlyUsdByScenario[$scenario] | cents
                  ) == (
                    $item.billedUnitsByScenario[$scenario]
                    * $item.unitMonthlyUsd
                    | cents
                  )
                )
                else all(
                  $scenarioIds[] as $scenario;
                  ($item.monthlyUsdByScenario[$scenario] | cents)
                    == ($item.quantity * $item.unitMonthlyUsd | cents)
                )
                end
              )
              and ($cost.officialPricingUrls | has($item.pricingSource))
            )
            and ($cost.scenarios | map(.id)) == $scenarioIds
            and $cost.scenarios == [
              {id: "initial", expectedMonthlyUsd: 22.40},
              {
                id: "afterFirstBilledKmsRotation",
                expectedMonthlyUsd: 23.40
              },
              {
                id: "afterSecondBilledKmsRotation",
                expectedMonthlyUsd: 24.40
              }
            ]
            and $declaredScenarioCents == {
              initial: 2240,
              afterFirstBilledKmsRotation: 2340,
              afterSecondBilledKmsRotation: 2440
            }
            and $computedScenarioCents == $declaredScenarioCents
            and (
              $cost.maximumExpectedMonthlyUsd | cents
            ) == $computedMaximumCents
            and $computedMaximumCents == 2440
            and ($cost.approvedCeilingMonthlyUsd | cents) == 2600
            and $cost.ceilingComparison == "strictly-less-than"
            and $computedMaximumCents
              < ($cost.approvedCeilingMonthlyUsd | cents)
            and $cost.variableUsageChargesExcluded == [
              "AWS WAF requests",
              "CloudWatch Logs ingestion and storage",
              "Amazon S3 storage and requests",
              "Amazon EventBridge events",
              "data transfer"
            ]
            and $cost.externalAndOutOfScopeChargesExcluded == [
              "taxes",
              "application compute, API, and network services",
              "CockroachDB Cloud",
              "model and inference services",
              "conditional regional alarm-routing control",
              "optional FinOps human notification route",
              "GitHub Actions"
            ]
          ' aws/foundation-storage-migration-policy.json >/dev/null

      - name: Fail closed unless the dispatch targets current green main
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_REGION" = "eu-west-1"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"

          if [ "$OPERATION" = "apply" ]; then
            test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
              "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
            test "$CONFIRMATION" = \
              "APPLY-PROTECTED-FOUNDATION-STORAGE-MIGRATION"
          elif [ "$OPERATION" = "plan" ]; then
            test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
              "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
            test -z "$CONFIRMATION"
          elif [ "$OPERATION" = "retire" ]; then
            test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
              "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
            test "$CONFIRMATION" = \
              "RETIRE-FOUNDATION-MIGRATION-AUTHORITY"
          elif [ "$OPERATION" = "abort" ]; then
            test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
              "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
            test "$CONFIRMATION" = \
              "ABORT-FOUNDATION-MIGRATION-AND-RETIRE-AUTHORITY"
          else
            test "$OPERATION" = "verify"
            test -z "$CONFIRMATION"
          fi

          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          prove_workflow() {
            local expected_name expected_path state workflow
            workflow="$1"
            expected_name="$2"
            expected_path="$3"
            state="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=100" |
                jq -er \
                  --arg sha "$TARGET_SHA" \
                  --arg name "$expected_name" \
                  --arg path "$expected_path" \
                  '
                    [
                      .workflow_runs[]
                      | select(
                          .head_sha == $sha
                          and .head_branch == "main"
                          and .event == "push"
                          and .name == $name
                          and .path == $path
                        )
                    ]
                    | sort_by(.run_number, .run_attempt)
                    | last
                    | select(.conclusion == "success")
                    | .conclusion
                  '
            )"
            test "$state" = "success"
          }
          prove_workflow ci.yml CI .github/workflows/ci.yml
          prove_workflow codeql.yml CodeQL .github/workflows/codeql.yml
          prove_workflow \
            supply-chain.yml "Supply Chain (enforced)" \
            .github/workflows/supply-chain.yml

  migrate:
    name: ${{ inputs.operation == 'plan' && 'Plan protected foundation migration' || inputs.operation == 'apply' && 'Apply protected foundation migration' || 'Verify protected foundation migration' }}
    needs: authorize
    if: inputs.operation != 'retire' && inputs.operation != 'abort'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bootstrap
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the authorized main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask foundation account and authority ARN
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          role_name="${APP_NAME}-github-foundation-migration"
          if [ "$OPERATION" = "verify" ]; then
            role_name="${APP_NAME}-github-foundation-promotion"
          fi
          role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${role_name}"
          echo "::add-mask::$AWS_ACCOUNT_ID"
          echo "::add-mask::$role_arn"

      - name: Configure pre-existing initial migration authority
        if: inputs.operation != 'verify'
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_FOUNDATION_MIGRATION_ROLE_ARN }}
          role-session-name: archon-foundation-migration-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Configure permanent narrow foundation authority
        if: inputs.operation == 'verify'
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.APP_NAME }}-github-foundation-promotion
          role-session-name: archon-foundation-verify-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Capture exact pre-migration state and policies
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          identity="${RUNNER_TEMP:?}/foundation-migration-identity.json"
          aws sts get-caller-identity --output json >"$identity"
          expected_role="${APP_NAME}-github-foundation-migration"
          if [ "$OPERATION" = "verify" ]; then
            expected_role="${APP_NAME}-github-foundation-promotion"
          else
            test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
              "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${expected_role}"
          fi
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg role "$expected_role" \
            '
              .Account == $account
              and (.Arn | contains(":assumed-role/" + $role + "/"))
            ' "$identity" >/dev/null

          current_stack="${RUNNER_TEMP:?}/foundation-current-stack.json"
          aws cloudformation describe-stacks \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$current_stack"
          jq -e \
            --arg stack "${APP_NAME}-delivery-bootstrap" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and (
                .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
              )
              and ((.Stacks[0].RoleARN // null) == null)
            ' "$current_stack" >/dev/null

          current_policy="${RUNNER_TEMP:?}/foundation-current-stack-policy.json"
          current_policy_body="${RUNNER_TEMP:?}/foundation-current-stack-policy-body.json"
          aws cloudformation get-stack-policy \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$current_policy"
          jq -e '.StackPolicyBody | fromjson' \
            "$current_policy" >"$current_policy_body"
          jq -e \
            --slurpfile legacy \
              aws/bootstrap-stack-policy.pre-storage-migration.json \
            --slurpfile target aws/bootstrap-stack-policy.json \
            '
              . == $legacy[0] or . == $target[0]
            ' "$current_policy_body" >/dev/null

          current_template_response="${RUNNER_TEMP:?}/foundation-current-template-response.json"
          current_template="${RUNNER_TEMP:?}/foundation-current-template.yaml"
          aws cloudformation get-template \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$current_template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$current_template_response" |
            base64 --decode >"$current_template"

          current_resources="${RUNNER_TEMP:?}/foundation-current-resources.json"
          aws cloudformation list-stack-resources \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$current_resources"
          jq -e '
            all(
              .StackResourceSummaries[];
              .ResourceStatus
              | IN(
                  "CREATE_COMPLETE",
                  "UPDATE_COMPLETE",
                  "UPDATE_ROLLBACK_COMPLETE"
                )
            )
          ' "$current_resources" >/dev/null

          receipt="${RUNNER_TEMP:?}/foundation-storage-migration-receipt.json"
          current_digest="$(sha256sum "$current_template" | awk '{print $1}')"
          candidate_digest="$(
            sha256sum aws/bootstrap-oidc.yaml | awk '{print $1}'
          )"
          policy_before_digest="$(
            sha256sum "$current_policy_body" | awk '{print $1}'
          )"
          policy_target_digest="$(
            sha256sum aws/bootstrap-stack-policy.json | awk '{print $1}'
          )"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [[ "$generated_at" =~ \
            ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          jq -n \
            --arg operation "$OPERATION" \
            --arg commit "$TARGET_SHA" \
            --arg generatedAt "$generated_at" \
            --arg currentDigest "$current_digest" \
            --arg candidateDigest "$candidate_digest" \
            --arg policyBeforeDigest "$policy_before_digest" \
            --arg policyTargetDigest "$policy_target_digest" \
            '{
              schema: "archon.aws.foundation-storage-migration",
              schemaVersion: 1,
              ok: false,
              operation: $operation,
              result: ($operation + "-pending"),
              commit: $commit,
              generatedAt: $generatedAt,
              templates: {
                beforeSha256: $currentDigest,
                candidateSha256: $candidateDigest
              },
              stackPolicy: {
                beforeSha256: $policyBeforeDigest,
                targetSha256: $policyTargetDigest
              }
            }' >"$receipt"
          {
            echo "CANDIDATE_TEMPLATE_DIGEST=$candidate_digest"
            echo "CURRENT_RESOURCES_FILE=$current_resources"
            echo "CURRENT_STACK_FILE=$current_stack"
            echo "CURRENT_STACK_POLICY_BODY_FILE=$current_policy_body"
            echo "CURRENT_TEMPLATE_DIGEST=$current_digest"
            echo "CURRENT_TEMPLATE_FILE=$current_template"
            echo "RECEIPT_FILE=$receipt"
            echo "TARGET_STACK_POLICY_DIGEST=$policy_target_digest"
          } >>"$GITHUB_ENV"

      - name: Prove exact one-time migration authority
        if: inputs.operation != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          authority_proof="${RUNNER_TEMP:?}/foundation-migration-authority-proof.json"
          bash aws/foundation-migration-authority.sh verify \
            >"$authority_proof"
          jq -e '
            .ok == true
            and .oneTime == true
            and .liveContractExact == true
            and .cloudFormationCreationContractExact == true
            and .retirementRequired == true
          ' "$authority_proof" >/dev/null
          receipt_next="${RUNNER_TEMP:?}/foundation-authority-bound-receipt.json"
          jq \
            --slurpfile authority "$authority_proof" \
            '. + {authority:$authority[0]}' \
            "$RECEIPT_FILE" >"$receipt_next"
          mv "$receipt_next" "$RECEIPT_FILE"

      - name: Stage immutable candidate with explicit bootstrap encryption
        if: inputs.operation != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          template="aws/bootstrap-oidc.yaml"
          bucket="${APP_NAME}-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          digest="$CANDIDATE_TEMPLATE_DIGEST"
          checksum="$(
            openssl dgst -sha256 -binary "$template" | base64 -w0
          )"
          head="${RUNNER_TEMP:?}/foundation-template-head.json"
          alias_error="${RUNNER_TEMP:?}/foundation-storage-alias.err"
          encryption="aws:kms"
          encryption_mode="kms"
          put_encryption=(
            --server-side-encryption aws:kms
            --ssekms-key-id
            "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage"
          )

          if ! aws kms describe-key \
              --key-id "alias/${APP_NAME}-storage" \
              --region "$AWS_REGION" \
              --output json \
              >"${RUNNER_TEMP:?}/foundation-storage-alias.json" \
              2>"$alias_error"; then
            grep -Fq "NotFoundException" "$alias_error"
            encryption="AES256-bootstrap"
            encryption_mode="bootstrap-aes256"
            put_encryption=(--server-side-encryption AES256)
          fi
          key="foundation/storage-migrations/${encryption_mode}/${TARGET_SHA}/${digest}.yaml"

          if ! aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              --checksum-mode ENABLED \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >"$head" 2>/dev/null; then
            aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$template" \
              "${put_encryption[@]}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "$checksum" \
              --metadata \
                "commit=$TARGET_SHA,sha256=$digest,purpose=foundation-storage-migration" \
              --if-none-match "*" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >/dev/null
            aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              --checksum-mode ENABLED \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >"$head"
          fi

          size="$(wc -c <"$template" | tr -d ' ')"
          jq -e \
            --arg commit "$TARGET_SHA" \
            --arg digest "$digest" \
            --arg checksum "$checksum" \
            --arg encryption "$encryption" \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --argjson size "$size" \
            '
              .ContentLength == $size
              and .ChecksumSHA256 == $checksum
              and .Metadata == {
                commit: $commit,
                sha256: $digest,
                purpose: "foundation-storage-migration"
              }
              and (.VersionId | type == "string" and length > 0)
              and (
                if $encryption == "AES256-bootstrap"
                then .ServerSideEncryption == "AES256"
                else (
                  .ServerSideEncryption == "aws:kms"
                  and (
                    .SSEKMSKeyId
                    | type == "string"
                    and test(
                      "^arn:aws:kms:" + $region + ":" + $account
                      + ":key/[0-9a-f-]+$"
                    )
                  )
                  and .BucketKeyEnabled == true
                )
                end
              )
            ' "$head" >/dev/null

          version_id="$(jq -er '.VersionId' "$head")"
          encoded_version="$(
            jq -nr --arg value "$version_id" '$value | @uri'
          )"
          template_url="https://${bucket}.s3.${AWS_REGION}.amazonaws.com/${key}?versionId=${encoded_version}"
          change_set="foundation-storage-${TARGET_SHA:0:12}-${digest:0:12}"
          description="operation=foundation-storage-migration commit=${TARGET_SHA} template_sha256=${digest} version_id=${version_id}"
          {
            echo "BOOTSTRAP_TEMPLATE_ENCRYPTION=$encryption"
            echo "CHANGE_SET_DESCRIPTION=$description"
            echo "CHANGE_SET_NAME=$change_set"
            echo "TEMPLATE_CHECKSUM=$checksum"
            echo "TEMPLATE_URL=$template_url"
            echo "TEMPLATE_VERSION_ID=$version_id"
          } >>"$GITHUB_ENV"

      - name: Detect an already-current foundation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CURRENT_TEMPLATE_DIGEST" = "$CANDIDATE_TEMPLATE_DIGEST" ]; then
            echo "ALREADY_CURRENT=true" >>"$GITHUB_ENV"
          else
            echo "ALREADY_CURRENT=false" >>"$GITHUB_ENV"
          fi

      - name: Persist immutable encrypted pre-migration recovery anchor
        if: inputs.operation == 'plan' || inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          anchor_dir="${RUNNER_TEMP:?}/foundation-prestate"
          bundle="${RUNNER_TEMP:?}/foundation-prestate.tar"
          manifest="$anchor_dir/manifest.json"
          parameters="$anchor_dir/parameters.json"
          mkdir -p "$anchor_dir"
          cp "$CURRENT_TEMPLATE_FILE" "$anchor_dir/template.yaml"
          cp "$CURRENT_STACK_POLICY_BODY_FILE" \
            "$anchor_dir/stack-policy.json"
          jq '
            .Stacks[0].Parameters
            | map({key:.ParameterKey, value:.ParameterValue})
            | from_entries
            | to_entries
            | sort_by(.key)
            | from_entries
          ' "$CURRENT_STACK_FILE" >"$parameters"
          template_sha256="$(
            sha256sum "$anchor_dir/template.yaml" | awk '{print $1}'
          )"
          policy_sha256="$(
            jq -Sc . "$anchor_dir/stack-policy.json" |
              sha256sum |
              awk '{print $1}'
          )"
          parameters_sha256="$(
            jq -Sc . "$parameters" | sha256sum | awk '{print $1}'
          )"
          jq -n \
            --arg commit "$TARGET_SHA" \
            --arg candidateSha256 "$CANDIDATE_TEMPLATE_DIGEST" \
            --arg templateSha256 "$template_sha256" \
            --arg policySha256 "$policy_sha256" \
            --arg parametersSha256 "$parameters_sha256" \
            '{
              schema:
                "archon.aws.foundation-migration-prestate",
              schemaVersion: 1,
              commit: $commit,
              candidateTemplateSha256: $candidateSha256,
              files: {
                "template.yaml": $templateSha256,
                "stack-policy.json": $policySha256,
                "parameters.json": $parametersSha256
              },
              recovery: {
                automaticDestructiveRollback: false,
                separatelyApprovedRecoveryRequired: true
              }
            }' >"$manifest"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$bundle" \
            -C "$anchor_dir" \
            manifest.json parameters.json stack-policy.json template.yaml
          bundle_sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          checksum="$(
            openssl dgst -sha256 -binary "$bundle" | base64 -w0
          )"
          bytes="$(wc -c <"$bundle" | tr -d ' ')"
          bucket="${APP_NAME}-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          key="foundation/storage-migrations/prestate/${TARGET_SHA}/${template_sha256}/${bundle_sha256}.tar"
          head="${RUNNER_TEMP:?}/foundation-prestate-head.json"
          encryption_args=(--server-side-encryption AES256)
          if [ "$BOOTSTRAP_TEMPLATE_ENCRYPTION" = "aws:kms" ]; then
            encryption_args=(
              --server-side-encryption aws:kms
              --ssekms-key-id
              "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage"
            )
          else
            test "$BOOTSTRAP_TEMPLATE_ENCRYPTION" = \
              "AES256-bootstrap"
          fi
          if ! aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              --checksum-mode ENABLED \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >"$head" 2>/dev/null; then
            aws s3api put-object \
              --bucket "$bucket" \
              --key "$key" \
              --body "$bundle" \
              "${encryption_args[@]}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "$checksum" \
              --content-type application/x-tar \
              --metadata \
                "commit=$TARGET_SHA,sha256=$bundle_sha256,purpose=foundation-prestate" \
              --if-none-match "*" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >/dev/null
            aws s3api head-object \
              --bucket "$bucket" \
              --key "$key" \
              --checksum-mode ENABLED \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --output json >"$head"
          fi
          jq -e \
            --arg commit "$TARGET_SHA" \
            --arg digest "$bundle_sha256" \
            --arg checksum "$checksum" \
            --arg encryption "$BOOTSTRAP_TEMPLATE_ENCRYPTION" \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --argjson bytes "$bytes" \
            '
              .ContentLength == $bytes
              and .ContentType == "application/x-tar"
              and .ChecksumSHA256 == $checksum
              and .Metadata == {
                commit: $commit,
                sha256: $digest,
                purpose: "foundation-prestate"
              }
              and (.VersionId | type == "string" and length > 0)
              and (
                if $encryption == "AES256-bootstrap"
                then .ServerSideEncryption == "AES256"
                else (
                  .ServerSideEncryption == "aws:kms"
                  and (
                    .SSEKMSKeyId
                    | type == "string"
                    and test(
                      "^arn:aws:kms:" + $region + ":" + $account
                      + ":key/[0-9a-f-]+$"
                    )
                  )
                  and .BucketKeyEnabled == true
                )
                end
              )
            ' "$head" >/dev/null
          version_id="$(jq -er '.VersionId' "$head")"
          version_id_sha256="$(
            printf '%s' "$version_id" | sha256sum | awk '{print $1}'
          )"
          receipt_next="${RUNNER_TEMP:?}/foundation-prestate-receipt.json"
          jq \
            --arg key "$key" \
            --arg versionIdSha256 "$version_id_sha256" \
            --arg sha256 "$bundle_sha256" \
            --arg checksum "$checksum" \
            --arg encryption "$BOOTSTRAP_TEMPLATE_ENCRYPTION" \
            '
              . + {
                recoveryAnchor: {
                  key: $key,
                  versionIdSha256: $versionIdSha256,
                  sha256: $sha256,
                  checksumSha256Base64: $checksum,
                  encryption: $encryption,
                  automaticDestructiveRollback: false,
                  separatelyApprovedRecoveryRequired: true
                }
              }
            ' "$RECEIPT_FILE" >"$receipt_next"
          mv "$receipt_next" "$RECEIPT_FILE"

      - name: Refuse post-migration verification before migration
        if: inputs.operation == 'verify' && env.ALREADY_CURRENT != 'true'
        shell: bash
        run: |
          echo "The protected foundation migration is not deployed." >&2
          exit 1

      - name: Create or reuse the inspected migration plan
        id: create_plan
        if: env.ALREADY_CURRENT != 'true' && inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          parameters="${RUNNER_TEMP:?}/foundation-migration-parameters.json"
          jq -e '
            ([.Stacks[0].Parameters[].ParameterKey] | sort) as $keys
            | $keys == [
                "AppName",
                "ArtifactAccessLoggingEnabled",
                "ExistingGitHubOidcProviderArn",
                "GitHubOrganization",
                "GitHubRepository",
                "GitHubRepositoryId",
                "GitHubRepositoryOwnerId"
              ]
              or $keys == [
                "AlarmRoutingEnabled",
                "AppName",
                "ArtifactAccessLoggingEnabled",
                "ExistingGitHubOidcProviderArn",
                "GitHubOrganization",
                "GitHubRepository",
                "GitHubRepositoryId",
                "GitHubRepositoryOwnerId"
              ]
          ' "$CURRENT_STACK_FILE" >/dev/null
          jq '
            (.Stacks[0].Parameters | map(.ParameterKey)) as $keys
            | [
                .Stacks[0].Parameters[]
                | if .ParameterKey == "ArtifactAccessLoggingEnabled"
                  then {
                    ParameterKey: .ParameterKey,
                    ParameterValue: "true"
                  }
                  else {
                    ParameterKey: .ParameterKey,
                    UsePreviousValue: true
                  }
                  end
              ]
              + if $keys | index("AlarmRoutingEnabled")
                then []
                else [{
                  ParameterKey: "AlarmRoutingEnabled",
                  ParameterValue: "false"
                }]
                end
          ' "$CURRENT_STACK_FILE" >"$parameters"

          existing="${RUNNER_TEMP:?}/foundation-existing-change-set.json"
          if aws cloudformation describe-change-set \
              --stack-name "${APP_NAME}-delivery-bootstrap" \
              --change-set-name "$CHANGE_SET_NAME" \
              --include-property-values \
              --region "$AWS_REGION" \
              --output json >"$existing" 2>/dev/null; then
            test "$(jq -er '.Description' "$existing")" = \
              "$CHANGE_SET_DESCRIPTION"
            jq -e '
              .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
            ' "$existing" >/dev/null
            change_set_id="$(jq -er '.ChangeSetId' "$existing")"
            [[ "$change_set_id" == \
              arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${CHANGE_SET_NAME}/* ]]
            echo "CHANGE_SET_ID=$change_set_id" >>"$GITHUB_ENV"
          else
            created="${RUNNER_TEMP:?}/foundation-change-set-created.json"
            aws cloudformation create-change-set \
              --stack-name "${APP_NAME}-delivery-bootstrap" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type UPDATE \
              --description "$CHANGE_SET_DESCRIPTION" \
              --template-url "$TEMPLATE_URL" \
              --parameters "file://$parameters" \
              --capabilities CAPABILITY_NAMED_IAM \
              --region "$AWS_REGION" \
              --output json >"$created"
            change_set_id="$(jq -er '.Id' "$created")"
            [[ "$change_set_id" == \
              arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${CHANGE_SET_NAME}/* ]]
            echo "CHANGE_SET_ID=$change_set_id" >>"$GITHUB_ENV"
            ready=false
            for attempt in $(seq 1 90); do
              probe="${RUNNER_TEMP:?}/foundation-change-set-probe.json"
              if aws cloudformation describe-change-set \
                  --stack-name "${APP_NAME}-delivery-bootstrap" \
                  --change-set-name "$change_set_id" \
                  --include-property-values \
                  --region "$AWS_REGION" \
                  --output json >"$probe" 2>/dev/null; then
                state="$(
                  jq -r '.Status + ":" + .ExecutionStatus' "$probe"
                )"
                case "$state" in
                  CREATE_COMPLETE:AVAILABLE)
                    ready=true
                    break
                    ;;
                  CREATE_PENDING:*|CREATE_IN_PROGRESS:*) ;;
                  *) exit 1 ;;
                esac
              fi
              test "$attempt" -lt 90
              sleep 5
            done
            test "$ready" = "true"
          fi
          [[ "$change_set_id" == \
            arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${CHANGE_SET_NAME}/* ]]

      - name: Load the exact existing migration plan
        id: load_plan
        if: env.ALREADY_CURRENT != 'true' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          change_set="${RUNNER_TEMP:?}/foundation-change-set-for-apply.json"
          aws cloudformation describe-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$CHANGE_SET_NAME" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$change_set"
          test "$(jq -er '.Description' "$change_set")" = \
            "$CHANGE_SET_DESCRIPTION"
          jq -e '
            .Status == "CREATE_COMPLETE"
            and .ExecutionStatus == "AVAILABLE"
          ' "$change_set" >/dev/null
          change_set_id="$(jq -er '.ChangeSetId' "$change_set")"
          [[ "$change_set_id" == \
            arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${CHANGE_SET_NAME}/* ]]
          echo "CHANGE_SET_ID=$change_set_id" >>"$GITHUB_ENV"

      - name: Require the exact additive non-replacement migration
        id: exact_plan
        if: env.ALREADY_CURRENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          change_set="${RUNNER_TEMP:?}/foundation-inspected-change-set.json"
          template_response="${RUNNER_TEMP:?}/foundation-change-set-template.json"
          template="${RUNNER_TEMP:?}/foundation-change-set-template.yaml"
          canonical_changes="${RUNNER_TEMP:?}/foundation-canonical-changes.json"
          canonical_parameters="${RUNNER_TEMP:?}/foundation-canonical-parameters.json"
          expected_additions="${RUNNER_TEMP:?}/foundation-expected-additions.json"

          aws cloudformation describe-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$CHANGE_SET_ID" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$change_set"
          aws cloudformation get-template \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$CHANGE_SET_ID" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$template_response" |
            base64 --decode >"$template"
          test "$(sha256sum "$template" | awk '{print $1}')" = \
            "$CANDIDATE_TEMPLATE_DIGEST"

          jq -e \
            --arg id "$CHANGE_SET_ID" \
            --arg name "$CHANGE_SET_NAME" \
            --arg description "$CHANGE_SET_DESCRIPTION" \
            --slurpfile current "$CURRENT_STACK_FILE" \
            '
              def parameter_map:
                map({key:.ParameterKey, value:.ParameterValue})
                | from_entries;
              (
                $current[0].Stacks[0].Parameters
                | parameter_map
                | .ArtifactAccessLoggingEnabled = "true"
                | .AlarmRoutingEnabled = (
                    .AlarmRoutingEnabled // "false"
                  )
              ) as $expectedParameters
              | .ChangeSetId == $id
              and .StackId == $current[0].Stacks[0].StackId
              and .ChangeSetName == $name
              and .Description == $description
              and .ChangeSetType == "UPDATE"
              and .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
              and ((.IncludeNestedStacks // false) == false)
              and .Capabilities == ["CAPABILITY_NAMED_IAM"]
              and .RoleARN == null
              and .NotificationARNs == []
              and (
                .RollbackConfiguration == {}
                or .RollbackConfiguration == {
                  RollbackTriggers: [],
                  MonitoringTimeInMinutes: 0
                }
              )
              and ((.ImportExistingResources // false) == false)
              and (
                (.Tags // [] | sort_by(.Key))
                == (
                  ($current[0].Stacks[0].Tags // [])
                  | sort_by(.Key)
                )
              )
              and (.Parameters | parameter_map) == $expectedParameters
              and (.Changes | length) > 0
            ' "$change_set" >/dev/null

          jq '
            .Parameters
            | map({key:.ParameterKey, value:.ParameterValue})
            | from_entries
            | to_entries
            | sort_by(.key)
            | from_entries
          ' "$change_set" >"$canonical_parameters"
          parameters_sha256="$(
            jq -Sc . "$canonical_parameters" |
              sha256sum |
              awk '{print $1}'
          )"

          jq -e \
            --slurpfile policy aws/foundation-storage-migration-policy.json \
            '
              $policy[0] as $policy
              | all(
                  .Changes[];
                  .ResourceChange as $change
                  | ($policy.forbiddenActions | index($change.Action)) == null
                  and (
                    if $change.Action == "Add"
                    then $change.Replacement == null
                      and (
                        ($change | has("Details") | not)
                        or $change.Details == null
                        or $change.Details == []
                      )
                    elif $change.Action == "Modify"
                    then $change.Replacement == "False"
                      and ($change.Details | type) == "array"
                      and ($change.Details | length) > 0
                      and all(
                        $change.Details[];
                        .Target.RequiresRecreation == "Never"
                      )
                    else false
                    end
                  )
                  and (
                    if $change.Action == "Add"
                    then any(
                      $policy.requiredNewResources[];
                      .logicalResourceId == $change.LogicalResourceId
                      and .resourceType == $change.ResourceType
                    )
                    elif $change.Action == "Modify"
                    then any(
                      $policy.allowedModifications[];
                      .logicalResourceId == $change.LogicalResourceId
                      and .resourceType == $change.ResourceType
                    )
                    else false
                    end
                  )
                )
            ' "$change_set" >/dev/null

          jq -n \
            --slurpfile resources "$CURRENT_RESOURCES_FILE" \
            --slurpfile policy aws/foundation-storage-migration-policy.json \
            '
              ($resources[0].StackResourceSummaries // []) as $current
              | [
                  $policy[0].requiredNewResources[]
                  | . as $required
                  | (
                      [
                        $current[]
                        | select(
                            .LogicalResourceId
                              == $required.logicalResourceId
                          )
                      ]
                    ) as $matches
                  | if ($matches | length) == 0
                    then $required
                    elif (
                      ($matches | length) == 1
                      and $matches[0].ResourceType
                        == $required.resourceType
                    )
                    then empty
                    else error("existing resource type mismatch")
                    end
                ]
              | sort_by(.logicalResourceId)
            ' >"$expected_additions"
          jq -e \
            --slurpfile expected "$expected_additions" \
            '
              [
                .Changes[]
                | select(.ResourceChange.Action == "Add")
                | {
                    logicalResourceId:
                      .ResourceChange.LogicalResourceId,
                    resourceType: .ResourceChange.ResourceType
                  }
              ]
              | sort_by(.logicalResourceId)
              | . == $expected[0]
            ' "$change_set" >/dev/null

          jq '
            [
              .Changes[]
              | {
                  action: .ResourceChange.Action,
                  logicalResourceId:
                    .ResourceChange.LogicalResourceId,
                  resourceType: .ResourceChange.ResourceType,
                  replacement:
                    (.ResourceChange.Replacement == "True")
                }
            ]
            | sort_by(.logicalResourceId, .action)
          ' "$change_set" >"$canonical_changes"

          change_set_arn_sha256="$(
            printf '%s' "$CHANGE_SET_ID" | sha256sum | awk '{print $1}'
          )"
          template_version_id_sha256="$(
            printf '%s' "$TEMPLATE_VERSION_ID" |
              sha256sum |
              awk '{print $1}'
          )"
          receipt_next="${RUNNER_TEMP:?}/foundation-plan-receipt.json"
          jq \
            --arg result \
              "$([ "$OPERATION" = "plan" ] && printf inspected-plan || printf apply-pending)" \
            --arg changeSetArnSha256 "$change_set_arn_sha256" \
            --arg changeSetName "$CHANGE_SET_NAME" \
            --arg templateVersionIdSha256 "$template_version_id_sha256" \
            --arg templateChecksum "$TEMPLATE_CHECKSUM" \
            --arg bootstrapEncryption "$BOOTSTRAP_TEMPLATE_ENCRYPTION" \
            --arg parametersSha256 "$parameters_sha256" \
            --slurpfile changes "$canonical_changes" \
            '
              . + {
                ok: (.operation == "plan"),
                result: $result,
                templateObject: {
                  versionIdSha256: $templateVersionIdSha256,
                  checksumSha256Base64: $templateChecksum,
                  encryption: $bootstrapEncryption
                },
                changeSet: {
                  arnSha256: $changeSetArnSha256,
                  name: $changeSetName,
                  status: "CREATE_COMPLETE",
                  executionStatus: "AVAILABLE",
                  changeSetType: "UPDATE",
                  parametersSha256: $parametersSha256,
                  roleArnPresent: false,
                  notificationArns: 0,
                  rollbackTriggers: 0,
                  changes: $changes[0]
                }
              }
            ' "$RECEIPT_FILE" >"$receipt_next"
          mv "$receipt_next" "$RECEIPT_FILE"

      - name: Delete an unverified foundation migration plan
        if: >-
          always() &&
          env.ALREADY_CURRENT != 'true' &&
          (inputs.operation == 'plan' || inputs.operation == 'apply') &&
          (
            env.CHANGE_SET_ID != '' ||
            (
              inputs.operation == 'plan' &&
              steps.create_plan.outcome == 'failure'
            )
          ) &&
          (
            steps.create_plan.outcome == 'failure' ||
            steps.load_plan.outcome == 'failure' ||
            steps.exact_plan.outcome == 'failure'
          )
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RECEIPT_FILE:-${RUNNER_TEMP:?}/foundation-storage-migration-receipt.json}"
          receipt_next="${RUNNER_TEMP:?}/foundation-unverified-plan-cleanup-receipt.json"
          change_set="${RUNNER_TEMP:?}/foundation-unverified-change-set.json"
          final_change_set="${RUNNER_TEMP:?}/foundation-unverified-change-set-final.json"
          template_response="${RUNNER_TEMP:?}/foundation-unverified-template.json"
          template="${RUNNER_TEMP:?}/foundation-unverified-template.yaml"
          target_after="${RUNNER_TEMP:?}/foundation-after-plan-cleanup.json"
          absence_error="${RUNNER_TEMP:?}/foundation-change-set-absence.err"
          recovery_error="${RUNNER_TEMP:?}/foundation-change-set-recovery.err"
          recovery_inventory="${RUNNER_TEMP:?}/foundation-change-set-recovery-inventory.json"
          cleanup_change_set_id="${CHANGE_SET_ID:-}"
          recovered_by_deterministic_name=false
          change_set_name_sha256="$(
            printf '%s' "$CHANGE_SET_NAME" | sha256sum | awk '{print $1}'
          )"
          description_sha256="$(
            printf '%s' "$CHANGE_SET_DESCRIPTION" |
              sha256sum |
              awk '{print $1}'
          )"

          if [ ! -f "$receipt" ]; then
            generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -n \
              --arg commit "$TARGET_SHA" \
              --arg generatedAt "$generated_at" \
              '{
                schema: "archon.aws.foundation-storage-migration",
                schemaVersion: 1,
                ok: false,
                operation: "cleanup",
                result: "unverified-plan-cleanup-failed",
                commit: $commit,
                generatedAt: $generatedAt
              }' >"$receipt"
          fi

          if [ -z "$cleanup_change_set_id" ]; then
            test "$OPERATION" = "plan"
            recovered=false
            for attempt in $(seq 1 90); do
              if aws cloudformation describe-change-set \
                  --stack-name "${APP_NAME}-delivery-bootstrap" \
                  --change-set-name "$CHANGE_SET_NAME" \
                  --include-property-values \
                  --region "$AWS_REGION" \
                  --output json >"$change_set" 2>"$recovery_error"; then
                recovery_state="$(
                  jq -r '.Status + ":" + .ExecutionStatus' "$change_set"
                )"
                case "$recovery_state" in
                  CREATE_COMPLETE:AVAILABLE)
                    cleanup_change_set_id="$(jq -er '.ChangeSetId' "$change_set")"
                    recovered=true
                    break
                    ;;
                  CREATE_PENDING:*|CREATE_IN_PROGRESS:*) ;;
                  *) exit 1 ;;
                esac
              elif grep -Eq 'ChangeSetNotFound|does not exist' \
                  "$recovery_error"; then
                :
              else
                exit 1
              fi
              test "$attempt" -lt 90
              sleep 5
            done
            test "$recovered" = "true"
            recovered_by_deterministic_name=true
            aws cloudformation list-change-sets \
              --stack-name "${APP_NAME}-delivery-bootstrap" \
              --region "$AWS_REGION" \
              --output json >"$recovery_inventory"
            jq -e \
              --arg id "$cleanup_change_set_id" \
              --arg name "$CHANGE_SET_NAME" \
              '
                (.Summaries // []) as $plans
                | ($plans | length) == 1
                and $plans[0].ChangeSetId == $id
                and $plans[0].ChangeSetName == $name
                and $plans[0].Status == "CREATE_COMPLETE"
                and $plans[0].ExecutionStatus == "AVAILABLE"
                and (($plans[0].ImportExistingResources // false) == false)
              ' "$recovery_inventory" >/dev/null
          fi

          [[ "$cleanup_change_set_id" == \
            arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${CHANGE_SET_NAME}/* ]]
          change_set_arn_sha256="$(
            printf '%s' "$cleanup_change_set_id" |
              sha256sum |
              awk '{print $1}'
          )"
          jq \
            --arg arnSha256 "$change_set_arn_sha256" \
            --arg nameSha256 "$change_set_name_sha256" \
            --arg descriptionSha256 "$description_sha256" \
            --argjson recoveredByDeterministicName \
              "$recovered_by_deterministic_name" \
            '
              del(.changeSet.name, .execution.clientRequestToken)
              | . + {
                  ok: false,
                  result: "unverified-plan-cleanup-failed",
                  cleanup: {
                    attempted: true,
                    deleted: false,
                    absenceVerified: false,
                    changeSetArnSha256: $arnSha256,
                    changeSetNameSha256: $nameSha256,
                    descriptionSha256: $descriptionSha256,
                    recoveredByDeterministicName:
                      $recoveredByDeterministicName
                  }
                }
            ' "$receipt" >"$receipt_next"
          mv "$receipt_next" "$receipt"

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          aws cloudformation describe-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$cleanup_change_set_id" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$change_set"
          aws cloudformation get-template \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$cleanup_change_set_id" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$template_response" | base64 --decode >"$template"
          test "$(sha256sum "$template" | awk '{print $1}')" = \
            "$CANDIDATE_TEMPLATE_DIGEST"

          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg app "$APP_NAME" \
            --arg id "$cleanup_change_set_id" \
            --arg name "$CHANGE_SET_NAME" \
            --arg description "$CHANGE_SET_DESCRIPTION" \
            --slurpfile current "$CURRENT_STACK_FILE" \
            '
              def parameter_map:
                map({key:.ParameterKey, value:.ParameterValue})
                | from_entries;
              (
                $current[0].Stacks[0].Parameters
                | parameter_map
                | .ArtifactAccessLoggingEnabled = "true"
                | .AlarmRoutingEnabled = (.AlarmRoutingEnabled // "false")
              ) as $expectedParameters
              | .ChangeSetId == $id
              and .ChangeSetName == $name
              and .ChangeSetId == (
                "arn:aws:cloudformation:" + $region + ":" + $account
                + ":changeSet/" + $name + "/"
                + (.ChangeSetId | split("/") | last)
              )
              and (.ChangeSetId | split("/") | length) == 3
              and .StackName == ($app + "-delivery-bootstrap")
              and .StackId == $current[0].Stacks[0].StackId
              and .Description == $description
              and .ChangeSetType == "UPDATE"
              and .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
              and ((.IncludeNestedStacks // false) == false)
              and .Capabilities == ["CAPABILITY_NAMED_IAM"]
              and ((.RoleARN // null) == null)
              and ((.NotificationARNs // []) == [])
              and (
                (.RollbackConfiguration // {}) == {}
                or .RollbackConfiguration == {
                  RollbackTriggers: [],
                  MonitoringTimeInMinutes: 0
                }
              )
              and ((.ImportExistingResources // false) == false)
              and ((.OnStackFailure // null) == null)
              and (
                ((.Tags // []) | sort_by(.Key))
                == (
                  ($current[0].Stacks[0].Tags // []) | sort_by(.Key)
                )
              )
              and (.Parameters | parameter_map) == $expectedParameters
            ' "$change_set" >/dev/null

          target_projection='{
            StackId,
            StackName,
            StackStatus,
            EnableTerminationProtection,
            RoleARN: (.RoleARN // null),
            NotificationARNs: (.NotificationARNs // []),
            Capabilities: (.Capabilities // []),
            Parameters: (.Parameters // [] | sort_by(.ParameterKey)),
            Tags: (.Tags // [] | sort_by(.Key)),
            Outputs: (.Outputs // [] | sort_by(.OutputKey))
          }'
          before_projection_sha256="$(
            jq -Sc ".Stacks[0] | $target_projection" \
              "$CURRENT_STACK_FILE" |
              sha256sum |
              awk '{print $1}'
          )"

          aws cloudformation describe-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$cleanup_change_set_id" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$final_change_set"
          jq -e \
            --arg id "$cleanup_change_set_id" \
            --arg name "$CHANGE_SET_NAME" \
            --arg stackId "$(jq -er '.Stacks[0].StackId' "$CURRENT_STACK_FILE")" \
            '
              .ChangeSetId == $id
              and .ChangeSetName == $name
              and .StackId == $stackId
              and .ChangeSetType == "UPDATE"
              and .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
              and ((.ImportExistingResources // false) == false)
            ' "$final_change_set" >/dev/null
          aws cloudformation delete-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$cleanup_change_set_id" \
            --region "$AWS_REGION"
          absent=false
          for attempt in $(seq 1 30); do
            if aws cloudformation describe-change-set \
                --stack-name "${APP_NAME}-delivery-bootstrap" \
                --change-set-name "$cleanup_change_set_id" \
                --region "$AWS_REGION" \
                --output json >/dev/null 2>"$absence_error"; then
              :
            elif grep -Eq 'ChangeSetNotFound|does not exist' \
                "$absence_error"; then
              absent=true
              break
            else
              exit 1
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          test "$absent" = "true"

          aws cloudformation describe-stacks \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$target_after"
          after_projection_sha256="$(
            jq -Sc ".Stacks[0] | $target_projection" "$target_after" |
              sha256sum |
              awk '{print $1}'
          )"
          test "$after_projection_sha256" = "$before_projection_sha256"

          jq \
            --arg targetProjectionSha256 "$after_projection_sha256" \
            --arg status "$(jq -er '.Status' "$change_set")" \
            --arg executionStatus \
              "$(jq -er '.ExecutionStatus' "$change_set")" \
            '
              . + {
                ok: false,
                result: "unverified-plan-deleted",
                cleanup: (
                  .cleanup + {
                    deleted: true,
                    absenceVerified: true,
                    observedStatus: $status,
                    observedExecutionStatus: $executionStatus,
                    targetProjectionSha256: $targetProjectionSha256,
                    targetUnchanged: true
                  }
                )
              }
            ' "$receipt" >"$receipt_next"
          mv "$receipt_next" "$receipt"

      - name: Apply target stack policy and execute the inspected plan
        if: env.ALREADY_CURRENT != 'true' && inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          policy_transitioned=false
          execution_started=false
          restore_previous_policy() {
            local status="$?"
            trap - ERR
            if [ "$policy_transitioned" = "true" ] &&
                [ "$execution_started" = "false" ]; then
              aws cloudformation set-stack-policy \
                --stack-name "${APP_NAME}-delivery-bootstrap" \
                --stack-policy-body \
                  "file://$CURRENT_STACK_POLICY_BODY_FILE" \
                --region "$AWS_REGION" || true
            fi
            exit "$status"
          }
          trap restore_previous_policy ERR
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          aws cloudformation set-stack-policy \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --stack-policy-body file://aws/bootstrap-stack-policy.json \
            --region "$AWS_REGION"
          policy_transitioned=true
          policy_after="${RUNNER_TEMP:?}/foundation-stack-policy-after-set.json"
          aws cloudformation get-stack-policy \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$policy_after"
          jq -e \
            --slurpfile expected aws/bootstrap-stack-policy.json \
            '(.StackPolicyBody | fromjson) == $expected[0]' \
            "$policy_after" >/dev/null

          client_token="foundation-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_SHA:0:12}"
          # Once execution is dispatched, only an observed terminal rollback may
          # restore the previous policy. Ambiguous CLI/network failures retain
          # the target policy and fail closed for an operator-controlled retry.
          execution_started=true
          aws cloudformation execute-change-set \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --change-set-name "$CHANGE_SET_ID" \
            --client-request-token "$client_token" \
            --region "$AWS_REGION"

          terminal=false
          saw_progress=false
          stack_status=UNKNOWN
          for attempt in $(seq 1 120); do
            state="${RUNNER_TEMP:?}/foundation-migration-state.json"
            aws cloudformation describe-stacks \
              --stack-name "${APP_NAME}-delivery-bootstrap" \
              --region "$AWS_REGION" \
              --output json >"$state"
            stack_status="$(jq -er '.Stacks[0].StackStatus' "$state")"
            case "$stack_status" in
              UPDATE_COMPLETE)
                execution_status="$(
                  aws cloudformation describe-change-set \
                    --stack-name "${APP_NAME}-delivery-bootstrap" \
                    --change-set-name "$CHANGE_SET_ID" \
                    --region "$AWS_REGION" \
                    --query ExecutionStatus \
                    --output text
                )"
                if [ "$saw_progress" = "true" ] ||
                    [ "$execution_status" = "EXECUTE_COMPLETE" ]; then
                  terminal=true
                  break
                fi
                test "$attempt" -lt 12
                ;;
              UPDATE_ROLLBACK_COMPLETE)
                aws cloudformation set-stack-policy \
                  --stack-name "${APP_NAME}-delivery-bootstrap" \
                  --stack-policy-body \
                    "file://$CURRENT_STACK_POLICY_BODY_FILE" \
                  --region "$AWS_REGION"
                policy_transitioned=false
                execution_started=false
                echo "Foundation migration rolled back." >&2
                exit 1
                ;;
              UPDATE_FAILED|UPDATE_ROLLBACK_FAILED)
                echo "Foundation migration reached $stack_status." >&2
                false
                ;;
              UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|\
              UPDATE_ROLLBACK_IN_PROGRESS|\
              UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                saw_progress=true
                ;;
              *)
                echo "Unexpected foundation stack state: $stack_status" >&2
                false
                ;;
            esac
            test "$attempt" -lt 120
            sleep 10
          done
          test "$terminal" = "true"
          trap - ERR
          echo "EXECUTION_CLIENT_TOKEN=$client_token" >>"$GITHUB_ENV"

      - name: Prove exact deployed template and live storage controls
        if: inputs.operation == 'apply' || env.ALREADY_CURRENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployed_response="${RUNNER_TEMP:?}/foundation-deployed-template-response.json"
          deployed_template="${RUNNER_TEMP:?}/foundation-deployed-template.yaml"
          live_policy="${RUNNER_TEMP:?}/foundation-live-target-policy.json"
          storage_proof="${RUNNER_TEMP:?}/foundation-storage-proof.json"
          access_logging_proof="${RUNNER_TEMP:?}/foundation-access-logging-proof.json"

          aws cloudformation get-template \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$deployed_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$deployed_response" |
            base64 --decode >"$deployed_template"
          test "$(sha256sum "$deployed_template" | awk '{print $1}')" = \
            "$CANDIDATE_TEMPLATE_DIGEST"

          aws cloudformation get-stack-policy \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$live_policy"
          jq -e \
            --slurpfile expected aws/bootstrap-stack-policy.json \
            '(.StackPolicyBody | fromjson) == $expected[0]' \
            "$live_policy" >/dev/null

          authority_state=ignore
          if [ "$OPERATION" = "verify" ]; then
            authority_state=retired
          fi
          bash aws/prove-foundation-storage-controls.sh \
            "$authority_state" >"$storage_proof"
          bash aws/prove-s3-access-logging.sh verify \
            >"$access_logging_proof"
          jq -e \
            --arg operation "$OPERATION" \
            '
              .ok == true
              and (
                if $operation == "verify"
                then .migrationAuthority.retired == true
                else true
                end
              )
            ' "$storage_proof" >/dev/null
          jq -e '.ok == true' "$access_logging_proof" >/dev/null

          result="already-current"
          if [ "$ALREADY_CURRENT" != "true" ]; then
            result="applied-and-proved"
          fi
          receipt_next="${RUNNER_TEMP:?}/foundation-proved-receipt.json"
          jq \
            --arg result "$result" \
            --arg clientToken "${EXECUTION_CLIENT_TOKEN:-}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg policySha256 "$TARGET_STACK_POLICY_DIGEST" \
            --slurpfile storage "$storage_proof" \
            --slurpfile accessLogging "$access_logging_proof" \
            '
              . + {
                ok: true,
                result: $result,
                run: {
                  id: ($runId | tonumber),
                  attempt: ($runAttempt | tonumber),
                  workflowRef: $workflowRef
                },
                stackPolicy: (
                  .stackPolicy + {
                    deployedSha256: $policySha256
                  }
                ),
                execution: {
                  clientRequestToken: (
                    if $clientToken == ""
                    then null
                    else $clientToken
                    end
                  ),
                  terminalStackStatus: $storage[0].stack.status
                },
                proof: {
                  storage: $storage[0],
                  accessLogging: $accessLogging[0]
                }
              }
            ' "$RECEIPT_FILE" >"$receipt_next"
          mv "$receipt_next" "$RECEIPT_FILE"

      - name: Mark an already-current plan as proved
        if: env.ALREADY_CURRENT == 'true' && inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok == true and .result == "already-current"' \
            "$RECEIPT_FILE" >/dev/null

      - name: Upload sanitized migration receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-storage-migration-${{ inputs.operation }}-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-storage-migration-receipt.json
          if-no-files-found: error
          retention-days: 90

  abort-authority:
    name: Abort migration and retire one-time authority
    needs: authorize
    if: inputs.operation == 'abort'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Initialize sanitized abort receipt before AWS access
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/foundation-storage-migration-receipt.json"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg commit "$TARGET_SHA" \
            --arg generatedAt "$generated_at" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            '{
              schema: "archon.aws.foundation-storage-migration",
              schemaVersion: 1,
              ok: false,
              operation: "abort",
              result: "abort-pending",
              commit: $commit,
              generatedAt: $generatedAt,
              run: {
                id: ($runId | tonumber),
                attempt: ($runAttempt | tonumber),
                workflowRef: $workflowRef
              }
            }' >"$receipt"

      - name: Check out the authorized main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask foundation account and one-time authority ARN
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
          echo "::add-mask::$AWS_ACCOUNT_ID"
          echo "::add-mask::$role_arn"

      - name: Configure exact one-time migration authority
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_FOUNDATION_MIGRATION_ROLE_ARN }}
          role-session-name: archon-foundation-abort-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Prove stable foundation, clean safe plans, and delete authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/foundation-storage-migration-receipt.json"
          receipt_next="${RUNNER_TEMP:?}/foundation-abort-receipt-next.json"
          authority_proof="${RUNNER_TEMP:?}/foundation-abort-authority-proof.json"
          authority_final="${RUNNER_TEMP:?}/foundation-abort-authority-final.json"
          historical_authority_generator="${RUNNER_TEMP:?}/foundation-authority-historical-generator.sh"
          historical_authority_template="${RUNNER_TEMP:?}/foundation-authority-historical-template.json"
          authority_stack="${RUNNER_TEMP:?}/foundation-abort-authority-stack.json"
          identity="${RUNNER_TEMP:?}/foundation-abort-identity.json"
          target_before="${RUNNER_TEMP:?}/foundation-abort-target-before.json"
          target_after="${RUNNER_TEMP:?}/foundation-abort-target-after.json"
          target_template_before_response="${RUNNER_TEMP:?}/foundation-abort-template-before.json"
          target_template_after_response="${RUNNER_TEMP:?}/foundation-abort-template-after.json"
          target_template_before="${RUNNER_TEMP:?}/foundation-abort-template-before.yaml"
          target_template_after="${RUNNER_TEMP:?}/foundation-abort-template-after.yaml"
          target_policy_before="${RUNNER_TEMP:?}/foundation-abort-policy-before.json"
          target_policy_after="${RUNNER_TEMP:?}/foundation-abort-policy-after.json"
          target_resources_before="${RUNNER_TEMP:?}/foundation-abort-resources-before.json"
          target_resources_after="${RUNNER_TEMP:?}/foundation-abort-resources-after.json"
          plans="${RUNNER_TEMP:?}/foundation-abort-plans.json"
          remaining_plans="${RUNNER_TEMP:?}/foundation-abort-remaining-plans.json"
          final_plans="${RUNNER_TEMP:?}/foundation-abort-final-plans.json"
          plan_records="${RUNNER_TEMP:?}/foundation-abort-plan-records.json"
          phase=initial-proof

          record_failure() {
            failure_status="$?"
            trap - ERR
            set +e
            jq \
              --arg phase "$phase" \
              '. + {
                ok: false,
                result: "abort-failed",
                failure: {phase: $phase}
              }' "$receipt" >"$receipt_next" &&
              mv "$receipt_next" "$receipt"
            exit "$failure_status"
          }
          trap record_failure ERR

          test "$AWS_REGION" = "eu-west-1"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$AWS_FOUNDATION_MIGRATION_ROLE_ARN" = \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"

          aws sts get-caller-identity --output json >"$identity"
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg role "${APP_NAME}-github-foundation-migration" \
            '
              .Account == $account
              and (.Arn | contains(":assumed-role/" + $role + "/"))
            ' "$identity" >/dev/null

          bash aws/foundation-migration-authority.sh verify-intrinsic \
            >"$authority_proof"
          jq -e '
            .ok == true
            and .oneTime == true
            and .verificationMode == "verify-intrinsic"
            and .liveContractExact == false
            and .cloudFormationCreationContractExact == false
            and .intrinsicSafetyContractVerified == true
            and .creationBindingVerified == true
            and .trustRepositoryBound == true
            and .retirementRequired == true
            and .resourceCount == 1
          ' "$authority_proof" >/dev/null
          authority_proof_sha256="$(
            jq -Sc . "$authority_proof" | sha256sum | awk '{print $1}'
          )"
          authority_source="$(jq -er '.sourceCommit' "$authority_proof")"
          [[ "$authority_source" =~ ^[0-9a-f]{40}$ ]]
          authority_commit="${RUNNER_TEMP:?}/foundation-authority-source-commit.json"
          authority_compare="${RUNNER_TEMP:?}/foundation-authority-source-compare.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${authority_source}" \
            >"$authority_commit"
          jq -e --arg source "$authority_source" \
            '.sha == $source' "$authority_commit" >/dev/null
          gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${authority_source}...${TARGET_SHA}" \
            >"$authority_compare"
          jq -e \
            --arg source "$authority_source" \
            '
              .merge_base_commit.sha == $source
              and (.status == "ahead" or .status == "identical")
            ' "$authority_compare" >/dev/null
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/aws/foundation-migration-authority.sh?ref=${authority_source}" \
            >"$historical_authority_generator"
          # The only historical source execution is the exact generator mode
          # from the verified ancestor commit, under an empty credential-free
          # environment. No general script mode or sourced helper is allowed.
          env -i \
            PATH="/usr/bin:/bin" \
            APP_NAME="$APP_NAME" \
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" \
            AWS_REGION="$AWS_REGION" \
            GITHUB_ORGANIZATION="$GITHUB_ORGANIZATION" \
            GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
            GITHUB_REPOSITORY_NAME="$GITHUB_REPOSITORY_NAME" \
            GITHUB_REPOSITORY_OWNER_ID="$GITHUB_REPOSITORY_OWNER_ID" \
            GITHUB_OIDC_PROVIDER_ARN="$GITHUB_OIDC_PROVIDER_ARN" \
            bash --noprofile --norc "$historical_authority_generator" \
              render-template >"$historical_authority_template"
          historical_authority_template_sha256="$(
            jq -Sc . "$historical_authority_template" |
              sha256sum |
              awk '{print $1}'
          )"
          test "$historical_authority_template_sha256" = \
            "$(jq -er '.authorityTemplateSha256' "$authority_proof")"

          phase=target-before
          target_stack_name="${APP_NAME}-delivery-bootstrap"
          aws cloudformation describe-stacks \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_before"
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg stack "$target_stack_name" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and .Stacks[0].StackId == (
                "arn:aws:cloudformation:" + $region + ":" + $account
                + ":stack/" + $stack + "/"
                + (.Stacks[0].StackId | split("/") | last)
              )
              and (.Stacks[0].StackId | split("/") | length) == 3
              and (
                .Stacks[0].StackStatus
                | IN(
                    "CREATE_COMPLETE",
                    "UPDATE_COMPLETE",
                    "UPDATE_ROLLBACK_COMPLETE"
                  )
              )
              and ((.Stacks[0].RoleARN // null) == null)
              and ((.Stacks[0].NotificationARNs // []) == [])
            ' "$target_before" >/dev/null
          aws cloudformation get-template \
            --stack-name "$target_stack_name" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$target_template_before_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$target_template_before_response" |
            base64 --decode >"$target_template_before"
          aws cloudformation get-stack-policy \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_policy_before"
          jq -e '.StackPolicyBody | fromjson' \
            "$target_policy_before" >/dev/null
          aws cloudformation list-stack-resources \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_resources_before"
          jq -e '
            (.StackResourceSummaries | length) > 0
            and all(
              .StackResourceSummaries[];
              .ResourceStatus
              | IN(
                  "CREATE_COMPLETE",
                  "UPDATE_COMPLETE",
                  "UPDATE_ROLLBACK_COMPLETE"
                )
            )
          ' "$target_resources_before" >/dev/null

          target_projection='{
            StackId,
            StackName,
            StackStatus,
            EnableTerminationProtection,
            RoleARN: (.RoleARN // null),
            NotificationARNs: (.NotificationARNs // []),
            Capabilities: (.Capabilities // []),
            Parameters: (.Parameters // [] | sort_by(.ParameterKey)),
            Tags: (.Tags // [] | sort_by(.Key)),
            Outputs: (.Outputs // [] | sort_by(.OutputKey))
          }'
          target_projection_sha256="$(
            jq -Sc ".Stacks[0] | $target_projection" "$target_before" |
              sha256sum |
              awk '{print $1}'
          )"
          target_template_sha256="$(
            sha256sum "$target_template_before" | awk '{print $1}'
          )"
          target_policy_sha256="$(
            jq -Sc '.StackPolicyBody | fromjson' "$target_policy_before" |
              sha256sum |
              awk '{print $1}'
          )"
          target_resources_sha256="$(
            jq -Sc '
              .StackResourceSummaries
              | sort_by(.LogicalResourceId)
              | map({
                  LogicalResourceId,
                  PhysicalResourceId,
                  ResourceType,
                  ResourceStatus
                })
            ' "$target_resources_before" |
              sha256sum |
              awk '{print $1}'
          )"

          phase=plan-enumeration
          aws cloudformation list-change-sets \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$plans"
          jq -e '
            all(
              (.Summaries // [])[];
              (.ChangeSetName | startswith("foundation-storage-"))
              and .Status == "CREATE_COMPLETE"
              and (.ExecutionStatus | IN("AVAILABLE", "OBSOLETE"))
              and ((.ImportExistingResources // false) == false)
            )
          ' "$plans" >/dev/null
          printf '[]\n' >"$plan_records"
          plan_count=0
          while IFS= read -r encoded; do
            summary="$(printf '%s' "$encoded" | base64 --decode)"
            plan_name="$(jq -er '.ChangeSetName' <<<"$summary")"
            plan_id="$(jq -er '.ChangeSetId' <<<"$summary")"
            [[ "$plan_name" =~ ^foundation-storage-[0-9a-f]{12}-[0-9a-f]{12}$ ]]
            [[ "$plan_id" == \
              arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:changeSet/${plan_name}/* ]]

            plan_count=$((plan_count + 1))
            detail="${RUNNER_TEMP:?}/foundation-abort-plan-${plan_count}.json"
            final_detail="${RUNNER_TEMP:?}/foundation-abort-plan-final-${plan_count}.json"
            plan_template_response="${RUNNER_TEMP:?}/foundation-abort-plan-template-${plan_count}.json"
            plan_template="${RUNNER_TEMP:?}/foundation-abort-plan-template-${plan_count}.yaml"
            source_template="${RUNNER_TEMP:?}/foundation-abort-plan-source-${plan_count}.yaml"
            source_commit_json="${RUNNER_TEMP:?}/foundation-abort-plan-commit-${plan_count}.json"
            source_compare_json="${RUNNER_TEMP:?}/foundation-abort-plan-compare-${plan_count}.json"
            absence_error="${RUNNER_TEMP:?}/foundation-abort-plan-absence-${plan_count}.err"

            aws cloudformation describe-change-set \
              --stack-name "$target_stack_name" \
              --change-set-name "$plan_id" \
              --include-property-values \
              --region "$AWS_REGION" \
              --output json >"$detail"
            description="$(jq -er '.Description' "$detail")"
            if [[ "$description" =~ ^operation=foundation-storage-migration\ commit=([0-9a-f]{40})\ template_sha256=([0-9a-f]{64})\ version_id=([^[:space:]]+)$ ]]; then
              plan_source="${BASH_REMATCH[1]}"
              plan_template_sha256="${BASH_REMATCH[2]}"
              plan_version_id="${BASH_REMATCH[3]}"
            else
              exit 1
            fi
            plan_name_body="${plan_name#foundation-storage-}"
            test "${plan_source:0:12}" = "${plan_name_body%%-*}"
            plan_name_suffix="${plan_name##*-}"
            test "${plan_template_sha256:0:12}" = "$plan_name_suffix"

            jq -e \
              --arg account "$AWS_ACCOUNT_ID" \
              --arg region "$AWS_REGION" \
              --arg id "$plan_id" \
              --arg name "$plan_name" \
              --arg description "$description" \
              --slurpfile current "$target_before" \
              '
                def parameter_map:
                  map({key:.ParameterKey, value:.ParameterValue})
                  | from_entries;
                (
                  $current[0].Stacks[0].Parameters
                  | parameter_map
                  | .ArtifactAccessLoggingEnabled = "true"
                  | .AlarmRoutingEnabled = (.AlarmRoutingEnabled // "false")
                ) as $expectedParameters
                | .ChangeSetId == $id
                and .ChangeSetName == $name
                and .ChangeSetId == (
                  "arn:aws:cloudformation:" + $region + ":" + $account
                  + ":changeSet/" + $name + "/"
                  + (.ChangeSetId | split("/") | last)
                )
                and (.ChangeSetId | split("/") | length) == 3
                and .StackId == $current[0].Stacks[0].StackId
                and .StackName == $current[0].Stacks[0].StackName
                and .Description == $description
                and .ChangeSetType == "UPDATE"
                and .Status == "CREATE_COMPLETE"
                and (.ExecutionStatus | IN("AVAILABLE", "OBSOLETE"))
                and ((.IncludeNestedStacks // false) == false)
                and .Capabilities == ["CAPABILITY_NAMED_IAM"]
                and ((.RoleARN // null) == null)
                and ((.NotificationARNs // []) == [])
                and (
                  (.RollbackConfiguration // {}) == {}
                  or .RollbackConfiguration == {
                    RollbackTriggers: [],
                    MonitoringTimeInMinutes: 0
                  }
                )
                and ((.ImportExistingResources // false) == false)
                and ((.OnStackFailure // null) == null)
                and (
                  ((.Tags // []) | sort_by(.Key))
                  == (
                    ($current[0].Stacks[0].Tags // []) | sort_by(.Key)
                  )
                )
                and (.Parameters | parameter_map) == $expectedParameters
              ' "$detail" >/dev/null

            aws cloudformation get-template \
              --stack-name "$target_stack_name" \
              --change-set-name "$plan_id" \
              --template-stage Original \
              --region "$AWS_REGION" \
              --output json >"$plan_template_response"
            jq -er '
              .TemplateBody
              | select(type == "string" and length > 0)
              | @base64
            ' "$plan_template_response" |
              base64 --decode >"$plan_template"
            test "$(sha256sum "$plan_template" | awk '{print $1}')" = \
              "$plan_template_sha256"

            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${plan_source}" \
              >"$source_commit_json"
            jq -e --arg source "$plan_source" \
              '.sha == $source' "$source_commit_json" >/dev/null
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${plan_source}...${TARGET_SHA}" \
              >"$source_compare_json"
            jq -e \
              --arg source "$plan_source" \
              '
                .merge_base_commit.sha == $source
                and (.status == "ahead" or .status == "identical")
              ' "$source_compare_json" >/dev/null
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/aws/bootstrap-oidc.yaml?ref=${plan_source}" \
              >"$source_template"
            test "$(sha256sum "$source_template" | awk '{print $1}')" = \
              "$plan_template_sha256"

            plan_id_sha256="$(
              printf '%s' "$plan_id" | sha256sum | awk '{print $1}'
            )"
            plan_name_sha256="$(
              printf '%s' "$plan_name" | sha256sum | awk '{print $1}'
            )"
            description_sha256="$(
              printf '%s' "$description" | sha256sum | awk '{print $1}'
            )"
            version_id_sha256="$(
              printf '%s' "$plan_version_id" |
                sha256sum |
                awk '{print $1}'
            )"

            phase=plan-delete
            aws cloudformation describe-change-set \
              --stack-name "$target_stack_name" \
              --change-set-name "$plan_id" \
              --include-property-values \
              --region "$AWS_REGION" \
              --output json >"$final_detail"
            jq -e \
              --arg id "$plan_id" \
              --arg name "$plan_name" \
              --arg stackId "$(jq -er '.Stacks[0].StackId' "$target_before")" \
              '
                .ChangeSetId == $id
                and .ChangeSetName == $name
                and .StackId == $stackId
                and .ChangeSetType == "UPDATE"
                and .Status == "CREATE_COMPLETE"
                and (.ExecutionStatus | IN("AVAILABLE", "OBSOLETE"))
                and ((.ImportExistingResources // false) == false)
              ' "$final_detail" >/dev/null
            observed_status="$(jq -er '.Status' "$final_detail")"
            observed_execution="$(jq -er '.ExecutionStatus' "$final_detail")"
            aws cloudformation delete-change-set \
              --stack-name "$target_stack_name" \
              --change-set-name "$plan_id" \
              --region "$AWS_REGION"
            absent=false
            for attempt in $(seq 1 30); do
              if aws cloudformation describe-change-set \
                  --stack-name "$target_stack_name" \
                  --change-set-name "$plan_id" \
                  --region "$AWS_REGION" \
                  --output json >/dev/null 2>"$absence_error"; then
                :
              elif grep -Eq 'ChangeSetNotFound|does not exist' \
                  "$absence_error"; then
                absent=true
                break
              else
                exit 1
              fi
              test "$attempt" -lt 30
              sleep 2
            done
            test "$absent" = "true"

            jq \
              --arg idSha256 "$plan_id_sha256" \
              --arg nameSha256 "$plan_name_sha256" \
              --arg descriptionSha256 "$description_sha256" \
              --arg sourceCommit "$plan_source" \
              --arg templateSha256 "$plan_template_sha256" \
              --arg versionIdSha256 "$version_id_sha256" \
              --arg status "$observed_status" \
              --arg executionStatus "$observed_execution" \
              '. + [{
                idSha256: $idSha256,
                nameSha256: $nameSha256,
                descriptionSha256: $descriptionSha256,
                sourceCommit: $sourceCommit,
                templateSha256: $templateSha256,
                versionIdSha256: $versionIdSha256,
                observedStatus: $status,
                observedExecutionStatus: $executionStatus,
                repositorySourceVerified: true,
                deleted: true,
                absenceVerified: true
              }]' "$plan_records" >"${plan_records}.next"
            mv "${plan_records}.next" "$plan_records"
            phase=plan-enumeration
          done < <(
            jq -r '
              [
                (.Summaries // [])[]
                | select(
                    .ChangeSetName
                    | startswith("foundation-storage-")
                  )
              ]
              | sort_by(.ChangeSetName)
              | .[]
              | @base64
            ' "$plans"
          )

          aws cloudformation list-change-sets \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$remaining_plans"
          jq -e '(.Summaries // []) | length == 0' \
            "$remaining_plans" >/dev/null

          phase=target-after
          aws cloudformation describe-stacks \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_after"
          aws cloudformation get-template \
            --stack-name "$target_stack_name" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$target_template_after_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$target_template_after_response" |
            base64 --decode >"$target_template_after"
          aws cloudformation get-stack-policy \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_policy_after"
          aws cloudformation list-stack-resources \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$target_resources_after"
          test "$(
            jq -Sc ".Stacks[0] | $target_projection" "$target_after" |
              sha256sum |
              awk '{print $1}'
          )" = "$target_projection_sha256"
          test "$(sha256sum "$target_template_after" | awk '{print $1}')" = \
            "$target_template_sha256"
          test "$(
            jq -Sc '.StackPolicyBody | fromjson' "$target_policy_after" |
              sha256sum |
              awk '{print $1}'
          )" = "$target_policy_sha256"
          test "$(
            jq -Sc '
              .StackResourceSummaries
              | sort_by(.LogicalResourceId)
              | map({
                  LogicalResourceId,
                  PhysicalResourceId,
                  ResourceType,
                  ResourceStatus
                })
            ' "$target_resources_after" |
              sha256sum |
              awk '{print $1}'
          )" = "$target_resources_sha256"

          phase=authority-final-proof
          bash aws/foundation-migration-authority.sh verify-intrinsic \
            >"$authority_final"
          test "$(
            jq -Sc . "$authority_final" | sha256sum | awk '{print $1}'
          )" = "$authority_proof_sha256"
          authority_stack_name="${APP_NAME}-foundation-migration-authority"
          aws cloudformation describe-stacks \
            --stack-name "$authority_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$authority_stack"
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            --arg stack "$authority_stack_name" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and .Stacks[0].StackId == (
                "arn:aws:cloudformation:" + $region + ":" + $account
                + ":stack/" + $stack + "/"
                + (.Stacks[0].StackId | split("/") | last)
              )
              and (.Stacks[0].StackId | split("/") | length) == 3
              and (
                .Stacks[0].StackStatus
                | IN(
                    "CREATE_COMPLETE",
                    "UPDATE_COMPLETE",
                    "UPDATE_ROLLBACK_COMPLETE"
                  )
              )
              and .Stacks[0].EnableTerminationProtection == false
              and ((.Stacks[0].RoleARN // null) == null)
            ' "$authority_stack" >/dev/null
          authority_stack_id="$(jq -er '.Stacks[0].StackId' "$authority_stack")"
          test "$(
            printf '%s' "$authority_stack_id" |
              sha256sum |
              awk '{print $1}'
          )" = "$(jq -er '.authorityStackIdSha256' "$authority_proof")"

          phase=final-plan-inventory
          aws cloudformation list-change-sets \
            --stack-name "$target_stack_name" \
            --region "$AWS_REGION" \
            --output json >"$final_plans"
          jq -e '(.Summaries // []) | length == 0' "$final_plans" >/dev/null

          phase=authority-delete
          client_token="abort-foundation-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation delete-stack \
            --stack-name "$authority_stack_id" \
            --client-request-token "$client_token" \
            --region "$AWS_REGION"
          authority_absent=false
          authority_error="${RUNNER_TEMP:?}/foundation-abort-authority-absence.err"
          for attempt in $(seq 1 90); do
            if aws cloudformation describe-stacks \
                --stack-name "$authority_stack_id" \
                --region "$AWS_REGION" \
                --output json >/dev/null 2>"$authority_error"; then
              :
            elif grep -Fq "ValidationError" "$authority_error" &&
                grep -Fq "does not exist" "$authority_error"; then
              authority_absent=true
              break
            else
              exit 1
            fi
            test "$attempt" -lt 90
            sleep 5
          done
          test "$authority_absent" = "true"
          role_error="${RUNNER_TEMP:?}/foundation-abort-role-absence.err"
          if aws iam get-role \
              --role-name "${APP_NAME}-github-foundation-migration" \
              --output json >/dev/null 2>"$role_error"; then
            exit 1
          fi
          grep -Fq "NoSuchEntity" "$role_error"

          phase=receipt
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          client_token_sha256="$(
            printf '%s' "$client_token" | sha256sum | awk '{print $1}'
          )"
          jq \
            --arg generatedAt "$generated_at" \
            --arg targetStatus \
              "$(jq -er '.Stacks[0].StackStatus' "$target_after")" \
            --arg targetProjectionSha256 "$target_projection_sha256" \
            --arg targetTemplateSha256 "$target_template_sha256" \
            --arg targetPolicySha256 "$target_policy_sha256" \
            --arg targetResourcesSha256 "$target_resources_sha256" \
            --arg authoritySourceCommit "$authority_source" \
            --arg historicalAuthorityTemplateSha256 \
              "$historical_authority_template_sha256" \
            --arg clientTokenSha256 "$client_token_sha256" \
            --argjson planCount "$plan_count" \
            --slurpfile authority "$authority_proof" \
            --slurpfile plans "$plan_records" \
            '
              . + {
                ok: true,
                result: "migration-aborted-authority-retired",
                generatedAt: $generatedAt,
                foundation: {
                  stackStatus: $targetStatus,
                  stackProjectionSha256: $targetProjectionSha256,
                  templateSha256: $targetTemplateSha256,
                  stackPolicySha256: $targetPolicySha256,
                  resourcesSha256: $targetResourcesSha256,
                  unchanged: true
                },
                changeSetCleanup: {
                  discoveredCount: $planCount,
                  deletedCount: $planCount,
                  remainingCount: 0,
                  plans: $plans[0]
                },
                historicalAuthoritySource: {
                  sourceCommit: $authoritySourceCommit,
                  canonicalTemplateSha256:
                    $historicalAuthorityTemplateSha256,
                  verifiedAncestor: true,
                  boundedGeneratorMode: "render-template",
                  credentialFreeEnvironment: true,
                  matchesRecordedAndLiveTemplate: true
                },
                abortExecution: {
                  clientRequestTokenSha256: $clientTokenSha256
                },
                retiredAuthority: (
                  $authority[0] + {
                    proofStableUntilDeletion: true,
                    stackDeleted: true,
                    roleDeleted: true,
                    retired: true
                  }
                )
              }
              | del(.failure)
            ' "$receipt" >"$receipt_next"
          mv "$receipt_next" "$receipt"
          trap - ERR

      - name: Upload sanitized abort receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-storage-migration-abort-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-storage-migration-receipt.json
          if-no-files-found: error
          retention-days: 90

  prove-retirement-readiness:
    name: Prove permanent authority before retirement
    needs: authorize
    if: inputs.operation == 'retire'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bootstrap
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      proof-sha256: ${{ steps.proof.outputs.sha256 }}
    steps:
      - name: Check out the authorized main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask foundation account and permanent authority ARN
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-promotion"
          echo "::add-mask::$AWS_ACCOUNT_ID"
          echo "::add-mask::$role_arn"

      - name: Configure permanent narrow foundation authority
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.APP_NAME }}-github-foundation-promotion
          role-session-name: archon-foundation-retirement-proof-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Prove candidate foundation and permanent controls
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          proof="${RUNNER_TEMP:?}/foundation-retirement-readiness.json"
          template_response="${RUNNER_TEMP:?}/foundation-retirement-template.json"
          template="${RUNNER_TEMP:?}/foundation-retirement-template.yaml"
          stack_policy="${RUNNER_TEMP:?}/foundation-retirement-policy.json"
          bash aws/prove-foundation-storage-controls.sh >"$proof"
          jq -e '.ok == true' "$proof" >/dev/null
          aws cloudformation get-template \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$template_response" |
            base64 --decode >"$template"
          test "$(sha256sum "$template" | awk '{print $1}')" = \
            "$(sha256sum aws/bootstrap-oidc.yaml | awk '{print $1}')"
          aws cloudformation get-stack-policy \
            --stack-name "${APP_NAME}-delivery-bootstrap" \
            --region "$AWS_REGION" \
            --output json >"$stack_policy"
          jq -e \
            --slurpfile expected aws/bootstrap-stack-policy.json \
            '(.StackPolicyBody | fromjson) == $expected[0]' \
            "$stack_policy" >/dev/null
          sha256="$(jq -Sc . "$proof" | sha256sum | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

  retire-authority:
    name: Retire one-time migration authority
    needs:
      - authorize
      - prove-retirement-readiness
    if: inputs.operation == 'retire'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bootstrap
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the authorized main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mask foundation account and retirement authority ARN
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-foundation-migration"
          echo "::add-mask::$AWS_ACCOUNT_ID"
          echo "::add-mask::$role_arn"

      - name: Configure exact one-time migration authority
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_FOUNDATION_MIGRATION_ROLE_ARN }}
          role-session-name: archon-foundation-retire-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Verify and retire the exact authority stack
        env:
          PERMANENT_PROOF_SHA256: ${{ needs.prove-retirement-readiness.outputs.proof-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          authority_proof="${RUNNER_TEMP:?}/foundation-retired-authority-proof.json"
          final_authority_proof="${RUNNER_TEMP:?}/foundation-retirement-final-authority-proof.json"
          fresh_controls="${RUNNER_TEMP:?}/foundation-retirement-fresh-controls.json"
          fresh_template_response="${RUNNER_TEMP:?}/foundation-retirement-fresh-template-response.json"
          fresh_template="${RUNNER_TEMP:?}/foundation-retirement-fresh-template.yaml"
          fresh_stack_policy="${RUNNER_TEMP:?}/foundation-retirement-fresh-stack-policy.json"
          permanent_role="${RUNNER_TEMP:?}/foundation-retirement-permanent-role.json"
          permanent_role_policy="${RUNNER_TEMP:?}/foundation-retirement-permanent-role-policy.json"
          permanent_role_drift="${RUNNER_TEMP:?}/foundation-retirement-permanent-role-drift.json"
          final_change_sets="${RUNNER_TEMP:?}/foundation-retirement-final-change-sets.json"
          fresh_bundle="${RUNNER_TEMP:?}/foundation-retirement-fresh-proof.json"
          receipt="${RUNNER_TEMP:?}/foundation-storage-migration-receipt.json"
          bash aws/foundation-migration-authority.sh verify \
            >"$authority_proof"
          jq -e '.ok == true and .retirementRequired == true' \
            "$authority_proof" >/dev/null
          stack="${APP_NAME}-foundation-migration-authority"
          target_stack="${APP_NAME}-delivery-bootstrap"

          # Re-prove every retirement prerequisite under the destructive job's
          # fresh session. This block intentionally sits adjacent to DeleteStack.
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          bash aws/prove-foundation-storage-controls.sh >"$fresh_controls"
          jq -e '.ok == true' "$fresh_controls" >/dev/null
          fresh_controls_sha256="$(
            jq -Sc . "$fresh_controls" | sha256sum | awk '{print $1}'
          )"
          test "$fresh_controls_sha256" = "$PERMANENT_PROOF_SHA256"

          aws cloudformation get-template \
            --stack-name "$target_stack" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$fresh_template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$fresh_template_response" | base64 --decode >"$fresh_template"
          fresh_template_sha256="$(sha256sum "$fresh_template" | awk '{print $1}')"
          test "$fresh_template_sha256" = \
            "$(sha256sum aws/bootstrap-oidc.yaml | awk '{print $1}')"

          aws cloudformation get-stack-policy \
            --stack-name "$target_stack" \
            --region "$AWS_REGION" \
            --output json >"$fresh_stack_policy"
          jq -e \
            --slurpfile expected aws/bootstrap-stack-policy.json \
            '(.StackPolicyBody | fromjson) == $expected[0]' \
            "$fresh_stack_policy" >/dev/null
          fresh_stack_policy_sha256="$(
            jq -Sc '.StackPolicyBody | fromjson' "$fresh_stack_policy" |
              sha256sum |
              awk '{print $1}'
          )"

          permanent_role_name="${APP_NAME}-github-foundation-promotion"
          aws iam get-role \
            --role-name "$permanent_role_name" \
            --output json >"$permanent_role"
          aws iam get-role-policy \
            --role-name "$permanent_role_name" \
            --policy-name promote-foundation-logging \
            --output json >"$permanent_role_policy"
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg app "$APP_NAME" \
            --arg provider "$GITHUB_OIDC_PROVIDER_ARN" \
            --arg repository "${GITHUB_ORGANIZATION}/${GITHUB_REPOSITORY_NAME}" \
            --arg repositoryId "$GITHUB_REPOSITORY_ID" \
            --arg ownerId "$GITHUB_REPOSITORY_OWNER_ID" \
            '
              def tag_map:
                map({key:.Key, value:.Value}) | from_entries;
              .Role.RoleName == ($app + "-github-foundation-promotion")
              and .Role.Arn == (
                "arn:aws:iam::" + $account + ":role/" + $app
                + "-github-foundation-promotion"
              )
              and .Role.MaxSessionDuration == 3600
              and .Role.AssumeRolePolicyDocument == {
                Version: "2012-10-17",
                Statement: [{
                  Effect: "Allow",
                  Principal: {Federated:$provider},
                  Action: "sts:AssumeRoleWithWebIdentity",
                  Condition: {StringEquals: {
                    "token.actions.githubusercontent.com:aud":
                      "sts.amazonaws.com",
                    "token.actions.githubusercontent.com:sub":
                      ("repo:" + $repository + ":environment:bootstrap"),
                    "token.actions.githubusercontent.com:repository":
                      $repository,
                    "token.actions.githubusercontent.com:repository_id":
                      $repositoryId,
                    "token.actions.githubusercontent.com:repository_owner_id":
                      $ownerId,
                    "token.actions.githubusercontent.com:ref":
                      "refs/heads/main",
                    "token.actions.githubusercontent.com:environment":
                      "bootstrap",
                    "token.actions.githubusercontent.com:workflow": [
                      "Bootstrap AWS Foundation",
                      "Foundation Storage Migration"
                    ]
                  }}
                }]
              }
              and ((.Role.Tags // []) | tag_map) == {
                Application: $app,
                Environment: "bootstrap",
                ManagedBy: "CloudFormation"
              }
            ' "$permanent_role" >/dev/null
          jq -e \
            --arg role "$permanent_role_name" \
            '
              .RoleName == $role
              and .PolicyName == "promote-foundation-logging"
              and .PolicyDocument.Version == "2012-10-17"
              and (
                .PolicyDocument.Statement | map(.Sid) | sort
              ) == ([
                "ActivateArtifactBucketLoggingWithoutReplacement",
                "CreatePinnedBootstrapChangeSet",
                "EncryptImmutableFoundationTemplate",
                "ExecuteOnlyBootstrapLoggingChangeSets",
                "InspectArtifactAndArchiveBuckets",
                "InspectBootstrapStackAndChangeSets",
                "InspectFoundationAutomationRule",
                "InspectOriginVerificationSecretMetadata",
                "InspectPermanentControlRoleMetadata",
                "InspectPermanentControlRolePolicies",
                "PublishImmutableFoundationTemplate",
                "ResolveExactCloudFormationExecutionRoles",
                "ResolveExactFoundationAutomationRule",
                "ResolveExactFoundationRoleAttributes"
              ] | sort)
              and all(.PolicyDocument.Statement[]; .Effect == "Allow")
            ' "$permanent_role_policy" >/dev/null

          aws cloudformation detect-stack-resource-drift \
            --stack-name "$target_stack" \
            --logical-resource-id FoundationPromotionRole \
            --region "$AWS_REGION" \
            --output json >"$permanent_role_drift"
          jq -e \
            --arg stack "$target_stack" \
            --arg role "$permanent_role_name" \
            '
              .StackResourceDrift.StackName == $stack
              and .StackResourceDrift.LogicalResourceId
                == "FoundationPromotionRole"
              and .StackResourceDrift.PhysicalResourceId == $role
              and .StackResourceDrift.ResourceType == "AWS::IAM::Role"
              and .StackResourceDrift.StackResourceDriftStatus == "IN_SYNC"
              and (.StackResourceDrift.PropertyDifferences // []) == []
            ' "$permanent_role_drift" >/dev/null

          aws cloudformation list-change-sets \
            --stack-name "$target_stack" \
            --region "$AWS_REGION" \
            --output json >"$final_change_sets"
          jq -e '(.Summaries // []) | length == 0' \
            "$final_change_sets" >/dev/null

          permanent_role_sha256="$(
            jq -Sc '{
              RoleName: .Role.RoleName,
              Arn: .Role.Arn,
              MaxSessionDuration: .Role.MaxSessionDuration,
              AssumeRolePolicyDocument: .Role.AssumeRolePolicyDocument,
              Tags: (.Role.Tags // [] | sort_by(.Key))
            }' "$permanent_role" | sha256sum | awk '{print $1}'
          )"
          permanent_role_policy_sha256="$(
            jq -Sc '{
              RoleName,
              PolicyName,
              PolicyDocument
            }' "$permanent_role_policy" | sha256sum | awk '{print $1}'
          )"
          permanent_role_drift_sha256="$(
            jq -Sc '.StackResourceDrift | {
              StackId,
              LogicalResourceId,
              PhysicalResourceId,
              ResourceType,
              ExpectedProperties,
              ActualProperties,
              PropertyDifferences,
              StackResourceDriftStatus
            }' "$permanent_role_drift" | sha256sum | awk '{print $1}'
          )"

          # Final AWS read before DeleteStack: rebind the exact authority stack,
          # role, policy, template, source parameters/tags, and one resource.
          bash aws/foundation-migration-authority.sh verify-intrinsic \
            >"$final_authority_proof"
          jq -e \
            --slurpfile initial "$authority_proof" \
            '
              .ok == true
              and .verificationMode == "verify-intrinsic"
              and .intrinsicSafetyContractVerified == true
              and .creationBindingVerified == true
              and .resourceCount == 1
              and .roleArnSha256 == $initial[0].roleArnSha256
              and .trustPolicySha256 == $initial[0].trustPolicySha256
              and .permissionsPolicySha256
                == $initial[0].permissionsPolicySha256
              and .authorityTemplateSha256
                == $initial[0].authorityTemplateSha256
              and .authorityStackIdSha256
                == $initial[0].authorityStackIdSha256
              and .sourceCommit == $initial[0].sourceCommit
              and .stackStatus == $initial[0].stackStatus
            ' "$final_authority_proof" >/dev/null
          final_authority_proof_sha256="$(
            jq -Sc . "$final_authority_proof" |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "$final_authority_proof_sha256" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg controlsSha256 "$fresh_controls_sha256" \
            --arg templateSha256 "$fresh_template_sha256" \
            --arg stackPolicySha256 "$fresh_stack_policy_sha256" \
            --arg permanentRoleSha256 "$permanent_role_sha256" \
            --arg permanentRolePolicySha256 \
              "$permanent_role_policy_sha256" \
            --arg permanentRoleDriftSha256 \
              "$permanent_role_drift_sha256" \
            --arg finalAuthorityProofSha256 \
              "$final_authority_proof_sha256" \
            '{
              controlsSha256: $controlsSha256,
              templateSha256: $templateSha256,
              stackPolicySha256: $stackPolicySha256,
              permanentRoleSha256: $permanentRoleSha256,
              permanentRolePolicySha256: $permanentRolePolicySha256,
              permanentRoleDriftSha256: $permanentRoleDriftSha256,
              finalAuthorityProofSha256: $finalAuthorityProofSha256,
              finalAuthorityProofStable: true,
              permanentRoleInSync: true,
              changeSetInventoryEmpty: true,
              freshImmediatelyBeforeDeletion: true
            }' >"$fresh_bundle"
          fresh_retirement_proof_sha256="$(
            jq -Sc . "$fresh_bundle" | sha256sum | awk '{print $1}'
          )"
          [[ "$fresh_retirement_proof_sha256" =~ ^[0-9a-f]{64}$ ]]

          client_token="retire-foundation-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation delete-stack \
            --stack-name "$stack" \
            --client-request-token "$client_token" \
            --region "$AWS_REGION"
          deleted=false
          for attempt in $(seq 1 90); do
            error="${RUNNER_TEMP:?}/foundation-authority-delete.err"
            if aws cloudformation describe-stacks \
                --stack-name "$stack" \
                --region "$AWS_REGION" \
                --output json >/dev/null 2>"$error"; then
              :
            elif grep -Fq "ValidationError" "$error" &&
                grep -Fq "does not exist" "$error"; then
              deleted=true
              break
            fi
            test "$attempt" -lt 90
            sleep 5
          done
          test "$deleted" = "true"
          role_error="${RUNNER_TEMP:?}/foundation-authority-role.err"
          if aws iam get-role \
              --role-name "${APP_NAME}-github-foundation-migration" \
              --output json >/dev/null 2>"$role_error"; then
            echo "The one-time migration role still exists." >&2
            exit 1
          fi
          grep -Fq "NoSuchEntity" "$role_error"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg commit "$TARGET_SHA" \
            --arg generatedAt "$generated_at" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg clientToken "$client_token" \
            --arg permanentProofSha256 "$PERMANENT_PROOF_SHA256" \
            --arg freshRetirementProofSha256 \
              "$fresh_retirement_proof_sha256" \
            --arg finalAuthorityProofSha256 \
              "$final_authority_proof_sha256" \
            --slurpfile authority "$authority_proof" \
            '{
              schema: "archon.aws.foundation-storage-migration",
              schemaVersion: 1,
              ok: true,
              operation: "retire",
              result: "one-time-authority-retired",
              commit: $commit,
              generatedAt: $generatedAt,
              run: {
                id: ($runId | tonumber),
                attempt: ($runAttempt | tonumber),
                workflowRef: $workflowRef
              },
              execution: {
                clientRequestToken: $clientToken
              },
              permanentAuthorityProofSha256:
                $permanentProofSha256,
              freshRetirementProofSha256:
                $freshRetirementProofSha256,
              freshRetirementProofBound: true,
              finalAuthorityProofSha256:
                $finalAuthorityProofSha256,
              finalAuthorityProofBoundImmediatelyBeforeDeletion: true,
              retiredAuthority: (
                $authority[0] + {
                  stackDeleted: true,
                  roleDeleted: true,
                  retired: true
                }
              )
            }' >"$receipt"

      - name: Upload sanitized retirement receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-storage-migration-retire-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-storage-migration-receipt.json
          if-no-files-found: error
          retention-days: 90
