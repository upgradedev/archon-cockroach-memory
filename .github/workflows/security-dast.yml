name: Hosted DAST

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy AWS"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "43 4 * * 1"

concurrency:
  group: hosted-dast-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAST_TARGET_URL: https://d2s5v0o0eg2aaw.cloudfront.net
  DAST_CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DAST_EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
  DAST_REQUIRE_HARDENED_HEADERS: "1"
  DAST_SCANNER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DAST_SOURCE_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
  DAST_SOURCE_DEPLOY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}

jobs:
  source-gate:
    name: Validate Hosted DAST source deployment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful operation-bound Deploy AWS source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            exit 0
          fi
          test "$SOURCE_CONCLUSION" = "success"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          deploy_jobs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}/jobs?per_page=100"
          )"
          jq -e \
            --argjson run_id "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_SHA" \
            '
              def exact_job($name):
                [.jobs[] |
                  select(
                    .name == $name and
                    .run_id == $run_id and
                    .head_sha == $sha and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] | length == 1;
              def exact_step($job_name; $step_name):
                [.jobs[] | select(.name == $job_name)] as $jobs |
                ($jobs | length == 1) and
                ([
                  $jobs[0].steps[]? |
                  select(
                    .name == $step_name and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] | length == 1);
              .total_count == (.jobs | length) and
              exact_job("Validate Deploy AWS source CI") and
              exact_step(
                "Validate Deploy AWS source CI";
                "Require successful exact-main push CI source"
              ) and
              exact_job("Verify CI SHA and build once") and
              exact_step(
                "Verify CI SHA and build once";
                "Upload immutable candidate"
              ) and
              exact_job("Deploy and smoke staging") and
              exact_step(
                "Deploy and smoke staging";
                "Deploy staging with recovery-safe SAM canary"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Smoke the same-origin application and real recall path"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Hosted Chromium judge journey on staging"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Build and validate sanitized staging deployment receipt"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Upload staging receipt"
              ) and
              exact_job("Promote identical candidate to production") and
              exact_step(
                "Promote identical candidate to production";
                "Deploy production with recovery-safe SAM canary"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Smoke production through CloudFront"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Hosted Chromium judge journey on production"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Build and validate sanitized production deployment receipt"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Commit the receipt-bound production recovery intent"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Upload production receipt"
              ) and
              exact_job(
                "Prove production memory through CockroachDB Managed MCP"
              ) and
              exact_step(
                "Prove production memory through CockroachDB Managed MCP";
                "Run bounded read-only Managed MCP proof"
              ) and
              exact_step(
                "Prove production memory through CockroachDB Managed MCP";
                "Upload sanitized Managed MCP receipt"
              )
            ' <<< "$deploy_jobs"

  boundary-probes:
    needs: source-gate
    name: Bounded active API and browser-boundary probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
      - name: Run fail-closed hosted adversarial probes
        env:
          DAST_RECEIPT_PATH: ${{ runner.temp }}/hosted-dast.json
        run: node scripts/hosted-dast.mjs
      - name: Upload sanitized hosted DAST receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-dast-${{ env.DAST_CHECKOUT_SHA }}-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || github.run_attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-dast.json
          if-no-files-found: error
          retention-days: 90

  zap-baseline:
    needs: source-gate
    name: OWASP ZAP passive and AJAX-spider baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
          persist-credentials: false
      - name: Scan the owned public production release
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          rules_file_name: .zap/release.tsv
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          cmd_options: "-a -j -m 2"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ env.DAST_CHECKOUT_SHA }}-${{ github.run_attempt }}
