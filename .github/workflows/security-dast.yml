name: Hosted DAST

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy AWS"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "43 4 * * 1"

concurrency:
  group: hosted-dast-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAST_TARGET_URL: https://d2s5v0o0eg2aaw.cloudfront.net
  DAST_CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DAST_EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
  DAST_SCANNER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  boundary-probes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Bounded active API and browser-boundary probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
      - name: Run fail-closed hosted adversarial probes
        env:
          DAST_RECEIPT_PATH: ${{ runner.temp }}/hosted-dast.json
        run: node scripts/hosted-dast.mjs
      - name: Upload sanitized hosted DAST receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-dast-${{ env.DAST_CHECKOUT_SHA }}
          path: ${{ runner.temp }}/hosted-dast.json
          if-no-files-found: error
          retention-days: 30

  zap-baseline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: OWASP ZAP passive and AJAX-spider baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
      - name: Scan the owned public production surface
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          cmd_options: "-a -j -m 2"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ env.DAST_CHECKOUT_SHA }}
