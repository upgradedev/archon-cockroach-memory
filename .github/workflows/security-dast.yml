name: Hosted DAST

# Exact-release scans are reusable jobs inside the causal Deploy AWS run.
# Scheduled and manual invocations remain read-only production audits.
on:
  workflow_call:
    inputs:
      exact_sha:
        description: Exact deployed main commit to scan
        required: true
        type: string
      deploy_run_id:
        description: Deploy AWS run that promoted the release
        required: true
        type: number
      deploy_run_attempt:
        description: Exact Deploy AWS run attempt
        required: true
        type: number
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

concurrency:
  group: hosted-dast-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAST_TARGET_URL: https://d2s5v0o0eg2aaw.cloudfront.net
  DAST_REQUIRE_HARDENED_HEADERS: "1"

jobs:
  source-gate:
    name: Validate Hosted DAST source deployment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
      expected_release_sha: ${{ steps.source.outputs.expected_release_sha }}
      source_deploy_run_id: ${{ steps.source.outputs.source_deploy_run_id }}
      source_deploy_run_attempt: ${{ steps.source.outputs.source_deploy_run_attempt }}
      artifact_run_id: ${{ steps.source.outputs.artifact_run_id }}
      artifact_run_attempt: ${{ steps.source.outputs.artifact_run_attempt }}
    steps:
      - name: Require successful operation-bound Deploy AWS source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RUN_ID: ${{ inputs.deploy_run_id || '' }}
          REQUESTED_RUN_ATTEMPT: ${{ inputs.deploy_run_attempt || '' }}
          REQUESTED_SHA: ${{ inputs.exact_sha || '' }}
        run: |
          set -euo pipefail
          checkout_sha="$GITHUB_SHA"
          expected_release_sha=""
          source_deploy_run_id=""
          source_deploy_run_attempt=""
          if [[ -z "$REQUESTED_SHA" &&
                -z "$REQUESTED_RUN_ID" &&
                -z "$REQUESTED_RUN_ATTEMPT" ]]; then
            case "$EVENT_NAME" in
              schedule|workflow_dispatch) ;;
              *)
                echo "Standalone Hosted DAST has an invalid trigger." >&2
                exit 1
                ;;
            esac
            test "$GITHUB_REF" = "refs/heads/main"
            [[ "$checkout_sha" =~ ^[0-9a-f]{40}$ ]]
            {
              echo "checkout_sha=$checkout_sha"
              echo "expected_release_sha="
              echo "source_deploy_run_id="
              echo "source_deploy_run_attempt="
              echo "artifact_run_id=$GITHUB_RUN_ID"
              echo "artifact_run_attempt=$GITHUB_RUN_ATTEMPT"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          test "$EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          [[ "$REQUESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_RUN_ID" = "$REQUESTED_RUN_ID"
          test "$GITHUB_RUN_ATTEMPT" = "$REQUESTED_RUN_ATTEMPT"
          test "$GITHUB_SHA" = "$REQUESTED_SHA"

          deploy_run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}/attempts/${REQUESTED_RUN_ATTEMPT}"
          )"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$REQUESTED_SHA" \
            --argjson run_id "$REQUESTED_RUN_ID" \
            --argjson run_attempt "$REQUESTED_RUN_ATTEMPT" '
              .id == $run_id and
              .run_attempt == $run_attempt and
              .name == "Deploy AWS" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $sha and
              .head_repository.full_name == $repository and
              .repository.full_name == $repository and
              (
                .path == ".github/workflows/deploy-aws.yml" or
                .path == ".github/workflows/deploy-aws.yml@main" or
                .path ==
                  ".github/workflows/deploy-aws.yml@refs/heads/main"
              ) and
              (
                .status == "in_progress" or
                .status == "queued" or
                .status == "waiting" or
                .status == "pending"
              ) and
              .conclusion == null
            ' <<<"$deploy_run" >/dev/null

          deploy_jobs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}/attempts/${REQUESTED_RUN_ATTEMPT}/jobs?per_page=100"
          )"
          jq -e \
            --argjson run_attempt "$REQUESTED_RUN_ATTEMPT" \
            --argjson run_id "$REQUESTED_RUN_ID" \
            --arg sha "$REQUESTED_SHA" \
            '
              def exact_job($name):
                [.jobs[] |
                  select(
                    .name == $name and
                    .run_id == $run_id and
                    .run_attempt == $run_attempt and
                    .head_sha == $sha and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] | length == 1;
              def exact_step($job_name; $step_name):
                [.jobs[] | select(.name == $job_name)] as $jobs |
                ($jobs | length == 1) and
                ([
                  $jobs[0].steps[]? |
                  select(
                    .name == $step_name and
                    .status == "completed" and
                    .conclusion == "success"
                  )
                ] | length == 1);
              .total_count == (.jobs | length) and
              exact_job("Validate Deploy AWS source CI") and
              exact_step(
                "Validate Deploy AWS source CI";
                "Require successful exact-main push CI source"
              ) and
              exact_job("Verify CI SHA and build once") and
              exact_step(
                "Verify CI SHA and build once";
                "Upload immutable candidate"
              ) and
              exact_job("Deploy and smoke staging") and
              exact_step(
                "Deploy and smoke staging";
                "Deploy staging with recovery-safe SAM canary"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Smoke the same-origin application and real recall path"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Hosted Chromium judge journey on staging"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Build and validate sanitized staging deployment receipt"
              ) and
              exact_step(
                "Deploy and smoke staging";
                "Upload staging receipt"
              ) and
              exact_job("Promote identical candidate to production") and
              exact_step(
                "Promote identical candidate to production";
                "Deploy production with recovery-safe SAM canary"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Smoke production through CloudFront"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Hosted Chromium judge journey on production"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Build and validate sanitized production deployment receipt"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Commit the receipt-bound production recovery intent"
              ) and
              exact_step(
                "Promote identical candidate to production";
                "Upload production receipt"
              ) and
              exact_job(
                "Prove production memory through CockroachDB Managed MCP"
              ) and
              exact_step(
                "Prove production memory through CockroachDB Managed MCP";
                "Run bounded read-only Managed MCP proof"
              ) and
              exact_step(
                "Prove production memory through CockroachDB Managed MCP";
                "Upload sanitized Managed MCP receipt"
              )
            ' <<< "$deploy_jobs"
          checkout_sha="$REQUESTED_SHA"
          expected_release_sha="$REQUESTED_SHA"
          source_deploy_run_id="$REQUESTED_RUN_ID"
          source_deploy_run_attempt="$REQUESTED_RUN_ATTEMPT"
          {
            echo "checkout_sha=$checkout_sha"
            echo "expected_release_sha=$expected_release_sha"
            echo "source_deploy_run_id=$source_deploy_run_id"
            echo "source_deploy_run_attempt=$source_deploy_run_attempt"
            echo "artifact_run_id=$GITHUB_RUN_ID"
            echo "artifact_run_attempt=$GITHUB_RUN_ATTEMPT"
          } >>"$GITHUB_OUTPUT"

  boundary-probes:
    needs: source-gate
    name: Bounded active API and browser-boundary probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAST_CHECKOUT_SHA: ${{ needs.source-gate.outputs.checkout_sha }}
      DAST_EXPECTED_RELEASE_SHA: ${{ needs.source-gate.outputs.expected_release_sha }}
      DAST_SCANNER_SHA: ${{ needs.source-gate.outputs.checkout_sha }}
      DAST_SOURCE_DEPLOY_RUN_ID: ${{ needs.source-gate.outputs.source_deploy_run_id }}
      DAST_SOURCE_DEPLOY_RUN_ATTEMPT: ${{ needs.source-gate.outputs.source_deploy_run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
      - name: Run fail-closed hosted adversarial probes
        env:
          DAST_RECEIPT_PATH: ${{ runner.temp }}/hosted-dast.json
        run: node scripts/hosted-dast.mjs
      - name: Upload sanitized hosted DAST receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-dast-${{ env.DAST_CHECKOUT_SHA }}-${{ needs.source-gate.outputs.artifact_run_id }}-${{ needs.source-gate.outputs.artifact_run_attempt }}
          path: ${{ runner.temp }}/hosted-dast.json
          if-no-files-found: error
          retention-days: 90

  zap-baseline:
    needs: source-gate
    name: OWASP ZAP passive and AJAX-spider baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAST_CHECKOUT_SHA: ${{ needs.source-gate.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DAST_CHECKOUT_SHA }}
          persist-credentials: false
      - name: Scan the owned public production release
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          rules_file_name: .zap/release.tsv
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          cmd_options: "-a -j -m 2"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-${{ env.DAST_CHECKOUT_SHA }}-${{ needs.source-gate.outputs.artifact_run_attempt }}
