name: Manage AWS Alarm Routing

# Manual only. Plan creates an inert, exact-SHA CloudFormation change set.
# Apply executes only that inspected plan. Verify is read-only. Drill can force
# only the dedicated staging probe ALARM -> OK and reads, but never deletes,
# the encrypted SNS -> SQS archive message.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan activation, apply the exact plan, verify, or run the bounded staging drill.
        required: true
        type: choice
        options:
          - plan
          - apply
          - verify
          - drill
      target_sha:
        description: Exact 40-character current main SHA proven by CI, CodeQL, and Supply Chain.
        required: true
        type: string
      approval_reference:
        description: Non-secret human approval record for this exact operation; never enter contact details.
        required: true
        type: string
      human_acknowledgement_reference:
        description: For drill only, non-secret acknowledgement record; never enter a name, email, phone, or contact details.
        required: false
        type: string
      confirmation:
        description: For apply enter ACTIVATE-ENCRYPTED-ALARM-ROUTING; for drill enter DRILL-STAGING-ALARM-DELIVERY.
        required: false
        type: string

concurrency:
  group: aws-alarm-routing-controls
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  APP_NAME: ${{ vars.AWS_APP_NAME || 'archon-memory' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ALARM_ROUTING_CONTROL_ROLE_ARN: >-
    arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_APP_NAME || 'archon-memory' }}-github-alarm-routing-controls
  AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN: >-
    arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_APP_NAME || 'archon-memory' }}-alarm-routing-cloudformation-execution
  AWS_REGION: eu-west-1
  HUMAN_ACKNOWLEDGEMENT_REFERENCE: ${{ inputs.human_acknowledgement_reference }}
  OPERATION: ${{ inputs.operation }}
  OPERATION_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  authorize:
    name: Authorize exact green main SHA and human intent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed unless dispatch is exact, current, green, and explicit
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,16}$ ]]
          [[ "$OPERATION_APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
          test "$AWS_REGION" = "eu-west-1"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          test "$AWS_ALARM_ROUTING_CONTROL_ROLE_ARN" = \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-alarm-routing-controls"
          test "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" = \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-alarm-routing-cloudformation-execution"

          case "$OPERATION" in
            apply)
              test "$CONFIRMATION" = \
                "ACTIVATE-ENCRYPTED-ALARM-ROUTING"
              test -z "$HUMAN_ACKNOWLEDGEMENT_REFERENCE"
              ;;
            drill)
              test "$CONFIRMATION" = \
                "DRILL-STAGING-ALARM-DELIVERY"
              [[ "$HUMAN_ACKNOWLEDGEMENT_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
              ;;
            plan|verify)
              test -z "$CONFIRMATION"
              test -z "$HUMAN_ACKNOWLEDGEMENT_REFERENCE"
              ;;
            *) exit 1 ;;
          esac

          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          prove_workflow() {
            local expected_name expected_path state workflow
            workflow="$1"
            expected_name="$2"
            expected_path="$3"
            state="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=100" |
                jq -er \
                  --arg sha "$TARGET_SHA" \
                  --arg name "$expected_name" \
                  --arg path "$expected_path" \
                  '
                    [
                      .workflow_runs[]
                      | select(
                          .head_sha == $sha
                          and .head_branch == "main"
                          and .event == "push"
                          and .name == $name
                          and .path == $path
                        )
                    ]
                    | sort_by(.run_number, .run_attempt)
                    | last
                    | select(.conclusion == "success")
                    | .conclusion
                  '
            )"
            test "$state" = "success"
          }
          prove_workflow ci.yml CI .github/workflows/ci.yml
          prove_workflow codeql.yml CodeQL .github/workflows/codeql.yml
          prove_workflow \
            supply-chain.yml "Supply Chain (enforced)" \
            .github/workflows/supply-chain.yml

  control:
    name: ${{ inputs.operation == 'plan' && 'Plan protected alarm routing' || inputs.operation == 'apply' && 'Activate protected alarm routing' || inputs.operation == 'verify' && 'Verify protected alarm routing' || 'Drill staging alarm delivery' }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: alarm-routing-controls
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the authorized main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize canonical identifiers and sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          digest_text() {
            printf '%s' "$1" | sha256sum | awk '{print $1}'
          }

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,16}$ ]]
          [[ "$OPERATION_APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
          test "$AWS_REGION" = "eu-west-1"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          case "$OPERATION" in
            plan|apply|verify|drill) ;;
            *) exit 1 ;;
          esac

          template_digest="$(
            sha256sum aws/bootstrap-oidc.yaml | awk '{print $1}'
          )"
          approval_digest="$(digest_text "$OPERATION_APPROVAL_REFERENCE")"
          acknowledgement_digest=""
          if [ "$OPERATION" = "drill" ]; then
            [[ "$HUMAN_ACKNOWLEDGEMENT_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
            acknowledgement_digest="$(
              digest_text "$HUMAN_ACKNOWLEDGEMENT_REFERENCE"
            )"
          else
            test -z "$HUMAN_ACKNOWLEDGEMENT_REFERENCE"
          fi
          execution_role_digest="$(
            digest_text "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN"
          )"
          stack_name="${APP_NAME}-delivery-bootstrap"
          change_set="alarm-routing-${TARGET_SHA:0:10}-${template_digest:0:10}-${approval_digest:0:10}-${execution_role_digest:0:10}"
          template_key="foundation/alarm-routing/${TARGET_SHA}/${template_digest}.yaml"
          receipt="${RUNNER_TEMP:?}/alarm-routing-${OPERATION}-${TARGET_SHA}.json"

          jq -n \
            --arg operation "$OPERATION" \
            --arg commit "$TARGET_SHA" \
            --arg templateSha256 "$template_digest" \
            --arg approvalSha256 "$approval_digest" \
            --arg acknowledgementSha256 "$acknowledgement_digest" \
            --arg executionRoleSha256 "$execution_role_digest" \
            --arg stackSha256 "$(digest_text "$stack_name")" \
            --arg repositorySha256 "$(digest_text "$GITHUB_REPOSITORY")" \
            --arg workflowRefSha256 "$(digest_text "$GITHUB_WORKFLOW_REF")" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "archon.aws.alarm-routing-control",
              schemaVersion: 1,
              ok: false,
              operation: $operation,
              result: ($operation + "-pending"),
              commit: $commit,
              applicationRegion: "eu-west-1",
              templateSha256: $templateSha256,
              approvalReferenceSha256: $approvalSha256,
              humanAcknowledgementReferenceSha256:
                (if $acknowledgementSha256 == ""
                 then null else $acknowledgementSha256 end),
              authority: {
                cloudFormationExecutionRoleArnSha256:
                  $executionRoleSha256
              },
              foundationStackNameSha256: $stackSha256,
              source: {
                repositorySha256: $repositorySha256,
                workflowRefSha256: $workflowRefSha256,
                runId: ($runId | tonumber),
                runAttempt: ($runAttempt | tonumber)
              },
              disclosure: {
                rawAwsIdentifiersStored: false,
                rawHumanReferencesStored: false,
                humanContactDetailsStored: false,
                secretValuesRead: false
              }
            }' >"$receipt"

          {
            echo "ACTIVATION_APPROVAL_DIGEST=$approval_digest"
            echo "ALARM_CHANGE_SET_NAME=$change_set"
            echo "ALARM_FOUNDATION_STACK=$stack_name"
            echo "ALARM_TEMPLATE_DIGEST=$template_digest"
            echo "ALARM_TEMPLATE_KEY=$template_key"
            echo "HUMAN_ACKNOWLEDGEMENT_DIGEST=$acknowledgement_digest"
            echo "RECEIPT_FILE=$receipt"
          } >>"$GITHUB_ENV"

      - name: Configure pre-existing least-privilege alarm-control authority
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: eu-west-1
          role-to-assume: ${{ env.AWS_ALARM_ROUTING_CONTROL_ROLE_ARN }}
          role-session-name: archon-alarm-routing-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Prove exact identity, source, stack policy, template, and current switch
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          identity="${RUNNER_TEMP:?}/alarm-routing-identity.json"
          aws sts get-caller-identity --output json >"$identity"
          jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg role "${APP_NAME}-github-alarm-routing-controls" \
            '
              .Account == $account
              and (.Arn | contains(":assumed-role/" + $role + "/"))
            ' "$identity" >/dev/null

          stack="${RUNNER_TEMP:?}/alarm-routing-current-stack.json"
          aws cloudformation describe-stacks \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --region "$AWS_REGION" \
            --output json >"$stack"
          jq -e \
            --arg stack "$ALARM_FOUNDATION_STACK" \
            --arg executionRole "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" \
            --arg operation "$OPERATION" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and (
                if $operation == "plan" or $operation == "apply"
                then .Stacks[0].StackStatus | IN(
                  "CREATE_COMPLETE",
                  "UPDATE_COMPLETE",
                  "UPDATE_ROLLBACK_COMPLETE"
                )
                else .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                end
              )
              and .Stacks[0].EnableTerminationProtection == true
              and (
                if $operation == "plan" or $operation == "apply"
                then (
                  ((.Stacks[0].RoleARN // null) == null)
                  or .Stacks[0].RoleARN == $executionRole
                )
                else .Stacks[0].RoleARN == $executionRole
                end
              )
            ' "$stack" >/dev/null

          jq -e \
            --arg operation "$OPERATION" \
            '
              [
                .Stacks[0].Parameters[]
                | select(.ParameterKey == "AlarmRoutingEnabled")
                | .ParameterValue
              ] == [
                if $operation == "plan" or $operation == "apply"
                then "false" else "true" end
              ]
            ' "$stack" >/dev/null
          jq -e '
            [ .Stacks[0].Parameters[].ParameterKey ] | sort
            == [
              "AlarmRoutingEnabled",
              "AppName",
              "ArtifactAccessLoggingEnabled",
              "ExistingGitHubOidcProviderArn",
              "GitHubOrganization",
              "GitHubRepository",
              "GitHubRepositoryId",
              "GitHubRepositoryOwnerId"
            ]
          ' "$stack" >/dev/null
          if [ "$OPERATION" = "drill" ]; then
            updated_at="$(jq -er '.Stacks[0].LastUpdatedTime' "$stack")"
            updated_epoch="$(date -u -d "$updated_at" +%s)"
            now_epoch="$(date -u +%s)"
            test $((now_epoch - updated_epoch)) -ge 900
          fi

          policy="${RUNNER_TEMP:?}/alarm-routing-stack-policy.json"
          aws cloudformation get-stack-policy \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --region "$AWS_REGION" \
            --output json >"$policy"
          jq -e \
            --slurpfile expected aws/bootstrap-stack-policy.json \
            '(.StackPolicyBody | fromjson) == $expected[0]' \
            "$policy" >/dev/null

          template_response="${RUNNER_TEMP:?}/alarm-routing-current-template-response.json"
          current_template="${RUNNER_TEMP:?}/alarm-routing-current-template.yaml"
          aws cloudformation get-template \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$template_response" | base64 --decode >"$current_template"
          test "$(sha256sum "$current_template" | awk '{print $1}')" = \
            "$ALARM_TEMPLATE_DIGEST"

          cp "$stack" "${RUNNER_TEMP:?}/alarm-routing-authorized-stack.json"

      - name: Publish immutable exact-SHA foundation template for plan
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          artifact_bucket="${APP_NAME}-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          storage_alias="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage"
          response="${RUNNER_TEMP:?}/alarm-routing-template-put.json"
          storage_key_arn="$(
            aws kms describe-key \
              --key-id "$storage_alias" \
              --region "$AWS_REGION" \
              --output json |
              jq -er '.KeyMetadata.Arn'
          )"
          [[ "$storage_key_arn" =~ ^arn:aws:kms:eu-west-1:${AWS_ACCOUNT_ID}:key/[A-Za-z0-9-]{1,128}$ ]]
          aws s3api put-object \
            --bucket "$artifact_bucket" \
            --key "$ALARM_TEMPLATE_KEY" \
            --body aws/bootstrap-oidc.yaml \
            --content-type application/yaml \
            --metadata "commit=${TARGET_SHA},sha256=${ALARM_TEMPLATE_DIGEST},purpose=alarm-routing-activation" \
            --server-side-encryption aws:kms \
            --ssekms-key-id "$storage_alias" \
            --region "$AWS_REGION" \
            --output json >"$response"
          version_id="$(jq -er '.VersionId | select(length > 0)' "$response")"
          head="${RUNNER_TEMP:?}/alarm-routing-template-head.json"
          aws s3api head-object \
            --bucket "$artifact_bucket" \
            --key "$ALARM_TEMPLATE_KEY" \
            --version-id "$version_id" \
            --region "$AWS_REGION" \
            --output json >"$head"
          jq -e \
            --arg digest "$ALARM_TEMPLATE_DIGEST" \
            --arg commit "$TARGET_SHA" \
            --arg key "$storage_key_arn" \
            '
              .ServerSideEncryption == "aws:kms"
              and .SSEKMSKeyId == $key
              and .Metadata.commit == $commit
              and .Metadata.sha256 == $digest
              and .Metadata.purpose == "alarm-routing-activation"
            ' "$head" >/dev/null

      - name: Create and inspect inert false-to-true activation plan
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          change_set_created=false
          remove_unverified_plan() {
            if [ "$change_set_created" = "true" ]; then
              aws cloudformation delete-change-set \
                --stack-name "$ALARM_FOUNDATION_STACK" \
                --change-set-name "$ALARM_CHANGE_SET_NAME" \
                --region "$AWS_REGION" >/dev/null
            fi
          }
          trap remove_unverified_plan EXIT
          stack="${RUNNER_TEMP:?}/alarm-routing-authorized-stack.json"
          parameters="${RUNNER_TEMP:?}/alarm-routing-parameters.json"
          jq '
            [
              .Stacks[0].Parameters[]
              | if .ParameterKey == "AlarmRoutingEnabled"
                then {
                  ParameterKey: "AlarmRoutingEnabled",
                  ParameterValue: "true"
                }
                else {
                  ParameterKey: .ParameterKey,
                  UsePreviousValue: true
                }
                end
            ] | sort_by(.ParameterKey)
          ' "$stack" >"$parameters"
          jq -e '
            length == 8
            and ([.[].ParameterKey] | unique | length) == 8
            and ([.[] | select(
              .ParameterKey == "AlarmRoutingEnabled"
              and .ParameterValue == "true"
              and ((.UsePreviousValue // false) == false)
            )] | length) == 1
            and ([.[] | select(
              .ParameterKey != "AlarmRoutingEnabled"
              and .UsePreviousValue == true
              and ((.ParameterValue // null) == null)
            )] | length) == 7
          ' "$parameters" >/dev/null

          template_url="https://${APP_NAME}-artifacts-${AWS_ACCOUNT_ID}-${AWS_REGION}.s3.${AWS_REGION}.amazonaws.com/${ALARM_TEMPLATE_KEY}"
          description="operation=activate-alarm-routing commit=${TARGET_SHA} template_sha256=${ALARM_TEMPLATE_DIGEST} approval_sha256=${ACTIVATION_APPROVAL_DIGEST} execution_role_sha256=$(printf '%s' "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" | sha256sum | awk '{print $1}')"
          aws cloudformation create-change-set \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --description "$description" \
            --template-url "$template_url" \
            --parameters "file://${parameters}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --output json >"${RUNNER_TEMP:?}/alarm-routing-create-change-set.json"
          change_set_created=true
          aws cloudformation wait change-set-create-complete \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          plan="${RUNNER_TEMP:?}/alarm-routing-plan.json"
          aws cloudformation describe-change-set \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$plan"
          planned_template_response="${RUNNER_TEMP:?}/alarm-routing-planned-template-response.json"
          planned_template="${RUNNER_TEMP:?}/alarm-routing-planned-template.yaml"
          aws cloudformation get-template \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$planned_template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$planned_template_response" |
            base64 --decode >"$planned_template"
          test "$(sha256sum "$planned_template" | awk '{print $1}')" = \
            "$ALARM_TEMPLATE_DIGEST"
          jq -e \
            --arg stack "$ALARM_FOUNDATION_STACK" \
            --arg role "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" \
            --arg description "$description" \
            '
              .StackName == $stack
              and .ChangeSetName == env.ALARM_CHANGE_SET_NAME
              and .ChangeSetType == "UPDATE"
              and .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
              and .RoleARN == $role
              and .Description == $description
              and .Capabilities == ["CAPABILITY_NAMED_IAM"]
              and ([.Parameters[].ParameterKey] | sort) == [
                "AlarmRoutingEnabled",
                "AppName",
                "ArtifactAccessLoggingEnabled",
                "ExistingGitHubOidcProviderArn",
                "GitHubOrganization",
                "GitHubRepository",
                "GitHubRepositoryId",
                "GitHubRepositoryOwnerId"
              ]
              and ([.Parameters[] | select(
                .ParameterKey == "AlarmRoutingEnabled"
                and .ParameterValue == "true"
              )] | length) == 1
              and ([
                .Changes[].ResourceChange
                | {
                    action: .Action,
                    logicalId: .LogicalResourceId,
                    resourceType: .ResourceType,
                    replacement: (.Replacement // "False")
                  }
              ] | sort_by(.logicalId)) == ([
                {action:"Add", logicalId:"AlarmArchiveQueuePolicy", resourceType:"AWS::SQS::QueuePolicy", replacement:"False"},
                {action:"Add", logicalId:"AlarmNotificationsKey", resourceType:"AWS::KMS::Key", replacement:"False"},
                {action:"Add", logicalId:"AlarmNotificationsKeyAlias", resourceType:"AWS::KMS::Alias", replacement:"False"},
                {action:"Add", logicalId:"AlarmTopicPolicy", resourceType:"AWS::SNS::TopicPolicy", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmArchiveQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmArchiveSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmRoutingInspectionPolicy", resourceType:"AWS::IAM::Policy", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmTopic", resourceType:"AWS::SNS::Topic", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmArchiveQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmArchiveSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillAlarm", resourceType:"AWS::CloudWatch::Alarm", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingInspectionPolicy", resourceType:"AWS::IAM::Policy", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmTopic", resourceType:"AWS::SNS::Topic", replacement:"False"}
              ] | sort_by(.logicalId))
            ' "$plan" >/dev/null

          plan_digest="$(jq -cS . "$plan" | sha256sum | awk '{print $1}')"
          plan_id_digest="$(
            jq -er '.ChangeSetId' "$plan" |
              sha256sum |
              awk '{print $1}'
          )"
          jq \
            --arg planSha256 "$plan_digest" \
            --arg planIdSha256 "$plan_id_digest" \
            '.ok = true
             | .result = "activation-plan-created"
             | .activation = {
                 currentSwitch: false,
                 plannedSwitch: true,
                 existingResourceMutations: 0,
                 resourceAdditions: 15,
                 replacementCount: 0,
                 changeSetSha256: $planSha256,
                 changeSetIdSha256: $planIdSha256
               }
             | .live = {activationPerformed:false, drillPerformed:false}' \
            "$RECEIPT_FILE" >"${RECEIPT_FILE}.next"
          mv "${RECEIPT_FILE}.next" "$RECEIPT_FILE"
          trap - EXIT

      - name: Re-inspect and execute only the exact existing activation plan
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          description="operation=activate-alarm-routing commit=${TARGET_SHA} template_sha256=${ALARM_TEMPLATE_DIGEST} approval_sha256=${ACTIVATION_APPROVAL_DIGEST} execution_role_sha256=$(printf '%s' "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" | sha256sum | awk '{print $1}')"
          plan="${RUNNER_TEMP:?}/alarm-routing-approved-plan.json"
          aws cloudformation describe-change-set \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --include-property-values \
            --region "$AWS_REGION" \
            --output json >"$plan"
          planned_template_response="${RUNNER_TEMP:?}/alarm-routing-approved-template-response.json"
          planned_template="${RUNNER_TEMP:?}/alarm-routing-approved-template.yaml"
          aws cloudformation get-template \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --template-stage Original \
            --region "$AWS_REGION" \
            --output json >"$planned_template_response"
          jq -er '
            .TemplateBody
            | select(type == "string" and length > 0)
            | @base64
          ' "$planned_template_response" |
            base64 --decode >"$planned_template"
          test "$(sha256sum "$planned_template" | awk '{print $1}')" = \
            "$ALARM_TEMPLATE_DIGEST"
          jq -e \
            --arg stack "$ALARM_FOUNDATION_STACK" \
            --arg role "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" \
            --arg description "$description" \
            '
              .StackName == $stack
              and .ChangeSetName == env.ALARM_CHANGE_SET_NAME
              and .ChangeSetType == "UPDATE"
              and .Status == "CREATE_COMPLETE"
              and .ExecutionStatus == "AVAILABLE"
              and .RoleARN == $role
              and .Description == $description
              and .Capabilities == ["CAPABILITY_NAMED_IAM"]
              and ([.Parameters[].ParameterKey] | sort) == [
                "AlarmRoutingEnabled",
                "AppName",
                "ArtifactAccessLoggingEnabled",
                "ExistingGitHubOidcProviderArn",
                "GitHubOrganization",
                "GitHubRepository",
                "GitHubRepositoryId",
                "GitHubRepositoryOwnerId"
              ]
              and ([.Parameters[] | select(
                .ParameterKey == "AlarmRoutingEnabled"
                and .ParameterValue == "true"
              )] | length) == 1
              and ([
                .Changes[].ResourceChange
                | {
                    action: .Action,
                    logicalId: .LogicalResourceId,
                    resourceType: .ResourceType,
                    replacement: (.Replacement // "False")
                  }
              ] | sort_by(.logicalId)) == ([
                {action:"Add", logicalId:"AlarmArchiveQueuePolicy", resourceType:"AWS::SQS::QueuePolicy", replacement:"False"},
                {action:"Add", logicalId:"AlarmNotificationsKey", resourceType:"AWS::KMS::Key", replacement:"False"},
                {action:"Add", logicalId:"AlarmNotificationsKeyAlias", resourceType:"AWS::KMS::Alias", replacement:"False"},
                {action:"Add", logicalId:"AlarmTopicPolicy", resourceType:"AWS::SNS::TopicPolicy", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmArchiveQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmArchiveSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmRoutingInspectionPolicy", resourceType:"AWS::IAM::Policy", replacement:"False"},
                {action:"Add", logicalId:"ProductionAlarmTopic", resourceType:"AWS::SNS::Topic", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmArchiveQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmArchiveSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillAlarm", resourceType:"AWS::CloudWatch::Alarm", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillQueue", resourceType:"AWS::SQS::Queue", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingDrillSubscription", resourceType:"AWS::SNS::Subscription", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmRoutingInspectionPolicy", resourceType:"AWS::IAM::Policy", replacement:"False"},
                {action:"Add", logicalId:"StagingAlarmTopic", resourceType:"AWS::SNS::Topic", replacement:"False"}
              ] | sort_by(.logicalId))
            ' "$plan" >/dev/null

          token="alarm-routing-${TARGET_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation execute-change-set \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --change-set-name "$ALARM_CHANGE_SET_NAME" \
            --client-request-token "$token" \
            --region "$AWS_REGION"
          aws cloudformation wait stack-update-complete \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --region "$AWS_REGION"
          echo "EXECUTION_TOKEN_SHA256=$(printf '%s' "$token" | sha256sum | awk '{print $1}')" >>"$GITHUB_ENV"

      - name: Verify exact active conditional resources and encrypted routes
        if: inputs.operation != 'plan'
        shell: bash
        run: |
          set -euo pipefail
          stack="${RUNNER_TEMP:?}/alarm-routing-active-stack.json"
          resources="${RUNNER_TEMP:?}/alarm-routing-active-resources.json"
          aws cloudformation describe-stacks \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --region "$AWS_REGION" \
            --output json >"$stack"
          aws cloudformation list-stack-resources \
            --stack-name "$ALARM_FOUNDATION_STACK" \
            --region "$AWS_REGION" \
            --output json >"$resources"
          jq -e \
            --arg stack "$ALARM_FOUNDATION_STACK" \
            --arg role "$AWS_ALARM_ROUTING_EXECUTION_ROLE_ARN" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and .Stacks[0].StackStatus == "UPDATE_COMPLETE"
              and .Stacks[0].EnableTerminationProtection == true
              and .Stacks[0].RoleARN == $role
              and [
                .Stacks[0].Parameters[]
                | select(.ParameterKey == "AlarmRoutingEnabled")
                | .ParameterValue
              ] == ["true"]
              and ([
                .Stacks[0].Outputs[]
                | select(.OutputKey | IN(
                    "AlarmRoutingContractVersion",
                    "AlarmNotificationsKeyArn",
                    "StagingAlarmTopicArn",
                    "ProductionAlarmTopicArn",
                    "StagingAlarmArchiveQueueArn",
                    "StagingAlarmRoutingDrillQueueArn",
                    "ProductionAlarmArchiveQueueArn"
                  ))
                | .OutputKey
              ] | sort) == [
                "AlarmNotificationsKeyArn",
                "AlarmRoutingContractVersion",
                "ProductionAlarmArchiveQueueArn",
                "ProductionAlarmTopicArn",
                "StagingAlarmArchiveQueueArn",
                "StagingAlarmRoutingDrillQueueArn",
                "StagingAlarmTopicArn"
              ]
            ' "$stack" >/dev/null
          jq -e '
            [
              .StackResourceSummaries[]
              | select(.LogicalResourceId | IN(
                  "AlarmArchiveQueuePolicy",
                  "AlarmNotificationsKey",
                  "AlarmNotificationsKeyAlias",
                  "AlarmTopicPolicy",
                  "ProductionAlarmArchiveQueue",
                  "ProductionAlarmArchiveSubscription",
                  "ProductionAlarmRoutingInspectionPolicy",
                  "ProductionAlarmTopic",
                  "StagingAlarmArchiveQueue",
                  "StagingAlarmArchiveSubscription",
                  "StagingAlarmRoutingDrillAlarm",
                  "StagingAlarmRoutingDrillQueue",
                  "StagingAlarmRoutingDrillSubscription",
                  "StagingAlarmRoutingInspectionPolicy",
                  "StagingAlarmTopic"
                ))
              | {
                  logicalId: .LogicalResourceId,
                  status: .ResourceStatus
                }
            ] | sort_by(.logicalId)
            == ([
              "AlarmArchiveQueuePolicy",
              "AlarmNotificationsKey",
              "AlarmNotificationsKeyAlias",
              "AlarmTopicPolicy",
              "ProductionAlarmArchiveQueue",
              "ProductionAlarmArchiveSubscription",
              "ProductionAlarmRoutingInspectionPolicy",
              "ProductionAlarmTopic",
              "StagingAlarmArchiveQueue",
              "StagingAlarmArchiveSubscription",
              "StagingAlarmRoutingDrillAlarm",
              "StagingAlarmRoutingDrillQueue",
              "StagingAlarmRoutingDrillSubscription",
              "StagingAlarmRoutingInspectionPolicy",
              "StagingAlarmTopic"
            ] | map({logicalId: ., status: "CREATE_COMPLETE"}) | sort_by(.logicalId))
          ' "$resources" >/dev/null

          for environment in staging production; do
            proof="${RUNNER_TEMP:?}/${environment}-alarm-routing-active-proof.json"
            APP_NAME="$APP_NAME" \
            AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" \
            AWS_REGION="$AWS_REGION" \
            ENVIRONMENT="$environment" \
              bash aws/prove-alarm-routing.sh verify >"$proof"
            jq -e \
              --arg environment "$environment" \
              '
                .schema == "archon.alarm-routing.proof"
                and .version == 1
                and .ok == true
                and .mode == "verify"
                and .state == "active"
                and .contractVersion == "1"
                and .environment == $environment
                and .dedicatedDrillQueueProven
                  == ($environment == "staging")
                and .alarmCount == 4
              ' "$proof" >/dev/null
          done

      - name: Run bounded staging-only ALARM to OK encrypted delivery drill
        if: inputs.operation == 'drill'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HUMAN_ACKNOWLEDGEMENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          alarm_name="${APP_NAME}-staging-routing-drill"
          staging_topic="arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${APP_NAME}-staging-alarms"
          queue_name="${APP_NAME}-staging-alarm-routing-drill"
          drill_token="${TARGET_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reason="archon-staging-routing-drill:${drill_token}"

          wait_for_alarm_state() {
            local expected="$1"
            local output="$2"
            local attempt
            for attempt in $(seq 1 15); do
              aws cloudwatch describe-alarms \
                --alarm-names "$alarm_name" \
                --alarm-types MetricAlarm \
                --region "$AWS_REGION" \
                --output json >"$output"
              if jq -e \
                  --arg alarm "$alarm_name" \
                  --arg state "$expected" \
                  '(.MetricAlarms | length) == 1
                   and .MetricAlarms[0].AlarmName == $alarm
                   and .MetricAlarms[0].StateValue == $state' \
                  "$output" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          alarm="${RUNNER_TEMP:?}/staging-routing-drill-alarm.json"
          aws cloudwatch describe-alarms \
            --alarm-names "$alarm_name" \
            --alarm-types MetricAlarm \
            --region "$AWS_REGION" \
            --output json >"$alarm"
          jq -e \
            --arg alarm "$alarm_name" \
            --arg topic "$staging_topic" \
            '
              (.MetricAlarms | length) == 1
              and .MetricAlarms[0].AlarmName == $alarm
              and (.MetricAlarms[0].StateValue | IN(
                "OK",
                "INSUFFICIENT_DATA"
              ))
              and .MetricAlarms[0].ActionsEnabled == true
              and .MetricAlarms[0].AlarmActions == [$topic]
              and (.MetricAlarms[0].OKActions | length) == 0
              and (.MetricAlarms[0].InsufficientDataActions | length) == 0
              and (.CompositeAlarms | length) == 0
            ' "$alarm" >/dev/null

          initial_state="$(jq -er '.MetricAlarms[0].StateValue' "$alarm")"
          if [ "$initial_state" = "INSUFFICIENT_DATA" ]; then
            aws cloudwatch set-alarm-state \
              --alarm-name "$alarm_name" \
              --state-value OK \
              --state-reason "archon-staging-routing-drill-initialization:${drill_token}" \
              --region "$AWS_REGION" >/dev/null
            normalized_alarm="${RUNNER_TEMP:?}/staging-routing-drill-normalized-alarm.json"
            wait_for_alarm_state OK "$normalized_alarm"
          fi

          queue_url="$(
            aws sqs get-queue-url \
              --queue-name "$queue_name" \
              --region "$AWS_REGION" \
              --output json |
              jq -er '.QueueUrl'
          )"
          test "$queue_url" = \
            "https://sqs.${AWS_REGION}.amazonaws.com/${AWS_ACCOUNT_ID}/${queue_name}"

          restore_ok() {
            local cleanup_alarm
            aws cloudwatch set-alarm-state \
              --alarm-name "$alarm_name" \
              --state-value OK \
              --state-reason "archon-staging-routing-drill-cleanup:${drill_token}" \
              --region "$AWS_REGION" >/dev/null
            cleanup_alarm="${RUNNER_TEMP:?}/staging-routing-drill-cleanup-alarm.json"
            wait_for_alarm_state OK "$cleanup_alarm"
          }
          trap restore_ok EXIT
          aws cloudwatch set-alarm-state \
            --alarm-name "$alarm_name" \
            --state-value ALARM \
            --state-reason "$reason" \
            --region "$AWS_REGION"

          delivery="${RUNNER_TEMP:?}/staging-routing-drill-delivery.json"
          found=false
          for attempt in $(seq 1 12); do
            batch="${RUNNER_TEMP:?}/staging-routing-drill-batch-${attempt}.json"
            aws sqs receive-message \
              --queue-url "$queue_url" \
              --max-number-of-messages 10 \
              --visibility-timeout 0 \
              --wait-time-seconds 5 \
              --attribute-names SentTimestamp \
              --region "$AWS_REGION" \
              --output json >"$batch"
            if jq -e \
                --arg alarm "$alarm_name" \
                --arg reason "$reason" \
                --arg topic "$staging_topic" \
                '
                  [
                    .Messages[]?
                    | . as $message
                    | ($message.Body | fromjson) as $envelope
                    | ($envelope.Message | fromjson) as $alarmMessage
                    | select(
                        $envelope.TopicArn == $topic
                        and $alarmMessage.AlarmName == $alarm
                        and $alarmMessage.NewStateValue == "ALARM"
                        and $alarmMessage.NewStateReason == $reason
                      )
                    | {
                        MessageId: $envelope.MessageId,
                        Body: $message.Body,
                        SentTimestamp: $message.Attributes.SentTimestamp
                      }
                  ] as $matches
                  | if ($matches | length) >= 1
                    then (
                      ($matches | sort_by(.MessageId) | .[0])
                      + {MatchCount: ($matches | length)}
                    )
                    else empty
                    end
                ' "$batch" >"$delivery"; then
              found=true
              break
            fi
          done
          test "$found" = "true"

          restore_ok
          trap - EXIT
          final_alarm="${RUNNER_TEMP:?}/staging-routing-drill-final-alarm.json"
          wait_for_alarm_state OK "$final_alarm"

          message_id_digest="$(
            jq -er '.MessageId' "$delivery" |
              sha256sum |
              awk '{print $1}'
          )"
          body_digest="$(
            jq -er '.Body' "$delivery" |
              sha256sum |
              awk '{print $1}'
          )"
          sent_timestamp_digest="$(
            jq -er '.SentTimestamp' "$delivery" |
              sha256sum |
              awk '{print $1}'
          )"
          matching_delivery_count="$(jq -er '.MatchCount' "$delivery")"
          test "$matching_delivery_count" -ge 1
          jq \
            --arg initialState "$initial_state" \
            --arg messageIdSha256 "$message_id_digest" \
            --arg bodySha256 "$body_digest" \
            --arg sentTimestampSha256 "$sent_timestamp_digest" \
            --argjson matchingDeliveryCount "$matching_delivery_count" \
            '.ok = true
             | .result = "staging-encrypted-delivery-drill-passed"
             | .live = {activationPerformed:false, drillPerformed:true}
             | .drill = {
                 environment: "staging",
                 syntheticProbeOnly: true,
                 initialState: $initialState,
                 alarmTransition: ["ALARM", "OK"],
                 productionAlarmStateMutated: false,
                 encryptedSnsToSqsContractVerified: true,
                 dedicatedFilteredDrillQueueVerified: true,
                 exactAlarmNameBodyFilterVerified: true,
                 operationalArchiveRead: false,
                 drillQueueRetentionSeconds: 300,
                 drillMessageObserved: true,
                 drillMessageDeleted: false,
                 matchingDeliveryCount: $matchingDeliveryCount,
                 messageIdSha256: $messageIdSha256,
                 messageBodySha256: $bodySha256,
                 sentTimestampSha256: $sentTimestampSha256,
                 humanAcknowledgementAttestedByDispatch: true
               }' "$RECEIPT_FILE" >"${RECEIPT_FILE}.next"
          mv "${RECEIPT_FILE}.next" "$RECEIPT_FILE"

      - name: Finalize activation or read-only verification receipt
        if: inputs.operation == 'apply' || inputs.operation == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "apply" ]; then
            [[ "${EXECUTION_TOKEN_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]
            jq \
              --arg tokenSha256 "$EXECUTION_TOKEN_SHA256" \
              '.ok = true
               | .result = "alarm-routing-activated-and-verified"
               | .live = {activationPerformed:true, drillPerformed:false}
               | .activation = {
                   previousSwitch: false,
                   currentSwitch: true,
                   existingResourceMutations: 0,
                   resourceAdditions: 15,
                   replacementCount: 0,
                   executionClientTokenSha256: $tokenSha256
                 }' "$RECEIPT_FILE" >"${RECEIPT_FILE}.next"
          else
            jq \
              '.ok = true
               | .result = "active-alarm-routing-verified"
               | .live = {activationPerformed:false, drillPerformed:false}
               | .activation = {currentSwitch:true}' \
              "$RECEIPT_FILE" >"${RECEIPT_FILE}.next"
          fi
          mv "${RECEIPT_FILE}.next" "$RECEIPT_FILE"

      - name: Validate sanitized exact-SHA receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_FILE"
          jq -e \
            --arg operation "$OPERATION" \
            --arg commit "$TARGET_SHA" \
            --arg template "$ALARM_TEMPLATE_DIGEST" \
            --arg approval "$ACTIVATION_APPROVAL_DIGEST" \
            --arg acknowledgement "${HUMAN_ACKNOWLEDGEMENT_DIGEST:-}" \
            '
              .schema == "archon.aws.alarm-routing-control"
              and .schemaVersion == 1
              and .operation == $operation
              and .commit == $commit
              and .applicationRegion == "eu-west-1"
              and .templateSha256 == $template
              and .approvalReferenceSha256 == $approval
              and (
                if $operation == "drill"
                then .humanAcknowledgementReferenceSha256 == $acknowledgement
                else .humanAcknowledgementReferenceSha256 == null
                end
              )
              and .disclosure == {
                rawAwsIdentifiersStored: false,
                rawHumanReferencesStored: false,
                humanContactDetailsStored: false,
                secretValuesRead: false
              }
              and (
                if .ok
                then (.result | endswith("pending") | not)
                else (.result | endswith("pending"))
                end
              )
            ' "$RECEIPT_FILE" >/dev/null

      - name: Upload sanitized alarm-routing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alarm-routing-${{ inputs.operation }}-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_FILE }}
          if-no-files-found: error
          retention-days: 90
