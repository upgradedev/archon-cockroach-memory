name: CockroachDB managed-backup restore drill

# This workflow is intentionally manual and mutating. It restores one exact
# CockroachDB Cloud managed backup into a separately provisioned, empty Basic
# cluster. It never provisions, cuts over, or deletes a cluster.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main commit to verify and attest
        required: true
        type: string
      destination_cluster_id:
        description: Existing empty CockroachDB Basic destination cluster UUID
        required: true
        type: string
      backup_id:
        description: Exact managed-backup ID returned by the source cluster
        required: true
        type: string
      destructive_confirmation:
        description: Type RESTORE <destination UUID> FROM <backup UUID>
        required: true
        type: string
      approval_reference:
        description: Approved change or drill reference (stored only as SHA-256)
        required: true
        type: string
      rto_objective_minutes:
        description: Approved end-to-end restore-and-verify RTO objective
        required: true
        type: string
      rpo_objective_minutes:
        description: Approved RPO objective; Basic managed-backup default requires at least 1440
        required: true
        type: string
      max_poll_minutes:
        description: Bounded CockroachDB Cloud restore-status polling window
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "90"

concurrency:
  group: cockroach-managed-backup-restore-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore-and-verify:
    name: Restore exact managed backup and verify the isolated target
    if: >-
      github.repository == 'upgradedev/archon-cockroach-memory' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: production-db
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DATABASE_OPERATOR_ROLE_ARN: ${{ vars.AWS_DATABASE_OPERATOR_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
      COCKROACH_API_VERSION: "2024-09-16"
      SOURCE_CLUSTER_ID: ${{ vars.COCKROACH_CLUSTER_ID }}
      DESTINATION_CLUSTER_ID: ${{ inputs.destination_cluster_id }}
      BACKUP_ID: ${{ inputs.backup_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      RTO_OBJECTIVE_MINUTES: ${{ inputs.rto_objective_minutes }}
      RPO_OBJECTIVE_MINUTES: ${{ inputs.rpo_objective_minutes }}
      MAX_POLL_MINUTES: ${{ inputs.max_poll_minutes }}
      COCKROACH_DATABASE: ${{ vars.COCKROACH_DATABASE || 'archon' }}
      SOURCE_DATABASE_SECRET_ID: ${{ vars.COCKROACH_ADMIN_SECRET_ID || 'archon-memory/operator/cockroach-admin' }}
      DESTINATION_EMPTY_DATABASE_SECRET_ID: ${{ vars.COCKROACH_RESTORE_EMPTY_SECRET_ID }}
      DESTINATION_RESTORED_DATABASE_SECRET_ID: ${{ vars.COCKROACH_RESTORE_VALIDATION_SECRET_ID }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Bind the ephemeral receipt path
        shell: bash
        run: echo "RECEIPT_PATH=$RUNNER_TEMP/cockroach-managed-restore/receipt.json" >>"$GITHUB_ENV"

      - name: Check out the exact approved main source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source, protected inputs, and destructive intent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_WORKFLOW_REF" = \
            "upgradedev/archon-cockroach-memory/.github/workflows/cockroach-restore-drill.yml@refs/heads/main"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CLUSTER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$DESTINATION_CLUSTER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$BACKUP_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          test "$SOURCE_CLUSTER_ID" != "$DESTINATION_CLUSTER_ID"
          test "$DESTRUCTIVE_CONFIRMATION" = \
            "RESTORE $DESTINATION_CLUSTER_ID FROM $BACKUP_ID"
          test -n "$APPROVAL_REFERENCE"
          test "$AWS_REGION" = "eu-west-1"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DATABASE_OPERATOR_ROLE_ARN"
          test -n "$CCLOUD_API_KEY"
          test -n "$SOURCE_DATABASE_SECRET_ID"
          test -n "$DESTINATION_EMPTY_DATABASE_SECRET_ID"
          test -n "$DESTINATION_RESTORED_DATABASE_SECRET_ID"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Configure short-lived database-operator credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DATABASE_OPERATOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-db-restore-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Execute bounded cross-cluster managed-backup restore drill
        id: drill
        continue-on-error: true
        run: npx --no-install tsx scripts/cockroach-managed-restore-drill.ts

      - name: Attest the sanitized exact-SHA restore receipt
        if: steps.drill.outcome == 'success'
        uses: actions/attest-build-provenance@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/cockroach-managed-restore/receipt.json

      - name: Upload the sanitized restore receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cockroach-managed-restore-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cockroach-managed-restore/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize the bounded drill
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RECEIPT_PATH"
          jq -r '
            "### CockroachDB managed-backup restore drill\n" +
            "- Status: `" + .status + "`\n" +
            "- Exact SHA: `" + .targetSha + "`\n" +
            "- Operation: `" + .operation.type + "`\n" +
            "- PITR claimed: `" + (.operation.pointInTimeRestore | tostring) + "`\n" +
            "- Cutover performed: `" + (.operation.cutoverPerformed | tostring) + "`\n" +
            "- Deletion performed: `" + (.operation.deletionPerformed | tostring) + "`\n" +
            "- RTO seconds: `" + ((.measurements.rtoSeconds // "not-measured") | tostring) + "`\n" +
            "- RPO seconds: `" + ((.measurements.rpoSeconds // "not-measured") | tostring) + "`"
          ' "$RECEIPT_PATH" >>"$GITHUB_STEP_SUMMARY"

      - name: Fail closed when the drill or objectives did not pass
        if: steps.drill.outcome != 'success'
        shell: bash
        run: exit 1
