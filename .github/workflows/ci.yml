name: CI

# Archon Memory CI — mirrors the Archon convention (ADR-001 PR gate, ADR-005 gitleaks-first).
# The pipeline stands up CockroachDB + runs the schema, unit tests, and a real
# vector-recall smoke IN CI (the runner does the docker, never a dev laptop).
# Runs fully offline: no AWS creds → the embedder auto-falls back to FakeEmbedder
# (src/memory/embeddings.ts), so the vector index is exercised end-to-end with no secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Stage 1 — fail fast on any secret in the exact candidate tree (ADR-005).
  # Protected-main pushes additionally scan the full reachable history. Pull
  # requests scan the merge candidate tree so a removed synthetic fixture in an
  # unmerged intermediate commit cannot permanently block a clean squash merge.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks exact-tree and protected-main history (verified v8.30.1, redacted)
        run: |
          set -euo pipefail
          GITLEAKS_DIR="$RUNNER_TEMP/archon-gitleaks"
          GITLEAKS_ARCHIVE="$GITLEAKS_DIR/gitleaks.tar.gz"
          GITLEAKS_TREE_REPORT="$GITLEAKS_DIR/raw-tree-report.json"
          GITLEAKS_HISTORY_REPORT="$GITLEAKS_DIR/raw-history-report.json"
          mkdir -p "$GITLEAKS_DIR"
          trap 'rm -f "$GITLEAKS_TREE_REPORT" "$GITLEAKS_HISTORY_REPORT"' EXIT
          curl -sSLo "$GITLEAKS_ARCHIVE" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" |
            sha256sum --check
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$GITLEAKS_DIR" gitleaks

          report_sanitized_findings() {
            local scope="$1"
            local report="$2"
            if [[ ! -s "$report" ]]; then
              return
            fi
            echo "Sanitized gitleaks $scope findings (secret and match omitted):"
            jq -c \
              --arg scope "$scope" \
              'map({
                scope: $scope,
                ruleId: .RuleID,
                file: .File,
                startLine: .StartLine,
                endLine: .EndLine,
                commit: (.Commit // "")
              })' \
              "$report"
          }

          set +e
          "$GITLEAKS_DIR/gitleaks" dir . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$GITLEAKS_TREE_REPORT"
          GITLEAKS_TREE_STATUS="$?"
          set -e
          report_sanitized_findings exact-tree "$GITLEAKS_TREE_REPORT"

          GITLEAKS_HISTORY_STATUS=0
          if [[ "$GITHUB_EVENT_NAME" = "push" &&
                "$GITHUB_REF" = "refs/heads/main" ]]; then
            set +e
            "$GITLEAKS_DIR/gitleaks" git . \
              --redact \
              --no-banner \
              --report-format json \
              --report-path "$GITLEAKS_HISTORY_REPORT"
            GITLEAKS_HISTORY_STATUS="$?"
            set -e
            report_sanitized_findings protected-main-history \
              "$GITLEAKS_HISTORY_REPORT"
          fi

          test "$GITLEAKS_TREE_STATUS" -eq 0
          test "$GITLEAKS_HISTORY_STATUS" -eq 0
      - name: Verify generated artifacts stay ignored
        shell: bash
        run: |
          set -euo pipefail
          generated_paths=(
            legacy-reconciliation-receipt.json
            api-stage-preflight.json
            api-stage-proof.json
            foundation-s3-access-logging-receipt.json
            application-s3-access-logging-preflight.json
            application-s3-access-logging-proof.json
            application-s3-access-logging-recovery.json
            previous-stack-template.yaml
            previous-stack-parameters.json
            previous-stack-tags.json
            frontend-prestate.json
            previous-index.html
            previous-live-alias.json
            recovery-intent.json
            recovery-intent.tar
            recovery-snapshot-proof.json
            staging-durable-recovery-receipt.json
            production-durable-recovery-receipt.json
            staging-recovery-execution.json
            production-recovery-execution.json
            staging-recovery-finalization.json
            production-recovery-finalization.json
            staging-terminal-receipt-object.json
            production-terminal-receipt-object.json
            staging-cloudformation-controls-preflight.json
            production-cloudformation-controls-preflight.json
            staging-cloudformation-controls-terminal.json
            production-cloudformation-controls-terminal.json
            staging-cloudformation-controls-recovery.json
            production-cloudformation-controls-recovery.json
            staging-cloudformation-controls-audit.json
            production-cloudformation-controls-audit.json
            bench-clustered.txt
            bench-uniform.txt
            distribution.txt
            submission-readiness-receipt.json
            supply-chain-release-receipt.json
            well-architected-repository-receipt.json
            well-architected-live-receipt.json
            aws-account-security-baseline-receipt.json
            database-credential-rotation-receipt.json
            hosted-load-receipt.json
            hosted-k6-summary.json
            hosted-load-contract.sha256
            k6-machine-readable-schema.json
            sustainability-intensity-receipt.json
            human-impact-receipt.json
            evidence-manifest.sha256
            lambda-zip-content.sha256
            sbom-inputs-and-documents.sha256
            memory-evaluation-receipt.json
            policy-results.json
            scale-manifest.json
            vector-results.json
            vector-benchmark.log
            candidate-evidence-binding.json
            production-capture.webm
            capture-receipt.json
            narration-receipt.json
            video-build-receipt.json
            video-verification-receipt.json
            video-release-binding.json
            toolchain-provenance.json
            demo-video-publication.json
            01-hook.png
            02-scope-architecture.png
            03-recall-grounding.png
            04-audit-conflict.png
            05-audit-absence.png
            06-proof-ledger.png
            07-managed-mcp.png
            08-close.png
            captions.en.srt
            archon-memory-demo.mp4
            server.pid
            dist/nested/generated.js
            build/nested/generated.js
          )
          for generated_path in "${generated_paths[@]}"; do
            git check-ignore --quiet -- "$generated_path"
          done

  # Stage 2a — dependency vulnerability audit (runs in parallel with tests).
  # Runtime and development dependencies fail closed on moderate or higher
  # advisories; low-only findings remain visible without blocking the release.
  dep-audit:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: npm audit (fail on moderate/high/critical)
        run: npm audit --audit-level=moderate

  build-test:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://root@localhost:26257/archon_memory?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Start CockroachDB (v25.2+ for native vector indexing)
        run: |
          docker run -d --name crdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:v26.2.3@sha256:1073844226a6291b8a44fcb9cab5cb02035bb8fea3266dcc5dd021c0b34484a0 start-single-node --insecure
          echo "Waiting for CockroachDB to accept SQL..."
          for _ in $(seq 1 30); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "ready"; break
            fi
            sleep 2
          done
          docker exec crdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS archon_migration"
          # Fail loudly if it never came up.
          docker exec crdb cockroach sql --insecure -e "SELECT 1"

      - name: Rehearse legacy migration, drift failure, and idempotent re-apply
        env:
          DATABASE_URL: postgresql://root@localhost:26257/archon_migration?sslmode=disable
        run: npm run db:migration:rehearsal

      - name: Replace the isolated migration database with reconciliation
        shell: bash
        run: |
          set -euo pipefail
          docker exec crdb cockroach sql --insecure \
            -e "DROP DATABASE archon_migration CASCADE"
          docker exec crdb cockroach sql --insecure \
            -e "DROP USER archon_migration_ci"
          docker exec crdb cockroach sql --insecure \
            -e "CREATE DATABASE archon_reconciliation"

      - name: Rehearse exact legacy-memory rejection, post-mutation rollback, and rerun
        env:
          DATABASE_URL: postgresql://root@localhost:26257/archon_reconciliation?sslmode=disable
        run: npm run db:memory:reconciliation:rehearsal

      - name: Remove the isolated reconciliation database
        shell: bash
        run: |
          set -euo pipefail
          docker exec crdb cockroach sql --insecure \
            -e "DROP DATABASE archon_reconciliation CASCADE"

      - name: Bootstrap the safe local demo twice and prove exact idempotency
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            output="$(npm run --silent local:bootstrap)"
            printf '%s\n' "$output"
            test "$(printf '%s\n' "$output" |
              grep -Fxc 'local-bootstrap receipt=12/12/12 expected=12 persisted=12 unique=12 exact=12 model=fake-hash-embedder')" -eq 1
            echo "safe local bootstrap attempt ${attempt}/2 passed"
          done

      # Unit + integration tests, INCLUDING the multi-range vector fan-out test
      # (tests/fanout.test.ts): against the real CockroachDB in CI it forces the memory
      # table into >=2 KV ranges with enforced primary-key `SPLIT AT` (deterministic,
      # size-independent — not a natural size-driven auto-split), then proves one ANN
      # recall query fans out across those ranges and returns the correct top-k. Turns
      # docs/BENCHMARK.md Result 3b from asserted into tested. Offline it runs recall
      # correctness under the mock and skips the range assertions.
      - name: Unit + integration coverage gate (incl. multi-range fan-out)
        run: npm run test:coverage

      - name: Upload backend coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/archon-coverage/backend/lcov.info
          if-no-files-found: error
          retention-days: 30

      # Fast benchmark smoke — proves the recall@k harness runs end-to-end and the
      # distributed vector index tracks exact NN above a floor (fails loudly if the
      # index silently degrades). The FULL benchmark + 3-node distribution capture
      # run in benchmark.yml (workflow_dispatch); numbers are committed to docs/BENCHMARK.md.
      - name: Vector-index benchmark smoke (offline, recall floor)
        run: BENCH_N=1500 BENCH_QUERIES=50 BENCH_K=10 BENCH_BATCH=500 BENCH_RECALL_FLOOR=0.80 npm run benchmark

      - name: Dump CockroachDB logs on failure
        if: failure()
        run: docker logs crdb || true

  # Stage 2c — node-loss survival, DEMONSTRATED in CI (not just asserted).
  # Stands up the real 3-node cluster (docker-compose.cluster.yml), applies the
  # schema, loads a small corpus, then runs show-distribution.sh in STRICT mode:
  # it kills roach3 (docker stop) and asserts recall STILL serves through roach1
  # (RF=3 quorum). STRICT=1 makes the script exit non-zero if recall stops serving,
  # so a regression that breaks node-loss survival FAILS this job. This is what makes
  # the README "kill any one node → recall keeps serving" claim CI-proven.
  cluster-survival:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://root@localhost:26257/archon_memory?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Start the 3-node CockroachDB cluster (RF=3 across roach1/2/3)
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker-compose.cluster.yml"
          $COMPOSE up -d
          echo "Waiting for the roach1 process to accept exec…"
          for i in $(seq 1 20); do
            if $COMPOSE exec -T roach1 cockroach node status --insecure >/dev/null 2>&1; then break; fi
            # `node status` errors until init, but a non-"cannot exec" error means the process is up.
            if $COMPOSE exec -T roach1 true >/dev/null 2>&1; then break; fi
            sleep 3
          done
          echo "Initializing the cluster (retry until it takes)…"
          READY=0
          for i in $(seq 1 30); do
            $COMPOSE exec -T roach1 cockroach init --insecure >/dev/null 2>&1 || true
            if $COMPOSE exec -T roach1 cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              READY=1; echo "cluster ready after ${i} attempt(s)"; break
            fi
            sleep 3
          done
          if [ "$READY" -ne 1 ]; then echo "cluster never became ready"; $COMPOSE logs || true; exit 1; fi
          $COMPOSE exec -T roach1 cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS archon_memory"
          $COMPOSE exec -T roach1 cockroach sql --insecure -e "SELECT 1"

      - name: Apply schema to the cluster (VECTOR table + vector index)
        run: npm run db:schema

      - name: Node-kill survival — STRICT (fails the build if recall stops serving)
        run: STRICT=1 DIST_N=800 bash scripts/show-distribution.sh

      - name: Dump cluster logs on failure
        if: failure()
        run: docker compose -f docker-compose.cluster.yml logs || true

  # Stage 2d — PEN-TEST. Stands up its OWN CockroachDB and runs the application-security
  # suite (tests/security.test.ts) with DATABASE_URL set, so the injection /
  # parameterized-query assertions execute against a REAL engine (the in-memory mock
  # cannot prove SQL parameterization). Covers AuthZ (MCP write/read tool boundary),
  # injection, tenant/scope isolation, sensitive-data exposure, and input-abuse bounds.
  pen-test:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://root@localhost:26257/archon_memory?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Start CockroachDB (v25.2+ native vector indexing)
        run: |
          docker run -d --name crdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:v26.2.3@sha256:1073844226a6291b8a44fcb9cab5cb02035bb8fea3266dcc5dd021c0b34484a0 start-single-node --insecure
          for _ in $(seq 1 30); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then echo ready; break; fi
            sleep 2
          done
          docker exec crdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS archon_memory"
          docker exec crdb cockroach sql --insecure -e "SELECT 1"
      - name: Apply schema
        run: npm run db:schema
      - name: Application-security suite (real-CRDB parameterization proof)
        run: npm run test:security
      - name: Prove role-bound RLS ignores mutable application_name
        run: |
          set -euo pipefail
          docker exec crdb cockroach sql --insecure --database archon_memory --execute "
            CREATE USER IF NOT EXISTS archon_runtime_ci;
            GRANT CONNECT ON DATABASE archon_memory TO archon_runtime_ci;
            GRANT USAGE ON SCHEMA public TO archon_runtime_ci;
            GRANT archon_public_reader TO archon_runtime_ci;
            GRANT archon_resolution_writer TO archon_runtime_ci;
            UPDATE agent_memory
               SET tenant_id = 'public-demo', company = 'Helios SA', status = 'active'
             WHERE id = (SELECT id FROM agent_memory LIMIT 1);
          "
          RESULT="$(docker exec crdb cockroach sql \
            --insecure \
            --database archon_memory \
            --format=csv \
            --execute "
              SET ROLE archon_runtime_ci;
              SET application_name = 'archon.attacker-selected-tenant';
              SELECT count(*) AS visible,
                     count(*) FILTER (
                       WHERE tenant_id = 'public-demo'
                         AND company = 'Helios SA'
                         AND status = 'active'
                     ) AS correctly_scoped
                FROM agent_memory;
            " | tail -n 1)"
          VISIBLE="${RESULT%%,*}"
          SCOPED="${RESULT##*,}"
          test "$VISIBLE" -ge 1
          test "$VISIBLE" = "$SCOPED"
      - name: Exercise resolution loop through the least-privilege runtime login
        env:
          DATABASE_URL: postgresql://archon_runtime_ci@localhost:26257/archon_memory?sslmode=disable
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/resolution.test.ts
      - name: Dump CockroachDB logs on failure
        if: failure()
        run: docker logs crdb || true

  # Stage 2e — LOAD. Drives the recall / vector-search path under concurrency with k6
  # against a real CockroachDB (offline of AWS → FakeEmbedder/FakeNarrator, same recall
  # path). k6 thresholds enforce the p95 latency SLO + recall@1 correctness; a regression
  # that breaches either FAILS this job. Bounded (20 VUs, 20s).
  load:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://root@localhost:26257/archon_memory?sslmode=disable
      LOAD_N: "2000"
      PUBLIC_DEMO_COMPANY: LoadCorp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install k6 (SHA-pinned action and version)
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "2.0.0"
      - name: Inspect hosted-load module without network
        env:
          BASE_URL: https://d111111abcdef8.cloudfront.net
          RELEASE_SHA: "0000000000000000000000000000000000000000"
          TOTAL_ITERATIONS: "20"
          VUS: "2"
          MAX_DURATION_SECONDS: "60"
          P95_LATENCY_MS: "5000"
          MAX_ERROR_RATE: "0.01"
          K6_NO_USAGE_REPORT: "true"
        run: |
          set -euo pipefail
          # `inspect` evaluates imports, init code, and options. It never runs
          # setup/default, so the dummy CloudFront origin receives no request.
          # k6 deliberately excludes system env from `inspect`; explicit `-e`
          # flags make this validation independent of that secure default.
          k6 inspect \
            -e BASE_URL="$BASE_URL" \
            -e RELEASE_SHA="$RELEASE_SHA" \
            -e TOTAL_ITERATIONS="$TOTAL_ITERATIONS" \
            -e VUS="$VUS" \
            -e MAX_DURATION_SECONDS="$MAX_DURATION_SECONDS" \
            -e P95_LATENCY_MS="$P95_LATENCY_MS" \
            -e MAX_ERROR_RATE="$MAX_ERROR_RATE" \
            load/hosted-recall.js >/dev/null
      - name: Prove pinned k6 machine-readable summary schema without network
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP:?}/k6-machine-readable-schema.json"
          k6 run \
            --new-machine-readable-summary \
            --summary-export="$summary" \
            load/k6-summary-schema-smoke.js
          jq -e '
            (
              .results.metrics
              | map({key: .name, value: .})
              | from_entries
            ) as $metrics
            | .version == "1.0.0"
              and (.results.metrics | type) == "array"
              and ([.results.metrics[].name] | length)
                == ([.results.metrics[].name] | unique | length)
              and $metrics.iterations.type == "counter"
              and $metrics.iterations.values.count == 1
              and $metrics.archon_schema_counter.type == "counter"
              and $metrics.archon_schema_counter.values.count == 1
              and $metrics.archon_schema_rate.type == "rate"
              and $metrics.archon_schema_rate.values.rate == 1
              and $metrics.archon_schema_trend_ms.type == "trend"
              and $metrics.archon_schema_trend_ms.values.p95 == 42
          ' "$summary" >/dev/null
          rm -f -- "$summary"
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 -p 8080:8080 \
            cockroachdb/cockroach:v26.2.3@sha256:1073844226a6291b8a44fcb9cab5cb02035bb8fea3266dcc5dd021c0b34484a0 start-single-node --insecure
          for _ in $(seq 1 30); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then echo ready; break; fi
            sleep 2
          done
          docker exec crdb cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS archon_memory"
      - name: Apply schema
        run: npm run db:schema
      - name: Seed the load corpus
        run: npm run load:seed
      - name: Start the recall server
        run: |
          PORT=8787 npm run serve &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then echo "server up"; break; fi
            sleep 1
          done
      - name: k6 load test (p95 SLO + recall@1 under concurrency)
        run: >-
          k6 run
          --summary-export="${RUNNER_TEMP:?}/k6-summary.json"
          -e BASE_URL=http://localhost:8787
          -e LOAD_N=2000
          load/recall.js
      - name: Upload k6 load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-load-${{ github.sha }}
          path: ${{ runner.temp }}/k6-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - name: Dump CockroachDB logs on failure
        if: failure()
        run: docker logs crdb || true

  # Stage 2f — the judge-facing React app, browser journeys, and deployable SAM
  # architecture are first-class release gates. All build/browser artifacts live
  # only on the ephemeral CI runner.
  frontend-iac:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0
      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint==1.53.1
      - name: Install locked backend and frontend dependencies
        run: |
          npm ci
          npm ci --prefix web
      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          npm audit --prefix web --audit-level=moderate
      - name: Backend and frontend type/build gates
        run: |
          npm run typecheck
          npm run typecheck --prefix web
          npm run build --prefix web
      - name: Frontend unit coverage gate
        run: npm run test:coverage --prefix web
      - name: Upload frontend coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/archon-coverage/frontend/coverage-summary.json
            ${{ runner.temp }}/archon-coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 30
      - name: Validate and build the serverless architecture
        run: |
          set -euo pipefail
          bash -n aws/prove-api-stage-controls.sh
          bash -n aws/prove-alarm-routing.sh
          bash -n aws/prove-s3-access-logging.sh
          bash -n aws/prove-application-s3-access-logging.sh
          bash -n aws/prove-recovery-snapshot.sh
          bash -n aws/merge-canonical-stack-tags.sh
          bash -n aws/serialize-sam-stack-tags.sh
          bash -n aws/classify-github-recovery-preflight.sh
          bash -n aws/classify-durable-recovery-source.sh
          bash -n aws/fetch-codedeploy-appspec-revision.sh
          bash -n aws/create-durable-recovery-bundle.sh
          bash -n aws/delete-greenfield-stack.sh
          bash -n aws/download-durable-recovery-bundle.sh
          bash -n aws/enforce-cloudformation-controls.sh
          bash -n aws/extract-durable-recovery-bundle.sh
          bash -n aws/finalize-durable-recovery-receipt.sh
          bash -n aws/put-durable-recovery-object.sh
          bash -n aws/recover-durable-environment.sh
          bash -n aws/recovery-intent-ledger.sh
          bash -n aws/restore-cloudformation-stack.sh
          bash -n aws/verify-durable-recovery-bundle.sh
          bash -n aws/verify-durable-recovery-receipt.sh
          jq -e '.Statement | length == 2' aws/bootstrap-stack-policy.json >/dev/null
          cfn-lint aws/bootstrap-oidc.yaml
          sam validate --lint --template-file aws/template.yaml --region eu-west-1
          SAM_BUILD_LOG="${RUNNER_TEMP:?}/sam-build.log"
          if ! PATH="$PWD/node_modules/.bin:$PATH" sam build \
              --template-file aws/template.yaml \
              --build-dir .aws-sam/build \
              --parallel 2>&1 |
            tee "$SAM_BUILD_LOG"; then
            exit 1
          fi
          if grep -Eqi 'reserved logical ID|unexpected behaviors' \
            "$SAM_BUILD_LOG"; then
            echo "SAM emitted a reserved-logical-ID warning." >&2
            exit 1
          fi
          if grep -q "Type: AWS::IAM::" .aws-sam/build/template.yaml; then
            echo "Application stack must not synthesize IAM resources." >&2
            exit 1
          fi
      - name: Install Chromium in the ephemeral runner
        run: npx --prefix web playwright install --with-deps chromium
      - name: Verify video marker, strict scene locators, and DOM reinjection in Chromium
        working-directory: web
        run: node video/capture-marker-selftest.mjs
      - name: Desktop and mobile judge journeys
        run: npm run test:e2e --prefix web
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-ci-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Stage 2g — deterministic pre-deploy DAST. The complete 21-check adversarial
  # contract runs against controlled responses, while digest-pinned ZAP spiders
  # the exact candidate SPA built by this SHA. Live active probes and release-
  # policy ZAP remain a blocking causal tail of every production deployment.
  hosted-dast:
    name: Pre-deploy DAST contract and candidate SPA
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DAST_CANDIDATE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked DAST and candidate dependencies
        run: |
          npm ci
          npm ci --prefix web
      - name: Prove the complete 21-check adversarial DAST contract
        shell: bash
        env:
          DAST_CONTRACT_TAP: ${{ runner.temp }}/hosted-dast-contract.tap
        run: |
          set -euo pipefail
          node --import tsx --test --test-concurrency=1 \
            tests/hosted-dast.test.ts | tee "$DAST_CONTRACT_TAP"
      - name: Upload SHA-bound pre-deploy DAST contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-contract-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-dast-contract.tap
          if-no-files-found: error
          retention-days: 90
      - name: Build the exact candidate SPA
        run: npm run build --prefix web
      - name: Start the loopback-only transport-aware candidate server
        shell: bash
        env:
          PREDEPLOY_ZAP_PID_FILE: ${{ runner.temp }}/predeploy-zap-server.pid
          PREDEPLOY_ZAP_LOG_FILE: ${{ runner.temp }}/predeploy-zap-server.log
        run: |
          set -euo pipefail
          PREDEPLOY_WEB_ROOT="$GITHUB_WORKSPACE/web/dist" \
          PREDEPLOY_ZAP_PORT=4173 \
            node scripts/predeploy-zap-server.mjs \
              >"$PREDEPLOY_ZAP_LOG_FILE" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$PREDEPLOY_ZAP_PID_FILE"
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              sed -n '1,80p' -- "$PREDEPLOY_ZAP_LOG_FILE" >&2
              exit 1
            fi
            candidate_body="$(
              curl --fail --silent --show-error --max-time 2 \
                "$DAST_CANDIDATE_URL/"
            )" || true
            if grep -Fq '<div id="root"></div>' <<<"$candidate_body"; then
              kill -0 "$server_pid"
              exit 0
            fi
            sleep 1
          done
          sed -n '1,80p' -- "$PREDEPLOY_ZAP_LOG_FILE" >&2
          exit 1
      - name: OWASP ZAP passive and AJAX-spider candidate baseline
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ env.DAST_CANDIDATE_URL }}
          rules_file_name: .zap/predeploy.tsv
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          cmd_options: "-a -j -m 2"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-ci-${{ github.sha }}-${{ github.run_attempt }}
      - name: Require the candidate server to remain healthy and clean up
        if: always()
        shell: bash
        env:
          PREDEPLOY_ZAP_PID_FILE: ${{ runner.temp }}/predeploy-zap-server.pid
          PREDEPLOY_ZAP_LOG_FILE: ${{ runner.temp }}/predeploy-zap-server.log
        run: |
          set -euo pipefail
          if [ ! -f "$PREDEPLOY_ZAP_PID_FILE" ]; then
            exit 0
          fi
          server_pid="$(cat "$PREDEPLOY_ZAP_PID_FILE")"
          [[ "$server_pid" =~ ^[1-9][0-9]*$ ]]
          alive=false
          healthy=false
          shutdown_clean=false
          if kill -0 "$server_pid" 2>/dev/null; then
            alive=true
            if curl --fail --silent --show-error --max-time 2 \
                "$DAST_CANDIDATE_URL/" >/dev/null; then
              healthy=true
            fi
            if kill -TERM "$server_pid" && wait "$server_pid"; then
              shutdown_clean=true
            fi
          fi
          rm -f -- "$PREDEPLOY_ZAP_PID_FILE" "$PREDEPLOY_ZAP_LOG_FILE"
          test "$alive" = "true"
          test "$healthy" = "true"
          test "$shutdown_clean" = "true"

  # Stage 2h — guard the media guard. Tiny runner-temp fixtures prove that the
  # final-video verifier accepts a correct package and rejects scene, A/V,
  # caption, and receipt drift. No narration secret or generated media leaves
  # the hosted runner.
  video-gate:
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize runner-temp media root
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP}"
          echo "DEMO_VIDEO_ROOT=${RUNNER_TEMP}/archon-demo-video-selftest" >>"${GITHUB_ENV}"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
      - name: Install exact FFmpeg toolchain
        shell: bash
        run: bash demo/video/install-pinned-ffmpeg-linux.sh
      - name: Prove the final media gate passes good and rejects broken fixtures
        run: node demo/video/media-gate-selftest.mjs
      - name: Remove runner-temp media fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${DEMO_VIDEO_ROOT}" = "${RUNNER_TEMP}/archon-demo-video-selftest"
          toolchain_root="${RUNNER_TEMP}/archon-demo-video-toolchain-b8ed29dc71fe17f05f43e2d9dbfde89edf43270c3de13ce3c4d70f5df1f47e61"
          test "${toolchain_root}" != "${RUNNER_TEMP}"
          rm -rf -- "${DEMO_VIDEO_ROOT}" "${toolchain_root}"
      - name: Require a clean repository checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  # Stage 3 — the fail-closed READINESS GATE. It always evaluates after every
  # prerequisite reaches a terminal state and explicitly fails if any prerequisite
  # failed, was cancelled, or was skipped. Submission-only requirements remain
  # visibly pending and cannot masquerade as eligibility.
  readiness:
    needs: [secret-scan, dep-audit, build-test, cluster-survival, pen-test, load, frontend-iac, hosted-dast, video-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every prerequisite CI job to pass
        env:
          PREREQUISITE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'length == 9 and all(.[]; .result == "success")' <<<"$PREREQUISITE_RESULTS"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Source readiness gate (100% repository-verifiable checks)
        env:
          READINESS_OUTPUT: readiness.json
          SOURCE_READINESS_FLOOR: "100"
        run: npm run readiness
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-report
          path: readiness.json
