name: Database release

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact green main commit to reconcile
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA (defaults to the selected ref)
        required: false
        type: string

concurrency:
  group: cockroach-production-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Schema, runtime RLS, C-SPANN, and resolution-loop execution proof
    if: github.event_name == 'workflow_call' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-db
    permissions:
      contents: read
      id-token: write
    env:
      APP_NAME: ${{ vars.AWS_APP_NAME || 'archon-memory' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_DATABASE_OPERATOR_ROLE_ARN: ${{ vars.AWS_DATABASE_OPERATOR_ROLE_ARN }}
      CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
      COCKROACH_CLUSTER_ID: ${{ vars.COCKROACH_CLUSTER_ID }}
      COCKROACH_ADMIN_SECRET_ID: ${{ vars.COCKROACH_ADMIN_SECRET_ID || 'archon-memory/operator/cockroach-admin' }}
      STAGING_DATABASE_SECRET_ID: ${{ vars.STAGING_DATABASE_SECRET_ID || 'archon-memory/staging/database' }}
      PRODUCTION_DATABASE_SECRET_ID: ${{ vars.PRODUCTION_DATABASE_SECRET_ID || 'archon-memory/production/database' }}
      BEDROCK_REGION: eu-west-1
      BEDROCK_EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove target is still current main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate protected environment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DATABASE_OPERATOR_ROLE_ARN"
          test -n "$CCLOUD_API_KEY"
          test -n "$COCKROACH_CLUSTER_ID"
          test "$AWS_REGION" = "eu-west-1"

      - name: Prove CockroachDB Cloud provider, plan, state, and region
        run: |
          set -euo pipefail
          CLUSTER_METADATA="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --max-time 30 \
            "https://cockroachlabs.cloud/api/v1/clusters/$COCKROACH_CLUSTER_ID" \
            -H "Authorization: Bearer $CCLOUD_API_KEY" \
            -H "Cc-Version: 2024-09-16")"
          jq -e \
            --arg id "$COCKROACH_CLUSTER_ID" \
            '.id == $id and
             .cloud_provider == "AWS" and
             .plan == "BASIC" and
             .state == "CREATED" and
             (.cockroach_version |
               test("^v26\\.2(?:\\.|$)")) and
             ([.regions[] |
                select(.name == "eu-west-1" and .primary == true)] |
                length) == 1 and
             ([.regions[] |
                select(.name == "eu-west-1" and .primary == true)][0].sql_dns |
                type == "string" and
                length <= 253 and
                test("^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"))' \
             <<<"$CLUSTER_METADATA"
          COCKROACH_SQL_DNS="$(jq -er \
            '[.regions[] |
               select(.name == "eu-west-1" and .primary == true)][0].sql_dns' \
            <<<"$CLUSTER_METADATA")"
          {
            echo "COCKROACH_CLOUD_PROVIDER=AWS"
            echo "COCKROACH_CLOUD_PLAN=BASIC"
            echo "COCKROACH_CLOUD_REGION=eu-west-1"
            echo "COCKROACH_CLOUD_VERSION=$(jq -er '.cockroach_version' <<<"$CLUSTER_METADATA")"
            echo "COCKROACH_SQL_DNS=$COCKROACH_SQL_DNS"
          } >> "$GITHUB_ENV"
          unset CLUSTER_METADATA COCKROACH_SQL_DNS

      - name: Configure short-lived database-operator credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DATABASE_OPERATOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: archon-database-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Gate real Titan and Claude quality on the golden judge question
        env:
          RUN_BEDROCK_IT: "1"
          BEDROCK_MODEL_ID: eu.anthropic.claude-sonnet-4-6
        run: npm run test:bedrock

      - name: Reconcile schema, canonical memory, and runtime credentials
        run: |
          set -euo pipefail
          test -n "$AWS_ACCOUNT_ID"
          test "$AWS_REGION" = "eu-west-1"
          test "$BEDROCK_REGION" = "eu-west-1"
          test -n "$AWS_DATABASE_OPERATOR_ROLE_ARN"
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID"

          ADMIN_SECRET="$(aws secretsmanager get-secret-value \
            --secret-id "$COCKROACH_ADMIN_SECRET_ID" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text)"
          if [[ "$ADMIN_SECRET" == postgres://* || "$ADMIN_SECRET" == postgresql://* ]]; then
            DATABASE_URL="$ADMIN_SECRET"
          else
            DATABASE_URL="$(jq -er '.DATABASE_URL' <<<"$ADMIN_SECRET")"
          fi
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          npm run --silent db:endpoint:verify \
            > database-endpoint-binding-receipt.json
          jq -e \
            '.schemaVersion == 1 and
             .ok == true and
             .clusterIdBoundBy ==
               "authenticated Cockroach Cloud API primary eu-west-1 sql_dns" and
             (.endpointHostnameSha256 | test("^[a-f0-9]{64}$")) and
             .port == 26257 and
             .database == "archon" and
             .tlsMode == "verify-full" and
             .routingOverrides == "none" and
             .secretMaterialPrinted == false' \
            database-endpoint-binding-receipt.json

          for RUNTIME_SECRET_ID in \
            "$STAGING_DATABASE_SECRET_ID" \
            "$PRODUCTION_DATABASE_SECRET_ID"; do
            if aws secretsmanager describe-secret \
              --secret-id "$RUNTIME_SECRET_ID" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              RUNTIME_SECRET="$(aws secretsmanager get-secret-value \
                --secret-id "$RUNTIME_SECRET_ID" \
                --region "$AWS_REGION" \
                --query SecretString \
                --output text)"
              if [[ "$RUNTIME_SECRET" == postgres://* ||
                    "$RUNTIME_SECRET" == postgresql://* ]]; then
                RUNTIME_URL="$RUNTIME_SECRET"
              else
                RUNTIME_URL="$(jq -er '.DATABASE_URL' <<<"$RUNTIME_SECRET")"
              fi
              echo "::add-mask::$RUNTIME_URL"
              DATABASE_URL="$RUNTIME_URL" \
                npm run --silent db:endpoint:verify >/dev/null
              unset RUNTIME_SECRET RUNTIME_URL
            fi
          done
          unset RUNTIME_SECRET_ID

          npm run db:schema
          npm run demo:seed
          npm run --silent db:memory:reconcile > legacy-reconciliation-receipt.json
          jq -e \
            --arg target "$TARGET_SHA" \
            '.schemaVersion == 1 and
             .ok == true and
             .migrationId == "legacy-helios-event-v1" and
             .targetSha == $target and
             (.mode == "migrated" or
              .mode == "already-reconciled") and
             (.manifestSha256 | test("^[a-f0-9]{64}$")) and
             (.targetRowSetSha256 | test("^[a-f0-9]{64}$")) and
             .targetRowSetSha256 !=
               "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" and
             .expectedLegacyDuplicates == 6 and
             ((.mode == "migrated" and
               .activeBefore == 6 and
               .alreadySuperseded == 0 and
               .supersededThisRun == 6 and
               .linkedAfter == 6) or
              (.mode == "already-reconciled" and
               .activeBefore == 0 and
               .alreadySuperseded == 6 and
               .supersededThisRun == 0 and
               .linkedAfter == 6)) and
             .canonicalActive == 9 and
             .activeIntegrityGapsAfter == 0 and
             .activeDistinctIdempotencyKeys == 9 and
             .activeDistinctContentDigests == 9 and
             .historicalRowsPreserved == true and
             .secretMaterialPrinted == false' \
            legacy-reconciliation-receipt.json

          if ! aws secretsmanager describe-secret \
            --secret-id "$STAGING_DATABASE_SECRET_ID" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            APP_ENV=staging \
            APP_DB_USER="archon_staging_${TARGET_SHA:0:10}" \
            DATABASE_SECRET_NAME="$STAGING_DATABASE_SECRET_ID" \
            npm run aws:provision-secret
          else
            APP_ENV=staging \
            DATABASE_SECRET_NAME="$STAGING_DATABASE_SECRET_ID" \
            npm run aws:provision-secret
          fi
          if ! aws secretsmanager describe-secret \
            --secret-id "$PRODUCTION_DATABASE_SECRET_ID" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            APP_ENV=production \
            APP_DB_USER="archon_production_${TARGET_SHA:0:10}" \
            DATABASE_SECRET_NAME="$PRODUCTION_DATABASE_SECRET_ID" \
            npm run aws:provision-secret
          else
            APP_ENV=production \
            DATABASE_SECRET_NAME="$PRODUCTION_DATABASE_SECRET_ID" \
            npm run aws:provision-secret
          fi

          npm run --silent db:release:verify > database-release-receipt.json
          jq -e \
            --arg target "$TARGET_SHA" \
            '.schemaVersion == 5 and
             .ok == true and
             .targetSha == $target and
             .region == "eu-west-1" and
             .cockroachCloud.provider == "AWS" and
             .cockroachCloud.region == "eu-west-1" and
             .cockroachCloud.sqlEndpointBinding.source ==
               "exact primary eu-west-1 regions[].sql_dns" and
             (.cockroachCloud.sqlEndpointBinding.endpointHostnameSha256 |
               test("^[a-f0-9]{64}$")) and
             .cockroachCloud.sqlEndpointBinding.port == 26257 and
             .cockroachCloud.sqlEndpointBinding.database == "archon" and
             .cockroachCloud.sqlEndpointBinding.tlsMode == "verify-full" and
             .cockroachCloud.sqlEndpointBinding.routingOverrides == "none" and
             .cockroachCloud.sqlEndpointBinding.boundUrlCount == 3 and
             .fixtureRows == 12 and
             .proofs.roleBoundRls == true and
             .proofs.wrongCompanyInvisible == true and
             .proofs.wrongTenantInvisible == true and
             .proofs.retractedStatusInvisible == true and
             .proofs.companyScopedVectorIndex == true and
             .proofs.companyKindScopedVectorIndex == true and
             .proofs.fixedScopeServingViews == true and
             .proofs.durableStoreIntegrity == true and
             .proofs.canonicalActiveMemories == 9 and
             .proofs.distinctIdempotencyKeys == 9 and
             .proofs.distinctContentDigests == 9 and
             .proofs.scopedServingQueriesRejectCanaries == true and
             .proofs.isolationCanaryCount == 3 and
             .proofs.isolatedNonLoginServingViewOwner == true and
             .proofs.servingViewOwnerPrivilegeBoundary ==
               "direct non-inheritable BYPASSRLS role option; SELECT agent_memory only; no system privileges" and
             .proofs.runtimePrincipalCspannPlanAndExecute == true and
             .proofs.runtimePrincipalNoKindCspann == true and
             .proofs.runtimePrincipalKindCspann == true and
             .proofs.runtimeCspannEnvironmentCount == 2 and
             .proofs.memoryResolutionLoop == true and
             .proofs.runtimeResolutionEnvironmentCount == 2 and
             .proofs.resolutionSandbox.tables == 5 and
             .proofs.resolutionSandbox.rlsPolicies == 15 and
             .proofs.resolutionSandbox.ttlExpirationExpression ==
               "expires_at" and
             .proofs.resolutionSandbox.ttlSchedule ==
               "0 */4 * * *" and
             .proofs.resolutionSandbox.ttlClusterEnabled == true and
             .proofs.resolutionSandbox.ttlScheduleStatus == "ACTIVE" and
             .proofs.resolutionSandbox.ttlPaused == false and
             .proofs.resolutionSandbox.writerRelationGrantCount == 5 and
             .proofs.resolutionSandbox.transitionOwnerRelationGrantCount == 13 and
             .proofs.resolutionSandbox.transitionFunctionCount == 2 and
             .proofs.resolutionSandbox.writerFunctionExecuteCount == 2 and
             .proofs.resolutionSandbox.directRuntimeDml == "none" and
             .proofs.resolutionIsolationBoundary ==
               "trusted Lambda validates opaque bearer tokens; CockroachDB SECURITY DEFINER transition API confines mutation to fixed synthetic TTL rows" and
             .proofs.transitionOwnerPrivilegeBoundary ==
               "NOLOGIN/NOBYPASSRLS; no members or parent roles; schema USAGE without CREATE; 13 bounded relation grants; owns exactly two SECURITY DEFINER routines" and
             .proofs.runtimeRelationPrivilegeMatrix ==
               "canonical and fixed synthetic SELECT only; zero direct INSERT/UPDATE/DELETE" and
             .proofs.runtimeFunctionPrivilegeMatrix ==
               "EXECUTE only on archon_resolution_create_session and archon_resolution_decide" and
             (.proofs.indexDefinitionFingerprints.company |
               test("^[a-f0-9]{64}$")) and
             (.proofs.indexDefinitionFingerprints.kind |
               test("^[a-f0-9]{64}$")) and
             (.releaseDigests.schemaSha256 | test("^[a-f0-9]{64}$")) and
             (.releaseDigests.fixtureManifestSha256 | test("^[a-f0-9]{64}$")) and
             .secretMaterialPrinted == false and
             (.runtimes | length) == 2 and
             ([.runtimes[].environment] | sort) ==
               ["production", "staging"] and
             ([.runtimes[].cspannRecall.noKind.queryTemplateSha256] |
               unique | length) == 1 and
             ([.runtimes[].cspannRecall.kind.queryTemplateSha256] |
               unique | length) == 1 and
             all(.runtimes[];
               ((.environment == "staging" and
                 (.principal | test("^archon_staging_[a-z0-9]{6,40}$"))) or
                (.environment == "production" and
                 (.principal | test("^archon_production_[a-z0-9]{6,40}$")))) and
               .visibleMemories == 9 and
               .canonicalMemories == 9 and
               .distinctIdempotencyKeys == 9 and
               .distinctContentDigests == 9 and
               .cspannRecall.noKind.servingPath ==
                 "public-no-kind-cspann" and
               .cspannRecall.noKind.view ==
                 "archon_public_memory_recall" and
               .cspannRecall.noKind.index ==
                 "idx_agent_memory_company_scope_embedding" and
               .cspannRecall.noKind.vectorSearchPlanned == true and
               .cspannRecall.noKind.executed == true and
               .cspannRecall.noKind.scopeVerified == true and
               .cspannRecall.noKind.probeReturned == true and
               .cspannRecall.noKind.scopedServingQueryVerified == true and
               .cspannRecall.noKind.isolationCanariesRejected == 3 and
               (.cspannRecall.noKind.returnedRows >= 1 and
                .cspannRecall.noKind.returnedRows <= 5) and
               (.cspannRecall.noKind.queryTemplateSha256 |
                 test("^[a-f0-9]{64}$")) and
               .cspannRecall.kind.servingPath ==
                 "public-kind-cspann" and
               .cspannRecall.kind.kind == "validation" and
               .cspannRecall.kind.view ==
                 "archon_public_memory_kind_recall" and
               .cspannRecall.kind.index ==
                 "idx_agent_memory_company_kind_scope_embedding" and
               .cspannRecall.kind.vectorSearchPlanned == true and
               .cspannRecall.kind.executed == true and
               .cspannRecall.kind.scopeVerified == true and
               .cspannRecall.kind.probeReturned == true and
               .cspannRecall.kind.scopedServingQueryVerified == true and
               .cspannRecall.kind.isolationCanariesRejected == 3 and
               (.cspannRecall.kind.returnedRows >= 1 and
                .cspannRecall.kind.returnedRows <= 5) and
               (.cspannRecall.kind.queryTemplateSha256 |
                 test("^[a-f0-9]{64}$")) and
               .resolutionLoop.fixedSyntheticScenario == true and
               .resolutionLoop.serializableTransactions == true and
               .resolutionLoop.databaseEnforcedTransitions == true and
               .resolutionLoop.exactTransitionFunctionExecute == true and
               .resolutionLoop.directResolutionDmlDenied == true and
               .resolutionLoop.approvePath == true and
               .resolutionLoop.rejectPath == true and
               .resolutionLoop.idempotentReplay == true and
               .resolutionLoop.conflictingFinalDecisionRejected == true and
               .resolutionLoop.receiptVerified == true and
               .resolutionLoop.receiptDatabaseDerived == true and
               .resolutionLoop.consolidationVerified == true and
               .resolutionLoop.canonicalMemoryUnchanged == true and
               .resolutionLoop.immutableDecisionTables == true and
               .resolutionLoop.deletePrivilegeAbsent == true and
               .resolutionLoop.externalSideEffects == "none" and
               .resolutionLoop.sessionIsolationBoundary ==
                 "trusted-lambda-bearer-token" and
               .resolutionLoop.retention == "cockroach-row-level-ttl" and
               (.resolutionLoop.approvedReceiptSha256 |
                 test("^[a-f0-9]{64}$")) and
               (.resolutionLoop.rejectedReceiptSha256 |
                 test("^[a-f0-9]{64}$")) and
               .resolutionLoop.approvedReceiptSha256 !=
                 .resolutionLoop.rejectedReceiptSha256
             )' \
            database-release-receipt.json
          unset ADMIN_SECRET DATABASE_URL

      - name: Upload sanitized database release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-release-${{ env.TARGET_SHA }}
          path: |
            database-endpoint-binding-receipt.json
            database-release-receipt.json
            legacy-reconciliation-receipt.json
          if-no-files-found: error
          retention-days: 90
