name: Rotate CockroachDB Runtime Credential

# Manual-only two-principal rotation. The workflow mutates one environment's
# runtime principal and Secrets Manager version labels, so every execution is
# bound to protected approval and an exact already-deployed green main SHA.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact runtime credential to rotate.
        required: true
        type: choice
        options:
          - staging
          - production
      target_sha:
        description: Exact 40-character current main SHA already deployed.
        required: true
        type: string
      propagation_timeout_seconds:
        description: Bounded convergence timeout from 90 through 600 seconds.
        required: true
        default: "240"
        type: string
      drain_grace_seconds:
        description: Grace before cancelling retired app sessions; 30 through 180 seconds.
        required: true
        default: "60"
        type: string
      confirmation:
        description: Enter ROTATE-STAGING-RUNTIME-CREDENTIAL or ROTATE-PRODUCTION-RUNTIME-CREDENTIAL.
        required: true
        type: string

concurrency:
  group: cockroach-production-database
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  APP_NAME: ${{ vars.AWS_APP_NAME || 'archon-memory' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: eu-west-1
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  TARGET_SHA: ${{ inputs.target_sha }}
  PROPAGATION_TIMEOUT_SECONDS: ${{ inputs.propagation_timeout_seconds }}
  DRAIN_GRACE_SECONDS: ${{ inputs.drain_grace_seconds }}
  STAGING_APPLICATION_URL: ${{ vars.AWS_STAGING_APPLICATION_URL }}
  PRODUCTION_APPLICATION_URL: ${{ vars.AWS_PRODUCTION_APPLICATION_URL || 'https://d2s5v0o0eg2aaw.cloudfront.net' }}

jobs:
  authorize:
    name: Authorize exact green deployed main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      application_url: ${{ steps.inputs.outputs.application_url }}
      deploy_run_id: ${{ steps.source.outputs.deploy_run_id }}
      deploy_run_attempt: ${{ steps.source.outputs.deploy_run_attempt }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact inputs and owned application
        id: inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,16}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$PROPAGATION_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]]
          test "$PROPAGATION_TIMEOUT_SECONDS" -ge 90
          test "$PROPAGATION_TIMEOUT_SECONDS" -le 600
          [[ "$DRAIN_GRACE_SECONDS" =~ ^[0-9]+$ ]]
          test "$DRAIN_GRACE_SECONDS" -ge 30
          test "$DRAIN_GRACE_SECONDS" -le 180

          case "$TARGET_ENVIRONMENT" in
            staging)
              application_url="$STAGING_APPLICATION_URL"
              expected="ROTATE-STAGING-RUNTIME-CREDENTIAL"
              ;;
            production)
              application_url="$PRODUCTION_APPLICATION_URL"
              expected="ROTATE-PRODUCTION-RUNTIME-CREDENTIAL"
              ;;
            *) exit 1 ;;
          esac
          test "$CONFIRMATION" = "$expected"
          [[ "$application_url" =~ ^https://[a-z0-9-]+\.cloudfront\.net$ ]]
          test "$application_url" != \
            "https://d111111abcdef8.cloudfront.net"
          echo "application_url=$application_url" >>"$GITHUB_OUTPUT"

      - name: Require current green main and successful exact deployment
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          prove_workflow() {
            local expected_name expected_path state workflow
            workflow="$1"
            expected_name="$2"
            expected_path="$3"
            state="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=push&per_page=100" |
                jq -er \
                  --arg sha "$TARGET_SHA" \
                  --arg name "$expected_name" \
                  --arg path "$expected_path" \
                  '
                    [
                      .workflow_runs[]
                      | select(
                          .head_sha == $sha
                          and .head_branch == "main"
                          and .event == "push"
                          and .name == $name
                          and .path == $path
                        )
                    ]
                    | sort_by(.run_number, .run_attempt)
                    | last
                    | select(.conclusion == "success")
                  '
            )"
            test "$(jq -r '.conclusion' <<<"$state")" = "success"
            printf '%s\n' "$state"
          }

          prove_workflow ci.yml CI .github/workflows/ci.yml >/dev/null
          prove_workflow codeql.yml CodeQL .github/workflows/codeql.yml \
            >/dev/null
          prove_workflow \
            supply-chain.yml "Supply Chain (enforced)" \
            .github/workflows/supply-chain.yml >/dev/null
          deploy="$(
            prove_workflow \
              deploy-aws.yml "Deploy AWS" \
              .github/workflows/deploy-aws.yml
          )"
          {
            echo "deploy_run_id=$(jq -er '.id' <<<"$deploy")"
            echo "deploy_run_attempt=$(jq -er '.run_attempt' <<<"$deploy")"
          } >>"$GITHUB_OUTPUT"

  rotate:
    name: Rotate, prove, drain, and retire
    needs: authorize
    runs-on: ubuntu-latest
    # The legal 600-second convergence bound must still leave a full bounded
    # rollback/convergence window plus receipt upload before job termination.
    timeout-minutes: 40
    environment: production-db
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      APPLICATION_URL: ${{ needs.authorize.outputs.application_url }}
      AWS_DATABASE_OPERATOR_ROLE_ARN: ${{ vars.AWS_DATABASE_OPERATOR_ROLE_ARN }}
      COCKROACH_CLUSTER_ID: ${{ vars.COCKROACH_CLUSTER_ID }}
      COCKROACH_ADMIN_SECRET_ID: ${{ vars.COCKROACH_ADMIN_SECRET_ID || 'archon-memory/operator/cockroach-admin' }}
      DEPLOY_RUN_ID: ${{ needs.authorize.outputs.deploy_run_id }}
      DEPLOY_RUN_ATTEMPT: ${{ needs.authorize.outputs.deploy_run_attempt }}
      ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Initialize fail-closed rotation receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="${RUNNER_TEMP:?}/database-credential-rotation-receipt.json"
          printf '%s\n' \
            '{"schema":"archon.cockroach-runtime-credential-rotation","schemaVersion":1,"ok":false,"result":"not-finalized"}' \
            >"$receipt"
          echo "ROTATION_RECEIPT=$receipt" >>"$GITHUB_ENV"

      - name: Check out authorized source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebind source, protected authority, and region
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$AWS_REGION" = "eu-west-1"
          test "$COCKROACH_ADMIN_SECRET_ID" = \
            "${APP_NAME}/operator/cockroach-admin"
          expected_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${APP_NAME}-github-database-operator"
          test "$AWS_DATABASE_OPERATOR_ROLE_ARN" = "$expected_role"
          test -n "$COCKROACH_CLUSTER_ID"

      - name: Configure short-lived database-operator credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DATABASE_OPERATOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 2400
          role-session-name: archon-db-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"ReadExactAdminCredential","Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:GetSecretValue"],"Resource":"arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:secret:${{ env.APP_NAME }}/operator/cockroach-admin-??????"},{"Sid":"RotateOnlySelectedRuntimeCredential","Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:GetSecretValue","secretsmanager:ListSecretVersionIds","secretsmanager:PutSecretValue","secretsmanager:UpdateSecretVersionStage"],"Resource":"arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:secret:${{ env.APP_NAME }}/${{ env.TARGET_ENVIRONMENT }}/database-??????"}]}

      - name: Prove account and Cockroach Cloud endpoint binding
        shell: bash
        env:
          CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CCLOUD_API_KEY"
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "$AWS_ACCOUNT_ID"
          cluster="${RUNNER_TEMP:?}/rotation-cluster.json"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
            "https://cockroachlabs.cloud/api/v1/clusters/$COCKROACH_CLUSTER_ID" \
            -H "Authorization: Bearer $CCLOUD_API_KEY" \
            -H "Cc-Version: 2024-09-16" >"$cluster"
          jq -e \
            --arg id "$COCKROACH_CLUSTER_ID" \
            '
              .id == $id
              and .cloud_provider == "AWS"
              and .plan == "BASIC"
              and .state == "CREATED"
              and ([.regions[] | select(
                .name == "eu-west-1" and .primary == true
              )] | length) == 1
              and ([.regions[] | select(
                .name == "eu-west-1" and .primary == true
              )][0].sql_dns |
                type == "string"
                and length <= 253
                and test("^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"))
              and ([.regions[] | select(.name == "us-west-2")] | length) == 0
            ' "$cluster" >/dev/null
          sql_dns="$(
            jq -er '[.regions[] | select(
              .name == "eu-west-1" and .primary == true
            )][0].sql_dns' "$cluster"
          )"
          printf 'COCKROACH_SQL_DNS=%s\n' "$sql_dns" >>"$GITHUB_ENV"

      - name: Execute two-principal rotation without exposing material
        id: rotate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runtime_secret_id="${APP_NAME}/${TARGET_ENVIRONMENT}/database"
          admin_secret="$(
            aws secretsmanager get-secret-value \
              --secret-id "$COCKROACH_ADMIN_SECRET_ID" \
              --version-stage AWSCURRENT \
              --region "$AWS_REGION" \
              --query SecretString --output text
          )"
          if [[ "$admin_secret" == postgres://* ||
                "$admin_secret" == postgresql://* ]]; then
            admin_url="$admin_secret"
          else
            admin_url="$(jq -er '.DATABASE_URL' <<<"$admin_secret")"
          fi
          echo "::add-mask::$admin_url"
          candidate="${RUNNER_TEMP:?}/database-credential-rotation-candidate.json"
          # From this point a runner SIGKILL/OOM can interrupt provider
          # mutation before the script serializes its structured catch receipt.
          # Persist a conservative marker first; only the script may replace it
          # with a proved success or a reconciled phase-specific failure.
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg generatedAt "$generated_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg releaseSha "$TARGET_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployRunId "$DEPLOY_RUN_ID" \
            --arg deployRunAttempt "$DEPLOY_RUN_ATTEMPT" \
            '{
              schema: "archon.cockroach-runtime-credential-rotation",
              schemaVersion: 1,
              ok: false,
              result: "failed",
              generatedAt: $generatedAt,
              repository: $repository,
              releaseSha: $releaseSha,
              environment: $environment,
              region: "eu-west-1",
              workflow: {
                runId: ($workflowRunId | tonumber),
                runAttempt: ($workflowRunAttempt | tonumber)
              },
              sourceDeployment: {
                runId: ($deployRunId | tonumber),
                runAttempt: ($deployRunAttempt | tonumber)
              },
              failure: {
                phase: "script-execution-started",
                errorCode: "ROTATION_INTERRUPTED_STATE_UNKNOWN",
                providerDetailsRedacted: true,
                recovery: {
                  result: "operator-review-required",
                  rollback: "operator-review",
                  cleanup: "operator-review",
                  operatorReviewRequired: true
                }
              },
              secret: {
                identifiersRedacted: true,
                materialPrinted: false
              },
              safety: {
                canonicalMemoryMutated: false,
                applicationDataMutated: false,
                crossRegionWorkloadCreated: false
              }
            }' >"$ROTATION_RECEIPT"
          APP_ENV="$TARGET_ENVIRONMENT" \
          DATABASE_SECRET_ID="$runtime_secret_id" \
          DATABASE_URL="$admin_url" \
          RELEASE_SHA="$TARGET_SHA" \
          ROTATION_PROPAGATION_TIMEOUT_SECONDS="$PROPAGATION_TIMEOUT_SECONDS" \
          ROTATION_DRAIN_GRACE_SECONDS="$DRAIN_GRACE_SECONDS" \
            npm run --silent aws:rotate-runtime-secret >"$candidate" &
          rotation_pid="$!"
          set +e
          wait "$rotation_pid"
          rotation_exit="$?"
          set -e
          unset admin_secret admin_url runtime_secret_id
          test -s "$candidate"
          jq -e \
            '.schema == "archon.cockroach-runtime-credential-rotation"
              and .schemaVersion == 1
              and (.ok | type) == "boolean"
              and .secret.identifiersRedacted == true
              and .secret.materialPrinted == false' \
            "$candidate" >/dev/null

          finalized="${RUNNER_TEMP:?}/database-credential-rotation-final.json"
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployRunId "$DEPLOY_RUN_ID" \
            --arg deployRunAttempt "$DEPLOY_RUN_ATTEMPT" \
            '
              . + {
                repository: $repository,
                workflow: {
                  runId: ($workflowRunId | tonumber),
                  runAttempt: ($workflowRunAttempt | tonumber)
                },
                sourceDeployment: {
                  runId: ($deployRunId | tonumber),
                  runAttempt: ($deployRunAttempt | tonumber)
                }
              }
            ' "$candidate" >"$finalized"
          mv "$finalized" "$ROTATION_RECEIPT"
          rm -f "$candidate"
          if [ "$rotation_exit" -ne 0 ]; then
            exit "$rotation_exit"
          fi
          jq -e \
            --arg sha "$TARGET_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            '
              .schema
                == "archon.cockroach-runtime-credential-rotation"
              and .schemaVersion == 1
              and .ok == true
              and .result == "cutover-and-retirement-complete"
              and .releaseSha == $sha
              and .environment == $environment
              and .region == "eu-west-1"
              and .principals.pendingCredentialSqlProved == true
              and .principals.oldLoginRejected == true
              and .principals.oldSessionsDrained == true
              and .principals.oldPrincipalDropped == true
              and .secret.awspendingRemoved == true
              and .secret.materialPrinted == false
              and .safety.canonicalMemoryMutated == false
              and .safety.applicationDataMutated == false
              and .safety.crossRegionWorkloadCreated == false
            ' "$ROTATION_RECEIPT" >/dev/null

      - name: Preserve exact context for any interrupted failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          candidate="${RUNNER_TEMP:?}/database-credential-rotation-candidate.json"
          if jq -e \
              '.schema == "archon.cockroach-runtime-credential-rotation"
                and .schemaVersion == 1
                and (.ok | type) == "boolean"
                and .secret.identifiersRedacted == true
                and .secret.materialPrinted == false' \
              "$candidate" >/dev/null 2>&1; then
            finalized="${RUNNER_TEMP:?}/database-credential-rotation-recovered.json"
            jq \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflowRunId "$GITHUB_RUN_ID" \
              --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg deployRunId "$DEPLOY_RUN_ID" \
              --arg deployRunAttempt "$DEPLOY_RUN_ATTEMPT" \
              '. + {
                repository: $repository,
                workflow: {
                  runId: ($workflowRunId | tonumber),
                  runAttempt: ($workflowRunAttempt | tonumber)
                },
                sourceDeployment: {
                  runId: ($deployRunId | tonumber),
                  runAttempt: ($deployRunAttempt | tonumber)
                }
              }' "$candidate" >"$finalized"
            mv "$finalized" "$ROTATION_RECEIPT"
            rm -f "$candidate"
          elif jq -e '.result == "not-finalized"' \
              "$ROTATION_RECEIPT" >/dev/null; then
            generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            jq -n \
              --arg generatedAt "$generated_at" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg releaseSha "$TARGET_SHA" \
              --arg environment "$TARGET_ENVIRONMENT" \
              --arg workflowRunId "$GITHUB_RUN_ID" \
              --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              '{
                schema: "archon.cockroach-runtime-credential-rotation",
                schemaVersion: 1,
                ok: false,
                result: "failed",
                generatedAt: $generatedAt,
                repository: $repository,
                releaseSha: $releaseSha,
                environment: $environment,
                region: "eu-west-1",
                workflow: {
                  runId: ($workflowRunId | tonumber),
                  runAttempt: ($workflowRunAttempt | tonumber)
                },
                failure: {
                  phase: "workflow-preflight",
                  errorCode: "ROTATION_WORKFLOW_PREFLIGHT_FAILED",
                  providerDetailsRedacted: true,
                  recovery: {
                    result: "no-script-mutation-observed",
                    rollback: "not-required",
                    cleanup: "not-required",
                    operatorReviewRequired: false
                  }
                },
                secret: {
                  identifiersRedacted: true,
                  materialPrinted: false
                },
                safety: {
                  canonicalMemoryMutated: false,
                  applicationDataMutated: false,
                  crossRegionWorkloadCreated: false
                }
              }' >"$ROTATION_RECEIPT"
          fi

      - name: Attest the sanitized exact-SHA rotation receipt
        if: always()
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/database-credential-rotation-receipt.json

      - name: Upload the sanitized rotation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-credential-rotation-${{ inputs.environment }}-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/database-credential-rotation-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce finalized rotation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg sha "$TARGET_SHA" \
            --arg environment "$TARGET_ENVIRONMENT" \
            '
              .schema
                == "archon.cockroach-runtime-credential-rotation"
              and .schemaVersion == 1
              and .ok == true
              and .releaseSha == $sha
              and .environment == $environment
              and .repository == "upgradedev/archon-cockroach-memory"
            ' "$ROTATION_RECEIPT" >/dev/null
