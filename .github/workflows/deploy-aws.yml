name: Deploy AWS

# Third-party actions and runtime inputs are immutable. The deployment checks
# starts from a trusted main push, waits for the exact same-SHA CI run, builds
# once, verifies the receipt in every environment, then promotes that candidate.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: The only manual mode is the protected staging recovery drill.
        required: true
        type: choice
        options:
          - staging-recovery-drill
      target_sha:
        description: Exact current main SHA already green in required pipelines.
        required: true
        type: string
      approval_reference:
        description: Non-secret approved drill/change reference; retained only as SHA-256.
        required: true
        type: string
      confirmation:
        description: Enter FAULT-INJECT-STAGING-RECOVERY-AND-REQUIRE-WATCHDOG.
        required: true
        type: string

concurrency:
  group: aws-production-delivery
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  APP_NAME: ${{ vars.AWS_APP_NAME || 'archon-memory' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  BEDROCK_REGION: ${{ vars.BEDROCK_REGION || 'eu-west-1' }}
  BEDROCK_EMBED_MODEL_ID: ${{ vars.BEDROCK_EMBED_MODEL_ID || 'amazon.titan-embed-text-v2:0' }}
  BEDROCK_NARRATOR_MODEL_ID: ${{ vars.BEDROCK_NARRATOR_MODEL_ID || 'eu.anthropic.claude-sonnet-4-6' }}
  DEPLOY_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'release' }}
  RECOVERY_DRILL_TOKEN: ${{ github.event_name == 'workflow_dispatch' && format('drill-{0}-{1}', github.run_id, github.run_attempt) || 'disabled' }}

jobs:
  source-gate:
    name: Validate Deploy AWS source CI
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.source_ci.outputs.run_id }}
      ci_run_attempt: ${{ steps.source_ci.outputs.run_attempt }}
      memory_evaluation_receipt_base64: ${{ steps.memory_evaluation.outputs.receipt_base64 }}
      memory_evaluation_run_id: ${{ steps.memory_evaluation.outputs.run_id }}
      memory_evaluation_run_attempt: ${{ steps.memory_evaluation.outputs.run_attempt }}
      supply_chain_run_id: ${{ steps.supply_chain.outputs.run_id }}
      supply_chain_run_attempt: ${{ steps.supply_chain.outputs.run_attempt }}
      foundation_control_run_id: ${{ steps.control_receipts.outputs.foundation_run_id }}
      foundation_control_run_attempt: ${{ steps.control_receipts.outputs.foundation_run_attempt }}
      staging_edge_control_run_id: ${{ steps.control_receipts.outputs.staging_edge_run_id }}
      staging_edge_control_run_attempt: ${{ steps.control_receipts.outputs.staging_edge_run_attempt }}
      production_edge_control_run_id: ${{ steps.control_receipts.outputs.production_edge_run_id }}
      production_edge_control_run_attempt: ${{ steps.control_receipts.outputs.production_edge_run_attempt }}
    steps:
      - name: Require successful exact-main push CI source
        id: source_ci
        shell: bash
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference || '' }}
          DEPLOY_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          DRILL_CONFIRMATION: ${{ inputs.confirmation || '' }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REPOSITORY" = \
            "upgradedev/archon-cockroach-memory"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$DEPLOY_TARGET_SHA" = "$EXPECTED_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$DEPLOY_OPERATION" = "release"
              test "$RECOVERY_DRILL_TOKEN" = "disabled"
              test -z "$APPROVAL_REFERENCE"
              test -z "$DRILL_CONFIRMATION"
              ;;
            workflow_dispatch)
              test "$DEPLOY_OPERATION" = "staging-recovery-drill"
              test "$DRILL_CONFIRMATION" = \
                "FAULT-INJECT-STAGING-RECOVERY-AND-REQUIRE-WATCHDOG"
              [[ "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
              test "$RECOVERY_DRILL_TOKEN" = \
                "drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              ;;
            *)
              echo "Deploy AWS accepts only a main push or its exact protected staging drill dispatch." >&2
              exit 1
              ;;
          esac
          for _ in {1..180}; do
            run="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=20" |
                jq -cer --arg sha "$EXPECTED_SHA" '
                  [
                    .workflow_runs[] |
                    select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push" and
                      .name == "CI" and
                      .path == ".github/workflows/ci.yml"
                    )
                  ] |
                  sort_by(.updated_at, .run_number, .run_attempt) |
                  last // {}
                '
            )"
            state="$(
              jq -r '
                if .id == null then "missing"
                elif .conclusion != null then .conclusion
                else .status
                end
              ' <<<"$run"
            )"
            case "$state" in
              success)
                run_id="$(jq -er '.id' <<<"$run")"
                run_attempt="$(jq -er '.run_attempt' <<<"$run")"
                [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
                [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
                {
                  echo "run_id=$run_id"
                  echo "run_attempt=$run_attempt"
                } >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale|neutral|skipped)
                echo "CI did not pass for release SHA $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
              missing|queued|in_progress|pending|requested|waiting)
                sleep 15
                ;;
              *)
                echo "Unexpected CI state for release SHA $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
            esac
          done
          echo "CI did not complete for release SHA $EXPECTED_SHA." >&2
          exit 1

      - name: Require successful exact-SHA Supply Chain evidence
        id: supply_chain
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          for _ in {1..180}; do
            run="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/supply-chain.yml/runs?branch=main&event=push&per_page=20" |
                jq -cer --arg sha "$EXPECTED_SHA" '
                  [
                    .workflow_runs[] |
                    select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push" and
                      .path == ".github/workflows/supply-chain.yml"
                    )
                  ] |
                  sort_by(.updated_at, .run_number, .run_attempt) |
                  last // {}
                '
            )"
            state="$(
              jq -r '
                if .id == null then "missing"
                elif .conclusion != null then .conclusion
                else .status
                end
              ' <<<"$run"
            )"
            case "$state" in
              success)
                run_id="$(jq -er '.id' <<<"$run")"
                run_attempt="$(jq -er '.run_attempt' <<<"$run")"
                [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
                [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
                echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
                echo "run_attempt=$run_attempt" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale|neutral|skipped)
                echo "Supply Chain did not pass for release SHA $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
              missing|queued|in_progress|pending|requested|waiting)
                sleep 15
                ;;
              *)
                echo "Unexpected Supply Chain state for $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
            esac
          done
          echo "Supply Chain did not complete for release SHA $EXPECTED_SHA." >&2
          exit 1

      - name: Require successful exact-SHA Memory architecture evaluation
        id: memory_evaluation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          for _ in {1..160}; do
            run="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/memory-evaluation.yml/runs?branch=main&event=push&per_page=20" |
                jq -cer --arg sha "$EXPECTED_SHA" '
                  [
                    .workflow_runs[] |
                    select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push" and
                      .name == "Memory architecture evaluation" and
                      .path == ".github/workflows/memory-evaluation.yml"
                    )
                  ] |
                  sort_by(.updated_at, .run_number, .run_attempt) |
                  last // {}
                '
            )"
            state="$(
              jq -r '
                if .id == null then "missing"
                elif .conclusion != null then .conclusion
                else .status
                end
              ' <<<"$run"
            )"
            case "$state" in
              success)
                run_id="$(jq -er '.id' <<<"$run")"
                run_attempt="$(jq -er '.run_attempt' <<<"$run")"
                [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
                [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
                jobs="$(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}/attempts/${run_attempt}/jobs?per_page=100"
                )"
                jq -e \
                  --arg sha "$EXPECTED_SHA" \
                  --argjson runId "$run_id" \
                  --argjson runAttempt "$run_attempt" '
                    [
                      .jobs[] |
                      select(
                        .name ==
                          "Longitudinal, scale, and C-SPANN evidence"
                      )
                    ] as $matches |
                    ($matches | length) == 1 and
                    $matches[0].run_id == $runId and
                    $matches[0].run_attempt == $runAttempt and
                    $matches[0].head_sha == $sha and
                    $matches[0].status == "completed" and
                    $matches[0].conclusion == "success"
                  ' <<<"$jobs" >/dev/null

                evaluation_dir="${RUNNER_TEMP:?}/memory-evaluation-${run_id}-${run_attempt}"
                artifact_name="memory-evaluation-${EXPECTED_SHA}-${run_id}-${run_attempt}"
                mkdir -p "$evaluation_dir"
                gh run download "$run_id" \
                  --repo "$GITHUB_REPOSITORY" \
                  --name "$artifact_name" \
                  --dir "$evaluation_dir"
                receipt="$evaluation_dir/memory-evaluation-receipt.json"
                test -f "$receipt"
                test ! -L "$receipt"
                jq -e \
                  --arg sha "$EXPECTED_SHA" \
                  --arg runId "$run_id" \
                  --arg runAttempt "$run_attempt" '
                    .schemaVersion == "1.0.0" and
                    .source == {
                      "repository":"upgradedev/archon-cockroach-memory",
                      "sha":$sha,
                      "workflow":"Memory architecture evaluation",
                      "runId":$runId,
                      "runAttempt":$runAttempt,
                      "eventName":"push"
                    } and
                    (.generatedAt |
                      type == "string" and
                      test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")) and
                    [.artifacts[].file] == [
                      "policy-results.json",
                      "scale-manifest.json",
                      "vector-results.json",
                      "vector-benchmark.log"
                    ] and
                    .gates == {
                      "policy":true,
                      "representativeScale":true,
                      "cspannVersusExact":true,
                      "exactShaBound":true
                    } and
                    .claims.supported == [
                      "deterministic-longitudinal-policy-evaluation",
                      "B0-through-B4-fair-fixture-comparison",
                      "lifecycle-ablation-study",
                      "representative-100k-plus-event-rehearsal",
                      "unauthorized-actions-zero-in-B4-and-scale-rehearsal",
                      "real-cockroachdb-cspann-recall-versus-exact-ground-truth"
                    ] and
                    .claims.notSupportedByThisReceipt == [
                      "real-customer-production-corpus",
                      "human-evaluation-results",
                      "production-business-impact",
                      "hosted-load-or-SLA-results",
                      "exact-scan-latency-comparison"
                    ] and
                    .receipt.algorithm == "sha256" and
                    (.receipt.digest | test("^[a-f0-9]{64}$"))
                  ' "$receipt" >/dev/null
                while IFS=$'\t' read -r file expected_digest; do
                  [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
                  [[ "$expected_digest" =~ ^[a-f0-9]{64}$ ]]
                  test -f "$evaluation_dir/$file"
                  test ! -L "$evaluation_dir/$file"
                  actual_digest="$(
                    sha256sum "$evaluation_dir/$file" | awk '{print $1}'
                  )"
                  test "$actual_digest" = "$expected_digest"
                done < <(
                  jq -r '.artifacts[] | [.file,.sha256] | @tsv' "$receipt"
                )
                expected_receipt_digest="$(jq -er '.receipt.digest' "$receipt")"
                canonical_body="$(jq -cS 'del(.receipt)' "$receipt")"
                actual_receipt_digest="$(
                  printf '%s' "$canonical_body" | sha256sum | awk '{print $1}'
                )"
                test "$actual_receipt_digest" = "$expected_receipt_digest"
                receipt_base64="$(base64 -w0 "$receipt")"
                [[ "$receipt_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
                echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
                echo "run_attempt=$run_attempt" >>"$GITHUB_OUTPUT"
                echo "receipt_base64=$receipt_base64" >>"$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale|neutral|skipped)
                echo "Memory architecture evaluation did not pass for $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
              missing|queued|in_progress|pending|requested|waiting)
                sleep 15
                ;;
              *)
                echo "Unexpected Memory architecture evaluation state for $EXPECTED_SHA: $state" >&2
                exit 1
                ;;
            esac
          done
          echo "Memory architecture evaluation did not complete for $EXPECTED_SHA." >&2
          exit 1

      - name: Require exact-SHA foundation and edge-control receipts
        id: control_receipts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          evidence_root="${RUNNER_TEMP:?}/aws-control-plane-prerequisites"
          mkdir -p "$evidence_root"
          EDGE_CONTROL_RUNS=

          prove_foundation_receipt() {
            local artifact artifacts candidate conclusion destination
            local expected_name head_sha id operation receipt run_attempt runs
            if ! runs="$(
                gh api \
                  --paginate \
                  --slurp \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/foundation-migration.yml/runs?per_page=100"
              )"; then
              return 1
            fi
            if ! candidate="$(
                jq -er \
                  '
                    [
                      .[].workflow_runs[]
                      | select(
                          (.head_sha | test("^[0-9a-f]{40}$"))
                          and .head_branch == "main"
                          and .event == "workflow_dispatch"
                          and .name == "Foundation Storage Migration"
                          and .path
                            == ".github/workflows/foundation-migration.yml"
                          and (
                            .head_sha as $head
                            | .display_title == ("Foundation plan " + $head)
                            or .display_title == ("Foundation apply " + $head)
                            or .display_title == ("Foundation verify " + $head)
                            or .display_title == ("Foundation abort " + $head)
                            or .display_title == ("Foundation retire " + $head)
                          )
                        )
                      | . + {
                          evidenceOperation: (
                            .display_title | split(" ")[1]
                          )
                        }
                    ]
                    | sort_by(.updated_at, .run_number, .run_attempt)
                    | last
                    | select(. != null)
                    | [
                        .id,
                        .run_attempt,
                        (.conclusion // "pending"),
                        .evidenceOperation,
                        .head_sha
                      ]
                    | @tsv
                  ' <<<"$runs" 2>/dev/null
              )"; then
              return 1
            fi
            IFS=$'\t' read -r id run_attempt conclusion operation head_sha \
              <<<"$candidate"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || return 1
            if [ "$head_sha" != "$EXPECTED_SHA" ]; then
              CONTROL_RECEIPT_SUPERSEDED=true
              return 1
            fi
            [ "$operation" = "verify" ] || return 1
            [ "$conclusion" = "success" ] || return 1
            expected_name="foundation-storage-migration-verify-${EXPECTED_SHA}-${id}-${run_attempt}"
            if ! artifacts="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/${id}/artifacts?per_page=100"
              )"; then
              return 1
            fi
            if ! artifact="$(
                jq -er \
                  --arg name "$expected_name" \
                  '[.artifacts[] | select(.name == $name and .expired == false)]
                    | select(length == 1)
                    | .[0].name' \
                  <<<"$artifacts" 2>/dev/null
              )"; then
              return 1
            fi
            [ "$artifact" = "$expected_name" ] || return 1
            if ! destination="$(
                mktemp -d \
                  "$evidence_root/foundation-${id}-${run_attempt}-XXXXXX"
              )"; then
              return 1
            fi
            if ! gh run download "$id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact" \
                --dir "$destination"; then
              return 1
            fi
            receipt="$destination/foundation-storage-migration-receipt.json"
            [ -f "$receipt" ] || return 1
            if ! jq -e \
                --arg sha "$EXPECTED_SHA" \
                '
                  .schema
                    == "archon.aws.foundation-storage-migration"
                  and .schemaVersion == 1
                  and .ok == true
                  and .operation == "verify"
                  and .result == "already-current"
                  and .commit == $sha
                  and .proof.storage.ok == true
                  and .proof.storage.migrationAuthority.retired
                    == true
                  and .proof.storage.migrationAuthority.selfDeletionAllowed
                    == false
                  and .proof.storage.foundationAuthorityRetirement.cloudFormationServiceRoleBound
                    == true
                  and .proof.storage.foundationAuthorityRetirement.controllerExecutionRoleSeparated
                    == true
                  and .proof.storage.foundationAuthorityRetirement.controllerAttachmentContractVerified
                    == true
                  and .proof.storage.foundationAuthorityRetirement.executionAttachmentContractVerified
                    == true
                  and .proof.storage.foundationAuthorityRetirement.unexpectedAttachmentsFailClosed
                    == true
                  and .proof.storage.foundationAuthorityRetirement.cloudFormationDriftInSync
                    == true
                  and (.proof.storage.foundationAuthorityRetirement.controllerRoleIdSha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.executionRoleIdSha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.controllerInventorySha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.executionInventorySha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.controllerPolicySha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.executionPolicySha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.controllerDriftSha256
                    | test("^[0-9a-f]{64}$"))
                  and (.proof.storage.foundationAuthorityRetirement.executionDriftSha256
                    | test("^[0-9a-f]{64}$"))
                  and .proof.storage.foundationAuthorityRetirement.selfDeletion
                    == false
                  and .proof.accessLogging.ok == true
                ' "$receipt" >/dev/null; then
              return 1
            fi
            PROVED_FOUNDATION_RUN_ID="$id"
            PROVED_FOUNDATION_RUN_ATTEMPT="$run_attempt"
            return 0
          }

          prove_edge_receipt() {
            local artifact artifacts candidate conclusion destination
            local environment expected_name head_sha id operation receipt
            local run_attempt
            environment="$1"
            [[ "$environment" =~ ^(staging|production)$ ]] || return 1
            if ! candidate="$(
                jq -er \
                  --arg environment "$environment" \
                  '
                    [
                      .[].workflow_runs[]
                      | select(
                          (.head_sha | test("^[0-9a-f]{40}$"))
                          and .head_branch == "main"
                          and .event == "workflow_dispatch"
                          and .name == "Manage AWS Edge Controls"
                          and .path == ".github/workflows/edge-controls.yml"
                          and (
                            .head_sha as $head
                            | .display_title ==
                              ("Edge " + $environment + " plan " + $head)
                            or .display_title ==
                              ("Edge " + $environment + " apply " + $head)
                            or .display_title ==
                              ("Edge " + $environment + " verify " + $head)
                            or .display_title ==
                              ("Edge " + $environment + " cleanup " + $head)
                            or .display_title ==
                              ("Edge " + $environment + " finalize " + $head)
                          )
                        )
                      | . + {
                          evidenceOperation: (
                            .display_title | split(" ")[2]
                          )
                        }
                    ]
                    | sort_by(.updated_at, .run_number, .run_attempt)
                    | last
                    | select(. != null)
                    | [
                        .id,
                        .run_attempt,
                        (.conclusion // "pending"),
                        .evidenceOperation,
                        .head_sha
                      ]
                    | @tsv
                  ' <<<"$EDGE_CONTROL_RUNS" 2>/dev/null
              )"; then
              return 1
            fi
            IFS=$'\t' read -r id run_attempt conclusion operation head_sha \
              <<<"$candidate"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || return 1
            if [ "$head_sha" != "$EXPECTED_SHA" ]; then
              CONTROL_RECEIPT_SUPERSEDED=true
              return 1
            fi
            [[ "$operation" =~ ^(verify|apply)$ ]] || return 1
            [ "$conclusion" = "success" ] || return 1
            if ! artifacts="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/${id}/artifacts?per_page=100"
              )"; then
              return 1
            fi
            expected_name="edge-controls-${environment}-${operation}-${EXPECTED_SHA}-${id}-${run_attempt}"
            if ! artifact="$(
                jq -er \
                  --arg name "$expected_name" \
                  '[.artifacts[] | select(.name == $name and .expired == false)]
                    | select(length == 1)
                    | .[0].name' \
                  <<<"$artifacts" 2>/dev/null
              )"; then
              return 1
            fi
            [ "$artifact" = "$expected_name" ] || return 1
            if ! destination="$(
                mktemp -d \
                  "$evidence_root/edge-${environment}-${id}-${run_attempt}-XXXXXX"
              )"; then
              return 1
            fi
            if ! gh run download "$id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact" \
                --dir "$destination"; then
              return 1
            fi
            receipt="$destination/edge-controls-receipt.json"
            [ -f "$receipt" ] || return 1
            if ! jq -e \
                  --arg sha "$EXPECTED_SHA" \
                  --arg environment "$environment" \
                  --arg operation "$operation" \
                  '
                    .schema == "archon.aws.edge-controls"
                    and .schemaVersion == 1
                    and .ok == true
                    and .operation == $operation
                    and (
                      .result == "verified"
                      or .result == "applied-and-proved"
                      or .result == "apply-finalized-and-proved"
                    )
                    and .environment == $environment
                    and .commit == $sha
                    and .proof.live == true
                    and .proof.scope == "CLOUDFRONT"
                    and .proof.controlPlaneRegion == "us-east-1"
                    and .proof.accountBound == true
                    and .proof.nameBound == true
                    and .proof.tagsBound == true
                    and (
                      .proof.webAclArnSha256
                      | test("^[0-9a-f]{64}$")
                    )
                    and (
                      .proof.webAclIdSha256
                      | test("^[0-9a-f]{64}$")
                    )
                    and (has("webAclArn") | not)
                    and (has("webAclId") | not)
                  ' "$receipt" >/dev/null; then
              return 1
            fi
            if [ "$environment" = "staging" ]; then
              PROVED_STAGING_EDGE_RUN_ID="$id"
              PROVED_STAGING_EDGE_RUN_ATTEMPT="$run_attempt"
            else
              PROVED_PRODUCTION_EDGE_RUN_ID="$id"
              PROVED_PRODUCTION_EDGE_RUN_ATTEMPT="$run_attempt"
            fi
            return 0
          }

          CONTROL_RECEIPT_SUPERSEDED=false
          for _ in {1..180}; do
            if ! EDGE_CONTROL_RUNS="$(
                gh api \
                  --paginate \
                  --slurp \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/edge-controls.yml/runs?per_page=100"
              )"; then
              EDGE_CONTROL_RUNS='[]'
            fi
            PROVED_FOUNDATION_RUN_ID=
            PROVED_FOUNDATION_RUN_ATTEMPT=
            PROVED_STAGING_EDGE_RUN_ID=
            PROVED_STAGING_EDGE_RUN_ATTEMPT=
            PROVED_PRODUCTION_EDGE_RUN_ID=
            PROVED_PRODUCTION_EDGE_RUN_ATTEMPT=
            foundation_ready=false
            staging_ready=false
            production_ready=false
            if prove_foundation_receipt; then
              foundation_ready=true
            fi
            if prove_edge_receipt staging; then
              staging_ready=true
            fi
            if prove_edge_receipt production; then
              production_ready=true
            fi
            if [ "$CONTROL_RECEIPT_SUPERSEDED" = "true" ]; then
              echo "A newer foundation or edge-control run superseded $EXPECTED_SHA." >&2
              exit 1
            fi
            if [ "$foundation_ready" = "true" ] &&
                [ "$staging_ready" = "true" ] &&
                [ "$production_ready" = "true" ]; then
              current_main="$(
                gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main"
              )"
              jq -e \
                --arg sha "$EXPECTED_SHA" '
                  .ref == "refs/heads/main"
                  and .object.type == "commit"
                  and .object.sha == $sha
                ' <<<"$current_main" >/dev/null
              {
                echo "foundation_run_id=$PROVED_FOUNDATION_RUN_ID"
                echo "foundation_run_attempt=$PROVED_FOUNDATION_RUN_ATTEMPT"
                echo "staging_edge_run_id=$PROVED_STAGING_EDGE_RUN_ID"
                echo "staging_edge_run_attempt=$PROVED_STAGING_EDGE_RUN_ATTEMPT"
                echo "production_edge_run_id=$PROVED_PRODUCTION_EDGE_RUN_ID"
                echo "production_edge_run_attempt=$PROVED_PRODUCTION_EDGE_RUN_ATTEMPT"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Foundation and edge-control receipts are incomplete for $EXPECTED_SHA." >&2
          exit 1

  build-once:
    name: Verify CI SHA and build once
    needs:
      - source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact successful CI commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the CI SHA is still the main branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$EXPECTED_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download the exact-SHA Supply Chain release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-release-${{ github.sha }}-${{ needs.source-gate.outputs.supply_chain_run_id }}-${{ needs.source-gate.outputs.supply_chain_run_attempt }}
          path: ${{ runner.temp }}/supply-chain-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.source-gate.outputs.supply_chain_run_id }}

      - name: Verify exact-SHA Supply Chain receipt and attestation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ needs.source-gate.outputs.supply_chain_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.source-gate.outputs.supply_chain_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/supply-chain-release/supply-chain-release-receipt.json"
          evidence_manifest="${RUNNER_TEMP:?}/supply-chain-release/evidence-manifest.sha256"
          lambda_manifest="${RUNNER_TEMP:?}/supply-chain-release/lambda-zip-content.sha256"
          sbom_manifest="${RUNNER_TEMP:?}/supply-chain-release/sbom-inputs-and-documents.sha256"
          for file in \
            "$receipt" \
            "$evidence_manifest" \
            "$lambda_manifest" \
            "$sbom_manifest"; do
            test -f "$file"
            test ! -L "$file"
            test -s "$file"
          done
          evidence_manifest_sha256="$(
            sha256sum "$evidence_manifest" | awk '{print $1}'
          )"
          lambda_manifest_sha256="$(
            sha256sum "$lambda_manifest" | awk '{print $1}'
          )"
          sbom_manifest_sha256="$(
            sha256sum "$sbom_manifest" | awk '{print $1}'
          )"
          waiver_ledger_sha256="$(
            sha256sum security/waivers.yml | awk '{print $1}'
          )"
          jq -e \
            --arg sourceSha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_RUN_ID" \
            --arg runAttempt "$EXPECTED_RUN_ATTEMPT" \
            --arg evidenceManifestSha256 "$evidence_manifest_sha256" \
            --arg lambdaManifestSha256 "$lambda_manifest_sha256" \
            --arg sbomManifestSha256 "$sbom_manifest_sha256" \
            --arg waiverLedgerSha256 "$waiver_ledger_sha256" '
              keys == [
                "enforcement",
                "evidence",
                "passed",
                "repository",
                "schema",
                "sourceSha",
                "version",
                "workflow"
              ] and
              .schema == "archon.supply-chain.release-evidence" and
              .version == 1 and
              .sourceSha == $sourceSha and
              .repository == "upgradedev/archon-cockroach-memory" and
              .workflow == {
                "name":"Supply Chain (enforced)",
                "path":".github/workflows/supply-chain.yml",
                "event":"push",
                "ref":"refs/heads/main",
                "runId":$runId,
                "runAttempt":$runAttempt
              } and
              .passed == true and
              .enforcement.mode ==
                "blocking-zero-unwaived-findings" and
              .enforcement.blocks == [
                "shellcheck-warning-or-higher",
                "actionlint-workflow-and-inline-shell",
                "zizmor-regular-persona",
                "cfn-lint-all-current-templates",
                "sam-validate-lint-and-build",
                "cloudformation-guard-current-templates",
                "trivy-iac-medium-or-higher",
                "trivy-sbom-vulnerability-and-license-policy"
              ] and
              .enforcement.acceptedWaivers == 0 and
              .enforcement.unwaivedFindings == 0 and
              .evidence.cloudFormationTemplates == [
                "aws/template.yaml",
                "aws/bootstrap-oidc.yaml",
                "aws/edge-waf.yaml",
                "aws/finops.yaml"
              ] and
              .evidence.manifestSha256 == $evidenceManifestSha256 and
              .evidence.lambdaContentManifestSha256 ==
                $lambdaManifestSha256 and
              .evidence.sbomDocumentsManifestSha256 ==
                $sbomManifestSha256 and
              .evidence.waiverLedgerSha256 == $waiverLedgerSha256
            ' "$receipt" >/dev/null
          gh attestation verify "$receipt" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          install -m 0600 "$receipt" supply-chain-release-receipt.json

      - name: Bind exact-SHA Memory architecture evaluation receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ needs.source-gate.outputs.memory_evaluation_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.source-gate.outputs.memory_evaluation_run_attempt }}
          RECEIPT_BASE64: ${{ needs.source-gate.outputs.memory_evaluation_receipt_base64 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECEIPT_BASE64" =~ ^[A-Za-z0-9+/=]+$ ]]
          printf '%s' "$RECEIPT_BASE64" |
            base64 --decode > memory-evaluation-receipt.json
          test -s memory-evaluation-receipt.json
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_RUN_ID" \
            --arg runAttempt "$EXPECTED_RUN_ATTEMPT" '
              .schemaVersion == "1.0.0" and
              .source.sha == $sha and
              .source.repository ==
                "upgradedev/archon-cockroach-memory" and
              .source.workflow == "Memory architecture evaluation" and
              .source.eventName == "push" and
              .source.runId == $runId and
              .source.runAttempt == $runAttempt and
              .gates == {
                "policy":true,
                "representativeScale":true,
                "cspannVersusExact":true,
                "exactShaBound":true
              } and
              (.receipt.digest | test("^[a-f0-9]{64}$"))
            ' memory-evaluation-receipt.json >/dev/null

      - name: Prove CodeQL succeeded for the exact release SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in {1..20}; do
            CODEQL_STATE="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?branch=main&event=push&per_page=20" |
                jq -r --arg sha "$EXPECTED_SHA" '
                  [.workflow_runs[] | select(.head_sha == $sha)][0] |
                  if . == null then "missing"
                  elif .conclusion != null then .conclusion
                  else .status
                  end
                '
            )"
            case "$CODEQL_STATE" in
              success)
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale)
                echo "CodeQL did not pass for release SHA $EXPECTED_SHA: $CODEQL_STATE" >&2
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done
          echo "CodeQL did not complete for release SHA $EXPECTED_SHA." >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0

      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check cfn-lint==1.53.1

      - name: Install backend and frontend dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix web

      - name: Test and build the frontend
        run: |
          set -euo pipefail
          npm test --prefix web
          npm run build --prefix web

      - name: Validate and build the SAM application
        run: |
          set -euo pipefail
          cfn-lint aws/bootstrap-oidc.yaml
          sam validate --lint --template-file aws/template.yaml --region "$AWS_REGION"
          SAM_BUILD_LOG="${RUNNER_TEMP:?}/sam-build.log"
          if ! PATH="$PWD/node_modules/.bin:$PATH" sam build \
              --template-file aws/template.yaml \
              --build-dir .aws-sam/build \
              --cached \
              --parallel 2>&1 |
            tee "$SAM_BUILD_LOG"; then
            exit 1
          fi
          if grep -Eqi 'reserved logical ID|unexpected behaviors' \
            "$SAM_BUILD_LOG"; then
            echo "SAM emitted a reserved-logical-ID warning." >&2
            exit 1
          fi
          if grep -q "Type: AWS::IAM::" .aws-sam/build/template.yaml; then
            echo "Application stack must not synthesize IAM resources." >&2
            exit 1
          fi

      - name: Create sanitized build receipt
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node aws/create-deployment-receipt.mjs \
            --commit "$COMMIT_SHA" \
            --sam .aws-sam/build \
            --web web/dist > deployment-receipt.json
          jq -e \
            '.schemaVersion == 1 and
             .commitSha == env.COMMIT_SHA and
             .provenance.buildOncePromoteSameArtifact == true' \
            deployment-receipt.json

      - name: Create exact-SHA candidate evidence binding
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          MEMORY_EVALUATION_RUN_ID: ${{ needs.source-gate.outputs.memory_evaluation_run_id }}
          MEMORY_EVALUATION_RUN_ATTEMPT: ${{ needs.source-gate.outputs.memory_evaluation_run_attempt }}
          SUPPLY_CHAIN_RUN_ID: ${{ needs.source-gate.outputs.supply_chain_run_id }}
          SUPPLY_CHAIN_RUN_ATTEMPT: ${{ needs.source-gate.outputs.supply_chain_run_attempt }}
        run: |
          set -euo pipefail
          deployment_receipt_sha256="$(
            sha256sum deployment-receipt.json | awk '{print $1}'
          )"
          supply_chain_receipt_sha256="$(
            sha256sum supply-chain-release-receipt.json | awk '{print $1}'
          )"
          memory_evaluation_receipt_sha256="$(
            sha256sum memory-evaluation-receipt.json | awk '{print $1}'
          )"
          for digest in \
            "$deployment_receipt_sha256" \
            "$supply_chain_receipt_sha256" \
            "$memory_evaluation_receipt_sha256"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          jq -n \
            --arg commitSha "$COMMIT_SHA" \
            --arg deployRunId "$GITHUB_RUN_ID" \
            --arg deployRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deploymentReceiptSha256 "$deployment_receipt_sha256" \
            --arg supplyChainRunId "$SUPPLY_CHAIN_RUN_ID" \
            --arg supplyChainRunAttempt "$SUPPLY_CHAIN_RUN_ATTEMPT" \
            --arg supplyChainReceiptSha256 "$supply_chain_receipt_sha256" \
            --arg memoryEvaluationRunId "$MEMORY_EVALUATION_RUN_ID" \
            --arg memoryEvaluationRunAttempt "$MEMORY_EVALUATION_RUN_ATTEMPT" \
            --arg memoryEvaluationReceiptSha256 "$memory_evaluation_receipt_sha256" '
              {
                schema: "archon.aws-candidate.evidence-binding",
                version: 1,
                commitSha: $commitSha,
                deploy: {
                  runId: $deployRunId,
                  runAttempt: $deployRunAttempt
                },
                candidate: {
                  deploymentReceiptSha256: $deploymentReceiptSha256
                },
                supplyChain: {
                  runId: $supplyChainRunId,
                  runAttempt: $supplyChainRunAttempt,
                  receiptSha256: $supplyChainReceiptSha256
                },
                memoryEvaluation: {
                  runId: $memoryEvaluationRunId,
                  runAttempt: $memoryEvaluationRunAttempt,
                  receiptSha256: $memoryEvaluationReceiptSha256
                }
              }
            ' > candidate-evidence-binding.json
          jq -e --arg sha "$COMMIT_SHA" '
            .schema == "archon.aws-candidate.evidence-binding" and
            .version == 1 and
            .commitSha == $sha and
            (.candidate.deploymentReceiptSha256 |
              test("^[a-f0-9]{64}$")) and
            (.supplyChain.receiptSha256 |
              test("^[a-f0-9]{64}$")) and
            (.memoryEvaluation.receiptSha256 |
              test("^[a-f0-9]{64}$"))
          ' candidate-evidence-binding.json >/dev/null

      - name: Attest immutable candidate tree and evidence binding
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate-evidence-binding.json

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .aws-sam/build/
            web/dist/
            deployment-receipt.json
            candidate-evidence-binding.json
            memory-evaluation-receipt.json
            supply-chain-release-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  database-release:
    name: Reconcile CockroachDB memory release
    if: github.event_name == 'push'
    needs:
      - build-once
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/database-release.yml
    with:
      target_sha: ${{ github.sha }}
    secrets:
      CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}

  deploy-staging:
    name: Deploy and smoke staging
    if: >-
      always() &&
      !cancelled() &&
      needs.source-gate.result == 'success' &&
      needs.build-once.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          needs.database-release.result == 'success' &&
          needs.managed-mcp-production-audit.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'staging-recovery-drill' &&
          needs.database-release.result == 'skipped' &&
          needs.managed-mcp-production-audit.result == 'skipped'
        )
      )
    needs:
      - source-gate
      - build-once
      - database-release
      - managed-mcp-production-audit
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.stack.outputs.application_url }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # Reserve a complete second CloudFormation/CloudFront cycle for recovery.
    timeout-minutes: 105
    concurrency:
      group: aws-shared-control-plane-mutation
      cancel-in-progress: false
      queue: max
    env:
      STACK_NAME: ${{ vars.AWS_STACK_NAME || 'archon-memory-staging' }}
      DATABASE_SECRET_ID: ${{ vars.DATABASE_SECRET_ID || 'archon-memory/staging/database' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
      AWS_LAMBDA_EXECUTION_ROLE_ARN: ${{ vars.AWS_LAMBDA_EXECUTION_ROLE_ARN }}
      AWS_CODEDEPLOY_SERVICE_ROLE_ARN: ${{ vars.AWS_CODEDEPLOY_SERVICE_ROLE_ARN }}
      COCKROACH_SQL_DNS: ${{ needs.database-release.outputs.cockroach_sql_dns || '' }}
      FOUNDATION_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.foundation_control_run_id }}
      FOUNDATION_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.foundation_control_run_attempt }}
      STAGING_EDGE_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.staging_edge_control_run_id }}
      STAGING_EDGE_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.staging_edge_control_run_attempt }}
      PRODUCTION_EDGE_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.production_edge_control_run_id }}
      PRODUCTION_EDGE_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.production_edge_control_run_attempt }}
    steps:
      - name: Check out the exact promoted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download the CI-proven candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate, Supply Chain, and memory-evaluation provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MEMORY_EVALUATION_RUN_ID: ${{ needs.source-gate.outputs.memory_evaluation_run_id }}
          EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT: ${{ needs.source-gate.outputs.memory_evaluation_run_attempt }}
          EXPECTED_SUPPLY_CHAIN_RUN_ID: ${{ needs.source-gate.outputs.supply_chain_run_id }}
          EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT: ${{ needs.source-gate.outputs.supply_chain_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e --arg sha "$EXPECTED_SHA" '
            .schemaVersion == 1 and
            .commitSha == $sha and
            .provenance.buildOncePromoteSameArtifact == true
          ' deployment-receipt.json >/dev/null
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_MEMORY_EVALUATION_RUN_ID" \
            --arg runAttempt "$EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT" '
              .schemaVersion == "1.0.0" and
              .source.sha == $sha and
              .source.runId == $runId and
              .source.runAttempt == $runAttempt and
              .gates == {
                "policy":true,
                "representativeScale":true,
                "cspannVersusExact":true,
                "exactShaBound":true
              }
            ' memory-evaluation-receipt.json >/dev/null
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_SUPPLY_CHAIN_RUN_ID" \
            --arg runAttempt "$EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT" '
              .schema == "archon.supply-chain.release-evidence" and
              .version == 1 and
              .sourceSha == $sha and
              .passed == true and
              .workflow.name == "Supply Chain (enforced)" and
              .workflow.runId == $runId and
              .workflow.runAttempt == $runAttempt and
              .enforcement.mode ==
                "blocking-zero-unwaived-findings" and
              .enforcement.acceptedWaivers == 0 and
              .enforcement.unwaivedFindings == 0 and
              .evidence.cloudFormationTemplates == [
                "aws/template.yaml",
                "aws/bootstrap-oidc.yaml",
                "aws/edge-waf.yaml",
                "aws/finops.yaml"
              ] and
              (.evidence.waiverLedgerSha256 |
                test("^[a-f0-9]{64}$"))
            ' supply-chain-release-receipt.json >/dev/null
          deployment_receipt_sha256="$(
            sha256sum deployment-receipt.json | awk '{print $1}'
          )"
          supply_chain_receipt_sha256="$(
            sha256sum supply-chain-release-receipt.json | awk '{print $1}'
          )"
          memory_evaluation_receipt_sha256="$(
            sha256sum memory-evaluation-receipt.json | awk '{print $1}'
          )"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg deployRunId "$GITHUB_RUN_ID" \
            --arg deployRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deploymentReceiptSha256 "$deployment_receipt_sha256" \
            --arg supplyChainRunId "$EXPECTED_SUPPLY_CHAIN_RUN_ID" \
            --arg supplyChainRunAttempt "$EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT" \
            --arg supplyChainReceiptSha256 "$supply_chain_receipt_sha256" \
            --arg memoryEvaluationRunId "$EXPECTED_MEMORY_EVALUATION_RUN_ID" \
            --arg memoryEvaluationRunAttempt "$EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT" \
            --arg memoryEvaluationReceiptSha256 "$memory_evaluation_receipt_sha256" '
              .schema == "archon.aws-candidate.evidence-binding" and
              .version == 1 and
              .commitSha == $sha and
              .deploy == {
                "runId":$deployRunId,
                "runAttempt":$deployRunAttempt
              } and
              .candidate.deploymentReceiptSha256 ==
                $deploymentReceiptSha256 and
              .supplyChain == {
                "runId":$supplyChainRunId,
                "runAttempt":$supplyChainRunAttempt,
                "receiptSha256":$supplyChainReceiptSha256
              } and
              .memoryEvaluation == {
                "runId":$memoryEvaluationRunId,
                "runAttempt":$memoryEvaluationRunAttempt,
                "receiptSha256":$memoryEvaluationReceiptSha256
              }
            ' candidate-evidence-binding.json >/dev/null
          gh attestation verify candidate-evidence-binding.json \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          gh attestation verify supply-chain-release-receipt.json \
            --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Verify candidate tree hashes and eu-west-1 boundary
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          test "$BEDROCK_REGION" = "eu-west-1"
          test -n "$AWS_ACCOUNT_ID"
          node aws/create-deployment-receipt.mjs \
            --verify deployment-receipt.json \
            --commit "${{ github.sha }}" \
            --sam .aws-sam/build \
            --web web/dist

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Refuse staging mutation while earlier recovery is unresolved
        env:
          RECOVERY_ENVIRONMENT: staging
        run: |
          set -euo pipefail
          bash aws/recovery-intent-ledger.sh assert-clear |
            tee "${RUNNER_TEMP:?}/staging-recovery-ledger-clear.json"
          jq -e \
            '.ok == true
             and .schema == "archon.recovery-intent.clear"
             and .version == 1
             and .environment == "staging"
             and (
               .state == null
               or .state == "COMMITTED"
               or .state == "RECOVERED"
             )' \
            "${RUNNER_TEMP:?}/staging-recovery-ledger-clear.json" \
            >/dev/null

      - name: Reconcile an interrupted same-run staging greenfield recovery
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ENVIRONMENT: staging
          GH_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_DEPLOY_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TERMINAL_JOB_NAME: Deploy and smoke staging
        run: |
          set -euo pipefail
          owner_proof="${RUNNER_TEMP:?}/staging-greenfield-owner-proof.json"
          empty_template="${RUNNER_TEMP:?}/staging-no-previous-template"
          empty_parameters="${RUNNER_TEMP:?}/staging-no-previous-parameters"
          empty_tags="${RUNNER_TEMP:?}/staging-no-previous-tags"
          test ! -e "$empty_template"
          test ! -e "$empty_parameters"
          test ! -e "$empty_tags"
          STACK_STATE=greenfield \
          HAS_PREVIOUS_STACK=false \
          PREVIOUS_STACK_TEMPLATE_FILE="$empty_template" \
          PREVIOUS_STACK_PARAMETERS_FILE="$empty_parameters" \
          PREVIOUS_STACK_TAGS_FILE="$empty_tags" \
          CANDIDATE_SHA="$CANDIDATE_SHA" \
            bash aws/prove-recovery-snapshot.sh >"$owner_proof"
          GREENFIELD_OWNER="$(
            jq -er '.greenfieldOwner | select(test("^[0-9a-f]{64}$"))' \
              "$owner_proof"
          )"
          terminally_proved=false
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            for prior_attempt in $(seq 1 $((GITHUB_RUN_ATTEMPT - 1))); do
              prior_jobs="${RUNNER_TEMP:?}/staging-attempt-${prior_attempt}-jobs.json"
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${prior_attempt}/jobs?per_page=100" \
                >"$prior_jobs"
              if jq -e \
                --arg name "$TERMINAL_JOB_NAME" \
                '[.jobs[]?
                  | select(
                      .name == $name
                      and .status == "completed"
                      and .conclusion == "success"
                    )] | length > 0' \
                "$prior_jobs" >/dev/null; then
                terminally_proved=true
                break
              fi
            done
          fi
          if [ "$terminally_proved" != "true" ]; then
            current_run="${RUNNER_TEMP:?}/staging-current-delivery-run.json"
            candidate_runs="${RUNNER_TEMP:?}/staging-candidate-delivery-runs.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >"$current_run"
            current_started_at="$(
              jq -er \
                --arg event "$GITHUB_EVENT_NAME" \
                --argjson id "$GITHUB_RUN_ID" \
                --arg sha "$CANDIDATE_SHA" \
                '
                  select(
                    .id == $id
                    and .head_sha == $sha
                    and .event == $event
                    and (
                      .path == ".github/workflows/deploy-aws.yml"
                      or .path == ".github/workflows/deploy-aws.yml@main"
                      or .path == ".github/workflows/deploy-aws.yml@refs/heads/main"
                    )
                    and (
                      .run_started_at
                      | type == "string"
                        and test(
                          "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                        )
                    )
                  )
                  | .run_started_at
                ' "$current_run"
            )"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-aws.yml/runs?event=push&head_sha=${CANDIDATE_SHA}&per_page=100" \
              >"$candidate_runs"
            while IFS= read -r later_run_id; do
              [[ "$later_run_id" =~ ^[0-9]+$ ]]
              later_jobs="${RUNNER_TEMP:?}/staging-later-${later_run_id}-jobs.json"
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${later_run_id}/jobs?filter=all&per_page=100" \
                >"$later_jobs"
              if jq -e \
                --arg name "$TERMINAL_JOB_NAME" \
                '[.jobs[]?
                  | select(
                      .name == $name
                      and .status == "completed"
                      and .conclusion == "success"
                    )] | length > 0' \
                "$later_jobs" >/dev/null; then
                terminally_proved=true
                break
              fi
            done < <(
              jq -r \
                --arg sha "$CANDIDATE_SHA" \
                --arg startedAt "$current_started_at" \
                --argjson currentRunId "$GITHUB_RUN_ID" \
                '
                  [
                    .[].workflow_runs[]?
                    | select(
                        .id != $currentRunId
                        and .head_sha == $sha
                        and .event == "push"
                        and (
                          .path == ".github/workflows/deploy-aws.yml"
                          or .path == ".github/workflows/deploy-aws.yml@main"
                          or .path == ".github/workflows/deploy-aws.yml@refs/heads/main"
                        )
                        and (
                          .run_started_at > $startedAt
                          or (
                            .run_started_at == $startedAt
                            and .id > $currentRunId
                          )
                        )
                      )
                  ]
                  | sort_by(.run_started_at, .id)
                  | .[].id
                ' "$candidate_runs"
            )
          fi
          cleanup_needed=false
          if live_stack="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output json 2>&1)"; then
            live_identity="$(
              jq -c \
              --arg stack "$STACK_NAME" \
              --arg stackPrefix \
                "arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${STACK_NAME}/" \
              --arg owner "$GREENFIELD_OWNER" \
              --arg app "$APP_NAME" \
              --arg environment "$ENVIRONMENT" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                .Stacks[0] as $candidate
                | (
                    [.Stacks[]?.Tags[]?
                      | select(.Key == "ArchonGreenfieldOwner")
                      | .Value] == [$owner]
                  ) as $ownerMatches
                | {
                    exactOwner: (
                      (.Stacks | length) == 1
                      and $ownerMatches
                      and $candidate.StackName == $stack
                      and ($candidate.StackId | startswith($stackPrefix))
                      and $candidate.RoleARN == $role
                      and (
                        $candidate.EnableTerminationProtection
                        | type == "boolean"
                      )
                      and (
                        ($candidate.Tags // [])
                        | map({Key, Value})
                        | sort_by(.Key)
                      ) == (
                        [
                          {Key: "Application", Value: $app},
                          {
                            Key: "ArchonGreenfieldOwner",
                            Value: $owner
                          },
                          {Key: "Environment", Value: $environment}
                        ]
                        | sort_by(.Key)
                      )
                    ),
                    ownerMatches: $ownerMatches,
                    status: ($candidate.StackStatus // "")
                  }
              ' <<<"$live_stack"
            )"
            if [ "$(jq -er '.ownerMatches' <<<"$live_identity")" = "true" ] &&
               [ "$(jq -er '.exactOwner' <<<"$live_identity")" != "true" ]; then
              echo "The same-run staging stack failed exact ownership checks." >&2
              exit 1
            fi
            if [ "$(jq -er '.exactOwner' <<<"$live_identity")" = "true" ]; then
              live_status="$(jq -er '.status' <<<"$live_identity")"
              case "$live_status" in
                CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                  if [ "$terminally_proved" != "true" ]; then
                    cleanup_needed=true
                  fi
                  ;;
                REVIEW_IN_PROGRESS|CREATE_IN_PROGRESS|CREATE_FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|UPDATE_FAILED|UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS|UPDATE_ROLLBACK_FAILED|DELETE_IN_PROGRESS|DELETE_FAILED)
                  cleanup_needed=true
                  ;;
                *)
                  echo "The same-run staging stack is still mutating: $live_status" >&2
                  exit 1
                  ;;
              esac
            fi
          elif grep -qi "does not exist" <<<"$live_stack"; then
            cleanup_needed=true
          else
            echo "Unable to inspect prior staging greenfield state." >&2
            exit 1
          fi
          if [ "$cleanup_needed" = "true" ]; then
            GREENFIELD_OWNER="$GREENFIELD_OWNER" \
              bash aws/delete-greenfield-stack.sh \
                >"${RUNNER_TEMP:?}/staging-greenfield-reconciliation.json"
          fi

      - name: Refresh short-lived AWS credentials after staging reconciliation
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-preflight-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Preflight application S3 access logging before stack mutation
        id: application_s3_preflight
        env:
          ENVIRONMENT: staging
        run: |
          set -euo pipefail
          bash aws/prove-application-s3-access-logging.sh preflight |
            tee application-s3-access-logging-preflight.json
          jq -e \
            --arg environment "$ENVIRONMENT" \
            --arg source "${APP_NAME}-${ENVIRONMENT}-web-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg destination "${APP_NAME}-s3-access-logs-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg prefix "${ENVIRONMENT}-web/" \
            '
              .ok == true
              and .schema == "archon.application-s3-access-logging.preflight"
              and .version == 1
              and .mode == "preflight"
              and .evidence == "live-control-plane"
              and .foundationVerified == true
              and .environment == $environment
              and .sourceBucket == $source
              and .destinationBucket == $destination
              and (
                .priorState == "absent"
                or .priorState == "disabled"
                or .priorState == "enabled"
              )
              and .expected == {
                "LoggingEnabled": {
                  "TargetBucket": $destination,
                  "TargetPrefix": $prefix,
                  "TargetObjectKeyFormat": {
                    "PartitionedPrefix": {
                      "PartitionDateSource": "EventTime"
                    }
                  }
                }
              }
              and .integrity.algorithm == "sha256"
              and .integrity.canonicalization == "jq-cS-v1"
              and (
                .integrity.payloadSha256
                | type == "string"
                and test("^[0-9a-f]{64}$")
              )
            ' application-s3-access-logging-preflight.json >/dev/null
          receipt_sha256="$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "receipt_sha256=$receipt_sha256" >>"$GITHUB_OUTPUT"

      - name: Preflight API stage-proof permissions before stack mutation
        id: api_preflight
        env:
          API_ACCESS_LOG_GROUP: /aws/apigateway/${{ env.APP_NAME }}-staging
        run: |
          set -euo pipefail
          bash aws/prove-api-stage-controls.sh preflight |
            tee api-stage-preflight.json
          jq -e \
            '.ok == true and
             .mode == "preflight" and
             ((.state == "greenfield" and .deferredToPostDeploy == true) or
              (.state == "existing" and
               (.currentStage == "live" or .currentStage == "$default") and
               (.accessLogGroup | type == "string" and length > 0) and
               .permissions == [
                 "cloudformation:GetTemplate",
                 "apigateway:GET",
                 "cloudfront:GetDistribution",
                 "cloudfront:GetDistributionConfig",
                 "logs:DescribeLogStreams",
                 "logs:FilterLogEvents"
               ]))' \
            api-stage-preflight.json >/dev/null
          echo "stack_state=$(jq -er '.state' api-stage-preflight.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Discover the protected staging alarm-routing contract
        id: alarm_routing
        env:
          ENVIRONMENT: staging
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/staging-alarm-routing-discovery.json"
          bash aws/prove-alarm-routing.sh discover | tee "$receipt"
          jq -e \
            --arg environment "$ENVIRONMENT" \
            --arg expectedTopic \
              "arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${APP_NAME}-${ENVIRONMENT}-alarms" \
            '
              .ok == true
              and .schema == "archon.alarm-routing.proof"
              and .version == 1
              and .mode == "discover"
              and .environment == $environment
              and (
                (
                  (
                    .state == "legacy-inactive-not-provisioned"
                    or .state == "inactive-not-provisioned"
                  )
                  and .contractVersion == null
                  and .keyArn == null
                  and .topicArn == null
                  and .archiveQueueArn == null
                  and .alarmCount == null
                )
                or (
                  .state == "active"
                  and .contractVersion == "1"
                  and .topicArn == $expectedTopic
                  and (.keyArn | type == "string" and length > 0)
                  and (
                    .archiveQueueArn
                    | type == "string" and length > 0
                  )
                  and .alarmCount == null
                )
              )
            ' "$receipt" >/dev/null
          state="$(jq -er '.state' "$receipt")"
          topic_arn="$(jq -er '.topicArn // ""' "$receipt")"
          {
            echo "state=$state"
            echo "topic_arn=$topic_arn"
          } >>"$GITHUB_OUTPUT"

      - name: Capture the current recoverable release
        id: previous
        env:
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
        run: |
          set -euo pipefail
          FUNCTION_NAME=""
          FUNCTION_VERSION=""
          APPLICATION_URL=""
          BUCKET_NAME=""
          DISTRIBUTION_ID=""
          STACK_ID=""
          STACK_STATUS=""
          STACK_REVISION=""
          HAS_PREVIOUS_STACK=false
          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            stack_before="${RUNNER_TEMP:?}/staging-stack-before.json"
            stack_after="${RUNNER_TEMP:?}/staging-stack-after.json"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --output json >"$stack_before"
            jq -e \
              --arg stack "$STACK_NAME" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackName == $stack
                and (
                  .Stacks[0].StackStatus == "CREATE_COMPLETE"
                  or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                  or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
                )
                and .Stacks[0].RoleARN == $role
              ' "$stack_before" >/dev/null
            HAS_PREVIOUS_STACK=true
            STACK_ID="$(jq -er '.Stacks[0].StackId' "$stack_before")"
            STACK_STATUS="$(jq -er '.Stacks[0].StackStatus' "$stack_before")"
            STACK_REVISION="$(
              jq -er \
                '.Stacks[0].LastUpdatedTime // .Stacks[0].CreationTime' \
                "$stack_before"
            )"
            aws cloudformation get-template \
              --stack-name "$STACK_ID" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json |
              jq -er '.TemplateBody | if type == "string" then . else tojson end' \
                > previous-stack-template.yaml
            test "$(wc -c < previous-stack-template.yaml)" -le 51200
            jq -e \
                'map({ParameterKey, ParameterValue})
                 | sort_by(.ParameterKey)
                 | if (length > 0 and
                       all(.[];
                         (.ParameterKey | type == "string" and length > 0) and
                         (.ParameterValue |
                           type == "string" and . != "****")) and
                       ([.[].ParameterKey] | unique | length) == length)
                   then .
                   else error("invalid stack parameter snapshot")
                   end' \
              < <(jq '.Stacks[0].Parameters' "$stack_before") \
              > previous-stack-parameters.json
            jq -e \
              '
                (.Stacks[0].Tags // [])
                | map({Key, Value})
                | sort_by(.Key)
                | if ([.[].Key] | unique | length) == length
                  then .
                  else error("duplicate stack tag keys")
                  end
              ' "$stack_before" > previous-stack-tags.json
            FUNCTION_NAME="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "FunctionName")
                 | .OutputValue' "$stack_before"
            )"
            APPLICATION_URL="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "ApplicationUrl")
                 | .OutputValue' "$stack_before"
            )"
            BUCKET_NAME="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "SpaBucketName")
                 | .OutputValue' "$stack_before"
            )"
            DISTRIBUTION_ID="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "DistributionId")
                 | .OutputValue' "$stack_before"
            )"
            test "$BUCKET_NAME" = \
              "${APP_NAME}-staging-web-${AWS_ACCOUNT_ID}-${AWS_REGION}"
            [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
            if [ -n "$FUNCTION_NAME" ] && [ "$FUNCTION_NAME" != "None" ]; then
              alias_before="${RUNNER_TEMP:?}/staging-alias-before.json"
              alias_after="${RUNNER_TEMP:?}/staging-alias-after.json"
              aws lambda get-alias \
                --function-name "$FUNCTION_NAME" \
                --name live \
                --region "$AWS_REGION" \
                --output json >"$alias_before"
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${FUNCTION_NAME}:live" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and (.FunctionVersion | test("^[1-9][0-9]*$"))
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' "$alias_before" >/dev/null
              FUNCTION_VERSION="$(
                jq -er '.FunctionVersion' "$alias_before"
              )"
            else
              echo "The existing stack has no recoverable Lambda function." >&2
              exit 1
            fi
            test -n "$APPLICATION_URL"
            test "$APPLICATION_URL" != "None"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_ID" \
              --region "$AWS_REGION" \
              --output json >"$stack_after"
            jq -e \
              --slurpfile before "$stack_before" \
              '
                ($before[0].Stacks | length) == 1
                and (.Stacks | length) == 1
                and .Stacks[0].StackId == $before[0].Stacks[0].StackId
                and .Stacks[0].StackStatus ==
                  $before[0].Stacks[0].StackStatus
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime)
                  ==
                  ($before[0].Stacks[0].LastUpdatedTime //
                    $before[0].Stacks[0].CreationTime)
                )
                and .Stacks[0].RoleARN == $before[0].Stacks[0].RoleARN
                and .Stacks[0].Parameters ==
                  $before[0].Stacks[0].Parameters
                and .Stacks[0].Outputs == $before[0].Stacks[0].Outputs
              ' "$stack_after" >/dev/null
            aws lambda get-alias \
              --function-name "$FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json >"$alias_after"
            jq -e \
              --slurpfile before "$alias_before" \
              '
                .AliasArn == $before[0].AliasArn
                and .Name == $before[0].Name
                and .FunctionVersion == $before[0].FunctionVersion
                and (.RoutingConfig // {}) ==
                  ($before[0].RoutingConfig // {})
                and .RevisionId == $before[0].RevisionId
              ' "$alias_after" >/dev/null
          elif [ "$EXPECTED_STACK_STATE" = "greenfield" ]; then
            if stack_result="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "Stack state changed after the greenfield preflight." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$stack_result"; then
              echo "Unable to confirm the greenfield stack state." >&2
              exit 1
            fi
          else
            echo "Invalid API stage preflight stack state." >&2
            exit 1
          fi
          snapshot="${RUNNER_TEMP:?}/staging-recovery-snapshot.json"
          ENVIRONMENT=staging \
          STACK_STATE="$EXPECTED_STACK_STATE" \
          HAS_PREVIOUS_STACK="$HAS_PREVIOUS_STACK" \
          PREVIOUS_STACK_ID="$STACK_ID" \
          PREVIOUS_STACK_STATUS="$STACK_STATUS" \
          PREVIOUS_STACK_REVISION="$STACK_REVISION" \
          PREVIOUS_FUNCTION_NAME="$FUNCTION_NAME" \
          PREVIOUS_FUNCTION_VERSION="$FUNCTION_VERSION" \
          PREVIOUS_APPLICATION_URL="$APPLICATION_URL" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$snapshot"
          jq -e \
            --arg environment staging \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --argjson hasPreviousStack "$HAS_PREVIOUS_STACK" \
            '
              .ok == true
              and .schema == "archon.recovery-snapshot.proof"
              and .version == 1
              and .environment == $environment
              and .stackState == $stackState
              and .hasPreviousStack == $hasPreviousStack
              and (.manifestSha256 | test("^[0-9a-f]{64}$"))
            ' "$snapshot" >/dev/null
          {
            echo "function_name=$FUNCTION_NAME"
            echo "function_version=$FUNCTION_VERSION"
            echo "application_url=$APPLICATION_URL"
            echo "bucket_name=$BUCKET_NAME"
            echo "distribution_id=$DISTRIBUTION_ID"
            echo "has_previous_stack=$HAS_PREVIOUS_STACK"
            echo "stack_id=$STACK_ID"
            echo "stack_status=$STACK_STATUS"
            echo "stack_revision=$STACK_REVISION"
            echo "previous_release_sha256=$(jq -er '.manifestSha256' "$snapshot")"
            echo "template_sha256=$(jq -r '.templateSha256 // ""' "$snapshot")"
            echo "parameters_sha256=$(jq -r '.parametersSha256 // ""' "$snapshot")"
            echo "tags_sha256=$(jq -r '.tagsSha256 // ""' "$snapshot")"
            echo "greenfield_owner=$(jq -r '.greenfieldOwner // ""' "$snapshot")"
          } >> "$GITHUB_OUTPUT"

      - name: Authorize the exact existing staging release for fault injection
        id: drill_gate
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'staging-recovery-drill'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
        run: |
          set -euo pipefail
          umask 077
          test "$DEPLOY_OPERATION" = "staging-recovery-drill"
          test "$HAS_PREVIOUS_STACK" = "true"
          test -s previous-stack-parameters.json
          test ! -L previous-stack-parameters.json

          prior_cockroach_sql_dns="$(jq -er '
            [.[]
              | select(.ParameterKey == "CockroachSqlDns")
              | .ParameterValue]
            | if length == 1 then .[0]
              else error("exact prior Cockroach SQL DNS not proved")
              end
          ' previous-stack-parameters.json)"
          [[ "$prior_cockroach_sql_dns" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]
          test "${#prior_cockroach_sql_dns}" -le 253

          jq -e \
            --arg app "$APP_NAME" \
            --arg cockroachSqlDns "$prior_cockroach_sql_dns" \
            --arg databaseSecretId "$DATABASE_SECRET_ID" \
            --arg release "$GITHUB_SHA" '
              def exact_parameter($key; $value):
                ([.[] | select(.ParameterKey == $key) | .ParameterValue] == [$value]);
              exact_parameter("AppName"; $app)
              and exact_parameter("Environment"; "staging")
              and exact_parameter("CockroachSqlDns"; $cockroachSqlDns)
              and exact_parameter("DatabaseSecretId"; $databaseSecretId)
              and exact_parameter("ReleaseCommitSha"; $release)
              and exact_parameter("RecoveryDrillToken"; "disabled")
            ' previous-stack-parameters.json >/dev/null
          echo "COCKROACH_SQL_DNS=$prior_cockroach_sql_dns" >>"$GITHUB_ENV"

          source_run="$({
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-aws.yml/runs?branch=main&event=push&status=success&per_page=100"
          } | jq -cer --arg sha "$GITHUB_SHA" '
            [
              .workflow_runs[]
              | select(
                  .name == "Deploy AWS"
                  and .path == ".github/workflows/deploy-aws.yml"
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                  and .head_branch == "main"
                  and .head_sha == $sha
                  and .head_repository.full_name ==
                    "upgradedev/archon-cockroach-memory"
                )
            ]
            | sort_by(.updated_at, .run_number, .run_attempt)
            | last
            | select(
                (.id | type == "number" and . > 0)
                and (.run_attempt | type == "number" and . > 0)
              )
          ')"
          source_run_id="$(jq -er '.id | tostring' <<<"$source_run")"
          source_run_attempt="$(jq -er '.run_attempt | tostring' <<<"$source_run")"
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_run_attempt" =~ ^[1-9][0-9]*$ ]]

          expected_artifact="staging-deployment-receipt-${GITHUB_SHA}-${source_run_id}-${source_run_attempt}"
          artifact="$({
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/${source_run_id}/artifacts?per_page=100"
          } | jq -cer \
            --arg expected "$expected_artifact" \
            --arg sha "$GITHUB_SHA" \
            --argjson runId "$source_run_id" '
              [
                .artifacts[]
                | select(
                    .name == $expected
                    and .expired == false
                    and (.size_in_bytes | type == "number" and . > 0)
                    and (.digest | test("^sha256:[0-9a-f]{64}$"))
                    and .workflow_run.id == $runId
                    and .workflow_run.head_branch == "main"
                    and .workflow_run.head_sha == $sha
                  )
              ]
              | if length == 1 then .[0]
                else error("exact successful staging receipt artifact not proved")
                end
            ')"
          artifact_digest="$(jq -er '.digest' <<<"$artifact")"
          artifact_id="$(jq -er '.id | tostring' <<<"$artifact")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          source_proof="${RUNNER_TEMP:?}/staging-recovery-drill-source.json"
          jq -n \
            --arg artifactDigest "$artifact_digest" \
            --arg artifactIdSha256 "$(printf '%s' "$artifact_id" | sha256sum | awk '{print $1}')" \
            --arg commitSha "$GITHUB_SHA" \
            --arg runAttempt "$source_run_attempt" \
            --arg runId "$source_run_id" '
              {
                schema: "archon.staging-recovery-drill.source",
                version: 1,
                commitSha: $commitSha,
                releaseState: {
                  existingStack: true,
                  releaseCommitMatched: true,
                  recoveryDrillTokenDisabled: true,
                  runtimeDatabaseSecretMatched: true
                },
                successfulPushDeployment: {
                  workflow: "Deploy AWS",
                  event: "push",
                  conclusion: "success",
                  runId: $runId,
                  runAttempt: $runAttempt,
                  stagingReceiptArtifactDigest: $artifactDigest,
                  stagingReceiptArtifactIdSha256: $artifactIdSha256
                }
              }
            ' >"$source_proof"
          jq -e \
            --arg sha "$GITHUB_SHA" '
              .schema == "archon.staging-recovery-drill.source"
              and .version == 1
              and .commitSha == $sha
              and .releaseState.existingStack == true
              and .releaseState.releaseCommitMatched == true
              and .releaseState.recoveryDrillTokenDisabled == true
              and .releaseState.runtimeDatabaseSecretMatched == true
              and .successfulPushDeployment.event == "push"
              and .successfulPushDeployment.conclusion == "success"
              and (.successfulPushDeployment.runId | test("^[1-9][0-9]*$"))
              and (.successfulPushDeployment.runAttempt | test("^[1-9][0-9]*$"))
              and (.successfulPushDeployment.stagingReceiptArtifactDigest
                | test("^sha256:[0-9a-f]{64}$"))
              and (.successfulPushDeployment.stagingReceiptArtifactIdSha256
                | test("^[0-9a-f]{64}$"))
            ' "$source_proof" >/dev/null
          {
            echo "source_run_id=$source_run_id"
            echo "source_run_attempt=$source_run_attempt"
            echo "source_receipt_artifact_digest=$artifact_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Revalidate staging control-plane fence before new release mutation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_FOUNDATION_RUN_ID: ${{ needs.source-gate.outputs.foundation_control_run_id }}
          EXPECTED_FOUNDATION_RUN_ATTEMPT: ${{ needs.source-gate.outputs.foundation_control_run_attempt }}
          EXPECTED_STAGING_EDGE_RUN_ID: ${{ needs.source-gate.outputs.staging_edge_control_run_id }}
          EXPECTED_STAGING_EDGE_RUN_ATTEMPT: ${{ needs.source-gate.outputs.staging_edge_control_run_attempt }}
          EXPECTED_PRODUCTION_EDGE_RUN_ID: ${{ needs.source-gate.outputs.production_edge_control_run_id }}
          EXPECTED_PRODUCTION_EDGE_RUN_ATTEMPT: ${{ needs.source-gate.outputs.production_edge_control_run_attempt }}
          FENCE_ENVIRONMENT: staging
          FENCE_JOB_ID: deploy-staging
          FENCE_MUTEX_GROUP: aws-shared-control-plane-mutation
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fence="${RUNNER_TEMP:?}/staging-control-plane-receipt-fence.json"
          bash .github/scripts/revalidate-aws-control-plane-fence.sh \
            >"$fence"
          jq -e \
            --arg environment "$FENCE_ENVIRONMENT" \
            --arg foundationAttempt "$EXPECTED_FOUNDATION_RUN_ATTEMPT" \
            --arg foundationId "$EXPECTED_FOUNDATION_RUN_ID" \
            --arg job "$FENCE_JOB_ID" \
            --arg mutex "$FENCE_MUTEX_GROUP" \
            --arg productionAttempt "$EXPECTED_PRODUCTION_EDGE_RUN_ATTEMPT" \
            --arg productionId "$EXPECTED_PRODUCTION_EDGE_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg sha "$EXPECTED_SHA" \
            --arg stagingAttempt "$EXPECTED_STAGING_EDGE_RUN_ATTEMPT" \
            --arg stagingId "$EXPECTED_STAGING_EDGE_RUN_ID" '
              .schema == "archon.aws.control-plane-receipt-fence"
              and .schemaVersion == 1
              and .ok == true
              and .sourceSha == $sha
              and .mainHeadSha == $sha
              and .mainHeadRevalidated == true
              and .mutationMutexHeldByCaller == true
              and .latestEligibleRunsRevalidated == true
              and .edgeSnapshotShared == true
              and .mutex == {group:$mutex, heldByCaller:true}
              and .deployment == {
                environment:$environment,
                jobId:$job,
                runId:($runId | tonumber),
                runAttempt:($runAttempt | tonumber)
              }
              and .foundation == {
                runId:($foundationId | tonumber),
                runAttempt:($foundationAttempt | tonumber),
                operation:"verify"
              }
              and .edge.staging.runId == ($stagingId | tonumber)
              and .edge.staging.runAttempt == ($stagingAttempt | tonumber)
              and (.edge.staging.operation | test("^(apply|verify)$"))
              and .edge.production.runId == ($productionId | tonumber)
              and .edge.production.runAttempt == ($productionAttempt | tonumber)
              and (.edge.production.operation | test("^(apply|verify)$"))
              and (.checkedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' "$fence" >/dev/null
          fence_sha256="$(sha256sum "$fence" | awk '{print $1}')"
          [[ "$fence_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "CONTROL_PLANE_FENCE_FILE=$fence"
            echo "CONTROL_PLANE_FENCE_SHA256=$fence_sha256"
          } >>"$GITHUB_ENV"

      - name: Enforce staging stack protection and fresh pre-deploy drift gate
        env:
          ENVIRONMENT: staging
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          EXPECTED_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          EXPECTED_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          proof="${RUNNER_TEMP:?}/staging-cloudformation-controls-preflight.json"
          bash aws/enforce-cloudformation-controls.sh preflight >"$proof"
          jq -e -s \
            'length == 1 and (.[0] | type == "object")' \
            "$proof" >/dev/null
          jq -e \
            --arg expectedState "$EXPECTED_STACK_STATE" \
            '
              .ok == true
              and .schema == "archon.cloudformation-controls.proof"
              and .version == 1
              and .mode == "preflight"
              and .evidence == "live-control-plane"
              and .identity.environment == "staging"
              and (
                (
                  $expectedState == "greenfield"
                  and .identity.state == "absent"
                  and .protection.enabled == null
                  and .drift == null
                )
                or (
                  $expectedState == "existing"
                  and .identity.state == "existing"
                  and .protection.enabled == true
                  and .drift.detectionStatus == "DETECTION_COMPLETE"
                  and .drift.stackDriftStatus == "IN_SYNC"
                  and .drift.driftedResourceCount == 0
                  and .drift.checkedResourceCount > 0
                )
              )
            ' "$proof" >/dev/null

      - name: Re-prove the application S3 preflight immediately before SAM
        id: application_s3_recheck
        env:
          ENVIRONMENT: staging
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
        run: |
          set -euo pipefail
          snapshot_recheck="${RUNNER_TEMP:?}/staging-recovery-snapshot-recheck.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$snapshot_recheck"
          jq -e \
            --arg expected "$EXPECTED_PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$snapshot_recheck" >/dev/null

          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            current_stack="${RUNNER_TEMP:?}/staging-stack-recheck.json"
            current_template="${RUNNER_TEMP:?}/staging-template-recheck.yaml"
            current_parameters="${RUNNER_TEMP:?}/staging-parameters-recheck.json"
            current_tags="${RUNNER_TEMP:?}/staging-tags-recheck.json"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --output json >"$current_stack"
            jq -e \
              --arg stackId "$PREVIOUS_STACK_ID" \
              --arg status "$PREVIOUS_STACK_STATUS" \
              --arg revision "$PREVIOUS_STACK_REVISION" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              --arg function "$PREVIOUS_FUNCTION_NAME" \
              --arg url "$PREVIOUS_APPLICATION_URL" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackId == $stackId
                and .Stacks[0].StackStatus == $status
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime) == $revision
                )
                and .Stacks[0].RoleARN == $role
                and (
                  [.Stacks[0].Outputs[]
                    | select(.OutputKey == "FunctionName")
                    | .OutputValue] == [$function]
                )
                and (
                  [.Stacks[0].Outputs[]
                    | select(.OutputKey == "ApplicationUrl")
                    | .OutputValue] == [$url]
                )
              ' "$current_stack" >/dev/null
            aws cloudformation get-template \
              --stack-name "$PREVIOUS_STACK_ID" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json |
              jq -er \
                '.TemplateBody | if type == "string" then . else tojson end' \
                >"$current_template"
            jq \
              '.Stacks[0].Parameters
               | map({ParameterKey, ParameterValue})
               | sort_by(.ParameterKey)' \
              "$current_stack" >"$current_parameters"
            jq -e \
              '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
              "$current_stack" >"$current_tags"
            test "$(
              sha256sum "$current_template" | awk '{print $1}'
            )" = "$EXPECTED_TEMPLATE_SHA256"
            test "$(
              sha256sum "$current_parameters" | awk '{print $1}'
            )" = "$EXPECTED_PARAMETERS_SHA256"
            test "$(
              sha256sum "$current_tags" | awk '{print $1}'
            )" = "$EXPECTED_TAGS_SHA256"
            aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json |
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' >/dev/null
          else
            if stack_result="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "Stack state changed before the greenfield deploy." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$stack_result"; then
              echo "Unable to re-prove the greenfield stack state." >&2
              exit 1
            fi
          fi

          recheck="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-recheck.json"
          canonical_before="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-before.canonical.json"
          canonical_recheck="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-recheck.canonical.json"
          bash aws/prove-application-s3-access-logging.sh preflight >"$recheck"
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          jq -cS . application-s3-access-logging-preflight.json \
            >"$canonical_before"
          jq -cS . "$recheck" >"$canonical_recheck"
          cmp --silent "$canonical_before" "$canonical_recheck"
          jq -e \
            --arg stackState "$EXPECTED_STACK_STATE" \
            '
              (
                $stackState == "greenfield"
                and .priorState == "absent"
              )
              or (
                $stackState == "existing"
                and (
                  .priorState == "disabled"
                  or .priorState == "enabled"
                )
              )
            ' "$recheck" >/dev/null
          {
            echo "reproved=true"
            echo "stack_state=$EXPECTED_STACK_STATE"
          } >>"$GITHUB_OUTPUT"

      - name: Persist and arm the immutable staging recovery intent
        id: durable_recovery
        env:
          ARTIFACT_BUCKET: ${{ env.AWS_SAM_ARTIFACT_BUCKET }}
          CANDIDATE_SHA: ${{ github.sha }}
          ENVIRONMENT: staging
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          PREVIOUS_BUCKET_NAME: ${{ steps.previous.outputs.bucket_name }}
          PREVIOUS_DISTRIBUTION_ID: ${{ steps.previous.outputs.distribution_id }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          RECOVERY_ENVIRONMENT: staging
          RECOVERY_SNAPSHOT_PROOF_FILE: ${{ runner.temp }}/staging-recovery-snapshot-recheck.json
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.source-gate.outputs.ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.source-gate.outputs.ci_run_id }}
          SOURCE_DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_DEPLOY_RUN_ID: ${{ github.run_id }}
          STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          bundle_tar="${RUNNER_TEMP:?}/staging-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          roundtrip_tar="${RUNNER_TEMP:?}/staging-recovery-roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          extracted_dir="${RUNNER_TEMP:?}/staging-recovery-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bundle_proof="${RUNNER_TEMP:?}/staging-recovery-bundle-proof.json"
          object_proof="${RUNNER_TEMP:?}/staging-recovery-object-proof.json"
          object_response="${RUNNER_TEMP:?}/staging-recovery-object-response.json"
          cleanup_durable_intent() {
            rm -f -- \
              "$bundle_tar" \
              "$roundtrip_tar" \
              "$bundle_proof" \
              "$object_proof" \
              "$object_response"
            rm -rf -- "$extracted_dir"
          }
          trap cleanup_durable_intent EXIT

          bash aws/create-durable-recovery-bundle.sh "$bundle_tar" \
            >"$bundle_proof"
          RECOVERY_INTENT_ID="$(
            jq -er '.intentId | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_MANIFEST_SHA256="$(
            jq -er '.manifestSha256 | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_ARCHIVE_SHA256="$(
            jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_ARCHIVE_KEY="candidates/recovery/staging/${RECOVERY_INTENT_ID}.tar"
          RECOVERY_INTENT_ID="$RECOVERY_INTENT_ID" \
            bash aws/put-durable-recovery-object.sh \
              "$bundle_tar" \
              "$RECOVERY_ARCHIVE_KEY" >"$object_proof"
          RECOVERY_ARCHIVE_BUCKET="$(jq -er '.bucket' "$object_proof")"
          RECOVERY_ARCHIVE_VERSION_ID="$(
            jq -er '.versionId | select(length > 0 and . != "null")' \
              "$object_proof"
          )"
          test "$(jq -er '.sha256' "$object_proof")" = \
            "$RECOVERY_ARCHIVE_SHA256"

          aws s3api get-object \
            --bucket "$RECOVERY_ARCHIVE_BUCKET" \
            --key "$RECOVERY_ARCHIVE_KEY" \
            --version-id "$RECOVERY_ARCHIVE_VERSION_ID" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            --checksum-mode ENABLED \
            --region "$AWS_REGION" \
            --output json \
            "$roundtrip_tar" >"$object_response"
          test "$(
            sha256sum "$roundtrip_tar" | awk '{print $1}'
          )" = "$RECOVERY_ARCHIVE_SHA256"
          expected_checksum="$(
            openssl dgst -sha256 -binary "$roundtrip_tar" | base64 -w0
          )"
          jq -e \
            --arg checksum "$expected_checksum" \
            --arg version "$RECOVERY_ARCHIVE_VERSION_ID" \
            '.VersionId == $version and .ChecksumSHA256 == $checksum' \
            "$object_response" >/dev/null
          EXPECTED_ARCHIVE_SHA256="$RECOVERY_ARCHIVE_SHA256" \
          EXPECTED_CANDIDATE_SHA="$CANDIDATE_SHA" \
          EXPECTED_INTENT_ID="$RECOVERY_INTENT_ID" \
          EXPECTED_MANIFEST_SHA256="$RECOVERY_MANIFEST_SHA256" \
          EXPECTED_SOURCE_CI_RUN_ATTEMPT="$SOURCE_CI_RUN_ATTEMPT" \
          EXPECTED_SOURCE_CI_RUN_ID="$SOURCE_CI_RUN_ID" \
          EXPECTED_SOURCE_DEPLOY_RUN_ATTEMPT="$SOURCE_DEPLOY_RUN_ATTEMPT" \
          EXPECTED_SOURCE_DEPLOY_RUN_ID="$SOURCE_DEPLOY_RUN_ID" \
            bash aws/extract-durable-recovery-bundle.sh \
              "$roundtrip_tar" \
              "$extracted_dir" >/dev/null

          RECOVERY_ARCHIVE_BUCKET="$RECOVERY_ARCHIVE_BUCKET" \
          RECOVERY_ARCHIVE_KEY="$RECOVERY_ARCHIVE_KEY" \
          RECOVERY_ARCHIVE_SHA256="$RECOVERY_ARCHIVE_SHA256" \
          RECOVERY_ARCHIVE_VERSION_ID="$RECOVERY_ARCHIVE_VERSION_ID" \
          RECOVERY_INTENT_ID="$RECOVERY_INTENT_ID" \
          RECOVERY_MANIFEST_SHA256="$RECOVERY_MANIFEST_SHA256" \
            bash aws/recovery-intent-ledger.sh arm \
              >"${RUNNER_TEMP:?}/staging-recovery-ledger-armed.json"
          jq -e \
            --arg intent "$RECOVERY_INTENT_ID" \
            --arg version "$RECOVERY_ARCHIVE_VERSION_ID" \
            '
              .state == "ARMED"
              and .intentId == $intent
              and .archiveVersionId == $version
            ' "${RUNNER_TEMP:?}/staging-recovery-ledger-armed.json" \
            >/dev/null
          had_previous_index="$(
            jq -er \
              '.hadPreviousIndex
               | if type == "boolean"
                 then tostring
                 else error("invalid previous-index state")
                 end' \
              "$bundle_proof"
          )"
          {
            echo "armed=true"
            echo "intent_id=$RECOVERY_INTENT_ID"
            echo "archive_bucket=$RECOVERY_ARCHIVE_BUCKET"
            echo "archive_key=$RECOVERY_ARCHIVE_KEY"
            echo "archive_version_id=$RECOVERY_ARCHIVE_VERSION_ID"
            echo "archive_sha256=$RECOVERY_ARCHIVE_SHA256"
            echo "manifest_sha256=$RECOVERY_MANIFEST_SHA256"
            echo "had_previous_index=$had_previous_index"
            echo "previous_index_version=$(jq -r '.previousIndexVersionId // ""' "$bundle_proof")"
            echo "previous_index_sha256=$(jq -r '.previousIndexSha256 // ""' "$bundle_proof")"
          } >>"$GITHUB_OUTPUT"

      - name: Refresh short-lived AWS credentials for staging SAM deployment
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-sam-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve the exact staging edge-stack handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          edge_stack="${APP_NAME}-staging-edge"
          stack="${RUNNER_TEMP:?}/staging-edge-stack.json"
          aws cloudformation describe-stacks \
            --stack-name "$edge_stack" \
            --region us-east-1 \
            --output json >"$stack"
          web_acl_arn="$(
            jq -er \
              --arg account "$AWS_ACCOUNT_ID" \
              --arg app "$APP_NAME" \
              --arg stack "$edge_stack" \
              '
                .Stacks[0] as $current
                | (
                    (.Stacks | length) == 1
                    and $current.StackName == $stack
                    and (
                      $current.StackStatus == "CREATE_COMPLETE"
                      or $current.StackStatus == "UPDATE_COMPLETE"
                    )
                    and $current.EnableTerminationProtection == true
                    and (($current.RoleARN // null) == null)
                    and (
                      [
                        $current.Parameters[]
                        | {key:.ParameterKey, value:.ParameterValue}
                      ]
                      | from_entries
                    ) == {
                      AppName: $app,
                      Environment: "staging",
                      ApiAggregateRateLimit: "1000",
                      ResolutionCreateRateLimit: "100"
                    }
                    and (
                      [
                        $current.Outputs[]
                        | select(.OutputKey == "ControlPlaneRegion")
                        | .OutputValue
                      ]
                    ) == ["us-east-1"]
                  ) as $valid
                | if $valid
                  then [
                    $current.Outputs[]
                    | select(.OutputKey == "WebAclArn")
                    | .OutputValue
                    | select(
                        test(
                          "^arn:aws:wafv2:us-east-1:" + $account
                          + ":global/webacl/" + $app
                          + "-staging-cloudfront/[0-9a-f-]+$"
                        )
                      )
                  ]
                  | select(length == 1)
                  | .[0]
                  else error("invalid staging edge-stack handoff")
                  end
              ' "$stack"
          )"
          echo "CLOUDFRONT_WEB_ACL_ARN=$web_acl_arn" >>"$GITHUB_ENV"

      - name: Deploy staging with recovery-safe SAM canary
        id: deploy
        env:
          ALARM_TOPIC_ARN: ${{ steps.alarm_routing.outputs.topic_arn }}
          CANARY_URL: ${{ steps.previous.outputs.application_url }}
          DRILL_GATE_OUTCOME: ${{ steps.drill_gate.outcome }}
          DRILL_SOURCE_ARTIFACT_DIGEST: ${{ steps.drill_gate.outputs.source_receipt_artifact_digest }}
          ENVIRONMENT: staging
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_STACK_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_SECRET_ID"
          test -n "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN"
          test -n "$AWS_SAM_ARTIFACT_BUCKET"
          test -n "$AWS_LAMBDA_EXECUTION_ROLE_ARN"
          test -n "$AWS_CODEDEPLOY_SERVICE_ROLE_ARN"
          [[ "$COCKROACH_SQL_DNS" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]
          test "${#COCKROACH_SQL_DNS}" -le 253
          [[ "$CLOUDFRONT_WEB_ACL_ARN" =~ ^arn:aws:wafv2:us-east-1:${AWS_ACCOUNT_ID}:global/webacl/[A-Za-z0-9_-]+/[0-9a-f-]+$ ]]
          candidate_database_secret_id="$DATABASE_SECRET_ID"
          if [ "$DEPLOY_OPERATION" = "staging-recovery-drill" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$DRILL_GATE_OUTCOME" = "success"
            [[ "$DRILL_SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$HAS_PREVIOUS_STACK" = "true"
            candidate_database_secret_id="${APP_NAME}/staging/recovery-drill-inaccessible-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test "$candidate_database_secret_id" != "$DATABASE_SECRET_ID"
          else
            test "$DEPLOY_OPERATION" = "release"
            test "$GITHUB_EVENT_NAME" = "push"
            test "$RECOVERY_DRILL_TOKEN" = "disabled"
          fi
          # SAM CLI 1.164.0 accepts file-backed overrides only through its
          # TOML/YAML readers; JSON support is intentionally disabled upstream.
          # JSON is valid YAML 1.2, so jq still gives us an exact, typed mapping
          # while the supported .yaml extension preserves an explicit empty
          # AlarmTopicArn instead of losing it in shorthand parsing.
          parameter_overrides_file="${RUNNER_TEMP:?}/staging-sam-parameters.yaml"
          jq -n \
            --arg appName "$APP_NAME" \
            --arg environment "staging" \
            --arg databaseSecretId "$candidate_database_secret_id" \
            --arg lambdaRole "$AWS_LAMBDA_EXECUTION_ROLE_ARN" \
            --arg codeDeployRole "$AWS_CODEDEPLOY_SERVICE_ROLE_ARN" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg recoveryDrillToken "$RECOVERY_DRILL_TOKEN" \
            --arg bedrockRegion "$BEDROCK_REGION" \
            --arg embeddingModel "$BEDROCK_EMBED_MODEL_ID" \
            --arg narratorModel "$BEDROCK_NARRATOR_MODEL_ID" \
            --arg cockroachRegion "eu-west-1" \
            --arg cockroachEvidence \
              "cockroach-cloud-api-release-gate" \
            --arg cockroachSqlDns "$COCKROACH_SQL_DNS" \
            --arg reservedConcurrency "5" \
            --arg alarmTopicArn "$ALARM_TOPIC_ARN" \
            --arg cloudFrontWebAclArn "$CLOUDFRONT_WEB_ACL_ARN" \
            '{
              AppName: $appName,
              Environment: $environment,
              DatabaseSecretId: $databaseSecretId,
              LambdaExecutionRoleArn: $lambdaRole,
              CodeDeployServiceRoleArn: $codeDeployRole,
              ReleaseCommitSha: $releaseCommitSha,
              RecoveryDrillToken: $recoveryDrillToken,
              BedrockRegion: $bedrockRegion,
              BedrockEmbeddingModelId: $embeddingModel,
              BedrockNarratorModelId: $narratorModel,
              CockroachRegion: $cockroachRegion,
              CockroachRegionEvidence: $cockroachEvidence,
              CockroachSqlDns: $cockroachSqlDns,
              ReservedConcurrency: $reservedConcurrency,
              AlarmTopicArn: $alarmTopicArn,
              CloudFrontWebAclArn: $cloudFrontWebAclArn
            }' >"$parameter_overrides_file"
          jq -e \
            --arg environment "staging" \
            --arg databaseSecretId "$candidate_database_secret_id" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg recoveryDrillToken "$RECOVERY_DRILL_TOKEN" \
            --arg reservedConcurrency "5" \
            --arg alarmTopicArn "$ALARM_TOPIC_ARN" \
            --arg cloudFrontWebAclArn "$CLOUDFRONT_WEB_ACL_ARN" \
            '
              (keys | sort) == (
                [
                  "AlarmTopicArn",
                  "AppName",
                  "BedrockEmbeddingModelId",
                  "BedrockNarratorModelId",
                  "BedrockRegion",
                  "CockroachRegion",
                  "CockroachRegionEvidence",
                  "CockroachSqlDns",
                  "CloudFrontWebAclArn",
                  "CodeDeployServiceRoleArn",
                  "DatabaseSecretId",
                  "Environment",
                  "LambdaExecutionRoleArn",
                  "ReleaseCommitSha",
                  "RecoveryDrillToken",
                  "ReservedConcurrency"
                ] | sort
              )
              and all(.[]; type == "string")
              and .Environment == $environment
              and .DatabaseSecretId == $databaseSecretId
              and .ReleaseCommitSha == $releaseCommitSha
              and .RecoveryDrillToken == $recoveryDrillToken
              and .ReservedConcurrency == $reservedConcurrency
              and .AlarmTopicArn == $alarmTopicArn
              and .CloudFrontWebAclArn == $cloudFrontWebAclArn
              and .CockroachSqlDns == env.COCKROACH_SQL_DNS
            ' "$parameter_overrides_file" >/dev/null
          target_tags="${RUNNER_TEMP:?}/staging-sam-stack-tags.json"
          if [ "$EXPECTED_STACK_STATE" = "greenfield" ]; then
            [[ "$GREENFIELD_OWNER" =~ ^[0-9a-f]{64}$ ]]
            prior_tags="${RUNNER_TEMP:?}/staging-greenfield-base-tags.json"
            jq -n '[]' >"$prior_tags"
          else
            test "$EXPECTED_STACK_STATE" = "existing"
            test -z "$GREENFIELD_OWNER"
            [[ "$PREVIOUS_STACK_TAGS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$(
              sha256sum previous-stack-tags.json | awk '{print $1}'
            )" = "$PREVIOUS_STACK_TAGS_SHA256"
            prior_tags=previous-stack-tags.json
          fi
          GREENFIELD_OWNER="$GREENFIELD_OWNER" \
            bash aws/merge-canonical-stack-tags.sh \
              "$prior_tags" >"$target_tags"
          serialized_tags_file="${RUNNER_TEMP:?}/staging-sam-stack-tags.argv"
          bash aws/serialize-sam-stack-tags.sh \
            "$target_tags" >"$serialized_tags_file"
          mapfile -t canonical_stack_tags <"$serialized_tags_file"
          test "${#canonical_stack_tags[@]}" -ge 2
          SAM_TAGS=(--tags "${canonical_stack_tags[@]}")
          target_tags_sha256="$(
            sha256sum "$target_tags" | awk '{print $1}'
          )"
          [[ "$target_tags_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "target_tags_sha256=$target_tags_sha256" >>"$GITHUB_OUTPUT"
          DRILL_OBSERVER_PID=""
          CANARY_PROBE_PID=""
          stop_canary_probe() {
            if [ -n "$CANARY_PROBE_PID" ]; then
              kill "$CANARY_PROBE_PID" 2>/dev/null || true
              wait "$CANARY_PROBE_PID" 2>/dev/null || true
              CANARY_PROBE_PID=""
            fi
          }
          stop_drill_observer() {
            if [ -n "$DRILL_OBSERVER_PID" ]; then
              kill "$DRILL_OBSERVER_PID" 2>/dev/null || true
              wait "$DRILL_OBSERVER_PID" 2>/dev/null || true
              DRILL_OBSERVER_PID=""
            fi
          }
          cleanup_deploy_background() {
            stop_canary_probe
            stop_drill_observer
          }
          trap cleanup_deploy_background EXIT

          if [ "$DEPLOY_OPERATION" = "staging-recovery-drill" ]; then
            drill_resources="${RUNNER_TEMP:?}/staging-recovery-drill-codedeploy-resources.json"
            drill_group_before="${RUNNER_TEMP:?}/staging-recovery-drill-group-before.json"
            drill_deployments_before="${RUNNER_TEMP:?}/staging-recovery-drill-deployments-before.json"
            drill_started_epoch_file="${RUNNER_TEMP:?}/staging-recovery-drill-started-epoch"
            aws cloudformation describe-stack-resources \
              --stack-name "$PREVIOUS_STACK_ID" \
              --region "$AWS_REGION" \
              --output json >"$drill_resources"
            jq -e '
              ([.StackResources[]
                | select(.ResourceType == "AWS::CodeDeploy::Application")]
                | length) == 1
              and ([.StackResources[]
                | select(.ResourceType == "AWS::CodeDeploy::DeploymentGroup")]
                | length) == 1
            ' "$drill_resources" >/dev/null
            drill_codedeploy_application="$(jq -er '
              .StackResources[]
              | select(.ResourceType == "AWS::CodeDeploy::Application")
              | .PhysicalResourceId
            ' "$drill_resources")"
            drill_codedeploy_group="$(jq -er '
              .StackResources[]
              | select(.ResourceType == "AWS::CodeDeploy::DeploymentGroup")
              | .PhysicalResourceId
            ' "$drill_resources")"
            [[ "$drill_codedeploy_application" =~ ^[A-Za-z0-9._+=,@-]{1,100}$ ]]
            [[ "$drill_codedeploy_group" =~ ^[A-Za-z0-9._+=,@-]{1,100}$ ]]
            aws deploy get-deployment-group \
              --application-name "$drill_codedeploy_application" \
              --deployment-group-name "$drill_codedeploy_group" \
              --region "$AWS_REGION" \
              --output json >"$drill_group_before"
            jq -e \
              --arg application "$drill_codedeploy_application" \
              --arg group "$drill_codedeploy_group" '
                .deploymentGroupInfo.applicationName == $application
                and .deploymentGroupInfo.deploymentGroupName == $group
                and .deploymentGroupInfo.computePlatform == "Lambda"
              ' "$drill_group_before" >/dev/null
            date -u +%s >"$drill_started_epoch_file"
            grep -Eq '^[1-9][0-9]{8,}$' "$drill_started_epoch_file"
            aws deploy list-deployments \
              --application-name "$drill_codedeploy_application" \
              --deployment-group-name "$drill_codedeploy_group" \
              --region "$AWS_REGION" \
              --output json >"$drill_deployments_before"
            jq -e '
              keys == ["deployments"]
              and (.deployments | type == "array")
              and all(.deployments[]; test("^d-[A-Z0-9]+$"))
              and ((.deployments | unique | length) == (.deployments | length))
            ' "$drill_deployments_before" >/dev/null
          fi

          if [ -n "$CANARY_URL" ] && [ "$CANARY_URL" != "None" ]; then
            (
              # Exercise both the live proof boundary and the critical recall
              # path. The CodeDeploy alarm is scoped to the candidate's exact
              # ExecutedVersion, so failures from the previous weighted-alias
              # target cannot poison its recovery.
              attempt=0
              while true; do
                attempt=$((attempt + 1))
                curl --fail --silent --max-time 30 \
                  "$CANARY_URL/api/proof" >/dev/null 2>&1 || true
                if [ $((attempt % 5)) -eq 0 ]; then
                  curl --fail --silent --max-time 45 \
                    -X POST "$CANARY_URL/api/recall" \
                    -H 'content-type: application/json' \
                    --data '{"question":"What was the true employer cost and the off-bank wedge?","kind":"payroll_event","limit":5}' \
                    >/dev/null 2>&1 || true
                fi
                sleep 2
              done
            ) &
            CANARY_PROBE_PID=$!
          fi
          if [ "$DEPLOY_OPERATION" = "staging-recovery-drill" ]; then
            (
              set -euo pipefail
              observation="${RUNNER_TEMP:?}/staging-recovery-drill-live-observation.json"
              for _ in {1..300}; do
                alias_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-alias-observed.tmp"
                alarm_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-alarm-observed.tmp"
                group_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-group-observed.tmp"
                if aws lambda get-alias \
                    --function-name "$PREVIOUS_FUNCTION_NAME" \
                    --name live \
                    --region "$AWS_REGION" \
                    --output json >"$alias_tmp" 2>/dev/null; then
                  candidate_version=""
                  candidate_version="$(jq -er \
                    --arg previous "$PREVIOUS_FUNCTION_VERSION" '
                      (.RoutingConfig.AdditionalVersionWeights // {}) as $weights
                      | select(
                          .Name == "live"
                          and .FunctionVersion == $previous
                          and ($weights | length) == 1
                        )
                      | ($weights | to_entries[0])
                      | select(
                          (.key | test("^[1-9][0-9]*$"))
                          and .key != $previous
                          and .value >= 0.099
                          and .value <= 0.101
                        )
                      | .key
                    ' "$alias_tmp" 2>/dev/null || true)"
                  if [[ "$candidate_version" =~ ^[1-9][0-9]*$ ]]; then
                    alarm_name="${APP_NAME}-staging-lambda-canary-errors-v${candidate_version}"
                    if aws cloudwatch describe-alarms \
                        --alarm-names "$alarm_name" \
                        --region "$AWS_REGION" \
                        --output json >"$alarm_tmp" 2>/dev/null &&
                       aws deploy get-deployment-group \
                        --application-name "$drill_codedeploy_application" \
                        --deployment-group-name "$drill_codedeploy_group" \
                        --region "$AWS_REGION" \
                        --output json >"$group_tmp" 2>/dev/null &&
                       jq -e \
                        --arg alarm "$alarm_name" \
                        --arg function "$PREVIOUS_FUNCTION_NAME" \
                        --arg version "$candidate_version" '
                          (.MetricAlarms | length) == 1
                          and .MetricAlarms[0].AlarmName == $alarm
                          and .MetricAlarms[0].StateValue == "ALARM"
                          and .MetricAlarms[0].Namespace == "AWS/Lambda"
                          and .MetricAlarms[0].MetricName == "Errors"
                          and .MetricAlarms[0].Threshold == 1
                          and .MetricAlarms[0].ComparisonOperator ==
                            "GreaterThanOrEqualToThreshold"
                          and .MetricAlarms[0].TreatMissingData == "notBreaching"
                          and ([.MetricAlarms[0].Dimensions[]
                            | {Name, Value}] | sort_by(.Name)) == ([
                              {Name: "ExecutedVersion", Value: $version},
                              {Name: "FunctionName", Value: $function},
                              {Name: "Resource", Value: ($function + ":live")}
                            ] | sort_by(.Name))
                        ' "$alarm_tmp" >/dev/null &&
                       jq -e \
                        --arg alarm "$alarm_name" \
                        --arg application "$drill_codedeploy_application" \
                        --arg group "$drill_codedeploy_group" '
                          .deploymentGroupInfo.applicationName == $application
                          and .deploymentGroupInfo.deploymentGroupName == $group
                          and .deploymentGroupInfo.computePlatform == "Lambda"
                          and .deploymentGroupInfo.deploymentConfigName ==
                            "CodeDeployDefault.LambdaCanary10Percent5Minutes"
                          and .deploymentGroupInfo.alarmConfiguration.enabled == true
                          and .deploymentGroupInfo.alarmConfiguration.ignorePollAlarmFailure == false
                          and ([.deploymentGroupInfo.alarmConfiguration.alarms[].name] == [$alarm])
                          and .deploymentGroupInfo.autoRollbackConfiguration.enabled == true
                          and (.deploymentGroupInfo.autoRollbackConfiguration.events
                            | index("DEPLOYMENT_STOP_ON_ALARM")) != null
                        ' "$group_tmp" >/dev/null; then
                      jq -n \
                        --slurpfile alias "$alias_tmp" \
                        --slurpfile alarm "$alarm_tmp" \
                        --slurpfile group "$group_tmp" \
                        --arg candidateVersion "$candidate_version" \
                        --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
                          {
                            observedAt: $observedAt,
                            candidateVersion: $candidateVersion,
                            alias: $alias[0],
                            alarm: $alarm[0],
                            deploymentGroup: $group[0]
                          }
                        ' >"${observation}.tmp"
                      mv "${observation}.tmp" "$observation"
                      exit 0
                    fi
                  fi
                fi
                sleep 2
              done
              echo "The protected drill never observed the exact ALARM canary boundary." >&2
              exit 1
            ) &
            DRILL_OBSERVER_PID=$!
          fi
          if [ "$EXPECTED_STACK_STATE:$HAS_PREVIOUS_STACK" = "existing:true" ]; then
            final_stack="${RUNNER_TEMP:?}/staging-stack-final-before-sam.json"
            aws cloudformation describe-stacks \
              --stack-name "$PREVIOUS_STACK_ID" \
              --region "$AWS_REGION" \
              --output json >"$final_stack"
            jq -e \
              --arg stackId "$PREVIOUS_STACK_ID" \
              --arg status "$PREVIOUS_STACK_STATUS" \
              --arg revision "$PREVIOUS_STACK_REVISION" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackId == $stackId
                and .Stacks[0].StackStatus == $status
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime) == $revision
                )
                and .Stacks[0].RoleARN == $role
              ' "$final_stack" >/dev/null
            final_tags="${RUNNER_TEMP:?}/staging-tags-final-before-sam.json"
            jq -e \
              '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
              "$final_stack" >"$final_tags"
            test "$(
              sha256sum "$final_tags" | awk '{print $1}'
            )" = "$PREVIOUS_STACK_TAGS_SHA256"
            aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json |
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' >/dev/null
          elif [ "$EXPECTED_STACK_STATE:$HAS_PREVIOUS_STACK" = "greenfield:false" ]; then
            if final_stack_state="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "A stack appeared immediately before the greenfield SAM deploy." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$final_stack_state"; then
              echo "Unable to prove final greenfield absence before SAM." >&2
              exit 1
            fi
          else
            echo "The final stack-state contract is inconsistent." >&2
            exit 1
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"
          set +e
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$AWS_SAM_ARTIFACT_BUCKET" \
            --s3-prefix "candidates/deployments/staging/${{ github.sha }}" \
            --kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --role-arn "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides "file://${parameter_overrides_file}" \
            "${SAM_TAGS[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar
          sam_status=$?
          set -e
          stop_canary_probe
          if [ "$DEPLOY_OPERATION" = "staging-recovery-drill" ]; then
            observer_status=1
            for _ in {1..30}; do
              if [ -s "${RUNNER_TEMP:?}/staging-recovery-drill-live-observation.json" ]; then
                break
              fi
              if ! kill -0 "$DRILL_OBSERVER_PID" 2>/dev/null; then
                break
              fi
              sleep 2
            done
            set +e
            if [ -s "${RUNNER_TEMP:?}/staging-recovery-drill-live-observation.json" ]; then
              wait "$DRILL_OBSERVER_PID"
              observer_status=$?
            else
              if kill -0 "$DRILL_OBSERVER_PID" 2>/dev/null; then
                kill "$DRILL_OBSERVER_PID" 2>/dev/null
              fi
              wait "$DRILL_OBSERVER_PID"
              observer_status=$?
            fi
            set -e
            DRILL_OBSERVER_PID=""
            test "$sam_status" -ne 0
            test "$observer_status" -eq 0
            test -s "${RUNNER_TEMP:?}/staging-recovery-drill-live-observation.json"
            trap - EXIT
            exit "$sam_status"
          fi
          test "$sam_status" -eq 0
          trap - EXIT

      - name: Refresh short-lived AWS credentials after staging SAM deployment
        if: success()
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-post-sam-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve public, non-secret stack outputs
        id: stack
        env:
          ENVIRONMENT: staging
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          TARGET_STACK_TAGS_SHA256: ${{ steps.deploy.outputs.target_tags_sha256 }}
        run: |
          set -euo pipefail
          post_sam_stack="${RUNNER_TEMP:?}/staging-stack-after-sam.json"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output json >"$post_sam_stack"
          jq -e \
            --arg stack "$STACK_NAME" \
            --arg stackPrefix \
              "arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${STACK_NAME}/" \
            --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg owner "$GREENFIELD_OWNER" \
            --arg previousStackId "$PREVIOUS_STACK_ID" \
            --arg app "$APP_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg reservedConcurrency "5" \
            --arg cockroachSqlDns "$COCKROACH_SQL_DNS" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and (.Stacks[0].StackId | startswith($stackPrefix))
              and .Stacks[0].RoleARN == $role
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "ReleaseCommitSha")
                  | .ParameterValue] == [$releaseCommitSha]
              )
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "ReservedConcurrency")
                  | .ParameterValue] == [$reservedConcurrency]
              )
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "CockroachSqlDns")
                  | .ParameterValue] == [$cockroachSqlDns]
              )
              and (
                [.Stacks[0].Tags[]?
                  | select(.Key == "Application")
                  | .Value] == [$app]
              )
              and (
                [.Stacks[0].Tags[]?
                  | select(.Key == "Environment")
                  | .Value] == [$environment]
              )
              and (
                [.Stacks[0].Tags[]?.Key] as $keys
                | ($keys | unique | length) == ($keys | length)
              )
              and (
                (
                  $stackState == "greenfield"
                  and $previousStackId == ""
                  and .Stacks[0].StackStatus == "CREATE_COMPLETE"
                  and ((.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key))
                    == ([
                      {Key: "Application", Value: $app},
                      {Key: "ArchonGreenfieldOwner", Value: $owner},
                      {Key: "Environment", Value: $environment}
                    ] | sort_by(.Key))
                )
                or (
                  $stackState == "existing"
                  and .Stacks[0].StackId == $previousStackId
                  and $owner == ""
                  and (
                    .Stacks[0].StackStatus == "CREATE_COMPLETE"
                    or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                    or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
                  )
                )
              )
            ' "$post_sam_stack" >/dev/null
          post_sam_tags="${RUNNER_TEMP:?}/staging-tags-after-sam.json"
          jq -eS \
            '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
            "$post_sam_stack" >"$post_sam_tags"
          [[ "$TARGET_STACK_TAGS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(
            sha256sum "$post_sam_tags" | awk '{print $1}'
          )" = "$TARGET_STACK_TAGS_SHA256"
          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            test -z "$GREENFIELD_OWNER"
          else
            test "$EXPECTED_STACK_STATE" = "greenfield"
            [[ "$GREENFIELD_OWNER" =~ ^[0-9a-f]{64}$ ]]
          fi
          OUTPUTS="$(jq -cer '.Stacks[0].Outputs' "$post_sam_stack")"
          APPLICATION_URL="$(jq -er '.[] | select(.OutputKey == "ApplicationUrl") | .OutputValue' <<<"$OUTPUTS")"
          BUCKET_NAME="$(jq -er '.[] | select(.OutputKey == "SpaBucketName") | .OutputValue' <<<"$OUTPUTS")"
          DISTRIBUTION_ID="$(jq -er '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<<"$OUTPUTS")"
          API_ENDPOINT="$(jq -er '.[] | select(.OutputKey == "ApiEndpoint") | .OutputValue' <<<"$OUTPUTS")"
          API_ID="$(jq -er '.[] | select(.OutputKey == "ApiId") | .OutputValue' <<<"$OUTPUTS")"
          API_STAGE_NAME="$(jq -er '.[] | select(.OutputKey == "ApiStageName") | .OutputValue' <<<"$OUTPUTS")"
          API_ACCESS_LOG_GROUP="$(jq -er '.[] | select(.OutputKey == "ApiAccessLogGroupName") | .OutputValue' <<<"$OUTPUTS")"
          STACK_ID="$(jq -er '.Stacks[0].StackId' "$post_sam_stack")"
          STACK_REVISION="$(
            jq -er \
              '.Stacks[0].LastUpdatedTime // .Stacks[0].CreationTime' \
              "$post_sam_stack"
          )"
          STACK_TAGS_SHA256="$(
            sha256sum "$post_sam_tags" | awk '{print $1}'
          )"
          {
            echo "application_url=$APPLICATION_URL"
            echo "bucket_name=$BUCKET_NAME"
            echo "distribution_id=$DISTRIBUTION_ID"
            echo "api_endpoint=$API_ENDPOINT"
            echo "api_id=$API_ID"
            echo "api_stage_name=$API_STAGE_NAME"
            echo "api_access_log_group=$API_ACCESS_LOG_GROUP"
            echo "stack_id=$STACK_ID"
            echo "stack_revision=$STACK_REVISION"
            echo "tags_sha256=$STACK_TAGS_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Prove staging alarm routing after stack mutation
        env:
          ENVIRONMENT: staging
        run: |
          set -euo pipefail
          discovery="${RUNNER_TEMP:?}/staging-alarm-routing-discovery.json"
          proof="${RUNNER_TEMP:?}/staging-alarm-routing-proof.json"
          test -f "$discovery"
          bash aws/prove-alarm-routing.sh verify | tee "$proof"
          jq -e \
            --slurpfile discovery "$discovery" \
            '
              ($discovery | length) == 1
              and .ok == true
              and .schema == "archon.alarm-routing.proof"
              and .version == 1
              and .mode == "verify"
              and .environment == $discovery[0].environment
              and .foundationStackId == $discovery[0].foundationStackId
              and .state == $discovery[0].state
              and .contractVersion == $discovery[0].contractVersion
              and .keyArn == $discovery[0].keyArn
              and .topicArn == $discovery[0].topicArn
              and .archiveQueueArn == $discovery[0].archiveQueueArn
              and (
                (
                  .state == "legacy-inactive-not-provisioned"
                  and .alarmCount == null
                )
                or (
                  (
                    .state == "inactive-not-provisioned"
                    or .state == "active"
                  )
                  and .alarmCount == 4
                )
              )
            ' "$proof" >/dev/null

      - name: Prove live application S3 access logging before frontend mutation
        id: application_s3_verify
        env:
          ENVIRONMENT: staging
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          bash aws/prove-application-s3-access-logging.sh verify |
            tee application-s3-access-logging-proof.json
          jq -e \
            --slurpfile preflight application-s3-access-logging-preflight.json \
            --arg environment "$ENVIRONMENT" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg source "${APP_NAME}-${ENVIRONMENT}-web-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg destination "${APP_NAME}-s3-access-logs-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg prefix "${ENVIRONMENT}-web/" \
            '
              ($preflight | length) == 1
              and .ok == true
              and .schema == "archon.application-s3-access-logging.proof"
              and .version == 1
              and .mode == "verify"
              and .evidence == "live-control-plane"
              and .foundationVerified == true
              and .processedTemplateManaged == true
              and .environment == $environment
              and .stackState == $stackState
              and (
                (
                  $stackState == "greenfield"
                  and .stackStatus == "CREATE_COMPLETE"
                )
                or (
                  $stackState == "existing"
                  and (
                    .stackStatus == "CREATE_COMPLETE"
                    or .stackStatus == "UPDATE_COMPLETE"
                    or .stackStatus == "UPDATE_ROLLBACK_COMPLETE"
                  )
                )
              )
              and .sourceBucket == $source
              and .destinationBucket == $destination
              and .liveState == "enabled"
              and .preflightIntegrity == $preflight[0].integrity
              and .expected == .liveConfiguration
              and .liveConfiguration == {
                "LoggingEnabled": {
                  "TargetBucket": $destination,
                  "TargetPrefix": $prefix,
                  "TargetObjectKeyFormat": {
                    "PartitionedPrefix": {
                      "PartitionDateSource": "EventTime"
                    }
                  }
                }
              }
            ' application-s3-access-logging-proof.json >/dev/null
          proof_sha256="$(
            sha256sum application-s3-access-logging-proof.json |
              awk '{print $1}'
          )"
          [[ "$proof_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "receipt_sha256=$proof_sha256" >>"$GITHUB_OUTPUT"

      - name: Prove transformed and live API stage routing before frontend mutation
        env:
          API_ID: ${{ steps.stack.outputs.api_id }}
          API_STAGE_NAME: ${{ steps.stack.outputs.api_stage_name }}
          API_ENDPOINT: ${{ steps.stack.outputs.api_endpoint }}
          API_ACCESS_LOG_GROUP: ${{ steps.stack.outputs.api_access_log_group }}
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
        run: |
          set -euo pipefail
          bash aws/prove-api-stage-controls.sh |
            tee api-stage-proof.json
          jq -e \
            '.ok == true and
             .stage == "live" and
             .legacyDefaultStageAbsent == true and
             .detailedMetrics == true and
             .throttlingRate == 5 and
             .throttlingBurst == 10 and
             .cloudFrontStatus == "Deployed" and
             .cloudFrontOriginPath == "/live" and
             .directStageHealth == "GET /live/api/health 200" and
             .sameOriginHealth == "GET /api/health 200" and
             .accessLogEvent == "GET /api/health 200"' \
            api-stage-proof.json >/dev/null

      - name: Prove alarm-triggered CodeDeploy and CloudFormation rollback
        id: fault_injection
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'staging-recovery-drill' &&
          steps.deploy.outcome == 'failure'
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DRILL_SOURCE_ARTIFACT_DIGEST: ${{ steps.drill_gate.outputs.source_receipt_artifact_digest }}
          EXPECTED_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$DEPLOY_OPERATION" = "staging-recovery-drill"
          test "$DEPLOY_OUTCOME" = "failure"
          test "$CONFIRMATION" = \
            "FAULT-INJECT-STAGING-RECOVERY-AND-REQUIRE-WATCHDOG"
          [[ "$APPROVAL_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$ ]]
          test "$RECOVERY_DRILL_TOKEN" = \
            "drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$DRILL_SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$PREVIOUS_FUNCTION_NAME"
          [[ "$PREVIOUS_FUNCTION_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREVIOUS_STACK_ID" =~ ^arn:aws:cloudformation:eu-west-1:[0-9]{12}:stack/${STACK_NAME}/[0-9a-f-]+$ ]]
          [[ "$RECOVERY_INTENT_ID" =~ ^[0-9a-f]{64}$ ]]

          source_proof="${RUNNER_TEMP:?}/staging-recovery-drill-source.json"
          observation="${RUNNER_TEMP:?}/staging-recovery-drill-live-observation.json"
          resources="${RUNNER_TEMP:?}/staging-recovery-drill-codedeploy-resources.json"
          deployments_before="${RUNNER_TEMP:?}/staging-recovery-drill-deployments-before.json"
          drill_started_epoch_file="${RUNNER_TEMP:?}/staging-recovery-drill-started-epoch"
          deployments_after="${RUNNER_TEMP:?}/staging-recovery-drill-deployments-after.json"
          deployment_details="${RUNNER_TEMP:?}/staging-recovery-drill-deployment-details.json"
          codedeploy_proof="${RUNNER_TEMP:?}/staging-recovery-drill-codedeploy-proof.json"
          stack_state="${RUNNER_TEMP:?}/staging-recovery-drill-stack-automatic-rollback.json"
          stack_template="${RUNNER_TEMP:?}/staging-recovery-drill-template-automatic-rollback.yaml"
          alias_state="${RUNNER_TEMP:?}/staging-recovery-drill-alias-automatic-rollback.json"
          health="${RUNNER_TEMP:?}/staging-recovery-drill-health-automatic-rollback.json"
          proof="${RUNNER_TEMP:?}/staging-recovery-drill-memory-proof-automatic-rollback.json"
          receipt="${RUNNER_TEMP:?}/staging-recovery-drill-receipt.json"
          for required in \
            "$source_proof" \
            "$observation" \
            "$resources" \
            "$deployments_before" \
            "$drill_started_epoch_file" \
            previous-stack-parameters.json \
            previous-stack-tags.json \
            previous-stack-template.yaml \
            "${RUNNER_TEMP:?}/staging-stack-before.json"; do
            test -s "$required"
            test ! -L "$required"
          done
          read -r drill_started_epoch <"$drill_started_epoch_file"
          [[ "$drill_started_epoch" =~ ^[1-9][0-9]{8,}$ ]]

          codedeploy_application="$(jq -er '
            .StackResources[]
            | select(.ResourceType == "AWS::CodeDeploy::Application")
            | .PhysicalResourceId
          ' "$resources")"
          codedeploy_group="$(jq -er '
            .StackResources[]
            | select(.ResourceType == "AWS::CodeDeploy::DeploymentGroup")
            | .PhysicalResourceId
          ' "$resources")"
          [[ "$codedeploy_application" =~ ^[A-Za-z0-9._+=,@-]{1,100}$ ]]
          [[ "$codedeploy_group" =~ ^[A-Za-z0-9._+=,@-]{1,100}$ ]]

          candidate_version="$(jq -er '
            .candidateVersion
            | select(test("^[1-9][0-9]*$"))
          ' "$observation")"
          test "$candidate_version" != "$PREVIOUS_FUNCTION_VERSION"
          candidate_alarm="${APP_NAME}-staging-lambda-canary-errors-v${candidate_version}"
          jq -e \
            --arg alarm "$candidate_alarm" \
            --arg application "$codedeploy_application" \
            --arg candidate "$candidate_version" \
            --arg function "$PREVIOUS_FUNCTION_NAME" \
            --arg group "$codedeploy_group" \
            --arg previous "$PREVIOUS_FUNCTION_VERSION" '
              .candidateVersion == $candidate
              and .alias.Name == "live"
              and .alias.FunctionVersion == $previous
              and (.alias.RoutingConfig.AdditionalVersionWeights
                | keys == [$candidate])
              and (.alias.RoutingConfig.AdditionalVersionWeights[$candidate]
                >= 0.099)
              and (.alias.RoutingConfig.AdditionalVersionWeights[$candidate]
                <= 0.101)
              and (.alarm.MetricAlarms | length) == 1
              and .alarm.MetricAlarms[0].AlarmName == $alarm
              and .alarm.MetricAlarms[0].StateValue == "ALARM"
              and .deploymentGroup.deploymentGroupInfo.applicationName ==
                $application
              and .deploymentGroup.deploymentGroupInfo.deploymentGroupName ==
                $group
              and .deploymentGroup.deploymentGroupInfo.computePlatform == "Lambda"
              and .deploymentGroup.deploymentGroupInfo.deploymentConfigName ==
                "CodeDeployDefault.LambdaCanary10Percent5Minutes"
              and .deploymentGroup.deploymentGroupInfo.alarmConfiguration.enabled == true
              and .deploymentGroup.deploymentGroupInfo.alarmConfiguration.ignorePollAlarmFailure == false
              and ([.deploymentGroup.deploymentGroupInfo.alarmConfiguration.alarms[].name]
                == [$alarm])
              and .deploymentGroup.deploymentGroupInfo.autoRollbackConfiguration.enabled == true
              and (.deploymentGroup.deploymentGroupInfo.autoRollbackConfiguration.events
                | index("DEPLOYMENT_STOP_ON_ALARM")) != null
              and (.observedAt | test("Z$"))
            ' "$observation" >/dev/null

          codedeploy_proved=false
          for _ in {1..60}; do
            aws deploy list-deployments \
              --application-name "$codedeploy_application" \
              --deployment-group-name "$codedeploy_group" \
              --region "$AWS_REGION" \
              --output json >"$deployments_after"
            jq -n '[]' >"$deployment_details"
            mapfile -t new_deployment_ids < <(jq -er \
              --slurpfile before "$deployments_before" '
                [
                  .deployments[] as $deploymentId
                  | select(
                      ($before[0].deployments | index($deploymentId)) == null
                    )
                  | $deploymentId
                ]
                | unique[]
              ' "$deployments_after")
            for deployment_id in "${new_deployment_ids[@]}"; do
              [[ "$deployment_id" =~ ^d-[A-Z0-9]+$ ]]
              detail_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-deployment-${deployment_id}.json"
              revision_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-revision-${deployment_id}.json"
              record_tmp="${RUNNER_TEMP:?}/staging-recovery-drill-record-${deployment_id}.json"
              aws deploy get-deployment \
                --deployment-id "$deployment_id" \
                --region "$AWS_REGION" \
                --output json >"$detail_tmp"
              if jq -e '
                  .deploymentInfo.revision.revisionType == "AppSpecContent"
                  and (.deploymentInfo.revision.appSpecContent.sha256
                    | type == "string"
                    and test("^[0-9a-f]{64}$"))
                ' "$detail_tmp" >/dev/null; then
                bash aws/fetch-codedeploy-appspec-revision.sh \
                  "$detail_tmp" \
                  "$codedeploy_application" \
                  "$revision_tmp"
              else
                jq -n 'null' >"$revision_tmp"
              fi
              jq -n \
                --slurpfile detail "$detail_tmp" \
                --slurpfile revision "$revision_tmp" '
                  {
                    deploymentInfo: $detail[0].deploymentInfo,
                    applicationRevision: $revision[0]
                  }
                ' >"$record_tmp"
              jq -s '.[0] + [.[1]]' \
                "$deployment_details" "$record_tmp" \
                >"${deployment_details}.tmp"
              mv "${deployment_details}.tmp" "$deployment_details"
            done
            drill_ended_epoch="$(date -u +%s)"
            [[ "$drill_ended_epoch" =~ ^[1-9][0-9]{8,}$ ]]
            candidate_observed_at="$(jq -er '.observedAt' "$observation")"
            if EXPECTED_CODEDEPLOY_APPLICATION="$codedeploy_application" \
              EXPECTED_CODEDEPLOY_GROUP="$codedeploy_group" \
              EXPECTED_LAMBDA_FUNCTION_NAME="$PREVIOUS_FUNCTION_NAME" \
              EXPECTED_LAMBDA_ALIAS="live" \
              EXPECTED_PREVIOUS_VERSION="$PREVIOUS_FUNCTION_VERSION" \
              EXPECTED_CANDIDATE_VERSION="$candidate_version" \
              EXPECTED_CLOUDFORMATION_STACK_ID="$PREVIOUS_STACK_ID" \
              EXPECTED_DRILL_STARTED_EPOCH="$drill_started_epoch" \
              EXPECTED_CANDIDATE_OBSERVED_AT="$candidate_observed_at" \
              EXPECTED_DRILL_ENDED_EPOCH="$drill_ended_epoch" \
              node aws/select-staging-codedeploy-rollback.mjs \
                "$deployment_details" >"$codedeploy_proof"; then
              codedeploy_proved=true
              break
            fi
            sleep 5
          done
          test "$codedeploy_proved" = "true"
          jq -e '
            .relationProved == true
            and .source.status == "Stopped"
            and .source.errorInformation.code == "ALARM_ACTIVE"
            and .rollback.status == "Succeeded"
            and .sourceBinding.externalStackIdMatched == true
            and .sourceBinding.createTimeWithinDrillWindow == true
            and .sourceBinding.functionNameMatched == true
            and .sourceBinding.functionAliasMatched == true
            and .sourceBinding.previousVersionMatched == true
            and .sourceBinding.candidateVersionMatched == true
            and (.sourceBinding.appSpecSha256
              | test("^[0-9a-f]{64}$"))
            and (
              .rollback.creator == "CloudFormationRollback"
              or .rollback.creator == "codeDeployRollback"
            )
          ' "$codedeploy_proof" >/dev/null

          aws cloudformation describe-stacks \
            --stack-name "$PREVIOUS_STACK_ID" \
            --region "$AWS_REGION" \
            --output json >"$stack_state"
          jq -e \
            --slurpfile before "${RUNNER_TEMP:?}/staging-stack-before.json" \
            --slurpfile parameters previous-stack-parameters.json \
            --slurpfile tags previous-stack-tags.json \
            --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --arg stackId "$PREVIOUS_STACK_ID" '
              (.Stacks | length) == 1
              and ($before | length) == 1
              and ($before[0].Stacks | length) == 1
              and (.Stacks[0].StackId == $stackId)
              and (.Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE")
              and (.Stacks[0].RoleARN == $role)
              and ((.Stacks[0].Parameters
                | map({ParameterKey, ParameterValue})
                | sort_by(.ParameterKey)) == $parameters[0])
              and ((.Stacks[0].Tags // []
                | map({Key, Value})
                | sort_by(.Key)) == $tags[0])
              and ((.Stacks[0].Outputs // []) | sort_by(.OutputKey)) ==
                (($before[0].Stacks[0].Outputs // []) | sort_by(.OutputKey))
            ' "$stack_state" >/dev/null
          aws cloudformation get-template \
            --stack-name "$PREVIOUS_STACK_ID" \
            --region "$AWS_REGION" \
            --template-stage Original \
            --output json \
            | jq -er '.TemplateBody | if type == "string" then . else tojson end' \
              >"$stack_template"
          cmp --silent previous-stack-template.yaml "$stack_template"
          aws lambda get-alias \
            --function-name "$PREVIOUS_FUNCTION_NAME" \
            --name live \
            --region "$AWS_REGION" \
            --output json >"$alias_state"
          jq -e \
            --arg version "$PREVIOUS_FUNCTION_VERSION" '
              .Name == "live"
              and .FunctionVersion == $version
              and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
            ' "$alias_state" >/dev/null
          application_url="$(jq -er '
            .Stacks[0].Outputs[]
            | select(.OutputKey == "ApplicationUrl")
            | .OutputValue
          ' "$stack_state")"
          test "$application_url" = "$EXPECTED_APPLICATION_URL"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$application_url/api/health" >"$health"
          jq -e '.ok == true and .status == "reachable"' "$health" >/dev/null
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$application_url/api/proof" >"$proof"
          jq -e \
            '.memory.storeVerified == true and .memory.persisted == 9' \
            "$proof" >/dev/null

          approval_digest="$(printf '%s' "$APPROVAL_REFERENCE" | sha256sum | awk '{print $1}')"
          token_digest="$(printf '%s' "$RECOVERY_DRILL_TOKEN" | sha256sum | awk '{print $1}')"
          previous_version_digest="$(printf '%s' "$PREVIOUS_FUNCTION_VERSION" | sha256sum | awk '{print $1}')"
          candidate_version_digest="$(printf '%s' "$candidate_version" | sha256sum | awk '{print $1}')"
          candidate_alarm_digest="$(printf '%s' "$candidate_alarm" | sha256sum | awk '{print $1}')"
          inaccessible_secret="${APP_NAME}/staging/recovery-drill-inaccessible-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          inaccessible_secret_digest="$(printf '%s' "$inaccessible_secret" | sha256sum | awk '{print $1}')"
          source_deployment_id="$(jq -er '.source.deploymentId' "$codedeploy_proof")"
          rollback_deployment_id="$(jq -er '.rollback.deploymentId' "$codedeploy_proof")"
          rollback_creator="$(jq -er '.rollback.creator' "$codedeploy_proof")"
          source_appspec_sha256="$(jq -er '.sourceBinding.appSpecSha256' "$codedeploy_proof")"
          [[ "$source_deployment_id" =~ ^d-[A-Z0-9]+$ ]]
          [[ "$rollback_deployment_id" =~ ^d-[A-Z0-9]+$ ]]
          [[ "$source_appspec_sha256" =~ ^[0-9a-f]{64}$ ]]
          jq -n \
            --slurpfile source "$source_proof" \
            --arg approvalReferenceSha256 "$approval_digest" \
            --arg alarmNameSha256 "$candidate_alarm_digest" \
            --arg candidateVersionSha256 "$candidate_version_digest" \
            --arg commitSha "$GITHUB_SHA" \
            --arg drillTokenSha256 "$token_digest" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg inaccessibleSecretNameSha256 "$inaccessible_secret_digest" \
            --arg intentId "$RECOVERY_INTENT_ID" \
            --arg previousVersionSha256 "$previous_version_digest" \
            --arg rollbackCreator "$rollback_creator" \
            --arg rollbackDeploymentIdSha256 "$(printf '%s' "$rollback_deployment_id" | sha256sum | awk '{print $1}')" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg sourceAppSpecSha256 "$source_appspec_sha256" \
            --arg sourceDeploymentIdSha256 "$(printf '%s' "$source_deployment_id" | sha256sum | awk '{print $1}')" '
              {
                schema: "archon.staging-recovery-drill",
                version: 2,
                generatedAt: $generatedAt,
                commitSha: $commitSha,
                sourceRun: {id: $runId, attempt: $runAttempt},
                releaseSource: $source[0],
                approval: {
                  protectedEnvironment: "staging",
                  confirmationMatched: true,
                  referenceSha256: $approvalReferenceSha256
                },
                mutation: {
                  environment: "staging",
                  region: "eu-west-1",
                  recoveryDrillTokenSha256: $drillTokenSha256,
                  previousVersionSha256: $previousVersionSha256,
                  candidateVersionSha256: $candidateVersionSha256,
                  lambdaVersionChanged: true,
                  codeDeployCanaryConfigured: true,
                  observedCanaryWeight: 0.1,
                  behaviorFaultInjected: true,
                  faultBoundary: "candidate-database-secret-inaccessible",
                  inaccessibleSecretNameSha256: $inaccessibleSecretNameSha256,
                  secretMaterialCreated: false,
                  productionMutationPermitted: false
                },
                alarm: {
                  nameSha256: $alarmNameSha256,
                  stateObserved: "ALARM",
                  metric: "AWS/Lambda Errors",
                  candidateExecutedVersionScoped: true
                },
                codeDeploy: {
                  sourceDeploymentIdSha256: $sourceDeploymentIdSha256,
                  sourceStatus: "Stopped",
                  sourceErrorCode: "ALARM_ACTIVE",
                  sourceAppSpecSha256: $sourceAppSpecSha256,
                  sourceExternalStackIdMatched: true,
                  sourceCreateTimeWithinDrillWindow: true,
                  sourceFunctionNameMatched: true,
                  sourceFunctionAliasMatched: true,
                  sourcePreviousVersionMatched: true,
                  sourceCandidateVersionMatched: true,
                  rollbackDeploymentIdSha256: $rollbackDeploymentIdSha256,
                  rollbackStatus: "Succeeded",
                  rollbackCreator: $rollbackCreator,
                  rollbackRelationProved: true
                },
                automaticRollback: {
                  stackStatus: "UPDATE_ROLLBACK_COMPLETE",
                  previousTemplateRestored: true,
                  previousParametersRestored: true,
                  previousTagsRestored: true,
                  previousOutputsRestored: true,
                  previousAliasRestored: true,
                  additionalVersionWeightsCleared: true,
                  applicationHealthProved: true,
                  memoryProofProved: true
                },
                durableRecovery: {
                  intentId: $intentId,
                  armedBeforeMutation: true,
                  inlineRecoveryProved: false,
                  ledgerStateAfterInlineRecovery: null,
                  watchdogTerminalRecoveryPending: true,
                  terminalRecoveryClaimed: false
                },
                rawAwsIdentifiersStored: false,
                secretValuesRead: false,
                completed: false,
                result: "alarm-triggered-automatic-rollback-proved-watchdog-terminalization-required"
              }
            ' >"$receipt"
          jq -e \
            --arg sha "$GITHUB_SHA" '
              .schema == "archon.staging-recovery-drill"
              and .version == 2
              and .commitSha == $sha
              and .releaseSource.commitSha == $sha
              and .releaseSource.releaseState.existingStack == true
              and .releaseSource.releaseState.recoveryDrillTokenDisabled == true
              and .mutation.environment == "staging"
              and .mutation.region == "eu-west-1"
              and .mutation.observedCanaryWeight == 0.1
              and .mutation.behaviorFaultInjected == true
              and .mutation.faultBoundary ==
                "candidate-database-secret-inaccessible"
              and .mutation.secretMaterialCreated == false
              and .mutation.productionMutationPermitted == false
              and .alarm.stateObserved == "ALARM"
              and .alarm.candidateExecutedVersionScoped == true
              and .codeDeploy.sourceStatus == "Stopped"
              and .codeDeploy.sourceErrorCode == "ALARM_ACTIVE"
              and (.codeDeploy.sourceAppSpecSha256
                | test("^[0-9a-f]{64}$"))
              and .codeDeploy.sourceExternalStackIdMatched == true
              and .codeDeploy.sourceCreateTimeWithinDrillWindow == true
              and .codeDeploy.sourceFunctionNameMatched == true
              and .codeDeploy.sourceFunctionAliasMatched == true
              and .codeDeploy.sourcePreviousVersionMatched == true
              and .codeDeploy.sourceCandidateVersionMatched == true
              and .codeDeploy.rollbackStatus == "Succeeded"
              and .codeDeploy.rollbackRelationProved == true
              and .automaticRollback.stackStatus ==
                "UPDATE_ROLLBACK_COMPLETE"
              and .automaticRollback.previousTemplateRestored == true
              and .automaticRollback.previousParametersRestored == true
              and .automaticRollback.previousAliasRestored == true
              and .automaticRollback.additionalVersionWeightsCleared == true
              and .automaticRollback.applicationHealthProved == true
              and .automaticRollback.memoryProofProved == true
              and .durableRecovery.armedBeforeMutation == true
              and .durableRecovery.terminalRecoveryClaimed == false
              and .completed == false
              and .rawAwsIdentifiersStored == false
              and .secretValuesRead == false
            ' "$receipt" >/dev/null

      - name: Publish the frontend and invalidate CloudFront
        id: frontend
        env:
          BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
          EXPECTED_HAD_PREVIOUS_INDEX: ${{ steps.durable_recovery.outputs.had_previous_index }}
          EXPECTED_PREVIOUS_INDEX_SHA256: ${{ steps.durable_recovery.outputs.previous_index_sha256 }}
          EXPECTED_PREVIOUS_INDEX_VERSION: ${{ steps.durable_recovery.outputs.previous_index_version }}
        run: |
          set -euo pipefail
          case "$EXPECTED_HAD_PREVIOUS_INDEX" in
            true|false) ;;
            *) exit 1 ;;
          esac
          if previous_index="$(aws s3api head-object \
            --bucket "$BUCKET_NAME" \
            --key index.html \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --output json 2>&1)"; then
            current_version="$(
              jq -er '.VersionId | strings | select(length > 0)' \
                <<<"$previous_index"
            )"
            test "$EXPECTED_HAD_PREVIOUS_INDEX" = "true"
            test "$current_version" = "$EXPECTED_PREVIOUS_INDEX_VERSION"
            [[ "$EXPECTED_PREVIOUS_INDEX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          elif grep -Eqi 'NoSuchKey|Not Found|\(404\)' <<<"$previous_index"; then
            test "$EXPECTED_HAD_PREVIOUS_INDEX" = "false"
            test -z "$EXPECTED_PREVIOUS_INDEX_VERSION"
            test -z "$EXPECTED_PREVIOUS_INDEX_SHA256"
          else
            echo "Unable to re-prove the durable frontend baseline." >&2
            exit 1
          fi
          HAD_PREVIOUS_INDEX="$EXPECTED_HAD_PREVIOUS_INDEX"
          PREVIOUS_INDEX_VERSION="$EXPECTED_PREVIOUS_INDEX_VERSION"
          echo "had_previous_index=$HAD_PREVIOUS_INDEX" >>"$GITHUB_OUTPUT"
          echo "previous_index_version=$PREVIOUS_INDEX_VERSION" \
            >>"$GITHUB_OUTPUT"
          frontend_recovery_payload="$(
            jq -cnS \
              --arg bucket "$BUCKET_NAME" \
              --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
              --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
              '{
                bucket: $bucket,
                hadPreviousIndex: $hadPreviousIndex,
                previousIndexVersion: (
                  if $previousIndexVersion == ""
                  then null
                  else $previousIndexVersion
                  end
                )
              }'
          )"
          frontend_recovery_sha256="$(
            printf '%s' "$frontend_recovery_payload" |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "$frontend_recovery_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "recovery_sha256=$frontend_recovery_sha256" \
            >>"$GITHUB_OUTPUT"
          # Hashed assets are retained so the previous index remains recoverable.
          # The new index is the atomic switch and is uploaded last.
          echo "started=true" >>"$GITHUB_OUTPUT"
          aws s3 sync web/dist "s3://$BUCKET_NAME" \
            --region "$AWS_REGION" \
            --exclude index.html \
            --sse aws:kms \
            --sse-kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://$BUCKET_NAME/index.html" \
            --region "$AWS_REGION" \
            --sse aws:kms \
            --sse-kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Smoke the same-origin application and real recall path
        env:
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/" |
            grep -q '<div id="root"></div>'
          HEALTH="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/health")"
          jq -e \
            '.ok == true and
             .status == "reachable" and
             .service == "archon-cockroach-memory" and
             .access ==
               "canonical-read-only+isolated-synthetic-resolution-write" and
             .resolutionSandbox == {
               "state":"available",
               "authority":"financial-controller-human-gate",
               "persistence":"CockroachDB-row-level-TTL",
               "externalSideEffects":"none"
             } and
             .dependencies == "ready" and
             .checks.database.engine == "CockroachDB" and
             .checks.database.state == "reachable" and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured")' <<<"$HEALTH"
          RELEASE_COMMIT_SHA="${{ github.sha }}"
          [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          PROOF="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/proof")"
          jq -e \
            --arg embed "$BEDROCK_EMBED_MODEL_ID" \
            --arg narrator "$BEDROCK_NARRATOR_MODEL_ID" \
            --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            '$embed == "amazon.titan-embed-text-v2:0" and
             $narrator == "eu.anthropic.claude-sonnet-4-6" and
             .database.engine == "CockroachDB" and
             .database.deployment == "CockroachDB Cloud on AWS" and
             .database.role == "persistent agent memory" and
             .database.transactionIsolation == "SERIALIZABLE" and
             .database.database == "archon" and
             (.database.version | type == "string" and test("CockroachDB"; "i")) and
             .database.region == "eu-west-1" and
             .database.regionEvidence == "cockroach-cloud-api-release-gate" and
             (.database.runtimePrincipal |
               test("^archon_staging_[0-9a-f]{10}$")) and
             .database.activeMemories == 9 and
             .memory.persisted == 9 and
             .memory.idempotencyKeys == 9 and
             .memory.contentDigests == 9 and
             .memory.storeVerified == true and
             .memory.evidence == "live bounded fixed-scope payload-digest verification" and
             .vectorIndex.engine == "native CockroachDB C-SPANN" and
             .vectorIndex.enabled == true and
             .vectorIndex.name == "idx_agent_memory_company_scope_embedding" and
             .vectorIndex.metric == "cosine" and
             .vectorIndex.dimensions == 1024 and
             .vectorIndex.prefixes == ["tenant_id","embed_model","status","company"] and
             .vectorIndex.lifecycleState == "active" and
             .vectorIndex.evidence == "live pg_catalog.pg_indexes definition" and
             (.vectorIndex.definitionFingerprint | test("^[a-f0-9]{64}$")) and
             .resolutionLoop.enabled == true and
             .resolutionLoop.schemaTables == 5 and
             (.resolutionLoop.activeSandboxSessions |
               type == "number" and floor == . and . >= 0) and
             .resolutionLoop.transactionIsolation == "SERIALIZABLE" and
             .resolutionLoop.authorityBoundary ==
               "financial-controller-human-gate" and
             .resolutionLoop.identityAssurance ==
               "fixed-demo-role-assertion-not-authenticated" and
             .resolutionLoop.idempotency ==
               "decision-key+database-unique-constraint" and
             .resolutionLoop.receipt ==
               "SHA-256 immutable decision record" and
             .resolutionLoop.learning ==
               "conflict-observation+human-decision" and
             .resolutionLoop.consolidation ==
               "versioned current/superseded state" and
             .resolutionLoop.forgetting == "CockroachDB row-level TTL" and
             .resolutionLoop.canonicalMemoryMutable == false and
             .resolutionLoop.externalSideEffects == "none" and
             .resolutionLoop.evidence ==
               "live fixed-scope sandbox schema query" and
             .embeddingModel == "amazon.titan-embed-text-v2:0" and
             .narrationModel == "eu.anthropic.claude-sonnet-4-6" and
             .release.commitSha == $releaseCommitSha and
             .release.evidence == "server-configured Lambda environment" and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             (.generatedAt | type == "string" and test("Z$"))' <<<"$PROOF"
          RECALL="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --max-time 45 \
            -X POST "$APPLICATION_URL/api/recall" \
            -H 'content-type: application/json' \
            --data '{"question":"What was the true employer cost and the off-bank wedge?","kind":"payroll_event","limit":5}')"
          jq -e \
            --arg question "What was the true employer cost and the off-bank wedge?" \
            --arg embed "$BEDROCK_EMBED_MODEL_ID" \
            --arg narrator "$BEDROCK_NARRATOR_MODEL_ID" \
            '.question == $question and
             (.answer | contains("€15,375")) and
             (.answer | contains("€6,775")) and
             .modelId == $narrator and
             (.citations | length) >= 2 and
             (.citations | length) <= 5 and
             .recalled == (.citations | length) and
             (.grounding.status == "verified" or .grounding.status == "extractive") and
             .grounding.checks.citations == true and
             .grounding.checks.numerics == true and
             .grounding.checks.claims == true and
             .trace.retrieval.database == "CockroachDB" and
             .trace.retrieval.index == "native C-SPANN vector index" and
             .trace.retrieval.metric == "cosine" and
             .trace.retrieval.embeddingModel == $embed and
             .trace.retrieval.requestedKind == "payroll_event" and
             .trace.retrieval.requestedTopK == 5 and
             .trace.retrieval.recalled == .recalled and
             .trace.narration.model == $narrator and
             (.trace.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             any(.citations[]; .content | contains("€15,375")) and
             any(.citations[]; .content | contains("€6,775")) and
             all(.citations[];
               (.marker | test("^\\[[1-5]\\]$")) and
               (.memoryId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
               (.sourceRef | type == "string" and length > 0) and
               .company == "Helios SA" and
               .kind == "payroll_event" and
               .period == "2026-04" and
               (.score | type == "number" and . >= 0.15 and . <= 1)) and
             (.answer as $answer |
               all(.citations[].marker;
                 . as $marker | $answer | contains($marker))) and
             ([.citations[].marker] ==
               [range(1; ((.citations | length) + 1)) | "[\(.)]"]) and
             (([.citations[].memoryId] | unique | length) == (.citations | length)) and
             .consistencyOk == true' \
            <<<"$RECALL"
          AUDIT="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/audit")"
          jq -e \
            '.report.audited == 9 and
             .report.ok == false and
             .coverage.total == 9 and
             .coverage.scanned == 9 and
             .coverage.complete == true and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             (.report.contradictions | length) == 1 and
             .report.contradictions[0].subject == "INV-2043" and
             .report.contradictions[0].type == "contradiction" and
             .report.contradictions[0].attribute == "total" and
             ([.report.contradictions[0].values[].value] | sort) == [18400,18900] and
             .report.contradictions[0].resolution.recommendedValue == 18400 and
             .report.contradictions[0].resolution.rule == "importance" and
             (.report.contradictions[0].resolution.recommendedMemoryId |
               test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
             (.report.contradictions[0].resolution.confidence |
               type == "number" and . >= 0 and . <= 1) and
             (.report.contradictions[0].resolution.rationale |
               type == "string" and length >= 20) and
             (.report.absences | length) == 1 and
             .report.absences[0].type == "absence" and
             .report.absences[0].subject == "PAY-118" and
             (.report.absences[0].referencedBy | length) == 1 and
             .report.absences[0].referencedBy[0].sourceRef == "RECON-2043" and
             (.generatedAt | type == "string" and test("Z$"))' <<<"$AUDIT"

      - name: Hosted Chromium judge journey on staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.stack.outputs.application_url }}
          PLAYWRIGHT_LIVE: "1"
        run: |
          set -euo pipefail
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          npm run test:e2e --prefix web

      - name: Refresh short-lived AWS credentials for staging terminal proof
        if: success()
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-terminal-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Build and validate sanitized staging deployment receipt
        if: success()
        env:
          ENVIRONMENT: staging
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_PROOF_SHA256: ${{ steps.application_s3_verify.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
          PRE_MUTATION_REPROVED: ${{ steps.application_s3_recheck.outputs.reproved }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          FRONTEND_BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          FRONTEND_HAD_PREVIOUS_INDEX: ${{ steps.frontend.outputs.had_previous_index }}
          FRONTEND_PREVIOUS_INDEX_VERSION: ${{ steps.frontend.outputs.previous_index_version }}
          FRONTEND_RECOVERY_SHA256: ${{ steps.frontend.outputs.recovery_sha256 }}
          LIVE_STACK_ID: ${{ steps.stack.outputs.stack_id }}
          LIVE_STACK_REVISION: ${{ steps.stack.outputs.stack_revision }}
          LIVE_STACK_TAGS_SHA256: ${{ steps.stack.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          preflight_control="${RUNNER_TEMP:?}/staging-cloudformation-controls-preflight.json"
          terminal_control="${RUNNER_TEMP:?}/staging-cloudformation-controls-terminal.json"
          EXPECTED_STACK_ID="$LIVE_STACK_ID" \
          EXPECTED_STACK_REVISION="$LIVE_STACK_REVISION" \
          EXPECTED_TAGS_SHA256="$LIVE_STACK_TAGS_SHA256" \
            bash aws/enforce-cloudformation-controls.sh terminal \
              >"$terminal_control"
          for proof in "$preflight_control" "$terminal_control"; do
            jq -e -s \
              'length == 1 and (.[0] | type == "object")' \
              "$proof" >/dev/null
          done
          jq -e \
            '
              .ok == true
              and .schema == "archon.cloudformation-controls.proof"
              and .version == 1
              and .mode == "terminal"
              and .identity.state == "existing"
              and .identity.environment == "staging"
              and .protection.enabled == true
              and .drift.detectionStatus == "DETECTION_COMPLETE"
              and .drift.stackDriftStatus == "IN_SYNC"
              and .drift.driftedResourceCount == 0
              and .drift.checkedResourceCount > 0
            ' "$terminal_control" >/dev/null
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          test "$(
            sha256sum application-s3-access-logging-proof.json |
              awk '{print $1}'
          )" = "$EXPECTED_PROOF_SHA256"
          [[ "$PREVIOUS_RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_RECOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]

          terminal_snapshot="${RUNNER_TEMP:?}/staging-recovery-snapshot-terminal.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          EXPECTED_PREVIOUS_RELEASE_SHA256="$PREVIOUS_RELEASE_SHA256" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$terminal_snapshot"
          jq -e \
            --arg expected "$PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$terminal_snapshot" >/dev/null
          frontend_recovery_payload="$(
            jq -cnS \
              --arg bucket "$FRONTEND_BUCKET_NAME" \
              --argjson hadPreviousIndex "$FRONTEND_HAD_PREVIOUS_INDEX" \
              --arg previousIndexVersion "$FRONTEND_PREVIOUS_INDEX_VERSION" \
              '{
                bucket: $bucket,
                hadPreviousIndex: $hadPreviousIndex,
                previousIndexVersion: (
                  if $previousIndexVersion == ""
                  then null
                  else $previousIndexVersion
                  end
                )
              }'
          )"
          test "$(
            printf '%s' "$frontend_recovery_payload" |
              sha256sum |
              awk '{print $1}'
          )" = "$FRONTEND_RECOVERY_SHA256"

          terminal_proof="${RUNNER_TEMP:?}/staging-application-s3-access-logging-terminal-proof.json"
          bash aws/prove-application-s3-access-logging.sh verify \
            >"$terminal_proof"
          cmp --silent \
            application-s3-access-logging-proof.json \
            "$terminal_proof"
          terminal_proof_sha256="$(
            sha256sum "$terminal_proof" | awk '{print $1}'
          )"
          test "$terminal_proof_sha256" = "$EXPECTED_PROOF_SHA256"
          test -f "$CONTROL_PLANE_FENCE_FILE"
          test ! -L "$CONTROL_PLANE_FENCE_FILE"
          test "$(sha256sum "$CONTROL_PLANE_FENCE_FILE" | awk '{print $1}')" = \
            "$CONTROL_PLANE_FENCE_SHA256"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -e \
            --slurpfile apiStage api-stage-proof.json \
            --slurpfile cfnPreflight "$preflight_control" \
            --slurpfile cfnTerminal "$terminal_control" \
            --slurpfile controlPlaneFence "$CONTROL_PLANE_FENCE_FILE" \
            --slurpfile s3Preflight application-s3-access-logging-preflight.json \
            --slurpfile s3Proof "$terminal_proof" \
            --arg environment staging \
            --arg stackName "$STACK_NAME" \
            --arg applicationUrl "$APPLICATION_URL" \
            --arg sourceSha "${{ github.sha }}" \
            --arg controlPlaneFenceSha256 "$CONTROL_PLANE_FENCE_SHA256" \
            --arg deployRunId "$GITHUB_RUN_ID" \
            --arg deployRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg foundationControlRunId "$FOUNDATION_CONTROL_RUN_ID" \
            --arg foundationControlRunAttempt "$FOUNDATION_CONTROL_RUN_ATTEMPT" \
            --arg stagingEdgeControlRunId "$STAGING_EDGE_CONTROL_RUN_ID" \
            --arg stagingEdgeControlRunAttempt "$STAGING_EDGE_CONTROL_RUN_ATTEMPT" \
            --arg productionEdgeControlRunId "$PRODUCTION_EDGE_CONTROL_RUN_ID" \
            --arg productionEdgeControlRunAttempt "$PRODUCTION_EDGE_CONTROL_RUN_ATTEMPT" \
            --arg preMutationReproved "$PRE_MUTATION_REPROVED" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg previousReleaseSha256 "$PREVIOUS_RELEASE_SHA256" \
            --arg frontendRecoverySha256 "$FRONTEND_RECOVERY_SHA256" \
            --arg terminalProofSha256 "$terminal_proof_sha256" \
            --arg verifiedAt "$verified_at" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'if (($apiStage | length) == 1 and
                 ($cfnPreflight | length) == 1 and
                 ($cfnTerminal | length) == 1 and
                 ($controlPlaneFence | length) == 1 and
                 ($s3Preflight | length) == 1 and
                 ($s3Proof | length) == 1 and
                 $apiStage[0].ok == true and
                 $apiStage[0].stage == "live" and
                 $apiStage[0].legacyDefaultStageAbsent == true and
                 $apiStage[0].detailedMetrics == true and
                 $apiStage[0].throttlingRate == 5 and
                 $apiStage[0].throttlingBurst == 10 and
                 $apiStage[0].cloudFrontStatus == "Deployed" and
                 $apiStage[0].cloudFrontOriginPath == "/live" and
                 $apiStage[0].directStageHealth == "GET /live/api/health 200" and
                 $apiStage[0].sameOriginHealth == "GET /api/health 200" and
                 $apiStage[0].accessLogEvent == "GET /api/health 200" and
                 $cfnPreflight[0].ok == true and
                 $cfnPreflight[0].mode == "preflight" and
                 $cfnPreflight[0].identity.environment == $environment and
                 $cfnTerminal[0].ok == true and
                 $cfnTerminal[0].mode == "terminal" and
                 $cfnTerminal[0].identity.environment == $environment and
                 $cfnTerminal[0].identity.state == "existing" and
                 $cfnTerminal[0].protection.enabled == true and
                 $cfnTerminal[0].drift.detectionStatus ==
                   "DETECTION_COMPLETE" and
                 $cfnTerminal[0].drift.stackDriftStatus == "IN_SYNC" and
                 $cfnTerminal[0].drift.driftedResourceCount == 0 and
                 $cfnTerminal[0].drift.checkedResourceCount > 0 and
                 $s3Preflight[0].ok == true and
                 $s3Preflight[0].mode == "preflight" and
                 $s3Preflight[0].foundationVerified == true and
                 $s3Preflight[0].environment == $environment and
                 $s3Proof[0].ok == true and
                 $s3Proof[0].mode == "verify" and
                 $s3Proof[0].environment == $environment and
                 $s3Proof[0].stackState == $stackState and
                 (($stackState == "greenfield" and
                   $s3Preflight[0].priorState == "absent" and
                   $s3Proof[0].stackStatus == "CREATE_COMPLETE") or
                  ($stackState == "existing" and
                   ($s3Preflight[0].priorState == "disabled" or
                    $s3Preflight[0].priorState == "enabled") and
                   ($s3Proof[0].stackStatus == "CREATE_COMPLETE" or
                    $s3Proof[0].stackStatus == "UPDATE_COMPLETE" or
                    $s3Proof[0].stackStatus ==
                      "UPDATE_ROLLBACK_COMPLETE"))) and
                 $s3Proof[0].foundationVerified == true and
                 $s3Proof[0].processedTemplateManaged == true and
                 $s3Proof[0].liveState == "enabled" and
                 $s3Proof[0].preflightIntegrity ==
                   $s3Preflight[0].integrity and
                 $preMutationReproved == "true" and
                 ($controlPlaneFenceSha256 | test("^[0-9a-f]{64}$")) and
                 all([
                   $foundationControlRunId,
                   $foundationControlRunAttempt,
                   $stagingEdgeControlRunId,
                   $stagingEdgeControlRunAttempt,
                   $productionEdgeControlRunId,
                    $productionEdgeControlRunAttempt
                  ][]; test("^[1-9][0-9]*$")) and
                 $controlPlaneFence[0].schema ==
                   "archon.aws.control-plane-receipt-fence" and
                 $controlPlaneFence[0].schemaVersion == 1 and
                 $controlPlaneFence[0].ok == true and
                 $controlPlaneFence[0].sourceSha == $sourceSha and
                 $controlPlaneFence[0].mainHeadSha == $sourceSha and
                 $controlPlaneFence[0].mainHeadRevalidated == true and
                 $controlPlaneFence[0].latestEligibleRunsRevalidated == true and
                 $controlPlaneFence[0].edgeSnapshotShared == true and
                 $controlPlaneFence[0].mutationMutexHeldByCaller == true and
                 $controlPlaneFence[0].mutex == {
                   group:"aws-shared-control-plane-mutation",
                   heldByCaller:true
                 } and
                 $controlPlaneFence[0].deployment == {
                   environment:$environment,
                   jobId:"deploy-staging",
                   runId:($deployRunId | tonumber),
                   runAttempt:($deployRunAttempt | tonumber)
                 } and
                 $controlPlaneFence[0].foundation == {
                   runId:($foundationControlRunId | tonumber),
                   runAttempt:($foundationControlRunAttempt | tonumber),
                   operation:"verify"
                 } and
                 $controlPlaneFence[0].edge.staging.runId ==
                   ($stagingEdgeControlRunId | tonumber) and
                 $controlPlaneFence[0].edge.staging.runAttempt ==
                   ($stagingEdgeControlRunAttempt | tonumber) and
                 ($controlPlaneFence[0].edge.staging.operation |
                   test("^(apply|verify)$")) and
                 $controlPlaneFence[0].edge.production.runId ==
                   ($productionEdgeControlRunId | tonumber) and
                 $controlPlaneFence[0].edge.production.runAttempt ==
                   ($productionEdgeControlRunAttempt | tonumber) and
                 ($controlPlaneFence[0].edge.production.operation |
                   test("^(apply|verify)$")) and
                 ($controlPlaneFence[0].checkedAt |
                   test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
                 ($previousReleaseSha256 | test("^[0-9a-f]{64}$")) and
                 ($frontendRecoverySha256 | test("^[0-9a-f]{64}$")) and
                 ($terminalProofSha256 | test("^[0-9a-f]{64}$")) and
                 ($verifiedAt | test("Z$")))
             then . + {deployment: {
              environment: $environment,
              stackName: $stackName,
              applicationUrl: $applicationUrl,
              deployedAt: $deployedAt,
              smoke: "passed",
              canary: "Canary10Percent5Minutes",
              canaryTrafficProbe: "weighted-alias-proof-and-recall",
              deployAlarm: "candidate-executed-version-errors",
              recallGate: "post-promotion-with-explicit-restore",
              recoverySnapshot: {
                manifestSha256: $previousReleaseSha256,
                frontendSha256: $frontendRecoverySha256
              },
              controlPlaneReceiptFence:
                ($controlPlaneFence[0] + {
                  sha256: $controlPlaneFenceSha256
                }),
              cloudFormationControls: {
                preflight: $cfnPreflight[0],
                terminal: $cfnTerminal[0]
              },
              apiStage: $apiStage[0],
              s3AccessLogging: {
                preflight: {
                  foundationVerified: true,
                  beforeState: $s3Preflight[0].priorState,
                  preMutationReproved: true,
                  stackState: $s3Proof[0].stackState
                },
                verified: {
                  loggingEnabled: true,
                  targetPrefix:
                    $s3Proof[0].liveConfiguration.LoggingEnabled.TargetPrefix,
                  partitionDateSource:
                    $s3Proof[0].liveConfiguration.LoggingEnabled
                      .TargetObjectKeyFormat.PartitionedPrefix
                      .PartitionDateSource,
                  stackStatus: $s3Proof[0].stackStatus,
                  processedTemplateManaged: true,
                  liveControlPlaneVerified: true,
                  terminalLiveReproved: true,
                  terminalProofSha256: $terminalProofSha256,
                  verifiedAt: $verifiedAt
                }
              }
            }}
             else error("invalid deployment control proof")
             end' deployment-receipt.json > staging-deployment-receipt.json

      - name: Commit the receipt-bound staging recovery intent
        if: success()
        env:
          RECOVERY_ENVIRONMENT: staging
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_INTENT_ID" =~ ^[0-9a-f]{64}$ ]]
          receipt_sha256="$(
            sha256sum staging-deployment-receipt.json | awk '{print $1}'
          )"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          receipt_key="candidates/recovery/staging/receipts/${RECOVERY_INTENT_ID}/${receipt_sha256}.json"
          object_proof="${RUNNER_TEMP:?}/staging-terminal-receipt-object.json"
          trap 'rm -f -- "$object_proof"' EXIT
          bash aws/put-durable-recovery-object.sh \
            staging-deployment-receipt.json \
            "$receipt_key" >"$object_proof"
          test "$(jq -er '.sha256' "$object_proof")" = "$receipt_sha256"
          RECOVERY_RECEIPT_BUCKET="$(jq -er '.bucket' "$object_proof")" \
          RECOVERY_RECEIPT_KEY="$(jq -er '.key' "$object_proof")" \
          RECOVERY_RECEIPT_SHA256="$receipt_sha256" \
          RECOVERY_RECEIPT_VERSION_ID="$(jq -er '.versionId' "$object_proof")" \
            bash aws/recovery-intent-ledger.sh commit \
              >"${RUNNER_TEMP:?}/staging-recovery-ledger-committed.json"
          jq -e \
            --arg intent "$RECOVERY_INTENT_ID" \
            --arg receipt "$receipt_sha256" \
            '
              .ok == true
              and .schema == "archon.recovery-intent.terminal"
              and .version == 1
              and .state == "COMMITTED"
              and .intentId == $intent
              and .receiptSha256 == $receipt
            ' "${RUNNER_TEMP:?}/staging-recovery-ledger-committed.json" \
            >/dev/null

      - name: Refresh short-lived AWS credentials for staging recovery
        if: (failure() || cancelled()) && steps.deploy.outputs.started == 'true'
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-staging-recovery-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Restore the previous staging release on verification failure
        id: inline_recovery
        if: (failure() || cancelled()) && steps.deploy.outputs.started == 'true'
        env:
          BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
          FRONTEND_STARTED: ${{ steps.frontend.outputs.started }}
          HAD_PREVIOUS_INDEX: ${{ steps.frontend.outputs.had_previous_index }}
          PREVIOUS_INDEX_VERSION: ${{ steps.frontend.outputs.previous_index_version }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          EXPECTED_PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_PREVIOUS_STACK_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PREVIOUS_STACK_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_PREVIOUS_STACK_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          EXPECTED_FRONTEND_RECOVERY_SHA256: ${{ steps.frontend.outputs.recovery_sha256 }}
          ENVIRONMENT: staging
          RECOVERY_CANCELLED: ${{ job.status == 'cancelled' }}
          RECOVERY_ENVIRONMENT: staging
          RECOVERY_EXECUTION_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          recovery_ledger="${RUNNER_TEMP:?}/staging-inline-recovery-ledger.json"
          bash aws/recovery-intent-ledger.sh read >"$recovery_ledger"
          ledger_state="$(jq -er '.state' "$recovery_ledger")"
          test "$(jq -er '.intentId' "$recovery_ledger")" = \
            "$RECOVERY_INTENT_ID"
          if [ "$ledger_state" = "COMMITTED" ] ||
             [ "$ledger_state" = "RECOVERED" ]; then
            exit 0
          fi
          test "$ledger_state" = "ARMED"
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          bash aws/prove-application-s3-access-logging.sh \
            validate-preflight >/dev/null
          recovery_snapshot="${RUNNER_TEMP:?}/staging-recovery-snapshot-verified.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          EXPECTED_TEMPLATE_SHA256="$EXPECTED_PREVIOUS_STACK_TEMPLATE_SHA256" \
          EXPECTED_PARAMETERS_SHA256="$EXPECTED_PREVIOUS_STACK_PARAMETERS_SHA256" \
          EXPECTED_TAGS_SHA256="$EXPECTED_PREVIOUS_STACK_TAGS_SHA256" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$recovery_snapshot"
          jq -e \
            --arg expected "$EXPECTED_PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$recovery_snapshot" >/dev/null
          if [ "$FRONTEND_STARTED" = "true" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: (
                    if $previousIndexVersion == ""
                    then null
                    else $previousIndexVersion
                    end
                  )
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
          fi

          RECOVERY_FAILED=0
          storage_key_alias="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage"
          prove_application_s3_recovery() {
            if ! test "$(
              sha256sum application-s3-access-logging-preflight.json |
                awk '{print $1}'
            )" = "$EXPECTED_PREFLIGHT_SHA256"; then
              return 1
            fi
            if ! bash aws/prove-application-s3-access-logging.sh recover |
                tee application-s3-access-logging-recovery.json; then
              return 1
            fi
            jq -e \
              --slurpfile preflight application-s3-access-logging-preflight.json \
              --arg stackState "$EXPECTED_STACK_STATE" \
              '
                ($preflight | length) == 1
                and .ok == true
                and .schema == "archon.application-s3-access-logging.recovery"
                and .version == 1
                and .mode == "recover"
                and .evidence == "live-control-plane"
                and .foundationVerified == true
                and .environment == $preflight[0].environment
                and .stackState == $stackState
                and .sourceBucket == $preflight[0].sourceBucket
                and .destinationBucket == $preflight[0].destinationBucket
                and .priorState == $preflight[0].priorState
                and .restoredState == $preflight[0].priorState
                and .preflightIntegrity == $preflight[0].integrity
                and (
                  (
                    .restoredState == "absent"
                    and .restoredConfiguration == null
                  )
                  or (
                    .restoredState == "disabled"
                    and .restoredConfiguration == {}
                  )
                  or (
                    .restoredState == "enabled"
                    and .restoredConfiguration == .expected
                  )
                )
              ' application-s3-access-logging-recovery.json >/dev/null
          }
          if [ "$HAS_PREVIOUS_STACK" != "true" ]; then
            if ! GREENFIELD_OWNER="$EXPECTED_GREENFIELD_OWNER" \
              ENVIRONMENT=staging \
              bash aws/delete-greenfield-stack.sh; then
              echo "Failed to clean the failed greenfield deployment." >&2
              RECOVERY_FAILED=1
            fi
            if [ "$RECOVERY_CANCELLED" = "true" ]; then
              test "$RECOVERY_FAILED" -eq 0
              exit 0
            fi
            if ! prove_application_s3_recovery; then
              echo "Failed to prove greenfield S3 logging recovery." >&2
              RECOVERY_FAILED=1
            fi
            test "$RECOVERY_FAILED" -eq 0
            exit 0
          fi
          if ! bash aws/restore-cloudformation-stack.sh; then
            echo "Failed to restore the exact previous CloudFormation stack." >&2
            exit 1
          fi
          if [ "$RECOVERY_CANCELLED" = "true" ]; then
            exit 0
          fi
          if ! prove_application_s3_recovery; then
            echo "Failed to prove the restored S3 logging state." >&2
            exit 1
          fi
          BUCKET_NAME=""
          DISTRIBUTION_ID=""
          restored_stack="${RUNNER_TEMP:?}/staging-stack-after-recovery.json"
          aws cloudformation describe-stacks \
            --stack-name "$EXPECTED_PREVIOUS_STACK_ID" \
            --region "$AWS_REGION" \
            --output json >"$restored_stack"
          jq -e \
            --arg stackId "$EXPECTED_PREVIOUS_STACK_ID" \
            --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackId == $stackId
              and .Stacks[0].RoleARN == $role
              and (
                .Stacks[0].StackStatus == "CREATE_COMPLETE"
                or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
              )
              and (
                [.Stacks[0].Outputs[]?
                  | select(.OutputKey == "SpaBucketName")
                  | .OutputValue] | length
              ) == 1
              and (
                [.Stacks[0].Outputs[]?
                  | select(.OutputKey == "DistributionId")
                  | .OutputValue] | length
              ) == 1
            ' "$restored_stack" >/dev/null
          restored_tags="${RUNNER_TEMP:?}/staging-tags-after-recovery.json"
          jq -e \
            '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
            "$restored_stack" >"$restored_tags"
          test "$(
            sha256sum "$restored_tags" | awk '{print $1}'
          )" = "$EXPECTED_PREVIOUS_STACK_TAGS_SHA256"
          BUCKET_NAME="$(
            jq -er \
              '.Stacks[0].Outputs[]
               | select(.OutputKey == "SpaBucketName")
               | .OutputValue' "$restored_stack"
          )"
          DISTRIBUTION_ID="$(
            jq -er \
              '.Stacks[0].Outputs[]
               | select(.OutputKey == "DistributionId")
               | .OutputValue' "$restored_stack"
          )"
          test "$BUCKET_NAME" = \
            "${APP_NAME}-staging-web-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
          if [ "$FRONTEND_STARTED" = "true" ] &&
             [ "$HAD_PREVIOUS_INDEX" = "true" ] &&
             [ -n "$BUCKET_NAME" ] &&
             [ -n "$PREVIOUS_INDEX_VERSION" ] &&
             [ "$PREVIOUS_INDEX_VERSION" != "None" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: $previousIndexVersion
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
            if ! aws s3api copy-object \
              --bucket "$BUCKET_NAME" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --expected-source-bucket-owner "$AWS_ACCOUNT_ID" \
              --key index.html \
              --copy-source "${BUCKET_NAME}/index.html?versionId=${PREVIOUS_INDEX_VERSION}" \
              --server-side-encryption aws:kms \
              --ssekms-key-id "$storage_key_alias" \
              --metadata-directive REPLACE \
              --annotation-directive EXCLUDE \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --region "$AWS_REGION" >/dev/null; then
              RECOVERY_FAILED=1
            fi
          elif [ "$FRONTEND_STARTED" = "true" ] &&
               [ "$HAD_PREVIOUS_INDEX" = "false" ] &&
               [ -n "$BUCKET_NAME" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: null
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
            if ! aws s3api delete-object \
              --bucket "$BUCKET_NAME" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --key index.html \
              --region "$AWS_REGION" >/dev/null; then
              RECOVERY_FAILED=1
            fi
          elif [ "$FRONTEND_STARTED" = "true" ]; then
            RECOVERY_FAILED=1
          fi
          if [ -n "$PREVIOUS_FUNCTION_NAME" ] &&
             [ -n "$PREVIOUS_FUNCTION_VERSION" ] &&
             [ "$PREVIOUS_FUNCTION_VERSION" != "None" ]; then
            alias_before="${RUNNER_TEMP:?}/staging-alias-before-recovery.json"
            alias_after="${RUNNER_TEMP:?}/staging-alias-after-recovery.json"
            alias_update="${RUNNER_TEMP:?}/staging-alias-update.json"
            if ! aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json >"$alias_before"; then
              RECOVERY_FAILED=1
            else
              alias_revision="$(
                jq -er \
                  --arg arn \
                    "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                  '
                    select(
                      .AliasArn == $arn
                      and .Name == "live"
                      and (.FunctionVersion | test("^[1-9][0-9]*$"))
                      and (.RevisionId | type == "string" and length > 0)
                    )
                    | .RevisionId
                  ' "$alias_before"
              )"
              if ! aws lambda update-alias \
                --function-name "$PREVIOUS_FUNCTION_NAME" \
                --name live \
                --function-version "$PREVIOUS_FUNCTION_VERSION" \
                --routing-config '{"AdditionalVersionWeights":{}}' \
                --revision-id "$alias_revision" \
                --region "$AWS_REGION" \
                --output json >"$alias_update"; then
                RECOVERY_FAILED=1
              elif ! aws lambda get-alias \
                --function-name "$PREVIOUS_FUNCTION_NAME" \
                --name live \
                --region "$AWS_REGION" \
                --output json >"$alias_after"; then
                RECOVERY_FAILED=1
              elif ! jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' "$alias_after" >/dev/null; then
                RECOVERY_FAILED=1
              fi
            fi
          fi
          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            INVALIDATION_ID="$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths '/*' \
              --query 'Invalidation.Id' \
              --output text)"
            if ! aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" \
              --id "$INVALIDATION_ID"; then
              RECOVERY_FAILED=1
            fi
          else
            RECOVERY_FAILED=1
          fi
          if [ -n "$PREVIOUS_APPLICATION_URL" ] &&
             [ "$PREVIOUS_APPLICATION_URL" != "None" ]; then
            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$PREVIOUS_APPLICATION_URL/api/health" |
              jq -e '.ok == true and .status == "reachable"' >/dev/null; then
              RECOVERY_FAILED=1
            fi
            if ! curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$PREVIOUS_APPLICATION_URL/api/proof" |
              jq -e '.memory.storeVerified == true and .memory.persisted == 9' \
                >/dev/null; then
              RECOVERY_FAILED=1
            fi
          else
            RECOVERY_FAILED=1
          fi
          test "$RECOVERY_FAILED" -eq 0

      - name: Finalize the sanitized staging recovery drill handoff
        id: drill_handoff
        if: >-
          always() &&
          steps.deploy.outcome == 'failure' &&
          steps.fault_injection.outcome == 'success'
        env:
          APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          INLINE_RECOVERY_OUTCOME: ${{ steps.inline_recovery.outcome }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          RECOVERY_ENVIRONMENT: staging
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
        run: |
          set -euo pipefail
          umask 077
          receipt="${RUNNER_TEMP:?}/staging-recovery-drill-receipt.json"
          ledger="${RUNNER_TEMP:?}/staging-recovery-drill-ledger.json"
          alias_state="${RUNNER_TEMP:?}/staging-recovery-drill-restored-alias.json"
          health="${RUNNER_TEMP:?}/staging-recovery-drill-health.json"
          proof="${RUNNER_TEMP:?}/staging-recovery-drill-proof.json"
          test -f "$receipt"
          test ! -L "$receipt"
          test "$INLINE_RECOVERY_OUTCOME" = "success"
          [[ "$RECOVERY_INTENT_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREVIOUS_FUNCTION_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPLICATION_URL" =~ ^https://[a-z0-9-]+\.cloudfront\.net$ ]]

          bash aws/recovery-intent-ledger.sh read >"$ledger"
          jq -e \
            --arg intent "$RECOVERY_INTENT_ID" '
              .schema == "archon.recovery-intent.ledger"
              and .version == 1
              and .environment == "staging"
              and .intentId == $intent
              and .state == "ARMED"
              and .receiptSha256 == null
            ' "$ledger" >/dev/null
          aws lambda get-alias \
            --function-name "$PREVIOUS_FUNCTION_NAME" \
            --name live \
            --region "$AWS_REGION" \
            --output json >"$alias_state"
          jq -e \
            --arg version "$PREVIOUS_FUNCTION_VERSION" '
              .Name == "live"
              and .FunctionVersion == $version
              and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
            ' "$alias_state" >/dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/health" >"$health"
          jq -e '.ok == true and .status == "reachable"' "$health" >/dev/null
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/proof" >"$proof"
          jq -e \
            '.memory.storeVerified == true and .memory.persisted == 9' \
            "$proof" >/dev/null

          updated="${RUNNER_TEMP:?}/staging-recovery-drill-receipt-final.json"
          jq \
            --arg finalizedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              . + {
                finalizedAt: $finalizedAt,
                inlineRecovery: {
                  previousAliasRestored: true,
                  additionalVersionWeightsCleared: true,
                  applicationHealthProved: true,
                  memoryProofProved: true
                },
                durableRecovery: (
                  .durableRecovery + {
                    inlineRecoveryProved: true,
                    ledgerStateAfterInlineRecovery: "ARMED",
                    watchdogTerminalRecoveryPending: true,
                    terminalRecoveryClaimed: false
                  }
                ),
                completed: false,
                result: "inline-recovered-watchdog-terminalization-required"
              }
            ' "$receipt" >"$updated"
          mv "$updated" "$receipt"
          jq -e '
            .schema == "archon.staging-recovery-drill"
            and .version == 2
            and .mutation.environment == "staging"
            and .mutation.region == "eu-west-1"
            and .mutation.lambdaVersionChanged == true
            and .mutation.observedCanaryWeight == 0.1
            and .mutation.behaviorFaultInjected == true
            and .mutation.faultBoundary ==
              "candidate-database-secret-inaccessible"
            and .mutation.productionMutationPermitted == false
            and .alarm.stateObserved == "ALARM"
            and .codeDeploy.sourceStatus == "Stopped"
            and .codeDeploy.sourceErrorCode == "ALARM_ACTIVE"
            and (.codeDeploy.sourceAppSpecSha256
              | test("^[0-9a-f]{64}$"))
            and .codeDeploy.sourceExternalStackIdMatched == true
            and .codeDeploy.sourceCreateTimeWithinDrillWindow == true
            and .codeDeploy.sourceFunctionNameMatched == true
            and .codeDeploy.sourceFunctionAliasMatched == true
            and .codeDeploy.sourcePreviousVersionMatched == true
            and .codeDeploy.sourceCandidateVersionMatched == true
            and .codeDeploy.rollbackStatus == "Succeeded"
            and .codeDeploy.rollbackRelationProved == true
            and .automaticRollback.stackStatus ==
              "UPDATE_ROLLBACK_COMPLETE"
            and .automaticRollback.previousAliasRestored == true
            and .automaticRollback.applicationHealthProved == true
            and .automaticRollback.memoryProofProved == true
            and .inlineRecovery.previousAliasRestored == true
            and .inlineRecovery.applicationHealthProved == true
            and .inlineRecovery.memoryProofProved == true
            and .durableRecovery.ledgerStateAfterInlineRecovery == "ARMED"
            and .durableRecovery.watchdogTerminalRecoveryPending == true
            and .durableRecovery.terminalRecoveryClaimed == false
            and .completed == false
            and .rawAwsIdentifiersStored == false
            and .secretValuesRead == false
          ' "$receipt" >/dev/null

      - name: Attest the staging recovery drill handoff receipt
        if: >-
          always() &&
          steps.drill_handoff.outcome == 'success'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/staging-recovery-drill-receipt.json

      - name: Upload the staging recovery drill handoff receipt
        if: >-
          always() &&
          steps.drill_handoff.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-recovery-drill-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-recovery-drill-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove staging recovery drill runner material
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'staging-recovery-drill'
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP:?}"/staging-recovery-drill-*

      - name: Upload staging receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deployment-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-deployment-receipt.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Promote identical candidate to production
    if: success() && github.event_name == 'push'
    needs:
      - source-gate
      - build-once
      - deploy-staging
      - database-release
      - managed-mcp-production-audit
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.stack.outputs.application_url }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    # Reserve a complete second CloudFormation/CloudFront cycle for recovery.
    timeout-minutes: 105
    concurrency:
      group: aws-shared-control-plane-mutation
      cancel-in-progress: false
      queue: max
    env:
      STACK_NAME: ${{ vars.AWS_STACK_NAME || 'archon-memory-production' }}
      DATABASE_SECRET_ID: ${{ vars.DATABASE_SECRET_ID || 'archon-memory/production/database' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
      AWS_LAMBDA_EXECUTION_ROLE_ARN: ${{ vars.AWS_LAMBDA_EXECUTION_ROLE_ARN }}
      AWS_CODEDEPLOY_SERVICE_ROLE_ARN: ${{ vars.AWS_CODEDEPLOY_SERVICE_ROLE_ARN }}
      COCKROACH_SQL_DNS: ${{ needs.database-release.outputs.cockroach_sql_dns }}
      FOUNDATION_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.foundation_control_run_id }}
      FOUNDATION_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.foundation_control_run_attempt }}
      STAGING_EDGE_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.staging_edge_control_run_id }}
      STAGING_EDGE_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.staging_edge_control_run_attempt }}
      PRODUCTION_EDGE_CONTROL_RUN_ID: ${{ needs.source-gate.outputs.production_edge_control_run_id }}
      PRODUCTION_EDGE_CONTROL_RUN_ATTEMPT: ${{ needs.source-gate.outputs.production_edge_control_run_attempt }}
    steps:
      - name: Check out the exact promoted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the candidate is still the main branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$EXPECTED_SHA" = "$(git rev-parse origin/main)"
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download the same CI-proven candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate, Supply Chain, and memory-evaluation provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MEMORY_EVALUATION_RUN_ID: ${{ needs.source-gate.outputs.memory_evaluation_run_id }}
          EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT: ${{ needs.source-gate.outputs.memory_evaluation_run_attempt }}
          EXPECTED_SUPPLY_CHAIN_RUN_ID: ${{ needs.source-gate.outputs.supply_chain_run_id }}
          EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT: ${{ needs.source-gate.outputs.supply_chain_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e --arg sha "$EXPECTED_SHA" '
            .schemaVersion == 1 and
            .commitSha == $sha and
            .provenance.buildOncePromoteSameArtifact == true
          ' deployment-receipt.json >/dev/null
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_MEMORY_EVALUATION_RUN_ID" \
            --arg runAttempt "$EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT" '
              .schemaVersion == "1.0.0" and
              .source.sha == $sha and
              .source.runId == $runId and
              .source.runAttempt == $runAttempt and
              .gates == {
                "policy":true,
                "representativeScale":true,
                "cspannVersusExact":true,
                "exactShaBound":true
              }
            ' memory-evaluation-receipt.json >/dev/null
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg runId "$EXPECTED_SUPPLY_CHAIN_RUN_ID" \
            --arg runAttempt "$EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT" '
              .schema == "archon.supply-chain.release-evidence" and
              .version == 1 and
              .sourceSha == $sha and
              .passed == true and
              .workflow.name == "Supply Chain (enforced)" and
              .workflow.runId == $runId and
              .workflow.runAttempt == $runAttempt and
              .enforcement.mode ==
                "blocking-zero-unwaived-findings" and
              .enforcement.acceptedWaivers == 0 and
              .enforcement.unwaivedFindings == 0 and
              .evidence.cloudFormationTemplates == [
                "aws/template.yaml",
                "aws/bootstrap-oidc.yaml",
                "aws/edge-waf.yaml",
                "aws/finops.yaml"
              ] and
              (.evidence.waiverLedgerSha256 |
                test("^[a-f0-9]{64}$"))
            ' supply-chain-release-receipt.json >/dev/null
          deployment_receipt_sha256="$(
            sha256sum deployment-receipt.json | awk '{print $1}'
          )"
          supply_chain_receipt_sha256="$(
            sha256sum supply-chain-release-receipt.json | awk '{print $1}'
          )"
          memory_evaluation_receipt_sha256="$(
            sha256sum memory-evaluation-receipt.json | awk '{print $1}'
          )"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg deployRunId "$GITHUB_RUN_ID" \
            --arg deployRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deploymentReceiptSha256 "$deployment_receipt_sha256" \
            --arg supplyChainRunId "$EXPECTED_SUPPLY_CHAIN_RUN_ID" \
            --arg supplyChainRunAttempt "$EXPECTED_SUPPLY_CHAIN_RUN_ATTEMPT" \
            --arg supplyChainReceiptSha256 "$supply_chain_receipt_sha256" \
            --arg memoryEvaluationRunId "$EXPECTED_MEMORY_EVALUATION_RUN_ID" \
            --arg memoryEvaluationRunAttempt "$EXPECTED_MEMORY_EVALUATION_RUN_ATTEMPT" \
            --arg memoryEvaluationReceiptSha256 "$memory_evaluation_receipt_sha256" '
              .schema == "archon.aws-candidate.evidence-binding" and
              .version == 1 and
              .commitSha == $sha and
              .deploy == {
                "runId":$deployRunId,
                "runAttempt":$deployRunAttempt
              } and
              .candidate.deploymentReceiptSha256 ==
                $deploymentReceiptSha256 and
              .supplyChain == {
                "runId":$supplyChainRunId,
                "runAttempt":$supplyChainRunAttempt,
                "receiptSha256":$supplyChainReceiptSha256
              } and
              .memoryEvaluation == {
                "runId":$memoryEvaluationRunId,
                "runAttempt":$memoryEvaluationRunAttempt,
                "receiptSha256":$memoryEvaluationReceiptSha256
              }
            ' candidate-evidence-binding.json >/dev/null
          gh attestation verify candidate-evidence-binding.json \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          gh attestation verify supply-chain-release-receipt.json \
            --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Verify candidate tree hashes and eu-west-1 boundary
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          test "$BEDROCK_REGION" = "eu-west-1"
          test -n "$AWS_ACCOUNT_ID"
          node aws/create-deployment-receipt.mjs \
            --verify deployment-receipt.json \
            --commit "${{ github.sha }}" \
            --sam .aws-sam/build \
            --web web/dist

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.164.0

      - name: Configure short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Refuse production mutation while earlier recovery is unresolved
        env:
          RECOVERY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          bash aws/recovery-intent-ledger.sh assert-clear |
            tee "${RUNNER_TEMP:?}/production-recovery-ledger-clear.json"
          jq -e \
            '.ok == true
             and .schema == "archon.recovery-intent.clear"
             and .version == 1
             and .environment == "production"
             and (
               .state == null
               or .state == "COMMITTED"
               or .state == "RECOVERED"
             )' \
            "${RUNNER_TEMP:?}/production-recovery-ledger-clear.json" \
            >/dev/null

      - name: Reconcile an interrupted same-run production greenfield recovery
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ENVIRONMENT: production
          GH_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_DEPLOY_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TERMINAL_JOB_NAME: Promote identical candidate to production
        run: |
          set -euo pipefail
          owner_proof="${RUNNER_TEMP:?}/production-greenfield-owner-proof.json"
          empty_template="${RUNNER_TEMP:?}/production-no-previous-template"
          empty_parameters="${RUNNER_TEMP:?}/production-no-previous-parameters"
          empty_tags="${RUNNER_TEMP:?}/production-no-previous-tags"
          test ! -e "$empty_template"
          test ! -e "$empty_parameters"
          test ! -e "$empty_tags"
          STACK_STATE=greenfield \
          HAS_PREVIOUS_STACK=false \
          PREVIOUS_STACK_TEMPLATE_FILE="$empty_template" \
          PREVIOUS_STACK_PARAMETERS_FILE="$empty_parameters" \
          PREVIOUS_STACK_TAGS_FILE="$empty_tags" \
          CANDIDATE_SHA="$CANDIDATE_SHA" \
            bash aws/prove-recovery-snapshot.sh >"$owner_proof"
          GREENFIELD_OWNER="$(
            jq -er '.greenfieldOwner | select(test("^[0-9a-f]{64}$"))' \
              "$owner_proof"
          )"
          terminally_proved=false
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            for prior_attempt in $(seq 1 $((GITHUB_RUN_ATTEMPT - 1))); do
              prior_jobs="${RUNNER_TEMP:?}/production-attempt-${prior_attempt}-jobs.json"
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${prior_attempt}/jobs?per_page=100" \
                >"$prior_jobs"
              if jq -e \
                --arg name "$TERMINAL_JOB_NAME" \
                '[.jobs[]?
                  | select(
                      .name == $name
                      and .status == "completed"
                      and .conclusion == "success"
                    )] | length > 0' \
                "$prior_jobs" >/dev/null; then
                terminally_proved=true
                break
              fi
            done
          fi
          if [ "$terminally_proved" != "true" ]; then
            current_run="${RUNNER_TEMP:?}/production-current-delivery-run.json"
            candidate_runs="${RUNNER_TEMP:?}/production-candidate-delivery-runs.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >"$current_run"
            current_started_at="$(
              jq -er \
                --argjson id "$GITHUB_RUN_ID" \
                --arg sha "$CANDIDATE_SHA" \
                '
                  select(
                    .id == $id
                    and .head_sha == $sha
                    and .event == "push"
                    and (
                      .path == ".github/workflows/deploy-aws.yml"
                      or .path == ".github/workflows/deploy-aws.yml@main"
                      or .path == ".github/workflows/deploy-aws.yml@refs/heads/main"
                    )
                    and (
                      .run_started_at
                      | type == "string"
                        and test(
                          "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                        )
                    )
                  )
                  | .run_started_at
                ' "$current_run"
            )"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-aws.yml/runs?event=push&head_sha=${CANDIDATE_SHA}&per_page=100" \
              >"$candidate_runs"
            while IFS= read -r later_run_id; do
              [[ "$later_run_id" =~ ^[0-9]+$ ]]
              later_jobs="${RUNNER_TEMP:?}/production-later-${later_run_id}-jobs.json"
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${later_run_id}/jobs?filter=all&per_page=100" \
                >"$later_jobs"
              if jq -e \
                --arg name "$TERMINAL_JOB_NAME" \
                '[.jobs[]?
                  | select(
                      .name == $name
                      and .status == "completed"
                      and .conclusion == "success"
                    )] | length > 0' \
                "$later_jobs" >/dev/null; then
                terminally_proved=true
                break
              fi
            done < <(
              jq -r \
                --arg sha "$CANDIDATE_SHA" \
                --arg startedAt "$current_started_at" \
                --argjson currentRunId "$GITHUB_RUN_ID" \
                '
                  [
                    .[].workflow_runs[]?
                    | select(
                        .id != $currentRunId
                        and .head_sha == $sha
                        and .event == "push"
                        and (
                          .path == ".github/workflows/deploy-aws.yml"
                          or .path == ".github/workflows/deploy-aws.yml@main"
                          or .path == ".github/workflows/deploy-aws.yml@refs/heads/main"
                        )
                        and (
                          .run_started_at > $startedAt
                          or (
                            .run_started_at == $startedAt
                            and .id > $currentRunId
                          )
                        )
                      )
                  ]
                  | sort_by(.run_started_at, .id)
                  | .[].id
                ' "$candidate_runs"
            )
          fi
          cleanup_needed=false
          if live_stack="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output json 2>&1)"; then
            live_identity="$(
              jq -c \
              --arg stack "$STACK_NAME" \
              --arg stackPrefix \
                "arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${STACK_NAME}/" \
              --arg owner "$GREENFIELD_OWNER" \
              --arg app "$APP_NAME" \
              --arg environment "$ENVIRONMENT" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                .Stacks[0] as $candidate
                | (
                    [.Stacks[]?.Tags[]?
                      | select(.Key == "ArchonGreenfieldOwner")
                      | .Value] == [$owner]
                  ) as $ownerMatches
                | {
                    exactOwner: (
                      (.Stacks | length) == 1
                      and $ownerMatches
                      and $candidate.StackName == $stack
                      and ($candidate.StackId | startswith($stackPrefix))
                      and $candidate.RoleARN == $role
                      and (
                        $candidate.EnableTerminationProtection
                        | type == "boolean"
                      )
                      and (
                        ($candidate.Tags // [])
                        | map({Key, Value})
                        | sort_by(.Key)
                      ) == (
                        [
                          {Key: "Application", Value: $app},
                          {
                            Key: "ArchonGreenfieldOwner",
                            Value: $owner
                          },
                          {Key: "Environment", Value: $environment}
                        ]
                        | sort_by(.Key)
                      )
                    ),
                    ownerMatches: $ownerMatches,
                    status: ($candidate.StackStatus // "")
                  }
              ' <<<"$live_stack"
            )"
            if [ "$(jq -er '.ownerMatches' <<<"$live_identity")" = "true" ] &&
               [ "$(jq -er '.exactOwner' <<<"$live_identity")" != "true" ]; then
              echo "The same-run production stack failed exact ownership checks." >&2
              exit 1
            fi
            if [ "$(jq -er '.exactOwner' <<<"$live_identity")" = "true" ]; then
              live_status="$(jq -er '.status' <<<"$live_identity")"
              case "$live_status" in
                CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                  if [ "$terminally_proved" != "true" ]; then
                    cleanup_needed=true
                  fi
                  ;;
                REVIEW_IN_PROGRESS|CREATE_IN_PROGRESS|CREATE_FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|UPDATE_FAILED|UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS|UPDATE_ROLLBACK_FAILED|DELETE_IN_PROGRESS|DELETE_FAILED)
                  cleanup_needed=true
                  ;;
                *)
                  echo "The same-run production stack is still mutating: $live_status" >&2
                  exit 1
                  ;;
              esac
            fi
          elif grep -qi "does not exist" <<<"$live_stack"; then
            cleanup_needed=true
          else
            echo "Unable to inspect prior production greenfield state." >&2
            exit 1
          fi
          if [ "$cleanup_needed" = "true" ]; then
            GREENFIELD_OWNER="$GREENFIELD_OWNER" \
              bash aws/delete-greenfield-stack.sh \
                >"${RUNNER_TEMP:?}/production-greenfield-reconciliation.json"
          fi

      - name: Refresh short-lived AWS credentials after production reconciliation
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-preflight-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Preflight application S3 access logging before stack mutation
        id: application_s3_preflight
        env:
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          bash aws/prove-application-s3-access-logging.sh preflight |
            tee application-s3-access-logging-preflight.json
          jq -e \
            --arg environment "$ENVIRONMENT" \
            --arg source "${APP_NAME}-${ENVIRONMENT}-web-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg destination "${APP_NAME}-s3-access-logs-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg prefix "${ENVIRONMENT}-web/" \
            '
              .ok == true
              and .schema == "archon.application-s3-access-logging.preflight"
              and .version == 1
              and .mode == "preflight"
              and .evidence == "live-control-plane"
              and .foundationVerified == true
              and .environment == $environment
              and .sourceBucket == $source
              and .destinationBucket == $destination
              and (
                .priorState == "absent"
                or .priorState == "disabled"
                or .priorState == "enabled"
              )
              and .expected == {
                "LoggingEnabled": {
                  "TargetBucket": $destination,
                  "TargetPrefix": $prefix,
                  "TargetObjectKeyFormat": {
                    "PartitionedPrefix": {
                      "PartitionDateSource": "EventTime"
                    }
                  }
                }
              }
              and .integrity.algorithm == "sha256"
              and .integrity.canonicalization == "jq-cS-v1"
              and (
                .integrity.payloadSha256
                | type == "string"
                and test("^[0-9a-f]{64}$")
              )
            ' application-s3-access-logging-preflight.json >/dev/null
          receipt_sha256="$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "receipt_sha256=$receipt_sha256" >>"$GITHUB_OUTPUT"

      - name: Preflight API stage-proof permissions before stack mutation
        id: api_preflight
        env:
          API_ACCESS_LOG_GROUP: /aws/apigateway/${{ env.APP_NAME }}-production
        run: |
          set -euo pipefail
          bash aws/prove-api-stage-controls.sh preflight |
            tee api-stage-preflight.json
          jq -e \
            '.ok == true and
             .mode == "preflight" and
             ((.state == "greenfield" and .deferredToPostDeploy == true) or
              (.state == "existing" and
               (.currentStage == "live" or .currentStage == "$default") and
               (.accessLogGroup | type == "string" and length > 0) and
               .permissions == [
                 "cloudformation:GetTemplate",
                 "apigateway:GET",
                 "cloudfront:GetDistribution",
                 "cloudfront:GetDistributionConfig",
                 "logs:DescribeLogStreams",
                 "logs:FilterLogEvents"
               ]))' \
            api-stage-preflight.json >/dev/null
          echo "stack_state=$(jq -er '.state' api-stage-preflight.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Discover the protected production alarm-routing contract
        id: alarm_routing
        env:
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/production-alarm-routing-discovery.json"
          bash aws/prove-alarm-routing.sh discover | tee "$receipt"
          jq -e \
            --arg environment "$ENVIRONMENT" \
            --arg expectedTopic \
              "arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${APP_NAME}-${ENVIRONMENT}-alarms" \
            '
              .ok == true
              and .schema == "archon.alarm-routing.proof"
              and .version == 1
              and .mode == "discover"
              and .environment == $environment
              and (
                (
                  (
                    .state == "legacy-inactive-not-provisioned"
                    or .state == "inactive-not-provisioned"
                  )
                  and .contractVersion == null
                  and .keyArn == null
                  and .topicArn == null
                  and .archiveQueueArn == null
                  and .alarmCount == null
                )
                or (
                  .state == "active"
                  and .contractVersion == "1"
                  and .topicArn == $expectedTopic
                  and (.keyArn | type == "string" and length > 0)
                  and (
                    .archiveQueueArn
                    | type == "string" and length > 0
                  )
                  and .alarmCount == null
                )
              )
            ' "$receipt" >/dev/null
          state="$(jq -er '.state' "$receipt")"
          topic_arn="$(jq -er '.topicArn // ""' "$receipt")"
          {
            echo "state=$state"
            echo "topic_arn=$topic_arn"
          } >>"$GITHUB_OUTPUT"

      - name: Capture the current recoverable release
        id: previous
        env:
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
        run: |
          set -euo pipefail
          FUNCTION_NAME=""
          FUNCTION_VERSION=""
          APPLICATION_URL=""
          BUCKET_NAME=""
          DISTRIBUTION_ID=""
          STACK_ID=""
          STACK_STATUS=""
          STACK_REVISION=""
          HAS_PREVIOUS_STACK=false
          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            stack_before="${RUNNER_TEMP:?}/production-stack-before.json"
            stack_after="${RUNNER_TEMP:?}/production-stack-after.json"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --output json >"$stack_before"
            jq -e \
              --arg stack "$STACK_NAME" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackName == $stack
                and (
                  .Stacks[0].StackStatus == "CREATE_COMPLETE"
                  or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                  or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
                )
                and .Stacks[0].RoleARN == $role
              ' "$stack_before" >/dev/null
            HAS_PREVIOUS_STACK=true
            STACK_ID="$(jq -er '.Stacks[0].StackId' "$stack_before")"
            STACK_STATUS="$(jq -er '.Stacks[0].StackStatus' "$stack_before")"
            STACK_REVISION="$(
              jq -er \
                '.Stacks[0].LastUpdatedTime // .Stacks[0].CreationTime' \
                "$stack_before"
            )"
            aws cloudformation get-template \
              --stack-name "$STACK_ID" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json |
              jq -er '.TemplateBody | if type == "string" then . else tojson end' \
                > previous-stack-template.yaml
            test "$(wc -c < previous-stack-template.yaml)" -le 51200
            jq -e \
                'map({ParameterKey, ParameterValue})
                 | sort_by(.ParameterKey)
                 | if (length > 0 and
                       all(.[];
                         (.ParameterKey | type == "string" and length > 0) and
                         (.ParameterValue |
                           type == "string" and . != "****")) and
                       ([.[].ParameterKey] | unique | length) == length)
                   then .
                   else error("invalid stack parameter snapshot")
                   end' \
              < <(jq '.Stacks[0].Parameters' "$stack_before") \
              > previous-stack-parameters.json
            jq -e \
              '
                (.Stacks[0].Tags // [])
                | map({Key, Value})
                | sort_by(.Key)
                | if ([.[].Key] | unique | length) == length
                  then .
                  else error("duplicate stack tag keys")
                  end
              ' "$stack_before" > previous-stack-tags.json
            FUNCTION_NAME="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "FunctionName")
                 | .OutputValue' "$stack_before"
            )"
            APPLICATION_URL="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "ApplicationUrl")
                 | .OutputValue' "$stack_before"
            )"
            BUCKET_NAME="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "SpaBucketName")
                 | .OutputValue' "$stack_before"
            )"
            DISTRIBUTION_ID="$(
              jq -er \
                '.Stacks[0].Outputs[]
                 | select(.OutputKey == "DistributionId")
                 | .OutputValue' "$stack_before"
            )"
            test "$BUCKET_NAME" = \
              "${APP_NAME}-production-web-${AWS_ACCOUNT_ID}-${AWS_REGION}"
            [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
            if [ -n "$FUNCTION_NAME" ] && [ "$FUNCTION_NAME" != "None" ]; then
              alias_before="${RUNNER_TEMP:?}/production-alias-before.json"
              alias_after="${RUNNER_TEMP:?}/production-alias-after.json"
              aws lambda get-alias \
                --function-name "$FUNCTION_NAME" \
                --name live \
                --region "$AWS_REGION" \
                --output json >"$alias_before"
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${FUNCTION_NAME}:live" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and (.FunctionVersion | test("^[1-9][0-9]*$"))
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' "$alias_before" >/dev/null
              FUNCTION_VERSION="$(
                jq -er '.FunctionVersion' "$alias_before"
              )"
            else
              echo "The existing stack has no recoverable Lambda function." >&2
              exit 1
            fi
            test -n "$APPLICATION_URL"
            test "$APPLICATION_URL" != "None"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_ID" \
              --region "$AWS_REGION" \
              --output json >"$stack_after"
            jq -e \
              --slurpfile before "$stack_before" \
              '
                ($before[0].Stacks | length) == 1
                and (.Stacks | length) == 1
                and .Stacks[0].StackId == $before[0].Stacks[0].StackId
                and .Stacks[0].StackStatus ==
                  $before[0].Stacks[0].StackStatus
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime)
                  ==
                  ($before[0].Stacks[0].LastUpdatedTime //
                    $before[0].Stacks[0].CreationTime)
                )
                and .Stacks[0].RoleARN == $before[0].Stacks[0].RoleARN
                and .Stacks[0].Parameters ==
                  $before[0].Stacks[0].Parameters
                and .Stacks[0].Outputs == $before[0].Stacks[0].Outputs
              ' "$stack_after" >/dev/null
            aws lambda get-alias \
              --function-name "$FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json >"$alias_after"
            jq -e \
              --slurpfile before "$alias_before" \
              '
                .AliasArn == $before[0].AliasArn
                and .Name == $before[0].Name
                and .FunctionVersion == $before[0].FunctionVersion
                and (.RoutingConfig // {}) ==
                  ($before[0].RoutingConfig // {})
                and .RevisionId == $before[0].RevisionId
              ' "$alias_after" >/dev/null
          elif [ "$EXPECTED_STACK_STATE" = "greenfield" ]; then
            if stack_result="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "Stack state changed after the greenfield preflight." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$stack_result"; then
              echo "Unable to confirm the greenfield stack state." >&2
              exit 1
            fi
          else
            echo "Invalid API stage preflight stack state." >&2
            exit 1
          fi
          snapshot="${RUNNER_TEMP:?}/production-recovery-snapshot.json"
          ENVIRONMENT=production \
          STACK_STATE="$EXPECTED_STACK_STATE" \
          HAS_PREVIOUS_STACK="$HAS_PREVIOUS_STACK" \
          PREVIOUS_STACK_ID="$STACK_ID" \
          PREVIOUS_STACK_STATUS="$STACK_STATUS" \
          PREVIOUS_STACK_REVISION="$STACK_REVISION" \
          PREVIOUS_FUNCTION_NAME="$FUNCTION_NAME" \
          PREVIOUS_FUNCTION_VERSION="$FUNCTION_VERSION" \
          PREVIOUS_APPLICATION_URL="$APPLICATION_URL" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$snapshot"
          jq -e \
            --arg environment production \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --argjson hasPreviousStack "$HAS_PREVIOUS_STACK" \
            '
              .ok == true
              and .schema == "archon.recovery-snapshot.proof"
              and .version == 1
              and .environment == $environment
              and .stackState == $stackState
              and .hasPreviousStack == $hasPreviousStack
              and (.manifestSha256 | test("^[0-9a-f]{64}$"))
            ' "$snapshot" >/dev/null
          {
            echo "function_name=$FUNCTION_NAME"
            echo "function_version=$FUNCTION_VERSION"
            echo "application_url=$APPLICATION_URL"
            echo "bucket_name=$BUCKET_NAME"
            echo "distribution_id=$DISTRIBUTION_ID"
            echo "has_previous_stack=$HAS_PREVIOUS_STACK"
            echo "stack_id=$STACK_ID"
            echo "stack_status=$STACK_STATUS"
            echo "stack_revision=$STACK_REVISION"
            echo "previous_release_sha256=$(jq -er '.manifestSha256' "$snapshot")"
            echo "template_sha256=$(jq -r '.templateSha256 // ""' "$snapshot")"
            echo "parameters_sha256=$(jq -r '.parametersSha256 // ""' "$snapshot")"
            echo "tags_sha256=$(jq -r '.tagsSha256 // ""' "$snapshot")"
            echo "greenfield_owner=$(jq -r '.greenfieldOwner // ""' "$snapshot")"
          } >> "$GITHUB_OUTPUT"

      - name: Revalidate production control-plane fence before new release mutation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_FOUNDATION_RUN_ID: ${{ needs.source-gate.outputs.foundation_control_run_id }}
          EXPECTED_FOUNDATION_RUN_ATTEMPT: ${{ needs.source-gate.outputs.foundation_control_run_attempt }}
          EXPECTED_STAGING_EDGE_RUN_ID: ${{ needs.source-gate.outputs.staging_edge_control_run_id }}
          EXPECTED_STAGING_EDGE_RUN_ATTEMPT: ${{ needs.source-gate.outputs.staging_edge_control_run_attempt }}
          EXPECTED_PRODUCTION_EDGE_RUN_ID: ${{ needs.source-gate.outputs.production_edge_control_run_id }}
          EXPECTED_PRODUCTION_EDGE_RUN_ATTEMPT: ${{ needs.source-gate.outputs.production_edge_control_run_attempt }}
          FENCE_ENVIRONMENT: production
          FENCE_JOB_ID: deploy-production
          FENCE_MUTEX_GROUP: aws-shared-control-plane-mutation
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fence="${RUNNER_TEMP:?}/production-control-plane-receipt-fence.json"
          bash .github/scripts/revalidate-aws-control-plane-fence.sh \
            >"$fence"
          jq -e \
            --arg environment "$FENCE_ENVIRONMENT" \
            --arg foundationAttempt "$EXPECTED_FOUNDATION_RUN_ATTEMPT" \
            --arg foundationId "$EXPECTED_FOUNDATION_RUN_ID" \
            --arg job "$FENCE_JOB_ID" \
            --arg mutex "$FENCE_MUTEX_GROUP" \
            --arg productionAttempt "$EXPECTED_PRODUCTION_EDGE_RUN_ATTEMPT" \
            --arg productionId "$EXPECTED_PRODUCTION_EDGE_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg sha "$EXPECTED_SHA" \
            --arg stagingAttempt "$EXPECTED_STAGING_EDGE_RUN_ATTEMPT" \
            --arg stagingId "$EXPECTED_STAGING_EDGE_RUN_ID" '
              .schema == "archon.aws.control-plane-receipt-fence"
              and .schemaVersion == 1
              and .ok == true
              and .sourceSha == $sha
              and .mainHeadSha == $sha
              and .mainHeadRevalidated == true
              and .mutationMutexHeldByCaller == true
              and .latestEligibleRunsRevalidated == true
              and .edgeSnapshotShared == true
              and .mutex == {group:$mutex, heldByCaller:true}
              and .deployment == {
                environment:$environment,
                jobId:$job,
                runId:($runId | tonumber),
                runAttempt:($runAttempt | tonumber)
              }
              and .foundation == {
                runId:($foundationId | tonumber),
                runAttempt:($foundationAttempt | tonumber),
                operation:"verify"
              }
              and .edge.staging.runId == ($stagingId | tonumber)
              and .edge.staging.runAttempt == ($stagingAttempt | tonumber)
              and (.edge.staging.operation | test("^(apply|verify)$"))
              and .edge.production.runId == ($productionId | tonumber)
              and .edge.production.runAttempt == ($productionAttempt | tonumber)
              and (.edge.production.operation | test("^(apply|verify)$"))
              and (.checkedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' "$fence" >/dev/null
          fence_sha256="$(sha256sum "$fence" | awk '{print $1}')"
          [[ "$fence_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "CONTROL_PLANE_FENCE_FILE=$fence"
            echo "CONTROL_PLANE_FENCE_SHA256=$fence_sha256"
          } >>"$GITHUB_ENV"

      - name: Enforce production stack protection and fresh pre-deploy drift gate
        env:
          ENVIRONMENT: production
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          EXPECTED_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          EXPECTED_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          proof="${RUNNER_TEMP:?}/production-cloudformation-controls-preflight.json"
          bash aws/enforce-cloudformation-controls.sh preflight >"$proof"
          jq -e -s \
            'length == 1 and (.[0] | type == "object")' \
            "$proof" >/dev/null
          jq -e \
            --arg expectedState "$EXPECTED_STACK_STATE" \
            '
              .ok == true
              and .schema == "archon.cloudformation-controls.proof"
              and .version == 1
              and .mode == "preflight"
              and .evidence == "live-control-plane"
              and .identity.environment == "production"
              and (
                (
                  $expectedState == "greenfield"
                  and .identity.state == "absent"
                  and .protection.enabled == null
                  and .drift == null
                )
                or (
                  $expectedState == "existing"
                  and .identity.state == "existing"
                  and .protection.enabled == true
                  and .drift.detectionStatus == "DETECTION_COMPLETE"
                  and .drift.stackDriftStatus == "IN_SYNC"
                  and .drift.driftedResourceCount == 0
                  and .drift.checkedResourceCount > 0
                )
              )
            ' "$proof" >/dev/null

      - name: Re-prove the application S3 preflight immediately before SAM
        id: application_s3_recheck
        env:
          ENVIRONMENT: production
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
        run: |
          set -euo pipefail
          snapshot_recheck="${RUNNER_TEMP:?}/production-recovery-snapshot-recheck.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$snapshot_recheck"
          jq -e \
            --arg expected "$EXPECTED_PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$snapshot_recheck" >/dev/null

          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            current_stack="${RUNNER_TEMP:?}/production-stack-recheck.json"
            current_template="${RUNNER_TEMP:?}/production-template-recheck.yaml"
            current_parameters="${RUNNER_TEMP:?}/production-parameters-recheck.json"
            current_tags="${RUNNER_TEMP:?}/production-tags-recheck.json"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --output json >"$current_stack"
            jq -e \
              --arg stackId "$PREVIOUS_STACK_ID" \
              --arg status "$PREVIOUS_STACK_STATUS" \
              --arg revision "$PREVIOUS_STACK_REVISION" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              --arg function "$PREVIOUS_FUNCTION_NAME" \
              --arg url "$PREVIOUS_APPLICATION_URL" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackId == $stackId
                and .Stacks[0].StackStatus == $status
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime) == $revision
                )
                and .Stacks[0].RoleARN == $role
                and (
                  [.Stacks[0].Outputs[]
                    | select(.OutputKey == "FunctionName")
                    | .OutputValue] == [$function]
                )
                and (
                  [.Stacks[0].Outputs[]
                    | select(.OutputKey == "ApplicationUrl")
                    | .OutputValue] == [$url]
                )
              ' "$current_stack" >/dev/null
            aws cloudformation get-template \
              --stack-name "$PREVIOUS_STACK_ID" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json |
              jq -er \
                '.TemplateBody | if type == "string" then . else tojson end' \
                >"$current_template"
            jq \
              '.Stacks[0].Parameters
               | map({ParameterKey, ParameterValue})
               | sort_by(.ParameterKey)' \
              "$current_stack" >"$current_parameters"
            jq -e \
              '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
              "$current_stack" >"$current_tags"
            test "$(
              sha256sum "$current_template" | awk '{print $1}'
            )" = "$EXPECTED_TEMPLATE_SHA256"
            test "$(
              sha256sum "$current_parameters" | awk '{print $1}'
            )" = "$EXPECTED_PARAMETERS_SHA256"
            test "$(
              sha256sum "$current_tags" | awk '{print $1}'
            )" = "$EXPECTED_TAGS_SHA256"
            aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json |
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' >/dev/null
          else
            if stack_result="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "Stack state changed before the greenfield deploy." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$stack_result"; then
              echo "Unable to re-prove the greenfield stack state." >&2
              exit 1
            fi
          fi

          recheck="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-recheck.json"
          canonical_before="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-before.canonical.json"
          canonical_recheck="${RUNNER_TEMP:?}/application-s3-access-logging-preflight-recheck.canonical.json"
          bash aws/prove-application-s3-access-logging.sh preflight >"$recheck"
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          jq -cS . application-s3-access-logging-preflight.json \
            >"$canonical_before"
          jq -cS . "$recheck" >"$canonical_recheck"
          cmp --silent "$canonical_before" "$canonical_recheck"
          jq -e \
            --arg stackState "$EXPECTED_STACK_STATE" \
            '
              (
                $stackState == "greenfield"
                and .priorState == "absent"
              )
              or (
                $stackState == "existing"
                and (
                  .priorState == "disabled"
                  or .priorState == "enabled"
                )
              )
            ' "$recheck" >/dev/null
          {
            echo "reproved=true"
            echo "stack_state=$EXPECTED_STACK_STATE"
          } >>"$GITHUB_OUTPUT"

      - name: Persist and arm the immutable production recovery intent
        id: durable_recovery
        env:
          ARTIFACT_BUCKET: ${{ env.AWS_SAM_ARTIFACT_BUCKET }}
          CANDIDATE_SHA: ${{ github.sha }}
          ENVIRONMENT: production
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          PREVIOUS_BUCKET_NAME: ${{ steps.previous.outputs.bucket_name }}
          PREVIOUS_DISTRIBUTION_ID: ${{ steps.previous.outputs.distribution_id }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          RECOVERY_ENVIRONMENT: production
          RECOVERY_SNAPSHOT_PROOF_FILE: ${{ runner.temp }}/production-recovery-snapshot-recheck.json
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.source-gate.outputs.ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ needs.source-gate.outputs.ci_run_id }}
          SOURCE_DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_DEPLOY_RUN_ID: ${{ github.run_id }}
          STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          bundle_tar="${RUNNER_TEMP:?}/production-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          roundtrip_tar="${RUNNER_TEMP:?}/production-recovery-roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          extracted_dir="${RUNNER_TEMP:?}/production-recovery-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bundle_proof="${RUNNER_TEMP:?}/production-recovery-bundle-proof.json"
          object_proof="${RUNNER_TEMP:?}/production-recovery-object-proof.json"
          object_response="${RUNNER_TEMP:?}/production-recovery-object-response.json"
          cleanup_durable_intent() {
            rm -f -- \
              "$bundle_tar" \
              "$roundtrip_tar" \
              "$bundle_proof" \
              "$object_proof" \
              "$object_response"
            rm -rf -- "$extracted_dir"
          }
          trap cleanup_durable_intent EXIT

          bash aws/create-durable-recovery-bundle.sh "$bundle_tar" \
            >"$bundle_proof"
          RECOVERY_INTENT_ID="$(
            jq -er '.intentId | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_MANIFEST_SHA256="$(
            jq -er '.manifestSha256 | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_ARCHIVE_SHA256="$(
            jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' \
              "$bundle_proof"
          )"
          RECOVERY_ARCHIVE_KEY="candidates/recovery/production/${RECOVERY_INTENT_ID}.tar"
          RECOVERY_INTENT_ID="$RECOVERY_INTENT_ID" \
            bash aws/put-durable-recovery-object.sh \
              "$bundle_tar" \
              "$RECOVERY_ARCHIVE_KEY" >"$object_proof"
          RECOVERY_ARCHIVE_BUCKET="$(jq -er '.bucket' "$object_proof")"
          RECOVERY_ARCHIVE_VERSION_ID="$(
            jq -er '.versionId | select(length > 0 and . != "null")' \
              "$object_proof"
          )"
          test "$(jq -er '.sha256' "$object_proof")" = \
            "$RECOVERY_ARCHIVE_SHA256"

          aws s3api get-object \
            --bucket "$RECOVERY_ARCHIVE_BUCKET" \
            --key "$RECOVERY_ARCHIVE_KEY" \
            --version-id "$RECOVERY_ARCHIVE_VERSION_ID" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            --checksum-mode ENABLED \
            --region "$AWS_REGION" \
            --output json \
            "$roundtrip_tar" >"$object_response"
          test "$(
            sha256sum "$roundtrip_tar" | awk '{print $1}'
          )" = "$RECOVERY_ARCHIVE_SHA256"
          expected_checksum="$(
            openssl dgst -sha256 -binary "$roundtrip_tar" | base64 -w0
          )"
          jq -e \
            --arg checksum "$expected_checksum" \
            --arg version "$RECOVERY_ARCHIVE_VERSION_ID" \
            '.VersionId == $version and .ChecksumSHA256 == $checksum' \
            "$object_response" >/dev/null
          EXPECTED_ARCHIVE_SHA256="$RECOVERY_ARCHIVE_SHA256" \
          EXPECTED_CANDIDATE_SHA="$CANDIDATE_SHA" \
          EXPECTED_INTENT_ID="$RECOVERY_INTENT_ID" \
          EXPECTED_MANIFEST_SHA256="$RECOVERY_MANIFEST_SHA256" \
          EXPECTED_SOURCE_CI_RUN_ATTEMPT="$SOURCE_CI_RUN_ATTEMPT" \
          EXPECTED_SOURCE_CI_RUN_ID="$SOURCE_CI_RUN_ID" \
          EXPECTED_SOURCE_DEPLOY_RUN_ATTEMPT="$SOURCE_DEPLOY_RUN_ATTEMPT" \
          EXPECTED_SOURCE_DEPLOY_RUN_ID="$SOURCE_DEPLOY_RUN_ID" \
            bash aws/extract-durable-recovery-bundle.sh \
              "$roundtrip_tar" \
              "$extracted_dir" >/dev/null

          RECOVERY_ARCHIVE_BUCKET="$RECOVERY_ARCHIVE_BUCKET" \
          RECOVERY_ARCHIVE_KEY="$RECOVERY_ARCHIVE_KEY" \
          RECOVERY_ARCHIVE_SHA256="$RECOVERY_ARCHIVE_SHA256" \
          RECOVERY_ARCHIVE_VERSION_ID="$RECOVERY_ARCHIVE_VERSION_ID" \
          RECOVERY_INTENT_ID="$RECOVERY_INTENT_ID" \
          RECOVERY_MANIFEST_SHA256="$RECOVERY_MANIFEST_SHA256" \
            bash aws/recovery-intent-ledger.sh arm \
              >"${RUNNER_TEMP:?}/production-recovery-ledger-armed.json"
          jq -e \
            --arg intent "$RECOVERY_INTENT_ID" \
            --arg version "$RECOVERY_ARCHIVE_VERSION_ID" \
            '
              .state == "ARMED"
              and .intentId == $intent
              and .archiveVersionId == $version
            ' "${RUNNER_TEMP:?}/production-recovery-ledger-armed.json" \
            >/dev/null
          had_previous_index="$(
            jq -er \
              '.hadPreviousIndex
               | if type == "boolean"
                 then tostring
                 else error("invalid previous-index state")
                 end' \
              "$bundle_proof"
          )"
          {
            echo "armed=true"
            echo "intent_id=$RECOVERY_INTENT_ID"
            echo "archive_bucket=$RECOVERY_ARCHIVE_BUCKET"
            echo "archive_key=$RECOVERY_ARCHIVE_KEY"
            echo "archive_version_id=$RECOVERY_ARCHIVE_VERSION_ID"
            echo "archive_sha256=$RECOVERY_ARCHIVE_SHA256"
            echo "manifest_sha256=$RECOVERY_MANIFEST_SHA256"
            echo "had_previous_index=$had_previous_index"
            echo "previous_index_version=$(jq -r '.previousIndexVersionId // ""' "$bundle_proof")"
            echo "previous_index_sha256=$(jq -r '.previousIndexSha256 // ""' "$bundle_proof")"
          } >>"$GITHUB_OUTPUT"

      - name: Refresh short-lived AWS credentials for production SAM deployment
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-sam-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve the exact production edge-stack handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "eu-west-1"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          edge_stack="${APP_NAME}-production-edge"
          stack="${RUNNER_TEMP:?}/production-edge-stack.json"
          aws cloudformation describe-stacks \
            --stack-name "$edge_stack" \
            --region us-east-1 \
            --output json >"$stack"
          web_acl_arn="$(
            jq -er \
              --arg account "$AWS_ACCOUNT_ID" \
              --arg app "$APP_NAME" \
              --arg stack "$edge_stack" \
              '
                .Stacks[0] as $current
                | (
                    (.Stacks | length) == 1
                    and $current.StackName == $stack
                    and (
                      $current.StackStatus == "CREATE_COMPLETE"
                      or $current.StackStatus == "UPDATE_COMPLETE"
                    )
                    and $current.EnableTerminationProtection == true
                    and (($current.RoleARN // null) == null)
                    and (
                      [
                        $current.Parameters[]
                        | {key:.ParameterKey, value:.ParameterValue}
                      ]
                      | from_entries
                    ) == {
                      AppName: $app,
                      Environment: "production",
                      ApiAggregateRateLimit: "1000",
                      ResolutionCreateRateLimit: "100"
                    }
                    and (
                      [
                        $current.Outputs[]
                        | select(.OutputKey == "ControlPlaneRegion")
                        | .OutputValue
                      ]
                    ) == ["us-east-1"]
                  ) as $valid
                | if $valid
                  then [
                    $current.Outputs[]
                    | select(.OutputKey == "WebAclArn")
                    | .OutputValue
                    | select(
                        test(
                          "^arn:aws:wafv2:us-east-1:" + $account
                          + ":global/webacl/" + $app
                          + "-production-cloudfront/[0-9a-f-]+$"
                        )
                      )
                  ]
                  | select(length == 1)
                  | .[0]
                  else error("invalid production edge-stack handoff")
                  end
              ' "$stack"
          )"
          echo "CLOUDFRONT_WEB_ACL_ARN=$web_acl_arn" >>"$GITHUB_ENV"

      - name: Deploy production with recovery-safe SAM canary
        id: deploy
        env:
          ALARM_TOPIC_ARN: ${{ steps.alarm_routing.outputs.topic_arn }}
          CANARY_URL: ${{ steps.previous.outputs.application_url }}
          ENVIRONMENT: production
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_STACK_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_SECRET_ID"
          test -n "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN"
          test -n "$AWS_SAM_ARTIFACT_BUCKET"
          test -n "$AWS_LAMBDA_EXECUTION_ROLE_ARN"
          test -n "$AWS_CODEDEPLOY_SERVICE_ROLE_ARN"
          [[ "$COCKROACH_SQL_DNS" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]
          test "${#COCKROACH_SQL_DNS}" -le 253
          [[ "$CLOUDFRONT_WEB_ACL_ARN" =~ ^arn:aws:wafv2:us-east-1:${AWS_ACCOUNT_ID}:global/webacl/[A-Za-z0-9_-]+/[0-9a-f-]+$ ]]
          # Keep this identical to staging: SAM's supported YAML file interface
          # is required to carry the explicit dormant AlarmTopicArn value.
          parameter_overrides_file="${RUNNER_TEMP:?}/production-sam-parameters.yaml"
          jq -n \
            --arg appName "$APP_NAME" \
            --arg environment "production" \
            --arg databaseSecretId "$DATABASE_SECRET_ID" \
            --arg lambdaRole "$AWS_LAMBDA_EXECUTION_ROLE_ARN" \
            --arg codeDeployRole "$AWS_CODEDEPLOY_SERVICE_ROLE_ARN" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg recoveryDrillToken "disabled" \
            --arg bedrockRegion "$BEDROCK_REGION" \
            --arg embeddingModel "$BEDROCK_EMBED_MODEL_ID" \
            --arg narratorModel "$BEDROCK_NARRATOR_MODEL_ID" \
            --arg cockroachRegion "eu-west-1" \
            --arg cockroachEvidence \
              "cockroach-cloud-api-release-gate" \
            --arg cockroachSqlDns "$COCKROACH_SQL_DNS" \
            --arg reservedConcurrency "5" \
            --arg alarmTopicArn "$ALARM_TOPIC_ARN" \
            --arg cloudFrontWebAclArn "$CLOUDFRONT_WEB_ACL_ARN" \
            '{
              AppName: $appName,
              Environment: $environment,
              DatabaseSecretId: $databaseSecretId,
              LambdaExecutionRoleArn: $lambdaRole,
              CodeDeployServiceRoleArn: $codeDeployRole,
              ReleaseCommitSha: $releaseCommitSha,
              RecoveryDrillToken: $recoveryDrillToken,
              BedrockRegion: $bedrockRegion,
              BedrockEmbeddingModelId: $embeddingModel,
              BedrockNarratorModelId: $narratorModel,
              CockroachRegion: $cockroachRegion,
              CockroachRegionEvidence: $cockroachEvidence,
              CockroachSqlDns: $cockroachSqlDns,
              ReservedConcurrency: $reservedConcurrency,
              AlarmTopicArn: $alarmTopicArn,
              CloudFrontWebAclArn: $cloudFrontWebAclArn
            }' >"$parameter_overrides_file"
          jq -e \
            --arg environment "production" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg recoveryDrillToken "disabled" \
            --arg reservedConcurrency "5" \
            --arg alarmTopicArn "$ALARM_TOPIC_ARN" \
            --arg cloudFrontWebAclArn "$CLOUDFRONT_WEB_ACL_ARN" \
            '
              (keys | sort) == (
                [
                  "AlarmTopicArn",
                  "AppName",
                  "BedrockEmbeddingModelId",
                  "BedrockNarratorModelId",
                  "BedrockRegion",
                  "CockroachRegion",
                  "CockroachRegionEvidence",
                  "CockroachSqlDns",
                  "CloudFrontWebAclArn",
                  "CodeDeployServiceRoleArn",
                  "DatabaseSecretId",
                  "Environment",
                  "LambdaExecutionRoleArn",
                  "ReleaseCommitSha",
                  "RecoveryDrillToken",
                  "ReservedConcurrency"
                ] | sort
              )
              and all(.[]; type == "string")
              and .Environment == $environment
              and .ReleaseCommitSha == $releaseCommitSha
              and .RecoveryDrillToken == $recoveryDrillToken
              and .ReservedConcurrency == $reservedConcurrency
              and .AlarmTopicArn == $alarmTopicArn
              and .CloudFrontWebAclArn == $cloudFrontWebAclArn
              and .CockroachSqlDns == env.COCKROACH_SQL_DNS
            ' "$parameter_overrides_file" >/dev/null
          target_tags="${RUNNER_TEMP:?}/production-sam-stack-tags.json"
          if [ "$EXPECTED_STACK_STATE" = "greenfield" ]; then
            [[ "$GREENFIELD_OWNER" =~ ^[0-9a-f]{64}$ ]]
            prior_tags="${RUNNER_TEMP:?}/production-greenfield-base-tags.json"
            jq -n '[]' >"$prior_tags"
          else
            test "$EXPECTED_STACK_STATE" = "existing"
            test -z "$GREENFIELD_OWNER"
            [[ "$PREVIOUS_STACK_TAGS_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$(
              sha256sum previous-stack-tags.json | awk '{print $1}'
            )" = "$PREVIOUS_STACK_TAGS_SHA256"
            prior_tags=previous-stack-tags.json
          fi
          GREENFIELD_OWNER="$GREENFIELD_OWNER" \
            bash aws/merge-canonical-stack-tags.sh \
              "$prior_tags" >"$target_tags"
          serialized_tags_file="${RUNNER_TEMP:?}/production-sam-stack-tags.argv"
          bash aws/serialize-sam-stack-tags.sh \
            "$target_tags" >"$serialized_tags_file"
          mapfile -t canonical_stack_tags <"$serialized_tags_file"
          test "${#canonical_stack_tags[@]}" -ge 2
          SAM_TAGS=(--tags "${canonical_stack_tags[@]}")
          target_tags_sha256="$(
            sha256sum "$target_tags" | awk '{print $1}'
          )"
          [[ "$target_tags_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "target_tags_sha256=$target_tags_sha256" >>"$GITHUB_OUTPUT"
          CANARY_PROBE_PID=""
          stop_canary_probe() {
            if [ -n "$CANARY_PROBE_PID" ]; then
              kill "$CANARY_PROBE_PID" 2>/dev/null || true
              wait "$CANARY_PROBE_PID" 2>/dev/null || true
            fi
          }
          trap stop_canary_probe EXIT
          if [ -n "$CANARY_URL" ] && [ "$CANARY_URL" != "None" ]; then
            (
              # Exercise both the live proof boundary and the critical recall
              # path. The CodeDeploy alarm is scoped to the candidate's exact
              # ExecutedVersion, so failures from the previous weighted-alias
              # target cannot poison its recovery.
              attempt=0
              while true; do
                attempt=$((attempt + 1))
                curl --fail --silent --max-time 30 \
                  "$CANARY_URL/api/proof" >/dev/null 2>&1 || true
                if [ $((attempt % 5)) -eq 0 ]; then
                  curl --fail --silent --max-time 45 \
                    -X POST "$CANARY_URL/api/recall" \
                    -H 'content-type: application/json' \
                    --data '{"question":"What was the true employer cost and the off-bank wedge?","kind":"payroll_event","limit":5}' \
                    >/dev/null 2>&1 || true
                fi
                sleep 2
              done
            ) &
            CANARY_PROBE_PID=$!
          fi
          if [ "$EXPECTED_STACK_STATE:$HAS_PREVIOUS_STACK" = "existing:true" ]; then
            final_stack="${RUNNER_TEMP:?}/production-stack-final-before-sam.json"
            aws cloudformation describe-stacks \
              --stack-name "$PREVIOUS_STACK_ID" \
              --region "$AWS_REGION" \
              --output json >"$final_stack"
            jq -e \
              --arg stackId "$PREVIOUS_STACK_ID" \
              --arg status "$PREVIOUS_STACK_STATUS" \
              --arg revision "$PREVIOUS_STACK_REVISION" \
              --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              '
                (.Stacks | length) == 1
                and .Stacks[0].StackId == $stackId
                and .Stacks[0].StackStatus == $status
                and (
                  (.Stacks[0].LastUpdatedTime //
                    .Stacks[0].CreationTime) == $revision
                )
                and .Stacks[0].RoleARN == $role
              ' "$final_stack" >/dev/null
            final_tags="${RUNNER_TEMP:?}/production-tags-final-before-sam.json"
            jq -e \
              '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
              "$final_stack" >"$final_tags"
            test "$(
              sha256sum "$final_tags" | awk '{print $1}'
            )" = "$PREVIOUS_STACK_TAGS_SHA256"
            aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json |
              jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' >/dev/null
          elif [ "$EXPECTED_STACK_STATE:$HAS_PREVIOUS_STACK" = "greenfield:false" ]; then
            if final_stack_state="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" 2>&1)"; then
              echo "A stack appeared immediately before the greenfield SAM deploy." >&2
              exit 1
            elif ! grep -qi "does not exist" <<<"$final_stack_state"; then
              echo "Unable to prove final greenfield absence before SAM." >&2
              exit 1
            fi
          else
            echo "The final stack-state contract is inconsistent." >&2
            exit 1
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$AWS_SAM_ARTIFACT_BUCKET" \
            --s3-prefix "candidates/deployments/production/${{ github.sha }}" \
            --kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --role-arn "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides "file://${parameter_overrides_file}" \
            "${SAM_TAGS[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar
          stop_canary_probe
          trap - EXIT

      - name: Refresh short-lived AWS credentials after production SAM deployment
        if: success()
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-post-sam-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Resolve public, non-secret stack outputs
        id: stack
        env:
          ENVIRONMENT: production
          EXPECTED_STACK_STATE: ${{ steps.api_preflight.outputs.stack_state }}
          GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          TARGET_STACK_TAGS_SHA256: ${{ steps.deploy.outputs.target_tags_sha256 }}
        run: |
          set -euo pipefail
          post_sam_stack="${RUNNER_TEMP:?}/production-stack-after-sam.json"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output json >"$post_sam_stack"
          jq -e \
            --arg stack "$STACK_NAME" \
            --arg stackPrefix \
              "arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${STACK_NAME}/" \
            --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg owner "$GREENFIELD_OWNER" \
            --arg previousStackId "$PREVIOUS_STACK_ID" \
            --arg app "$APP_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg releaseCommitSha "${{ github.sha }}" \
            --arg reservedConcurrency "5" \
            --arg cockroachSqlDns "$COCKROACH_SQL_DNS" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackName == $stack
              and (.Stacks[0].StackId | startswith($stackPrefix))
              and .Stacks[0].RoleARN == $role
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "ReleaseCommitSha")
                  | .ParameterValue] == [$releaseCommitSha]
              )
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "ReservedConcurrency")
                  | .ParameterValue] == [$reservedConcurrency]
              )
              and (
                [.Stacks[0].Parameters[]?
                  | select(.ParameterKey == "CockroachSqlDns")
                  | .ParameterValue] == [$cockroachSqlDns]
              )
              and (
                [.Stacks[0].Tags[]?
                  | select(.Key == "Application")
                  | .Value] == [$app]
              )
              and (
                [.Stacks[0].Tags[]?
                  | select(.Key == "Environment")
                  | .Value] == [$environment]
              )
              and (
                [.Stacks[0].Tags[]?.Key] as $keys
                | ($keys | unique | length) == ($keys | length)
              )
              and (
                (
                  $stackState == "greenfield"
                  and $previousStackId == ""
                  and .Stacks[0].StackStatus == "CREATE_COMPLETE"
                  and ((.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key))
                    == ([
                      {Key: "Application", Value: $app},
                      {Key: "ArchonGreenfieldOwner", Value: $owner},
                      {Key: "Environment", Value: $environment}
                    ] | sort_by(.Key))
                )
                or (
                  $stackState == "existing"
                  and .Stacks[0].StackId == $previousStackId
                  and $owner == ""
                  and (
                    .Stacks[0].StackStatus == "CREATE_COMPLETE"
                    or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                    or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
                  )
                )
              )
            ' "$post_sam_stack" >/dev/null
          post_sam_tags="${RUNNER_TEMP:?}/production-tags-after-sam.json"
          jq -eS \
            '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
            "$post_sam_stack" >"$post_sam_tags"
          [[ "$TARGET_STACK_TAGS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(
            sha256sum "$post_sam_tags" | awk '{print $1}'
          )" = "$TARGET_STACK_TAGS_SHA256"
          if [ "$EXPECTED_STACK_STATE" = "existing" ]; then
            test -z "$GREENFIELD_OWNER"
          else
            test "$EXPECTED_STACK_STATE" = "greenfield"
            [[ "$GREENFIELD_OWNER" =~ ^[0-9a-f]{64}$ ]]
          fi
          OUTPUTS="$(jq -cer '.Stacks[0].Outputs' "$post_sam_stack")"
          APPLICATION_URL="$(jq -er '.[] | select(.OutputKey == "ApplicationUrl") | .OutputValue' <<<"$OUTPUTS")"
          BUCKET_NAME="$(jq -er '.[] | select(.OutputKey == "SpaBucketName") | .OutputValue' <<<"$OUTPUTS")"
          DISTRIBUTION_ID="$(jq -er '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<<"$OUTPUTS")"
          API_ENDPOINT="$(jq -er '.[] | select(.OutputKey == "ApiEndpoint") | .OutputValue' <<<"$OUTPUTS")"
          API_ID="$(jq -er '.[] | select(.OutputKey == "ApiId") | .OutputValue' <<<"$OUTPUTS")"
          API_STAGE_NAME="$(jq -er '.[] | select(.OutputKey == "ApiStageName") | .OutputValue' <<<"$OUTPUTS")"
          API_ACCESS_LOG_GROUP="$(jq -er '.[] | select(.OutputKey == "ApiAccessLogGroupName") | .OutputValue' <<<"$OUTPUTS")"
          STACK_ID="$(jq -er '.Stacks[0].StackId' "$post_sam_stack")"
          STACK_REVISION="$(
            jq -er \
              '.Stacks[0].LastUpdatedTime // .Stacks[0].CreationTime' \
              "$post_sam_stack"
          )"
          STACK_TAGS_SHA256="$(
            sha256sum "$post_sam_tags" | awk '{print $1}'
          )"
          {
            echo "application_url=$APPLICATION_URL"
            echo "bucket_name=$BUCKET_NAME"
            echo "distribution_id=$DISTRIBUTION_ID"
            echo "api_endpoint=$API_ENDPOINT"
            echo "api_id=$API_ID"
            echo "api_stage_name=$API_STAGE_NAME"
            echo "api_access_log_group=$API_ACCESS_LOG_GROUP"
            echo "stack_id=$STACK_ID"
            echo "stack_revision=$STACK_REVISION"
            echo "tags_sha256=$STACK_TAGS_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Prove production alarm routing after stack mutation
        env:
          ENVIRONMENT: production
        run: |
          set -euo pipefail
          discovery="${RUNNER_TEMP:?}/production-alarm-routing-discovery.json"
          proof="${RUNNER_TEMP:?}/production-alarm-routing-proof.json"
          test -f "$discovery"
          bash aws/prove-alarm-routing.sh verify | tee "$proof"
          jq -e \
            --slurpfile discovery "$discovery" \
            '
              ($discovery | length) == 1
              and .ok == true
              and .schema == "archon.alarm-routing.proof"
              and .version == 1
              and .mode == "verify"
              and .environment == $discovery[0].environment
              and .foundationStackId == $discovery[0].foundationStackId
              and .state == $discovery[0].state
              and .contractVersion == $discovery[0].contractVersion
              and .keyArn == $discovery[0].keyArn
              and .topicArn == $discovery[0].topicArn
              and .archiveQueueArn == $discovery[0].archiveQueueArn
              and (
                (
                  .state == "legacy-inactive-not-provisioned"
                  and .alarmCount == null
                )
                or (
                  (
                    .state == "inactive-not-provisioned"
                    or .state == "active"
                  )
                  and .alarmCount == 4
                )
              )
            ' "$proof" >/dev/null

      - name: Prove live application S3 access logging before frontend mutation
        id: application_s3_verify
        env:
          ENVIRONMENT: production
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          bash aws/prove-application-s3-access-logging.sh verify |
            tee application-s3-access-logging-proof.json
          jq -e \
            --slurpfile preflight application-s3-access-logging-preflight.json \
            --arg environment "$ENVIRONMENT" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg source "${APP_NAME}-${ENVIRONMENT}-web-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg destination "${APP_NAME}-s3-access-logs-${AWS_ACCOUNT_ID}-${AWS_REGION}" \
            --arg prefix "${ENVIRONMENT}-web/" \
            '
              ($preflight | length) == 1
              and .ok == true
              and .schema == "archon.application-s3-access-logging.proof"
              and .version == 1
              and .mode == "verify"
              and .evidence == "live-control-plane"
              and .foundationVerified == true
              and .processedTemplateManaged == true
              and .environment == $environment
              and .stackState == $stackState
              and (
                (
                  $stackState == "greenfield"
                  and .stackStatus == "CREATE_COMPLETE"
                )
                or (
                  $stackState == "existing"
                  and (
                    .stackStatus == "CREATE_COMPLETE"
                    or .stackStatus == "UPDATE_COMPLETE"
                    or .stackStatus == "UPDATE_ROLLBACK_COMPLETE"
                  )
                )
              )
              and .sourceBucket == $source
              and .destinationBucket == $destination
              and .liveState == "enabled"
              and .preflightIntegrity == $preflight[0].integrity
              and .expected == .liveConfiguration
              and .liveConfiguration == {
                "LoggingEnabled": {
                  "TargetBucket": $destination,
                  "TargetPrefix": $prefix,
                  "TargetObjectKeyFormat": {
                    "PartitionedPrefix": {
                      "PartitionDateSource": "EventTime"
                    }
                  }
                }
              }
            ' application-s3-access-logging-proof.json >/dev/null
          proof_sha256="$(
            sha256sum application-s3-access-logging-proof.json |
              awk '{print $1}'
          )"
          [[ "$proof_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "receipt_sha256=$proof_sha256" >>"$GITHUB_OUTPUT"

      - name: Prove transformed and live API stage routing before frontend mutation
        env:
          API_ID: ${{ steps.stack.outputs.api_id }}
          API_STAGE_NAME: ${{ steps.stack.outputs.api_stage_name }}
          API_ENDPOINT: ${{ steps.stack.outputs.api_endpoint }}
          API_ACCESS_LOG_GROUP: ${{ steps.stack.outputs.api_access_log_group }}
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
        run: |
          set -euo pipefail
          bash aws/prove-api-stage-controls.sh |
            tee api-stage-proof.json
          jq -e \
            '.ok == true and
             .stage == "live" and
             .legacyDefaultStageAbsent == true and
             .detailedMetrics == true and
             .throttlingRate == 5 and
             .throttlingBurst == 10 and
             .cloudFrontStatus == "Deployed" and
             .cloudFrontOriginPath == "/live" and
             .directStageHealth == "GET /live/api/health 200" and
             .sameOriginHealth == "GET /api/health 200" and
             .accessLogEvent == "GET /api/health 200"' \
            api-stage-proof.json >/dev/null

      - name: Publish the frontend and invalidate CloudFront
        id: frontend
        env:
          BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
          EXPECTED_HAD_PREVIOUS_INDEX: ${{ steps.durable_recovery.outputs.had_previous_index }}
          EXPECTED_PREVIOUS_INDEX_SHA256: ${{ steps.durable_recovery.outputs.previous_index_sha256 }}
          EXPECTED_PREVIOUS_INDEX_VERSION: ${{ steps.durable_recovery.outputs.previous_index_version }}
        run: |
          set -euo pipefail
          case "$EXPECTED_HAD_PREVIOUS_INDEX" in
            true|false) ;;
            *) exit 1 ;;
          esac
          if previous_index="$(aws s3api head-object \
            --bucket "$BUCKET_NAME" \
            --key index.html \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --output json 2>&1)"; then
            current_version="$(
              jq -er '.VersionId | strings | select(length > 0)' \
                <<<"$previous_index"
            )"
            test "$EXPECTED_HAD_PREVIOUS_INDEX" = "true"
            test "$current_version" = "$EXPECTED_PREVIOUS_INDEX_VERSION"
            [[ "$EXPECTED_PREVIOUS_INDEX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          elif grep -Eqi 'NoSuchKey|Not Found|\(404\)' <<<"$previous_index"; then
            test "$EXPECTED_HAD_PREVIOUS_INDEX" = "false"
            test -z "$EXPECTED_PREVIOUS_INDEX_VERSION"
            test -z "$EXPECTED_PREVIOUS_INDEX_SHA256"
          else
            echo "Unable to re-prove the durable frontend baseline." >&2
            exit 1
          fi
          HAD_PREVIOUS_INDEX="$EXPECTED_HAD_PREVIOUS_INDEX"
          PREVIOUS_INDEX_VERSION="$EXPECTED_PREVIOUS_INDEX_VERSION"
          echo "had_previous_index=$HAD_PREVIOUS_INDEX" >>"$GITHUB_OUTPUT"
          echo "previous_index_version=$PREVIOUS_INDEX_VERSION" \
            >>"$GITHUB_OUTPUT"
          frontend_recovery_payload="$(
            jq -cnS \
              --arg bucket "$BUCKET_NAME" \
              --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
              --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
              '{
                bucket: $bucket,
                hadPreviousIndex: $hadPreviousIndex,
                previousIndexVersion: (
                  if $previousIndexVersion == ""
                  then null
                  else $previousIndexVersion
                  end
                )
              }'
          )"
          frontend_recovery_sha256="$(
            printf '%s' "$frontend_recovery_payload" |
              sha256sum |
              awk '{print $1}'
          )"
          [[ "$frontend_recovery_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "recovery_sha256=$frontend_recovery_sha256" \
            >>"$GITHUB_OUTPUT"
          # Hashed assets are retained so the previous index remains recoverable.
          # The new index is the atomic switch and is uploaded last.
          echo "started=true" >>"$GITHUB_OUTPUT"
          aws s3 sync web/dist "s3://$BUCKET_NAME" \
            --region "$AWS_REGION" \
            --exclude index.html \
            --sse aws:kms \
            --sse-kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://$BUCKET_NAME/index.html" \
            --region "$AWS_REGION" \
            --sse aws:kms \
            --sse-kms-key-id "arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Smoke production through CloudFront
        env:
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/" |
            grep -q '<div id="root"></div>'
          HEALTH="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/health")"
          jq -e \
            '.ok == true and
             .status == "reachable" and
             .service == "archon-cockroach-memory" and
             .access ==
               "canonical-read-only+isolated-synthetic-resolution-write" and
             .resolutionSandbox == {
               "state":"available",
               "authority":"financial-controller-human-gate",
               "persistence":"CockroachDB-row-level-TTL",
               "externalSideEffects":"none"
             } and
             .dependencies == "ready" and
             .checks.database.engine == "CockroachDB" and
             .checks.database.state == "reachable" and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured")' <<<"$HEALTH"
          RELEASE_COMMIT_SHA="${{ github.sha }}"
          [[ "$RELEASE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          PROOF="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/proof")"
          jq -e \
            --arg embed "$BEDROCK_EMBED_MODEL_ID" \
            --arg narrator "$BEDROCK_NARRATOR_MODEL_ID" \
            --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            '$embed == "amazon.titan-embed-text-v2:0" and
             $narrator == "eu.anthropic.claude-sonnet-4-6" and
             .database.engine == "CockroachDB" and
             .database.deployment == "CockroachDB Cloud on AWS" and
             .database.role == "persistent agent memory" and
             .database.transactionIsolation == "SERIALIZABLE" and
             .database.database == "archon" and
             (.database.version | type == "string" and test("CockroachDB"; "i")) and
             .database.region == "eu-west-1" and
             .database.regionEvidence == "cockroach-cloud-api-release-gate" and
             (.database.runtimePrincipal |
               test("^archon_production_[0-9a-f]{10}$")) and
             .database.activeMemories == 9 and
             .memory.persisted == 9 and
             .memory.idempotencyKeys == 9 and
             .memory.contentDigests == 9 and
             .memory.storeVerified == true and
             .memory.evidence == "live bounded fixed-scope payload-digest verification" and
             .vectorIndex.engine == "native CockroachDB C-SPANN" and
             .vectorIndex.enabled == true and
             .vectorIndex.name == "idx_agent_memory_company_scope_embedding" and
             .vectorIndex.metric == "cosine" and
             .vectorIndex.dimensions == 1024 and
             .vectorIndex.prefixes == ["tenant_id","embed_model","status","company"] and
             .vectorIndex.lifecycleState == "active" and
             .vectorIndex.evidence == "live pg_catalog.pg_indexes definition" and
             (.vectorIndex.definitionFingerprint | test("^[a-f0-9]{64}$")) and
             .resolutionLoop.enabled == true and
             .resolutionLoop.schemaTables == 5 and
             (.resolutionLoop.activeSandboxSessions |
               type == "number" and floor == . and . >= 0) and
             .resolutionLoop.transactionIsolation == "SERIALIZABLE" and
             .resolutionLoop.authorityBoundary ==
               "financial-controller-human-gate" and
             .resolutionLoop.identityAssurance ==
               "fixed-demo-role-assertion-not-authenticated" and
             .resolutionLoop.idempotency ==
               "decision-key+database-unique-constraint" and
             .resolutionLoop.receipt ==
               "SHA-256 immutable decision record" and
             .resolutionLoop.learning ==
               "conflict-observation+human-decision" and
             .resolutionLoop.consolidation ==
               "versioned current/superseded state" and
             .resolutionLoop.forgetting == "CockroachDB row-level TTL" and
             .resolutionLoop.canonicalMemoryMutable == false and
             .resolutionLoop.externalSideEffects == "none" and
             .resolutionLoop.evidence ==
               "live fixed-scope sandbox schema query" and
             .embeddingModel == "amazon.titan-embed-text-v2:0" and
             .narrationModel == "eu.anthropic.claude-sonnet-4-6" and
             .release.commitSha == $releaseCommitSha and
             .release.evidence == "server-configured Lambda environment" and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             (.generatedAt | type == "string" and test("Z$"))' <<<"$PROOF"
          RECALL="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --max-time 45 \
            -X POST "$APPLICATION_URL/api/recall" \
            -H 'content-type: application/json' \
            --data '{"question":"What was the true employer cost and the off-bank wedge?","kind":"payroll_event","limit":5}')"
          jq -e \
            --arg question "What was the true employer cost and the off-bank wedge?" \
            --arg embed "$BEDROCK_EMBED_MODEL_ID" \
            --arg narrator "$BEDROCK_NARRATOR_MODEL_ID" \
            '.question == $question and
             (.answer | contains("€15,375")) and
             (.answer | contains("€6,775")) and
             .modelId == $narrator and
             (.citations | length) >= 2 and
             (.citations | length) <= 5 and
             .recalled == (.citations | length) and
             (.grounding.status == "verified" or .grounding.status == "extractive") and
             .grounding.checks.citations == true and
             .grounding.checks.numerics == true and
             .grounding.checks.claims == true and
             .trace.retrieval.database == "CockroachDB" and
             .trace.retrieval.index == "native C-SPANN vector index" and
             .trace.retrieval.metric == "cosine" and
             .trace.retrieval.embeddingModel == $embed and
             .trace.retrieval.requestedKind == "payroll_event" and
             .trace.retrieval.requestedTopK == 5 and
             .trace.retrieval.recalled == .recalled and
             .trace.narration.model == $narrator and
             (.trace.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             any(.citations[]; .content | contains("€15,375")) and
             any(.citations[]; .content | contains("€6,775")) and
             all(.citations[];
               (.marker | test("^\\[[1-5]\\]$")) and
               (.memoryId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
               (.sourceRef | type == "string" and length > 0) and
               .company == "Helios SA" and
               .kind == "payroll_event" and
               .period == "2026-04" and
               (.score | type == "number" and . >= 0.15 and . <= 1)) and
             (.answer as $answer |
               all(.citations[].marker;
                 . as $marker | $answer | contains($marker))) and
             ([.citations[].marker] ==
               [range(1; ((.citations | length) + 1)) | "[\(.)]"]) and
             (([.citations[].memoryId] | unique | length) == (.citations | length)) and
             .consistencyOk == true' \
            <<<"$RECALL"
          AUDIT="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --max-time 30 "$APPLICATION_URL/api/audit")"
          jq -e \
            '.report.audited == 9 and
             .report.ok == false and
             .coverage.total == 9 and
             .coverage.scanned == 9 and
             .coverage.complete == true and
             (.scope |
               keys == ["access","company","dataClassification","mode","source","tenantId"] and
               .tenantId == "public-demo" and
               .company == "Helios SA" and
               .mode == "fixed-synthetic-demo" and
               .access == "read-only" and
               .dataClassification == "synthetic-public-demo" and
               .source == "server-configured") and
             (.report.contradictions | length) == 1 and
             .report.contradictions[0].subject == "INV-2043" and
             .report.contradictions[0].type == "contradiction" and
             .report.contradictions[0].attribute == "total" and
             ([.report.contradictions[0].values[].value] | sort) == [18400,18900] and
             .report.contradictions[0].resolution.recommendedValue == 18400 and
             .report.contradictions[0].resolution.rule == "importance" and
             (.report.contradictions[0].resolution.recommendedMemoryId |
               test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
             (.report.contradictions[0].resolution.confidence |
               type == "number" and . >= 0 and . <= 1) and
             (.report.contradictions[0].resolution.rationale |
               type == "string" and length >= 20) and
             (.report.absences | length) == 1 and
             .report.absences[0].type == "absence" and
             .report.absences[0].subject == "PAY-118" and
             (.report.absences[0].referencedBy | length) == 1 and
             .report.absences[0].referencedBy[0].sourceRef == "RECON-2043" and
             (.generatedAt | type == "string" and test("Z$"))' <<<"$AUDIT"

      - name: Hosted Chromium judge journey on production
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.stack.outputs.application_url }}
          PLAYWRIGHT_LIVE: "1"
        run: |
          set -euo pipefail
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          npm run test:e2e --prefix web

      - name: Refresh short-lived AWS credentials for production terminal proof
        if: success()
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-terminal-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Build and validate sanitized production deployment receipt
        if: success()
        env:
          ENVIRONMENT: production
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_PROOF_SHA256: ${{ steps.application_s3_verify.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
          PRE_MUTATION_REPROVED: ${{ steps.application_s3_recheck.outputs.reproved }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          EXPECTED_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          FRONTEND_BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          FRONTEND_HAD_PREVIOUS_INDEX: ${{ steps.frontend.outputs.had_previous_index }}
          FRONTEND_PREVIOUS_INDEX_VERSION: ${{ steps.frontend.outputs.previous_index_version }}
          FRONTEND_RECOVERY_SHA256: ${{ steps.frontend.outputs.recovery_sha256 }}
          LIVE_STACK_ID: ${{ steps.stack.outputs.stack_id }}
          LIVE_STACK_REVISION: ${{ steps.stack.outputs.stack_revision }}
          LIVE_STACK_TAGS_SHA256: ${{ steps.stack.outputs.tags_sha256 }}
        run: |
          set -euo pipefail
          preflight_control="${RUNNER_TEMP:?}/production-cloudformation-controls-preflight.json"
          terminal_control="${RUNNER_TEMP:?}/production-cloudformation-controls-terminal.json"
          EXPECTED_STACK_ID="$LIVE_STACK_ID" \
          EXPECTED_STACK_REVISION="$LIVE_STACK_REVISION" \
          EXPECTED_TAGS_SHA256="$LIVE_STACK_TAGS_SHA256" \
            bash aws/enforce-cloudformation-controls.sh terminal \
              >"$terminal_control"
          for proof in "$preflight_control" "$terminal_control"; do
            jq -e -s \
              'length == 1 and (.[0] | type == "object")' \
              "$proof" >/dev/null
          done
          jq -e \
            '
              .ok == true
              and .schema == "archon.cloudformation-controls.proof"
              and .version == 1
              and .mode == "terminal"
              and .identity.state == "existing"
              and .identity.environment == "production"
              and .protection.enabled == true
              and .drift.detectionStatus == "DETECTION_COMPLETE"
              and .drift.stackDriftStatus == "IN_SYNC"
              and .drift.driftedResourceCount == 0
              and .drift.checkedResourceCount > 0
            ' "$terminal_control" >/dev/null
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          test "$(
            sha256sum application-s3-access-logging-proof.json |
              awk '{print $1}'
          )" = "$EXPECTED_PROOF_SHA256"
          [[ "$PREVIOUS_RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_RECOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]

          terminal_snapshot="${RUNNER_TEMP:?}/production-recovery-snapshot-terminal.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          EXPECTED_PREVIOUS_RELEASE_SHA256="$PREVIOUS_RELEASE_SHA256" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$terminal_snapshot"
          jq -e \
            --arg expected "$PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$terminal_snapshot" >/dev/null
          frontend_recovery_payload="$(
            jq -cnS \
              --arg bucket "$FRONTEND_BUCKET_NAME" \
              --argjson hadPreviousIndex "$FRONTEND_HAD_PREVIOUS_INDEX" \
              --arg previousIndexVersion "$FRONTEND_PREVIOUS_INDEX_VERSION" \
              '{
                bucket: $bucket,
                hadPreviousIndex: $hadPreviousIndex,
                previousIndexVersion: (
                  if $previousIndexVersion == ""
                  then null
                  else $previousIndexVersion
                  end
                )
              }'
          )"
          test "$(
            printf '%s' "$frontend_recovery_payload" |
              sha256sum |
              awk '{print $1}'
          )" = "$FRONTEND_RECOVERY_SHA256"

          terminal_proof="${RUNNER_TEMP:?}/production-application-s3-access-logging-terminal-proof.json"
          bash aws/prove-application-s3-access-logging.sh verify \
            >"$terminal_proof"
          cmp --silent \
            application-s3-access-logging-proof.json \
            "$terminal_proof"
          terminal_proof_sha256="$(
            sha256sum "$terminal_proof" | awk '{print $1}'
          )"
          test "$terminal_proof_sha256" = "$EXPECTED_PROOF_SHA256"
          test -f "$CONTROL_PLANE_FENCE_FILE"
          test ! -L "$CONTROL_PLANE_FENCE_FILE"
          test "$(sha256sum "$CONTROL_PLANE_FENCE_FILE" | awk '{print $1}')" = \
            "$CONTROL_PLANE_FENCE_SHA256"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -e \
            --slurpfile apiStage api-stage-proof.json \
            --slurpfile cfnPreflight "$preflight_control" \
            --slurpfile cfnTerminal "$terminal_control" \
            --slurpfile controlPlaneFence "$CONTROL_PLANE_FENCE_FILE" \
            --slurpfile s3Preflight application-s3-access-logging-preflight.json \
            --slurpfile s3Proof "$terminal_proof" \
            --arg environment production \
            --arg stackName "$STACK_NAME" \
            --arg applicationUrl "$APPLICATION_URL" \
            --arg sourceSha "${{ github.sha }}" \
            --arg controlPlaneFenceSha256 "$CONTROL_PLANE_FENCE_SHA256" \
            --arg deployRunId "$GITHUB_RUN_ID" \
            --arg deployRunAttempt "$GITHUB_RUN_ATTEMPT" \
             --arg foundationControlRunId "$FOUNDATION_CONTROL_RUN_ID" \
             --arg foundationControlRunAttempt "$FOUNDATION_CONTROL_RUN_ATTEMPT" \
             --arg stagingEdgeControlRunId "$STAGING_EDGE_CONTROL_RUN_ID" \
             --arg stagingEdgeControlRunAttempt "$STAGING_EDGE_CONTROL_RUN_ATTEMPT" \
             --arg productionEdgeControlRunId "$PRODUCTION_EDGE_CONTROL_RUN_ID" \
             --arg productionEdgeControlRunAttempt "$PRODUCTION_EDGE_CONTROL_RUN_ATTEMPT" \
             --arg preMutationReproved "$PRE_MUTATION_REPROVED" \
            --arg stackState "$EXPECTED_STACK_STATE" \
            --arg previousReleaseSha256 "$PREVIOUS_RELEASE_SHA256" \
            --arg frontendRecoverySha256 "$FRONTEND_RECOVERY_SHA256" \
            --arg terminalProofSha256 "$terminal_proof_sha256" \
            --arg verifiedAt "$verified_at" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'if (($apiStage | length) == 1 and
                 ($cfnPreflight | length) == 1 and
                 ($cfnTerminal | length) == 1 and
                 ($controlPlaneFence | length) == 1 and
                 ($s3Preflight | length) == 1 and
                 ($s3Proof | length) == 1 and
                 $apiStage[0].ok == true and
                 $apiStage[0].stage == "live" and
                 $apiStage[0].legacyDefaultStageAbsent == true and
                 $apiStage[0].detailedMetrics == true and
                 $apiStage[0].throttlingRate == 5 and
                 $apiStage[0].throttlingBurst == 10 and
                 $apiStage[0].cloudFrontStatus == "Deployed" and
                 $apiStage[0].cloudFrontOriginPath == "/live" and
                 $apiStage[0].directStageHealth == "GET /live/api/health 200" and
                 $apiStage[0].sameOriginHealth == "GET /api/health 200" and
                 $apiStage[0].accessLogEvent == "GET /api/health 200" and
                 $cfnPreflight[0].ok == true and
                 $cfnPreflight[0].mode == "preflight" and
                 $cfnPreflight[0].identity.environment == $environment and
                 $cfnTerminal[0].ok == true and
                 $cfnTerminal[0].mode == "terminal" and
                 $cfnTerminal[0].identity.environment == $environment and
                 $cfnTerminal[0].identity.state == "existing" and
                 $cfnTerminal[0].protection.enabled == true and
                 $cfnTerminal[0].drift.detectionStatus ==
                   "DETECTION_COMPLETE" and
                 $cfnTerminal[0].drift.stackDriftStatus == "IN_SYNC" and
                 $cfnTerminal[0].drift.driftedResourceCount == 0 and
                 $cfnTerminal[0].drift.checkedResourceCount > 0 and
                 $s3Preflight[0].ok == true and
                 $s3Preflight[0].mode == "preflight" and
                 $s3Preflight[0].foundationVerified == true and
                 $s3Preflight[0].environment == $environment and
                 $s3Proof[0].ok == true and
                 $s3Proof[0].mode == "verify" and
                 $s3Proof[0].environment == $environment and
                 $s3Proof[0].stackState == $stackState and
                 (($stackState == "greenfield" and
                   $s3Preflight[0].priorState == "absent" and
                   $s3Proof[0].stackStatus == "CREATE_COMPLETE") or
                  ($stackState == "existing" and
                   ($s3Preflight[0].priorState == "disabled" or
                    $s3Preflight[0].priorState == "enabled") and
                   ($s3Proof[0].stackStatus == "CREATE_COMPLETE" or
                    $s3Proof[0].stackStatus == "UPDATE_COMPLETE" or
                    $s3Proof[0].stackStatus ==
                      "UPDATE_ROLLBACK_COMPLETE"))) and
                 $s3Proof[0].foundationVerified == true and
                 $s3Proof[0].processedTemplateManaged == true and
                 $s3Proof[0].liveState == "enabled" and
                 $s3Proof[0].preflightIntegrity ==
                   $s3Preflight[0].integrity and
                 $preMutationReproved == "true" and
                 ($controlPlaneFenceSha256 | test("^[0-9a-f]{64}$")) and
                  all([
                    $foundationControlRunId,
                    $foundationControlRunAttempt,
                    $stagingEdgeControlRunId,
                    $stagingEdgeControlRunAttempt,
                    $productionEdgeControlRunId,
                    $productionEdgeControlRunAttempt
                  ][]; test("^[1-9][0-9]*$")) and
                 $controlPlaneFence[0].schema ==
                   "archon.aws.control-plane-receipt-fence" and
                 $controlPlaneFence[0].schemaVersion == 1 and
                 $controlPlaneFence[0].ok == true and
                 $controlPlaneFence[0].sourceSha == $sourceSha and
                 $controlPlaneFence[0].mainHeadSha == $sourceSha and
                 $controlPlaneFence[0].mainHeadRevalidated == true and
                 $controlPlaneFence[0].latestEligibleRunsRevalidated == true and
                 $controlPlaneFence[0].edgeSnapshotShared == true and
                 $controlPlaneFence[0].mutationMutexHeldByCaller == true and
                 $controlPlaneFence[0].mutex == {
                   group:"aws-shared-control-plane-mutation",
                   heldByCaller:true
                 } and
                 $controlPlaneFence[0].deployment == {
                   environment:$environment,
                   jobId:"deploy-production",
                   runId:($deployRunId | tonumber),
                   runAttempt:($deployRunAttempt | tonumber)
                 } and
                 $controlPlaneFence[0].foundation == {
                   runId:($foundationControlRunId | tonumber),
                   runAttempt:($foundationControlRunAttempt | tonumber),
                   operation:"verify"
                 } and
                 $controlPlaneFence[0].edge.staging.runId ==
                   ($stagingEdgeControlRunId | tonumber) and
                 $controlPlaneFence[0].edge.staging.runAttempt ==
                   ($stagingEdgeControlRunAttempt | tonumber) and
                 ($controlPlaneFence[0].edge.staging.operation |
                   test("^(apply|verify)$")) and
                 $controlPlaneFence[0].edge.production.runId ==
                   ($productionEdgeControlRunId | tonumber) and
                 $controlPlaneFence[0].edge.production.runAttempt ==
                   ($productionEdgeControlRunAttempt | tonumber) and
                 ($controlPlaneFence[0].edge.production.operation |
                   test("^(apply|verify)$")) and
                 ($controlPlaneFence[0].checkedAt |
                   test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
                 ($previousReleaseSha256 | test("^[0-9a-f]{64}$")) and
                 ($frontendRecoverySha256 | test("^[0-9a-f]{64}$")) and
                 ($terminalProofSha256 | test("^[0-9a-f]{64}$")) and
                 ($verifiedAt | test("Z$")))
             then . + {deployment: {
              environment: $environment,
              stackName: $stackName,
              applicationUrl: $applicationUrl,
              deployedAt: $deployedAt,
              smoke: "passed",
              canary: "Canary10Percent5Minutes",
              canaryTrafficProbe: "weighted-alias-proof-and-recall",
              deployAlarm: "candidate-executed-version-errors",
              recallGate: "post-promotion-with-explicit-restore",
               recoverySnapshot: {
                 manifestSha256: $previousReleaseSha256,
                 frontendSha256: $frontendRecoverySha256
               },
               controlPlaneReceiptFence:
                 ($controlPlaneFence[0] + {
                   sha256: $controlPlaneFenceSha256
                 }),
               cloudFormationControls: {
                preflight: $cfnPreflight[0],
                terminal: $cfnTerminal[0]
              },
              apiStage: $apiStage[0],
              s3AccessLogging: {
                preflight: {
                  foundationVerified: true,
                  beforeState: $s3Preflight[0].priorState,
                  preMutationReproved: true,
                  stackState: $s3Proof[0].stackState
                },
                verified: {
                  loggingEnabled: true,
                  targetPrefix:
                    $s3Proof[0].liveConfiguration.LoggingEnabled.TargetPrefix,
                  partitionDateSource:
                    $s3Proof[0].liveConfiguration.LoggingEnabled
                      .TargetObjectKeyFormat.PartitionedPrefix
                      .PartitionDateSource,
                  stackStatus: $s3Proof[0].stackStatus,
                  processedTemplateManaged: true,
                  liveControlPlaneVerified: true,
                  terminalLiveReproved: true,
                  terminalProofSha256: $terminalProofSha256,
                  verifiedAt: $verifiedAt
                }
              }
            }}
             else error("invalid deployment control proof")
             end' deployment-receipt.json > production-deployment-receipt.json

      - name: Commit the receipt-bound production recovery intent
        if: success()
        env:
          RECOVERY_ENVIRONMENT: production
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_INTENT_ID" =~ ^[0-9a-f]{64}$ ]]
          receipt_sha256="$(
            sha256sum production-deployment-receipt.json | awk '{print $1}'
          )"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          receipt_key="candidates/recovery/production/receipts/${RECOVERY_INTENT_ID}/${receipt_sha256}.json"
          object_proof="${RUNNER_TEMP:?}/production-terminal-receipt-object.json"
          trap 'rm -f -- "$object_proof"' EXIT
          bash aws/put-durable-recovery-object.sh \
            production-deployment-receipt.json \
            "$receipt_key" >"$object_proof"
          test "$(jq -er '.sha256' "$object_proof")" = "$receipt_sha256"
          RECOVERY_RECEIPT_BUCKET="$(jq -er '.bucket' "$object_proof")" \
          RECOVERY_RECEIPT_KEY="$(jq -er '.key' "$object_proof")" \
          RECOVERY_RECEIPT_SHA256="$receipt_sha256" \
          RECOVERY_RECEIPT_VERSION_ID="$(jq -er '.versionId' "$object_proof")" \
            bash aws/recovery-intent-ledger.sh commit \
              >"${RUNNER_TEMP:?}/production-recovery-ledger-committed.json"
          jq -e \
            --arg intent "$RECOVERY_INTENT_ID" \
            --arg receipt "$receipt_sha256" \
            '
              .ok == true
              and .schema == "archon.recovery-intent.terminal"
              and .version == 1
              and .state == "COMMITTED"
              and .intentId == $intent
              and .receiptSha256 == $receipt
            ' "${RUNNER_TEMP:?}/production-recovery-ledger-committed.json" \
            >/dev/null

      - name: Refresh short-lived AWS credentials for production recovery
        if: (failure() || cancelled()) && steps.deploy.outputs.started == 'true'
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: archon-production-recovery-${{ github.run_id }}
          mask-aws-account-id: true
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Restore the previous production release on verification failure
        if: (failure() || cancelled()) && steps.deploy.outputs.started == 'true'
        env:
          BUCKET_NAME: ${{ steps.stack.outputs.bucket_name }}
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
          FRONTEND_STARTED: ${{ steps.frontend.outputs.started }}
          HAD_PREVIOUS_INDEX: ${{ steps.frontend.outputs.had_previous_index }}
          PREVIOUS_INDEX_VERSION: ${{ steps.frontend.outputs.previous_index_version }}
          PREVIOUS_FUNCTION_NAME: ${{ steps.previous.outputs.function_name }}
          PREVIOUS_FUNCTION_VERSION: ${{ steps.previous.outputs.function_version }}
          PREVIOUS_APPLICATION_URL: ${{ steps.previous.outputs.application_url }}
          HAS_PREVIOUS_STACK: ${{ steps.previous.outputs.has_previous_stack }}
          PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          EXPECTED_PREVIOUS_STACK_ID: ${{ steps.previous.outputs.stack_id }}
          PREVIOUS_STACK_STATUS: ${{ steps.previous.outputs.stack_status }}
          PREVIOUS_STACK_REVISION: ${{ steps.previous.outputs.stack_revision }}
          EXPECTED_PREVIOUS_RELEASE_SHA256: ${{ steps.previous.outputs.previous_release_sha256 }}
          EXPECTED_PREVIOUS_STACK_TEMPLATE_SHA256: ${{ steps.previous.outputs.template_sha256 }}
          EXPECTED_PREVIOUS_STACK_PARAMETERS_SHA256: ${{ steps.previous.outputs.parameters_sha256 }}
          EXPECTED_PREVIOUS_STACK_TAGS_SHA256: ${{ steps.previous.outputs.tags_sha256 }}
          EXPECTED_GREENFIELD_OWNER: ${{ steps.previous.outputs.greenfield_owner }}
          EXPECTED_FRONTEND_RECOVERY_SHA256: ${{ steps.frontend.outputs.recovery_sha256 }}
          ENVIRONMENT: production
          RECOVERY_CANCELLED: ${{ job.status == 'cancelled' }}
          RECOVERY_ENVIRONMENT: production
          RECOVERY_EXECUTION_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          RECOVERY_INTENT_ID: ${{ steps.durable_recovery.outputs.intent_id }}
          APPLICATION_S3_ACCESS_LOGGING_PREFLIGHT_FILE: application-s3-access-logging-preflight.json
          EXPECTED_PREFLIGHT_SHA256: ${{ steps.application_s3_preflight.outputs.receipt_sha256 }}
          EXPECTED_STACK_STATE: ${{ steps.application_s3_recheck.outputs.stack_state }}
        run: |
          set -euo pipefail
          recovery_ledger="${RUNNER_TEMP:?}/production-inline-recovery-ledger.json"
          bash aws/recovery-intent-ledger.sh read >"$recovery_ledger"
          ledger_state="$(jq -er '.state' "$recovery_ledger")"
          test "$(jq -er '.intentId' "$recovery_ledger")" = \
            "$RECOVERY_INTENT_ID"
          if [ "$ledger_state" = "COMMITTED" ] ||
             [ "$ledger_state" = "RECOVERED" ]; then
            exit 0
          fi
          test "$ledger_state" = "ARMED"
          test "$(
            sha256sum application-s3-access-logging-preflight.json |
              awk '{print $1}'
          )" = "$EXPECTED_PREFLIGHT_SHA256"
          bash aws/prove-application-s3-access-logging.sh \
            validate-preflight >/dev/null
          recovery_snapshot="${RUNNER_TEMP:?}/production-recovery-snapshot-verified.json"
          STACK_STATE="$EXPECTED_STACK_STATE" \
          EXPECTED_TEMPLATE_SHA256="$EXPECTED_PREVIOUS_STACK_TEMPLATE_SHA256" \
          EXPECTED_PARAMETERS_SHA256="$EXPECTED_PREVIOUS_STACK_PARAMETERS_SHA256" \
          EXPECTED_TAGS_SHA256="$EXPECTED_PREVIOUS_STACK_TAGS_SHA256" \
          CANDIDATE_SHA="${{ github.sha }}" \
            bash aws/prove-recovery-snapshot.sh >"$recovery_snapshot"
          jq -e \
            --arg expected "$EXPECTED_PREVIOUS_RELEASE_SHA256" \
            '.ok == true and .manifestSha256 == $expected' \
            "$recovery_snapshot" >/dev/null
          if [ "$FRONTEND_STARTED" = "true" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: (
                    if $previousIndexVersion == ""
                    then null
                    else $previousIndexVersion
                    end
                  )
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
          fi

          RECOVERY_FAILED=0
          storage_key_alias="arn:aws:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/${APP_NAME}-storage"
          prove_application_s3_recovery() {
            if ! test "$(
              sha256sum application-s3-access-logging-preflight.json |
                awk '{print $1}'
            )" = "$EXPECTED_PREFLIGHT_SHA256"; then
              return 1
            fi
            if ! bash aws/prove-application-s3-access-logging.sh recover |
                tee application-s3-access-logging-recovery.json; then
              return 1
            fi
            jq -e \
              --slurpfile preflight application-s3-access-logging-preflight.json \
              --arg stackState "$EXPECTED_STACK_STATE" \
              '
                ($preflight | length) == 1
                and .ok == true
                and .schema == "archon.application-s3-access-logging.recovery"
                and .version == 1
                and .mode == "recover"
                and .evidence == "live-control-plane"
                and .foundationVerified == true
                and .environment == $preflight[0].environment
                and .stackState == $stackState
                and .sourceBucket == $preflight[0].sourceBucket
                and .destinationBucket == $preflight[0].destinationBucket
                and .priorState == $preflight[0].priorState
                and .restoredState == $preflight[0].priorState
                and .preflightIntegrity == $preflight[0].integrity
                and (
                  (
                    .restoredState == "absent"
                    and .restoredConfiguration == null
                  )
                  or (
                    .restoredState == "disabled"
                    and .restoredConfiguration == {}
                  )
                  or (
                    .restoredState == "enabled"
                    and .restoredConfiguration == .expected
                  )
                )
              ' application-s3-access-logging-recovery.json >/dev/null
          }
          if [ "$HAS_PREVIOUS_STACK" != "true" ]; then
            if ! GREENFIELD_OWNER="$EXPECTED_GREENFIELD_OWNER" \
              ENVIRONMENT=production \
              bash aws/delete-greenfield-stack.sh; then
              echo "Failed to clean the failed greenfield deployment." >&2
              RECOVERY_FAILED=1
            fi
            if [ "$RECOVERY_CANCELLED" = "true" ]; then
              test "$RECOVERY_FAILED" -eq 0
              exit 0
            fi
            if ! prove_application_s3_recovery; then
              echo "Failed to prove greenfield S3 logging recovery." >&2
              RECOVERY_FAILED=1
            fi
            test "$RECOVERY_FAILED" -eq 0
            exit 0
          fi
          if ! bash aws/restore-cloudformation-stack.sh; then
            echo "Failed to restore the exact previous CloudFormation stack." >&2
            exit 1
          fi
          if [ "$RECOVERY_CANCELLED" = "true" ]; then
            exit 0
          fi
          if ! prove_application_s3_recovery; then
            echo "Failed to prove the restored S3 logging state." >&2
            exit 1
          fi
          BUCKET_NAME=""
          DISTRIBUTION_ID=""
          restored_stack="${RUNNER_TEMP:?}/production-stack-after-recovery.json"
          aws cloudformation describe-stacks \
            --stack-name "$EXPECTED_PREVIOUS_STACK_ID" \
            --region "$AWS_REGION" \
            --output json >"$restored_stack"
          jq -e \
            --arg stackId "$EXPECTED_PREVIOUS_STACK_ID" \
            --arg role "$AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            '
              (.Stacks | length) == 1
              and .Stacks[0].StackId == $stackId
              and .Stacks[0].RoleARN == $role
              and (
                .Stacks[0].StackStatus == "CREATE_COMPLETE"
                or .Stacks[0].StackStatus == "UPDATE_COMPLETE"
                or .Stacks[0].StackStatus == "UPDATE_ROLLBACK_COMPLETE"
              )
              and (
                [.Stacks[0].Outputs[]?
                  | select(.OutputKey == "SpaBucketName")
                  | .OutputValue] | length
              ) == 1
              and (
                [.Stacks[0].Outputs[]?
                  | select(.OutputKey == "DistributionId")
                  | .OutputValue] | length
              ) == 1
            ' "$restored_stack" >/dev/null
          restored_tags="${RUNNER_TEMP:?}/production-tags-after-recovery.json"
          jq -e \
            '(.Stacks[0].Tags // []) | map({Key, Value}) | sort_by(.Key)' \
            "$restored_stack" >"$restored_tags"
          test "$(
            sha256sum "$restored_tags" | awk '{print $1}'
          )" = "$EXPECTED_PREVIOUS_STACK_TAGS_SHA256"
          BUCKET_NAME="$(
            jq -er \
              '.Stacks[0].Outputs[]
               | select(.OutputKey == "SpaBucketName")
               | .OutputValue' "$restored_stack"
          )"
          DISTRIBUTION_ID="$(
            jq -er \
              '.Stacks[0].Outputs[]
               | select(.OutputKey == "DistributionId")
               | .OutputValue' "$restored_stack"
          )"
          test "$BUCKET_NAME" = \
            "${APP_NAME}-production-web-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          [[ "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ]]
          if [ "$FRONTEND_STARTED" = "true" ] &&
             [ "$HAD_PREVIOUS_INDEX" = "true" ] &&
             [ -n "$BUCKET_NAME" ] &&
             [ -n "$PREVIOUS_INDEX_VERSION" ] &&
             [ "$PREVIOUS_INDEX_VERSION" != "None" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                --arg previousIndexVersion "$PREVIOUS_INDEX_VERSION" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: $previousIndexVersion
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
            if ! aws s3api copy-object \
              --bucket "$BUCKET_NAME" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --expected-source-bucket-owner "$AWS_ACCOUNT_ID" \
              --key index.html \
              --copy-source "${BUCKET_NAME}/index.html?versionId=${PREVIOUS_INDEX_VERSION}" \
              --server-side-encryption aws:kms \
              --ssekms-key-id "$storage_key_alias" \
              --metadata-directive REPLACE \
              --annotation-directive EXCLUDE \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --region "$AWS_REGION" >/dev/null; then
              RECOVERY_FAILED=1
            fi
          elif [ "$FRONTEND_STARTED" = "true" ] &&
               [ "$HAD_PREVIOUS_INDEX" = "false" ] &&
               [ -n "$BUCKET_NAME" ]; then
            frontend_recovery_payload="$(
              jq -cnS \
                --arg bucket "$BUCKET_NAME" \
                --argjson hadPreviousIndex "$HAD_PREVIOUS_INDEX" \
                '{
                  bucket: $bucket,
                  hadPreviousIndex: $hadPreviousIndex,
                  previousIndexVersion: null
                }'
            )"
            test "$(
              printf '%s' "$frontend_recovery_payload" |
                sha256sum |
                awk '{print $1}'
            )" = "$EXPECTED_FRONTEND_RECOVERY_SHA256"
            if ! aws s3api delete-object \
              --bucket "$BUCKET_NAME" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --key index.html \
              --region "$AWS_REGION" >/dev/null; then
              RECOVERY_FAILED=1
            fi
          elif [ "$FRONTEND_STARTED" = "true" ]; then
            RECOVERY_FAILED=1
          fi
          if [ -n "$PREVIOUS_FUNCTION_NAME" ] &&
             [ -n "$PREVIOUS_FUNCTION_VERSION" ] &&
             [ "$PREVIOUS_FUNCTION_VERSION" != "None" ]; then
            alias_before="${RUNNER_TEMP:?}/production-alias-before-recovery.json"
            alias_after="${RUNNER_TEMP:?}/production-alias-after-recovery.json"
            alias_update="${RUNNER_TEMP:?}/production-alias-update.json"
            if ! aws lambda get-alias \
              --function-name "$PREVIOUS_FUNCTION_NAME" \
              --name live \
              --region "$AWS_REGION" \
              --output json >"$alias_before"; then
              RECOVERY_FAILED=1
            else
              alias_revision="$(
                jq -er \
                  --arg arn \
                    "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                  '
                    select(
                      .AliasArn == $arn
                      and .Name == "live"
                      and (.FunctionVersion | test("^[1-9][0-9]*$"))
                      and (.RevisionId | type == "string" and length > 0)
                    )
                    | .RevisionId
                  ' "$alias_before"
              )"
              if ! aws lambda update-alias \
                --function-name "$PREVIOUS_FUNCTION_NAME" \
                --name live \
                --function-version "$PREVIOUS_FUNCTION_VERSION" \
                --routing-config '{"AdditionalVersionWeights":{}}' \
                --revision-id "$alias_revision" \
                --region "$AWS_REGION" \
                --output json >"$alias_update"; then
                RECOVERY_FAILED=1
              elif ! aws lambda get-alias \
                --function-name "$PREVIOUS_FUNCTION_NAME" \
                --name live \
                --region "$AWS_REGION" \
                --output json >"$alias_after"; then
                RECOVERY_FAILED=1
              elif ! jq -e \
                --arg arn \
                  "arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${PREVIOUS_FUNCTION_NAME}:live" \
                --arg version "$PREVIOUS_FUNCTION_VERSION" \
                '
                  .AliasArn == $arn
                  and .Name == "live"
                  and .FunctionVersion == $version
                  and ((.RoutingConfig.AdditionalVersionWeights // {}) == {})
                  and (.RevisionId | type == "string" and length > 0)
                ' "$alias_after" >/dev/null; then
                RECOVERY_FAILED=1
              fi
            fi
          fi
          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            INVALIDATION_ID="$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths '/*' \
              --query 'Invalidation.Id' \
              --output text)"
            if ! aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" \
              --id "$INVALIDATION_ID"; then
              RECOVERY_FAILED=1
            fi
          else
            RECOVERY_FAILED=1
          fi
          if [ -n "$PREVIOUS_APPLICATION_URL" ] &&
             [ "$PREVIOUS_APPLICATION_URL" != "None" ]; then
            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$PREVIOUS_APPLICATION_URL/api/health" |
              jq -e '.ok == true and .status == "reachable"' >/dev/null; then
              RECOVERY_FAILED=1
            fi
            if ! curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$PREVIOUS_APPLICATION_URL/api/proof" |
              jq -e '.memory.storeVerified == true and .memory.persisted == 9' \
                >/dev/null; then
              RECOVERY_FAILED=1
            fi
          else
            RECOVERY_FAILED=1
          fi
          test "$RECOVERY_FAILED" -eq 0

      - name: Upload production receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deployment-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90

  managed-mcp-production-audit:
    name: Prove production memory through CockroachDB Managed MCP
    if: github.event_name == 'push'
    needs:
      - database-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-audit
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      checked_at: ${{ steps.receipt.outputs.checked_at }}
      explain_status: ${{ steps.receipt.outputs.explain_status }}
    env:
      COCKROACH_DATABASE: ${{ vars.COCKROACH_DATABASE || 'archon' }}
    steps:
      - name: Check out the exact deployed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the exact database C-SPANN release receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: database-release-${{ github.sha }}
          path: ${{ runner.temp }}/managed-mcp-cspann-release
      - name: Bind the exact release C-SPANN receipt digest
        id: cspann
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP:?}/managed-mcp-cspann-release/database-release-receipt.json"
          test -f "$receipt"
          test ! -L "$receipt"
          jq -e --arg release "$RELEASE_SHA" '
            .schemaVersion == 6 and
            .ok == true and
            .targetSha == $release and
            .proofs.runtimePrincipalCspannPlanAndExecute == true and
            .proofs.runtimePrincipalNoKindCspann == true and
            .proofs.runtimePrincipalKindCspann == true and
            (.runtimes | length) == 2 and
            ([.runtimes[].environment] | sort) ==
              ["production", "staging"] and
            ([.runtimes[].clusterGrantProof.databaseMatrixSha256] |
              unique | length) == 2 and
            all(.runtimes[];
              ((.environment == "staging" and
                (.principal | test("^archon_staging_[a-z0-9]{6,40}$"))) or
               (.environment == "production" and
                (.principal | test("^archon_production_[a-z0-9]{6,40}$")))) and
              .clusterGrantProof.routineGrantCount == 2 and
              .clusterGrantProof.databaseGrantCount == 5 and
              .clusterGrantProof.databaseInventory ==
                ["archon", "defaultdb", "postgres", "system"] and
              .clusterGrantProof.databaseGrantMatrix == [
                {"databaseName":"archon","grantee":.principal,"privilegeType":"CONNECT","isGrantable":false},
                {"databaseName":"defaultdb","grantee":"public","privilegeType":"CONNECT","isGrantable":false},
                {"databaseName":"defaultdb","grantee":"public","privilegeType":"TEMPORARY","isGrantable":false},
                {"databaseName":"postgres","grantee":"public","privilegeType":"CONNECT","isGrantable":false},
                {"databaseName":"postgres","grantee":"public","privilegeType":"TEMPORARY","isGrantable":false}
              ] and
              (.clusterGrantProof.databaseMatrixSha256 |
                test("^[a-f0-9]{64}$"))) and
            (.proofs.indexDefinitionFingerprints.company |
              test("^[a-f0-9]{64}$")) and
            (.proofs.indexDefinitionFingerprints.kind |
              test("^[a-f0-9]{64}$"))
          ' "$receipt" >/dev/null
          for runtime_environment in staging production; do
            expected_matrix_sha="$(jq -er \
              --arg environment "$runtime_environment" \
              '.runtimes[] |
               select(.environment == $environment) |
               .clusterGrantProof.databaseMatrixSha256' "$receipt")"
            matrix_json="$(jq -cer \
              --arg environment "$runtime_environment" \
              '.runtimes[] |
               select(.environment == $environment) |
               .clusterGrantProof.databaseGrantMatrix' "$receipt")"
            actual_matrix_sha="$(printf '%s' "$matrix_json" |
              sha256sum | awk '{print $1}')"
            test "$actual_matrix_sha" = "$expected_matrix_sha"
          done
          receipt_sha256="$(sha256sum "$receipt" | awk '{print $1}')"
          [[ "$receipt_sha256" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$receipt_sha256" >>"$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run bounded read-only Managed MCP proof
        id: receipt
        env:
          CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
          COCKROACH_CLUSTER_ID: ${{ vars.COCKROACH_CLUSTER_ID }}
          MANAGED_MCP_RELEASE_SHA: ${{ github.sha }}
          MANAGED_MCP_CSPANN_RECEIPT_SHA256: ${{ steps.cspann.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$CCLOUD_API_KEY"
          test -n "$COCKROACH_CLUSTER_ID"
          [[ "$MANAGED_MCP_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$MANAGED_MCP_CSPANN_RECEIPT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          npm run --silent mcp:cloud:audit > managed-mcp-production-receipt.json
          if grep -Fq -- "$CCLOUD_API_KEY" managed-mcp-production-receipt.json; then
            echo "Managed MCP receipt leaked the API key." >&2
            exit 1
          fi
          if grep -Fq -- "$COCKROACH_CLUSTER_ID" managed-mcp-production-receipt.json; then
            echo "Managed MCP receipt leaked the cluster identifier." >&2
            exit 1
          fi
          jq -e \
            --arg database "$COCKROACH_DATABASE" \
            --arg release "$MANAGED_MCP_RELEASE_SHA" \
            --arg cspann "$MANAGED_MCP_CSPANN_RECEIPT_SHA256" \
            'type == "object" and
             keys == ["aggregate","bound","calledTools","checkedAt","cspannLinkage","database","endpoint","mode","ok","proofs","redactions","release","schemaVersion","scope","toolsAdvertised"] and
             .schemaVersion == 3 and
             .ok == true and
             (.checkedAt | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$")) and
             .endpoint == "https://cockroachlabs.cloud/mcp" and
             .database == $database and
             .mode == "read-only" and
             .scope == {
               "tenantId":"public-demo",
               "company":"Helios SA",
               "status":"active",
               "embedModel":"amazon.titan-embed-text-v2:0"
             } and
             .bound == {
               "index":"idx_agent_memory_active_scope",
               "innerLimit":10,
               "outerLimit":1
             } and
             .aggregate == {
               "persisted":9,
               "idempotencyKeys":9,
               "contentDigests":9
             } and
             .release == {
               "commitSha":$release,
               "cspannReceiptSha256":$cspann
             } and
             .cspannLinkage.index ==
               "idx_agent_memory_company_scope_embedding" and
             (
               (.cspannLinkage.explainQuery == {
                  "status":"not-advertised",
                  "planSha256":null
                } and
                .calledTools ==
                  ["get_cluster","list_tables","get_table_schema","select_query"]) or
               (.cspannLinkage.explainQuery.status == "verified" and
                (.cspannLinkage.explainQuery.planSha256 |
                  test("^[a-f0-9]{64}$")) and
                .calledTools ==
                  ["get_cluster","list_tables","get_table_schema","explain_query","select_query"])
             ) and
             (.toolsAdvertised | type == "number" and floor == . and . >= 4) and
             (if .cspannLinkage.explainQuery.status == "verified"
              then .toolsAdvertised >= 5
              else true
              end) and
             (.calledTools as $called | .proofs |
               type == "array" and
               map(.name) == $called and
               all(.[];
                 keys == ["detail","name","ok"] and
                  .ok == true and
                 (.detail | type == "string" and length > 0)
               )
             ) and
             ([.proofs[] | select(.name == "get_cluster") | .detail] ==
               ["Live cluster metadata returned through CockroachDB Cloud Managed MCP."]) and
             ([.proofs[] | select(.name == "list_tables") | .detail] ==
               ["`agent_memory` is present in the configured application database."]) and
             ([.proofs[] | select(.name == "get_table_schema") | .detail] ==
               ["Live schema exposes VECTOR(1024) and a native vector index."]) and
             ([.proofs[] | select(.name == "select_query") | .detail] ==
               ["The fixed-scope, index-forced, ten-row-sentinel aggregate is exactly 9/9/9."]) and
             (
               (.cspannLinkage.explainQuery.status == "not-advertised" and
                ([.proofs[] | select(.name == "explain_query")] | length) == 0) or
               (.cspannLinkage.explainQuery.status == "verified" and
                [.proofs[] | select(.name == "explain_query") | .detail] ==
                  ["Managed MCP EXPLAIN verified the exact fixed-scope C-SPANN serving index."])
             ) and
             .redactions == ["API key","cluster identifier","SQL credentials","memory content","embeddings","raw query plan"]' \
             managed-mcp-production-receipt.json
          receipt_sha256="$(
            sha256sum managed-mcp-production-receipt.json | awk '{print $1}'
          )"
          [[ "$receipt_sha256" =~ ^[a-f0-9]{64}$ ]]
          {
            echo "receipt_sha256=$receipt_sha256"
            echo "checked_at=$(jq -er '.checkedAt' managed-mcp-production-receipt.json)"
            echo "explain_status=$(jq -er '.cspannLinkage.explainQuery.status' managed-mcp-production-receipt.json)"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### CockroachDB tool-chain release gate"
            echo
            echo "| Evidence | Value |"
            echo "|---|---|"
            echo "| Release SHA | \`$MANAGED_MCP_RELEASE_SHA\` |"
            echo "| Database C-SPANN receipt | \`$MANAGED_MCP_CSPANN_RECEIPT_SHA256\` |"
            echo "| Managed MCP receipt | \`$receipt_sha256\` |"
            echo "| Optional explain_query | \`$(jq -er '.cspannLinkage.explainQuery.status' managed-mcp-production-receipt.json)\` |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized Managed MCP receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-mcp-production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: managed-mcp-production-receipt.json
          if-no-files-found: error
          retention-days: 90

  hosted-dast-production:
    name: Run hosted DAST against exact production release
    needs:
      - deploy-production
      - managed-mcp-production-audit
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/security-dast.yml
    with:
      exact_sha: ${{ github.sha }}
      deploy_run_id: ${{ fromJSON(github.run_id) }}
      deploy_run_attempt: ${{ fromJSON(github.run_attempt) }}
