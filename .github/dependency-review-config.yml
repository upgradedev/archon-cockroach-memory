# This gate evaluates dependency changes in pull requests. The full installed
# dependency inventory is handled independently by the blocking SBOM/Trivy
# policy gate.
fail-on-severity: moderate
fail-on-scopes:
  - runtime
  - development
  - unknown
license-check: true
vulnerability-check: true
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BlueOak-1.0.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - Python-2.0
  - Unlicense
retry-on-snapshot-warnings: true
retry-on-snapshot-warnings-timeout: 120
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 5
comment-summary-in-pr: never
