AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Archon Memory Control Room: private S3 SPA behind CloudFront OAC, with a
  same-origin HTTP API backed by Lambda, Bedrock, and CockroachDB Cloud.

Parameters:
  AppName:
    Type: String
    Default: archon-memory
    MinLength: 3
    MaxLength: 17
    AllowedPattern: "^[a-z][a-z0-9-]{2,16}$"
    Description: Lowercase application identifier used in resource names.
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
    Default: staging
  ReleaseCommitSha:
    Type: String
    AllowedPattern: "^[0-9a-f]{40}$"
    Description: Exact protected source commit promoted by the release workflow.
  RecoveryDrillToken:
    Type: String
    Default: disabled
    AllowedPattern: "^(disabled|drill-[1-9][0-9]*-[1-9][0-9]*)$"
    Description: >-
      Staging-only protected drill nonce. A non-default value creates a
      behavior-neutral Lambda version transition for real rollback evidence.
  HttpApiStageName:
    Type: String
    Default: live
    AllowedValues:
      - live
    Description: >-
      Single source of truth for the protected named HTTP API stage and the
      CloudFront API origin path.
  DatabaseSecretId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9/_+=.@-]+$"
    Description: >-
      Deterministic name of a Secrets Manager secret whose JSON contains
      DATABASE_URL. The
      connection string is never passed as a CloudFormation parameter or
      Lambda environment variable.
  LambdaExecutionRoleArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/.+$"
    Description: Bootstrap-owned environment-specific Lambda runtime role.
  CodeDeployServiceRoleArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/.+$"
    Description: Bootstrap-owned environment-specific CodeDeploy service role.
  BedrockRegion:
    Type: String
    Default: eu-west-1
    AllowedValues:
      - eu-west-1
  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    AllowedValues:
      - amazon.titan-embed-text-v2:0
  BedrockNarratorModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    AllowedValues:
      - eu.anthropic.claude-sonnet-4-6
  CockroachRegion:
    Type: String
    Default: eu-west-1
    AllowedValues:
      - eu-west-1
    Description: Region independently verified by the protected Cockroach Cloud API release gate.
  CockroachRegionEvidence:
    Type: String
    Default: cockroach-cloud-api-release-gate
    AllowedValues:
      - cockroach-cloud-api-release-gate
  CockroachSqlDns:
    Type: String
    AllowedPattern: "^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
    Description: >-
      Exact primary eu-west-1 regions[].sql_dns authenticated by the protected
      Cockroach Cloud database-release gate.
  PublicDemoTenantId:
    Type: String
    Default: public-demo
    AllowedValues:
      - public-demo
  PublicDemoCompany:
    Type: String
    Default: Helios SA
    AllowedValues:
      - Helios SA
  LambdaMemoryMb:
    Type: Number
    Default: 512
    MinValue: 256
    MaxValue: 3008
  ReservedConcurrency:
    Type: Number
    # The Control Room loads health, proof, and audit concurrently. Five allows
    # those three in-flight reads, one recall, and one bounded spare slot without
    # opening an unbounded model/database concurrency surface. API request rate
    # is enforced independently.
    Default: 5
    MinValue: 1
    MaxValue: 20
  ApiThrottleRate:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
  ApiThrottleBurst:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 200
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for operational alarm notifications.
  CloudFrontWebAclArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/[A-Za-z0-9_-]+/[0-9a-f-]+$"
    Description: >-
      Approval-gated CloudFront WebACL ARN provisioned by aws/edge-waf.yaml in
      the us-east-1 CloudFront control plane. Empty attaches no WebACL, so the
      template can be created before the edge control plane exists; any
      non-empty value must still be a us-east-1 global WebACL ARN. The release
      contract stays closed elsewhere: .github/workflows/deploy-aws.yml reads
      the ARN from the edge-waf stack output and refuses to deploy without it.

Rules:
  RecoveryDrillIsStagingOnly:
    RuleCondition: !Not [!Equals [!Ref RecoveryDrillToken, disabled]]
    Assertions:
      - Assert: !Equals [!Ref Environment, staging]
        AssertDescription: >-
          A non-disabled RecoveryDrillToken is permitted only for staging.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  HasCloudFrontWebAcl: !Not [!Equals [!Ref CloudFrontWebAclArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: !Ref LambdaMemoryMb
    Tracing: Active
    Tags:
      Application: !Ref AppName
      Environment: !Ref Environment
      ManagedBy: SAM

Resources:
  SpaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-${Environment}-web-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID:
                Fn::ImportValue: !Sub "${AppName}-storage-kms-key-arn"
              SSEAlgorithm: aws:kms
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "${AppName}-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: !Sub "${Environment}-web/"
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldNoncurrentVersions
            Status: Enabled
            Prefix: ""
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
              NewerNoncurrentVersions: 3
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub "${AppName}-${Environment} private SPA origin"
        Name: !Sub "${AppName}-${Environment}-spa-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AppName}-${Environment}-security-headers"
        Comment: Browser security policy for the public judge application
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; connect-src 'self';
              font-src 'self' data:; form-action 'self'; frame-ancestors 'none';
              img-src 'self' data:; object-src 'none'; script-src 'self';
              style-src 'self'; upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Embedder-Policy
              Value: "require-corp"
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: "same-origin"
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: "same-origin"
              Override: true
            - Header: Permissions-Policy
              Value: "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
              Override: true
            - Header: X-Robots-Tag
              Value: "noindex, nofollow"
              Override: true

  SpaRouteRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AppName}-${Environment}-spa-route-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless SPA routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AppName}-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  # Keep the legacy logical resource managed so an exact-template rollback can
  # restore the former $default stage without colliding with a retained name.
  # New HTTP API deliveries use AWS's wildcard-friendly vended-logs namespace.
  ApiVendedAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/apigateway/${AppName}-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  ArchonHttpApi:
    Type: AWS::Serverless::HttpApi
    DependsOn:
      - ApiVendedAccessLogGroup
    Properties:
      Description: Public fixed-scope judge API with read-only canonical memory and an isolated synthetic action sandbox
      # The regional SAM transform drops stage controls for a literal $default
      # stage. A named stage keeps the generated AWS::ApiGatewayV2::Stage
      # explicit in the processed template so throttling, metrics, and access
      # logs are enforced rather than merely declared.
      StageName: !Ref HttpApiStageName
      FailOnWarnings: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: !Ref ApiThrottleBurst
        ThrottlingRateLimit: !Ref ApiThrottleRate
      AccessLogSettings:
        # LogGroup.Arn appends ":*", but API Gateway stores the canonical ARN
        # without that wildcard. Use the canonical form so drift stays IN_SYNC.
        DestinationArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiVendedAccessLogGroup}"
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime","stage":"$context.stage","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}
      Tags:
        Application: !Ref AppName
        Environment: !Ref Environment
        ManagedBy: SAM

  ArchonFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ArchonFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-api"
      Description: Fixed-scope memory recall, audit, proof, and isolated human-gated resolution API
      CodeUri: ../
      Handler: lambda.handler
      Role: !Ref LambdaExecutionRoleArn
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      AutoPublishAlias: live
      DeploymentPreference:
        Enabled: true
        Type: Canary10Percent5Minutes
        Role: !Ref CodeDeployServiceRoleArn
        Alarms:
          - !Ref LambdaCanaryErrorAlarm
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          DATABASE_SECRET_ID: !Ref DatabaseSecretId
          COCKROACH_SQL_DNS: !Ref CockroachSqlDns
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_EMBED_MODEL_ID: !Ref BedrockEmbeddingModelId
          BEDROCK_MODEL_ID: !Ref BedrockNarratorModelId
          PUBLIC_DEMO_TENANT_ID: !Ref PublicDemoTenantId
          PUBLIC_DEMO_COMPANY: !Ref PublicDemoCompany
          COCKROACH_REGION: !Ref CockroachRegion
          COCKROACH_REGION_EVIDENCE: !Ref CockroachRegionEvidence
          RELEASE_COMMIT_SHA: !Ref ReleaseCommitSha
          RECOVERY_DRILL_TOKEN: !Ref RecoveryDrillToken
          PGPOOL_MAX: "1"
          PGPOOL_MAX_LIFETIME_SECONDS: "300"
          DATABASE_SECRET_REFRESH_SECONDS: "30"
          RECALL_MAX_QUESTION_CHARS: "500"
          RECALL_MIN_SCORE: "0.15"
          RESOLUTION_SESSION_TTL_MINUTES: "30"
          RESOLUTION_MAX_ACTIVE_SESSIONS: "500"
          # The bootstrap stack generates this value. A versionless dynamic
          # reference keeps it out of source, GitHub secrets, stack parameters,
          # and rollback snapshots. Rotation requires a protected stack update
          # so CloudFront and Lambda resolve the same AWSCURRENT version.
          ORIGIN_VERIFY_TOKEN: !Sub >-
            {{resolve:secretsmanager:${AppName}/${Environment}/origin-verification:SecretString:ORIGIN_VERIFY_TOKEN}}
          NODE_OPTIONS: "--enable-source-maps"
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/health
            Method: GET
        RecallPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/recall
            Method: POST
        Audit:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/audit
            Method: GET
        Proof:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/proof
            Method: GET
        ResolutionSessionCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/resolution/session
            Method: POST
        ResolutionSessionRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/resolution/session
            Method: GET
        ResolutionDecision:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/resolution/decision
            Method: POST
        ApiFallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref ArchonHttpApi
            Path: /api/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        External:
          - pg-native
          - "@aws-sdk/signature-v4-crt"
        Format: cjs
        Minify: true
        Sourcemap: true
        Target: node22

  ArchonFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${Environment}-api"
      RetentionInDays: 30
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AppName}-${Environment} same-origin web application"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !If [HasCloudFrontWebAcl, !Ref CloudFrontWebAclArn, !Ref "AWS::NoValue"]
        Logging:
          Bucket: !Sub >-
            ${AppName}-cloudfront-access-logs-${AWS::AccountId}-${AWS::Region}.s3.amazonaws.com
          IncludeCookies: false
          Prefix: !Sub "${Environment}/"
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: SpaOrigin
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub "${ArchonHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            # Bind CloudFront to the exact stage resource generated from the
            # non-reserved API logical ID. This Ref resolves to the deployed
            # stage name and creates the required ordering edge.
            OriginPath: !Join ["", ["/", !Ref ArchonHttpApi.Stage]]
            OriginCustomHeaders:
              - HeaderName: x-archon-origin-verify
                HeaderValue: !Sub >-
                  {{resolve:secretsmanager:${AppName}/${Environment}/origin-verification:SecretString:ORIGIN_VERIFY_TOKEN}}
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: SpaOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouteRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # Trivy AWS-0013 is a scanner/platform compatibility boundary here:
        # CloudFrontDefaultCertificate cannot be combined with
        # MinimumProtocolVersion. All behaviors still enforce HTTPS and the
        # CloudFront-managed certificate serves only the generated distribution
        # hostname. A custom domain is outside the approved demo boundary.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SpaBucket.Arn
              - !Sub "${SpaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenySpaWritesWithoutKms
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenySpaWritesWithUnexpectedKmsKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id:
                  Fn::ImportValue: !Sub "${AppName}-storage-kms-key-arn"
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Broad, long-lived operational signal. It is intentionally not a CodeDeploy
  # rollback alarm because a broken stable version must not block its recovery.
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-lambda-errors"
      AlarmDescription: Lambda errors detected across the public judge API function
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArchonFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  # A new physical alarm per candidate avoids inheriting stale ALARM state. The
  # full dimension set isolates the candidate behind the weighted live alias.
  LambdaCanaryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub
        - "${AppName}-${Environment}-lambda-canary-errors-v${CandidateVersion}"
        - CandidateVersion: !GetAtt ArchonFunction.Version.Version
      AlarmDescription: Errors from only the candidate version behind the live weighted alias
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArchonFunction
        - Name: Resource
          Value: !Sub "${ArchonFunction}:live"
        - Name: ExecutedVersion
          Value: !GetAtt ArchonFunction.Version.Version
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-lambda-throttles"
      AlarmDescription: Reserved-concurrency or account-level throttles detected
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArchonFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-api-5xx"
      AlarmDescription: HTTP API 5xx responses detected
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ArchonHttpApi
        - Name: Stage
          Value: !Ref HttpApiStageName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AppName}-${Environment}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda health",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ArchonFunction}"],
                  [".", "Errors", ".", "."],
                  [".", "Throttles", ".", "."],
                  [".", "Duration", ".", ".", {"stat": "p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "HTTP API",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${ArchonHttpApi}", "Stage", "${HttpApiStageName}"],
                  [".", "4xx", ".", ".", ".", "."],
                  [".", "5xx", ".", ".", ".", "."],
                  [".", "Latency", ".", ".", ".", ".", {"stat": "p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 5,
              "properties": {
                "title": "CloudFront delivery",
                "region": "us-east-1",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/CloudFront", "Requests", "DistributionId", "${Distribution}", "Region", "Global"],
                  [".", "4xxErrorRate", ".", ".", ".", ".", {"stat": "Average"}],
                  [".", "5xxErrorRate", ".", ".", ".", ".", {"stat": "Average"}]
                ]
              }
            }
          ]
        }

Outputs:
  ApplicationUrl:
    Description: Public same-origin judge application
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution used for frontend deployment/invalidation
    Value: !Ref Distribution
  SpaBucketName:
    Description: Private frontend deployment bucket
    Value: !Ref SpaBucket
  ApiEndpoint:
    Description: Direct HTTP API endpoint (CloudFront /api/* is preferred)
    Value: !Join
      - ""
      - - !Sub "https://${ArchonHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
        - !Ref ArchonHttpApi.Stage
  ApiId:
    Description: HTTP API identifier used by the protected live-stage release proof
    Value: !Ref ArchonHttpApi
  ApiStageName:
    Description: Named HTTP API stage whose controls are verified after deployment
    Value: !Ref ArchonHttpApi.Stage
  ApiAccessLogGroupName:
    Description: Access-log group verified by the protected release pipeline
    Value: !Ref ApiVendedAccessLogGroup
  FunctionName:
    Description: Lambda function name
    Value: !Ref ArchonFunction
  DashboardName:
    Description: CloudWatch operations dashboard
    Value: !Ref OperationsDashboard
