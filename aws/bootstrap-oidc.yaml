        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: bootstrap
        - Key: ManagedBy
          Value: CloudFormation

  StagingDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-staging-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:staging
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: staging
                token.actions.githubusercontent.com:workflow:
                  - Deploy AWS
                  - Recover AWS
      Policies:
        - PolicyName: deploy-staging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CancelUpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackResourceDrifts
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:RollbackStack
                  - cloudformation:UpdateTerminationProtection
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-staging/*"
              - Sid: InspectStagingControlPlaneOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-staging-edge/*
              - Sid: InspectStagingDriftDetection
                Effect: Allow
                Action:
                  - cloudformation:BatchDescribeTypeConfigurations
                  - cloudformation:DescribeStackDriftDetectionStatus
                Resource: "*"
              - Sid: ExpandStagingServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt StagingExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: InspectStagingArtifactAndApplicationBuckets
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketLogging
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}"
              - Sid: ListStagingArtifactNamespaces
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - candidates/deployments/staging/*
                      - candidates/recovery/staging/*
              - Sid: ListStagingApplicationBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}"
              - Sid: AuditS3AccessLogArchive
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketLogging
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                Resource: !GetAtt S3AccessLogArchive.Arn
              - Sid: InspectS3AccessLoggingFoundationStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
              - Sid: InspectS3AccessLoggingFoundationRule
                Effect: Allow
                Action: securityhub:BatchGetAutomationRules
                Resource: !GetAtt S3AccessLogArchiveS39Suppression.RuleArn
              - Sid: PublishStagingDeploymentArtifacts
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Effect: Allow
                Resource: !Sub >-
                  ${ArtifactBucket.Arn}/candidates/deployments/staging/*
              - Sid: UseStagingApplicationStorageKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                Resource: !GetAtt ApplicationStorageKey.Arn
              - Sid: ManageStagingRecoveryArtifacts
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Effect: Allow
                Resource: !Sub >-
                  ${ArtifactBucket.Arn}/candidates/recovery/staging/*
              - Sid: PublishAndRecoverStagingFrontend
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Effect: Allow
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: DeleteFailedStagingGreenfieldRetainedResources
                Effect: Allow
                Action:
                  - s3:DeleteBucket
                  - s3:GetBucketTagging
                  - s3:ListBucketVersions
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}"
              - Sid: DeleteFailedStagingGreenfieldObjectVersions
                Effect: Allow
                Action:
                  - s3:DeleteObjectVersion
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: DeleteFailedStagingGreenfieldRetainedLogs
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-staging-api"
              - Sid: InspectFailedStagingGreenfieldRetainedLogTags
                Effect: Allow
                Action: logs:ListTagsForResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-staging-api"
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: !Ref AppName
                    aws:ResourceTag/Environment: staging
              - Effect: Allow
                Action:
                  - lambda:GetAlias
                  - lambda:UpdateAlias
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-staging-api"
              - Sid: VerifyStagingApiStage
                Effect: Allow
                Action:
                  - apigateway:GET
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*/stages/*"
              - Sid: VerifyStagingApiAccessLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                # Both APIs are evaluated against child log-stream ARNs at runtime.
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-staging:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/${AppName}-staging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/apigateway/${AppName}-staging:*"

