                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-staging-waf-resolution-rate-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-any-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-api-rate-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-resolution-rate-block
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectOnlyNamedEdgeWafAlarms
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-staging-waf-any-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-staging-waf-api-rate-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-staging-waf-resolution-rate-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-any-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-api-rate-block
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-production-waf-resolution-rate-block
              - Sid: CheckCloudFrontWebAclCapacity
