    Properties:
      TopicArn: !Ref StagingAlarmTopic
      Protocol: sqs
      Endpoint: !GetAtt StagingAlarmArchiveQueue.Arn
      RawMessageDelivery: false

  StagingAlarmRoutingDrillSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableAlarmRouting
    DependsOn: AlarmArchiveQueuePolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TopicArn: !Ref StagingAlarmTopic
      Protocol: sqs
      Endpoint: !GetAtt StagingAlarmRoutingDrillQueue.Arn
      RawMessageDelivery: false
      FilterPolicyScope: MessageBody
      FilterPolicy:
        AlarmName:
          - !Sub "${AppName}-staging-routing-drill"

  ProductionAlarmArchiveSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableAlarmRouting
    DependsOn: AlarmArchiveQueuePolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TopicArn: !Ref ProductionAlarmTopic
      Protocol: sqs
      Endpoint: !GetAtt ProductionAlarmArchiveQueue.Arn
      RawMessageDelivery: false

  StagingAlarmRoutingDrillAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: !Sub "${AppName}-staging-routing-drill"
      AlarmDescription: >-
        Dedicated staging-only delivery probe. It is never attached to
        CodeDeploy and may be forced only by the protected alarm-routing drill.
      ActionsEnabled: true
      AlarmActions:
        - !Ref StagingAlarmTopic
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: DeliveryProbe
      Namespace: !Sub "${AppName}/AlarmRoutingDrill"
      Period: 86400
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: synthetic-operational-evidence
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation

