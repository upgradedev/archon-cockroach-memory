AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time eu-west-1 delivery bootstrap for Archon Memory: GitHub OIDC trust,
  environment-bound deploy roles, CloudFormation execution roles, and a private
  immutable-artifact bucket with centralized S3 server access logging.

Parameters:
  AppName:
    Type: String
    Default: archon-memory
    MinLength: 3
    MaxLength: 17
    AllowedPattern: "^[a-z][a-z0-9-]{2,16}$"
  GitHubOrganization:
    Type: String
    Default: upgradedev
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  GitHubRepository:
    Type: String
    Default: archon-cockroach-memory
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  GitHubRepositoryId:
    Type: String
    Default: "1285750381"
    AllowedPattern: "^[0-9]{1,20}$"
    Description: Immutable GitHub repository id used by the foundation OIDC trust.
  GitHubRepositoryOwnerId:
    Type: String
    Default: "25751981"
    AllowedPattern: "^[0-9]{1,20}$"
    Description: Immutable GitHub repository-owner id used by the foundation OIDC trust.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      Existing account-wide token.actions.githubusercontent.com provider ARN.
      Leave empty only when this account does not already have that provider.
  ArtifactAccessLoggingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Fail-closed two-phase migration switch. The initial archive and
      destination-policy deployment remains false until the protected
      activation workflow permanently enables it.
  AlarmRoutingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Dormant alarm-routing contract. A separately authorized administrator
      must explicitly accept the billable KMS, SNS, and SQS resources before
      permanently enabling this switch.

Rules:
  EuWestOneOnly:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, eu-west-1]
        AssertDescription: Archon application delivery resources must be in eu-west-1.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  EnableArtifactAccessLogging: !Equals [!Ref ArtifactAccessLoggingEnabled, "true"]
  EnableAlarmRouting: !Equals [!Ref AlarmRoutingEnabled, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationStorageKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub >-
        Customer-managed key for ${AppName} release artifacts, private SPA
        objects, and origin-verification secrets
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudFrontPrivateOriginRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
              ArnLike:
                AWS:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              StringLike:
                kms:EncryptionContext:aws:s3:arn:
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}
                  - !Sub >-
                    arn:${AWS::Partition}:s3:::${AppName}-production-web-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: application-storage-and-secrets
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationStorageKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: !Sub "alias/${AppName}-storage"
      TargetKeyId: !Ref ApplicationStorageKey

  StagingOriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: ApplicationStorageKeyAlias
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${AppName}/staging/origin-verification"
      Description: CloudFront-to-origin capability for the protected staging stack.
      KmsKeyId: !GetAtt ApplicationStorageKey.Arn
      GenerateSecretString:
        ExcludePunctuation: true
        ExcludeUppercase: false
        ExcludeLowercase: false
        ExcludeNumbers: false
        IncludeSpace: false
        PasswordLength: 64
        GenerateStringKey: ORIGIN_VERIFY_TOKEN
        SecretStringTemplate: "{}"
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: origin-verification-capability
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation

  ProductionOriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: ApplicationStorageKeyAlias
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${AppName}/production/origin-verification"
      Description: CloudFront-to-origin capability for the protected production stack.
      KmsKeyId: !GetAtt ApplicationStorageKey.Arn
      GenerateSecretString:
        ExcludePunctuation: true
        ExcludeUppercase: false
        ExcludeLowercase: false
        ExcludeNumbers: false
        IncludeSpace: false
        PasswordLength: 64
        GenerateStringKey: ORIGIN_VERIFY_TOKEN
        SecretStringTemplate: "{}"
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: origin-verification-capability
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  S3AccessLogArchiveS39Suppression:
    Type: AWS::SecurityHub::AutomationRule
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RuleName: !Sub "${AppName}-intentional-s3-log-archive-s39"
      Description: >-
        Suppress only S3.9 for the intentionally unlogged server-access-log
        archive, preventing recursive logging while retaining all source logs.
      RuleOrder: 1
      RuleStatus: ENABLED
      IsTerminal: true
      Criteria:
        AwsAccountId:
          - Comparison: EQUALS
            Value: !Ref AWS::AccountId
        ComplianceSecurityControlId:
          - Comparison: EQUALS
            Value: S3.9
        ComplianceStatus:
          - Comparison: EQUALS
            Value: FAILED
        ProductArn:
          - Comparison: EQUALS
            Value: !Sub >-
              arn:${AWS::Partition}:securityhub:${AWS::Region}::product/aws/securityhub
        RecordState:
          - Comparison: EQUALS
            Value: ACTIVE
        ResourceId:
          - Comparison: EQUALS
            Value: !Sub >-
              arn:${AWS::Partition}:s3:::${AppName}-s3-access-logs-${AWS::AccountId}-${AWS::Region}
        ResourceRegion:
          - Comparison: EQUALS
            Value: !Ref AWS::Region
        ResourceType:
          - Comparison: EQUALS
            Value: AwsS3Bucket
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: >-
                Intentional exception: an S3 server-access-log destination must
                not log to itself because that causes recursive log growth.
              UpdatedBy: !Sub "${AppName}-delivery-bootstrap"
      Tags:
        Application: !Ref AppName
        ManagedBy: CloudFormation

  S3AccessLogArchive:
    Type: AWS::S3::Bucket
    DependsOn: S3AccessLogArchiveS39Suppression
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-s3-access-logs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetireServerAccessLogs
            Status: Enabled
            Prefix: ""
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: access-logs
        - Key: ManagedBy
          Value: CloudFormation

  S3AccessLogArchivePolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref S3AccessLogArchive
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt S3AccessLogArchive.Arn
              - !Sub "${S3AccessLogArchive.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowArtifactBucketServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${S3AccessLogArchive.Arn}/artifacts/*"
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::${AppName}-artifacts-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowStagingWebBucketServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${S3AccessLogArchive.Arn}/staging-web/*"
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::${AppName}-staging-web-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowProductionWebBucketServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${S3AccessLogArchive.Arn}/production-web/*"
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::${AppName}-production-web-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowCloudFrontLogBucketServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${S3AccessLogArchive.Arn}/cloudfront-log-bucket/*"
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:s3:::${AppName}-cloudfront-access-logs-${AWS::AccountId}-${AWS::Region}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CloudFrontAccessLogBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3AccessLogArchivePolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-cloudfront-access-logs-${AWS::AccountId}-${AWS::Region}"
      # CloudFront standard logging (legacy) still requires bucket ACLs.
      # BucketOwnerPreferred enables the service-managed canonical grant; the
      # CloudFormation execution roles hold only GetBucketAcl/PutBucketAcl on
      # this bucket; the GitHub deployment roles can only pass those roles.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogArchive
        LogFilePrefix: cloudfront-log-bucket/
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      LifecycleConfiguration:
        Rules:
          - Id: RetireCloudFrontAccessLogs
            Status: Enabled
            Prefix: ""
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: cloudfront-access-logs
        - Key: ManagedBy
          Value: CloudFormation

  CloudFrontAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref CloudFrontAccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CloudFrontAccessLogBucket.Arn
              - !Sub "${CloudFrontAccessLogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3AccessLogArchivePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt ApplicationStorageKey.Arn
              SSEAlgorithm: aws:kms
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetireCandidateAndRecoveryEvidence
            Status: Enabled
            Prefix: candidates/
            # Current immutable candidates, recovery bundles, ledgers, and
            # receipts are bounded to the seven-year evidence horizon. Active
            # environments must create and drill a newer recovery point before
            # that horizon; noncurrent ledger versions retire much sooner.
            ExpirationInDays: 2555
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
              NewerNoncurrentVersions: 5
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RetireFoundationTemplates
            Status: Enabled
            Prefix: foundation/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
              NewerNoncurrentVersions: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      LoggingConfiguration: !If
        - EnableArtifactAccessLogging
        - DestinationBucketName: !Ref S3AccessLogArchive
          LogFilePrefix: artifacts/
          TargetObjectKeyFormat:
            PartitionedPrefix:
              PartitionDateSource: EventTime
        - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: ManagedBy
          Value: CloudFormation

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyArtifactWritesWithoutKms
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyArtifactWritesWithUnexpectedKmsKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !Sub >-
                  arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${AppName}-storage

  AlarmNotificationsKey:
    Type: AWS::KMS::Key
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub >-
        Customer-managed encryption key for ${AppName} CloudWatch alarm
        notifications and durable archive delivery
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchAlarmEncryption
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-staging-*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-production-*
          - Sid: AllowSnsEncryptedQueueDelivery
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: alarm-notifications
        - Key: ManagedBy
          Value: CloudFormation

  AlarmNotificationsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: !Sub "alias/${AppName}-alarm-notifications"
      TargetKeyId: !Ref AlarmNotificationsKey

  StagingAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: !Sub "${AppName}-staging-alarms"
      DisplayName: !Sub "${AppName} staging alarms"
      KmsMasterKeyId: !GetAtt AlarmNotificationsKey.Arn
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: alarm-notifications
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation

  ProductionAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: !Sub "${AppName}-production-alarms"
      DisplayName: !Sub "${AppName} production alarms"
      KmsMasterKeyId: !GetAtt AlarmNotificationsKey.Arn
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: alarm-notifications
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Topics:
        - !Ref StagingAlarmTopic
        - !Ref ProductionAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountTopicAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - sns:AddPermission
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:Publish
              - sns:RemovePermission
              - sns:SetTopicAttributes
              - sns:Subscribe
            Resource:
              - !Ref StagingAlarmTopic
              - !Ref ProductionAlarmTopic
          - Sid: AllowStagingCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref StagingAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-staging-*
          - Sid: AllowProductionCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ProductionAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-production-*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:*
            Resource:
              - !Ref StagingAlarmTopic
              - !Ref ProductionAlarmTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  StagingAlarmArchiveQueue:
    Type: AWS::SQS::Queue
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${AppName}-staging-alarm-archive"
      KmsMasterKeyId: !GetAtt AlarmNotificationsKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: alarm-notifications
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation

  StagingAlarmRoutingDrillQueue:
    Type: AWS::SQS::Queue
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${AppName}-staging-alarm-routing-drill"
      KmsMasterKeyId: !GetAtt AlarmNotificationsKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 300
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: synthetic-operational-evidence
        - Key: Environment
          Value: staging
        - Key: ManagedBy
          Value: CloudFormation

  ProductionAlarmArchiveQueue:
    Type: AWS::SQS::Queue
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${AppName}-production-alarm-archive"
      KmsMasterKeyId: !GetAtt AlarmNotificationsKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: DataClassification
          Value: alarm-notifications
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  AlarmArchiveQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: EnableAlarmRouting
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Queues:
        - !Ref StagingAlarmArchiveQueue
        - !Ref StagingAlarmRoutingDrillQueue
        - !Ref ProductionAlarmArchiveQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowStagingAlarmArchiveDelivery
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt StagingAlarmArchiveQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Ref StagingAlarmTopic
          - Sid: AllowProductionAlarmArchiveDelivery
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProductionAlarmArchiveQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Ref ProductionAlarmTopic
          - Sid: AllowStagingAlarmRoutingDrillDelivery
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt StagingAlarmRoutingDrillQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Ref StagingAlarmTopic
          - Sid: DenyStagingAlarmArchiveInjection
            Effect: Deny
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt StagingAlarmArchiveQueue.Arn
            Condition:
              ArnNotLike:
                aws:SourceArn: !Ref StagingAlarmTopic
          - Sid: DenyProductionAlarmArchiveInjection
            Effect: Deny
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt ProductionAlarmArchiveQueue.Arn
            Condition:
              ArnNotLike:
                aws:SourceArn: !Ref ProductionAlarmTopic
          - Sid: DenyStagingAlarmRoutingDrillInjection
            Effect: Deny
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt StagingAlarmRoutingDrillQueue.Arn
            Condition:
              ArnNotLike:
                aws:SourceArn: !Ref StagingAlarmTopic
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource:
              - !GetAtt StagingAlarmArchiveQueue.Arn
              - !GetAtt StagingAlarmRoutingDrillQueue.Arn
              - !GetAtt ProductionAlarmArchiveQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  StagingAlarmArchiveSubscription:
