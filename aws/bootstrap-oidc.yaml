              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: retire-one-time-foundation-authority
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeleteOnlyOneTimeFoundationMigrationRole
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                Resource: !Sub >-
                  arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-migration
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: bootstrap
        - Key: Lifecycle
          Value: permanent-authority-retirement-execution
        - Key: ManagedBy
          Value: CloudFormation

  FoundationPromotionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-foundation-promotion"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:bootstrap
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: bootstrap
                token.actions.githubusercontent.com:workflow:
                  - Bootstrap AWS Foundation
                  - Foundation Storage Migration
      Policies:
        - PolicyName: promote-foundation-logging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreatePinnedBootstrapChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: bootstrap-s3-*
                    cloudformation:TemplateUrl: !Sub >-
                      https://${AppName}-artifacts-${AWS::AccountId}-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/foundation/*
                  "Null":
                    cloudformation:RoleArn: "true"
                    cloudformation:StackPolicyUrl: "true"
              - Sid: ExecuteOnlyBootstrapLoggingChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName:
                      - bootstrap-s3-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/bootstrap-s3-*/*
              - Sid: InspectBootstrapStackAndChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:GetStackPolicy
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                  - !Sub >-
                      arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-foundation-migration-authority/*
              - Sid: InspectFoundationMigrationState
                Effect: Allow
                Action:
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:ListChangeSets
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
              - Sid: InspectOneTimeFoundationMigrationAuthority
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                Resource: !Sub >-
                  arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-migration
              - Sid: RetireOneTimeFoundationMigrationAuthorityStack
                Effect: Allow
                Action: cloudformation:DeleteStack
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-foundation-migration-authority/*
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt FoundationAuthorityRetirementExecutionRole.Arn
              - Sid: PassOnlyFoundationAuthorityRetirementExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt FoundationAuthorityRetirementExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: PublishImmutableFoundationTemplate
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/foundation/*"
              - Sid: EncryptImmutableFoundationTemplate
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ReEncrypt*
                Resource: !GetAtt ApplicationStorageKey.Arn
              - Sid: InspectOriginVerificationSecretMetadata
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource:
                  - !Ref StagingOriginVerifySecret
                  - !Ref ProductionOriginVerifySecret
              - Sid: InspectArtifactAndArchiveBuckets
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketLogging
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !GetAtt CloudFrontAccessLogBucket.Arn
                  - !GetAtt S3AccessLogArchive.Arn
              - Sid: ActivateArtifactBucketLoggingWithoutReplacement
                Effect: Allow
                Action: s3:PutBucketLogging
                Resource: !GetAtt ArtifactBucket.Arn
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectFoundationAutomationRule
                Effect: Allow
                Action: securityhub:BatchGetAutomationRules
                Resource: !GetAtt S3AccessLogArchiveS39Suppression.RuleArn
              - Sid: ResolveExactCloudFormationExecutionRoles
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-staging-cloudformation
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-production-cloudformation
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: ResolveExactFoundationRoleAttributes
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-staging-lambda-runtime
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-production-lambda-runtime
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-staging-codedeploy
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-production-codedeploy
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-database-operator
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-cleanup
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-finops-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-finops-cloudformation-execution
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-alarm-routing-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-alarm-routing-cloudformation-execution
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-promotion
                  - !GetAtt FoundationAuthorityRetirementExecutionRole.Arn
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-migration
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-staging-deploy
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-production-deploy
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectPermanentControlRoleMetadata
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-cleanup
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-finops-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-finops-cloudformation-execution
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-alarm-routing-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-alarm-routing-cloudformation-execution
              - Sid: InspectPermanentControlRolePolicies
                Effect: Allow
                Action: iam:GetRolePolicy
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-edge-cleanup
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-finops-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-finops-cloudformation-execution
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-alarm-routing-controls
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-alarm-routing-cloudformation-execution
              - Sid: InspectFoundationRetirementRoleMetadata
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-promotion
                  - !GetAtt FoundationAuthorityRetirementExecutionRole.Arn
              - Sid: InspectFoundationRetirementRolePolicies
                Effect: Allow
                Action: iam:GetRolePolicy
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-github-foundation-promotion
                  - !GetAtt FoundationAuthorityRetirementExecutionRole.Arn
              - Sid: ResolveExactFoundationAutomationRule
                Effect: Allow
                Action: securityhub:ListTagsForResource
                Resource: !GetAtt S3AccessLogArchiveS39Suppression.RuleArn
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
