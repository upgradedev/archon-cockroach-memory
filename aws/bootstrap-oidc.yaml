              - cloudfront:CreateDistribution
              - cloudfront:CreateFunction
              - cloudfront:CreateOriginAccessControl
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:DeleteCloudFrontOriginAccessIdentity
              - cloudfront:DeleteDistribution
              - cloudfront:DeleteFunction
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:DescribeFunction
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:GetCachePolicy
              - cloudfront:GetFunction
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginRequestPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:ListTagsForResource
              - cloudfront:PublishFunction
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:UpdateDistribution
              - cloudfront:UpdateFunction
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:UpdateResponseHeadersPolicy
            Resource: "*"

  CloudFormationApiGatewayStageTagPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn-lint:
        config:
          # The live AWS::ApiGatewayV2::Stage provider requires these native
          # actions, but cfn-lint 1.53.1 has not added them to rule W3037 yet.
          ignore_checks:
            - W3037
    Properties:
      ManagedPolicyName: !Sub "${AppName}-cloudformation-apigateway-stage-tags"
      Description: Native tag permissions required only by the HTTP API Stage provider.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ApiGatewayV2StageTags
            Effect: Allow
            Action:
              - apigateway:TagResource
              - apigateway:UntagResource
            Resource:
              - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*/stages"
              - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*/stages/*"

  StagingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-staging-cloudformation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CloudFormationCommonExecutionPolicy
        - !Ref CloudFormationApiGatewayStageTagPolicy
        - !Ref StagingCloudFormationResourcePolicy
      Policies:
        - PolicyName: pass-staging-service-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StagingLambdaRuntimeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StagingCodeDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: codedeploy.amazonaws.com
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: staging

  ProductionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-production-cloudformation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CloudFormationCommonExecutionPolicy
        - !Ref CloudFormationApiGatewayStageTagPolicy
        - !Ref ProductionCloudFormationResourcePolicy
      Policies:
        - PolicyName: pass-production-service-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ProductionLambdaRuntimeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ProductionCodeDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: codedeploy.amazonaws.com
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: production

  AlarmRoutingCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-alarm-routing-cloudformation-execution"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: activate-exact-alarm-routing-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPinnedAlarmRoutingFoundationTemplate
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub >-
                  ${ArtifactBucket.Arn}/foundation/alarm-routing/*
              - Sid: DecryptPinnedAlarmRoutingFoundationTemplate
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt ApplicationStorageKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
              - Sid: CreateOnlyTaggedAlarmNotificationKey
                Effect: Allow
                Action: kms:CreateKey
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Application: !Ref AppName
                    aws:RequestTag/DataClassification: alarm-notifications
                    aws:RequestTag/ManagedBy: CloudFormation
                    kms:KeySpec: SYMMETRIC_DEFAULT
                    kms:KeyUsage: ENCRYPT_DECRYPT
                  Bool:
                    kms:MultiRegion: "false"
              - Sid: ManageOnlyTaggedAlarmNotificationKey
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:EnableKeyRotation
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                Resource: !Sub >-
                  arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: !Ref AppName
                    aws:ResourceTag/DataClassification: alarm-notifications
                    aws:ResourceTag/ManagedBy: CloudFormation
              - Sid: ManageExactAlarmNotificationAlias
                Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:DeleteAlias
                  - kms:UpdateAlias
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${AppName}-alarm-notifications
                  - !Sub >-
                    arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              - Sid: ManageExactAlarmTopics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:UntagResource
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarms
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarms
              - Sid: ManageExactAlarmSubscriptions
                Effect: Allow
                Action:
                  - sns:GetSubscriptionAttributes
                  - sns:SetSubscriptionAttributes
                  - sns:Unsubscribe
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarms:*
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarms:*
              - Sid: ManageExactAlarmArchiveQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarm-archive
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarm-routing-drill
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarm-archive
              - Sid: AttachOnlyAlarmInspectionPolicies
                Effect: Allow
                Action:
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                Resource:
                  - !GetAtt StagingDeployRole.Arn
                  - !GetAtt ProductionDeployRole.Arn
              - Sid: ManageOnlyStagingRoutingDrillAlarm
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-staging-routing-drill
              - Sid: InspectStagingRoutingDrillAlarmDuringMutation
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: alarm-routing-controls
        - Key: ManagedBy
          Value: CloudFormation

  AlarmRoutingControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-alarm-routing-controls"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:alarm-routing-controls
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: alarm-routing-controls
                token.actions.githubusercontent.com:workflow: Manage AWS Alarm Routing
      Policies:
        - PolicyName: manage-exact-alarm-routing-control-plane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreatePinnedAlarmRoutingChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/alarm-routing-*/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt AlarmRoutingCloudFormationExecutionRole.Arn
                  StringLike:
                    cloudformation:ChangeSetName:
                      - alarm-routing-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/alarm-routing-*/*
                    cloudformation:TemplateUrl: !Sub >-
                      https://${ArtifactBucket}.s3.${AWS::Region}.amazonaws.com/foundation/alarm-routing/*
              - Sid: InspectAndExecutePinnedAlarmRoutingChangeSet
                Effect: Allow
                Action:
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetStackPolicy
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-delivery-bootstrap/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/alarm-routing-*/*
                Condition:
                  StringLikeIfExists:
                    cloudformation:ChangeSetName:
                      - alarm-routing-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/alarm-routing-*/*
              - Sid: PassOnlyAlarmRoutingCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AlarmRoutingCloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: PublishPinnedAlarmRoutingFoundationTemplate
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub >-
                  ${ArtifactBucket.Arn}/foundation/alarm-routing/*
              - Sid: EncryptPinnedAlarmRoutingFoundationTemplate
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                Resource: !GetAtt ApplicationStorageKey.Arn
              - Sid: DiscoverExactAlarmConfiguration
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: ProveTaggedAlarmNotificationKey
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                Resource: !Sub >-
                  arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: !Ref AppName
                    aws:ResourceTag/DataClassification: alarm-notifications
                    aws:ResourceTag/ManagedBy: CloudFormation
              - Sid: InspectExactAlarmTopics
                Effect: Allow
                Action:
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarms
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarms
              - Sid: InspectExactAlarmSubscriptions
                Effect: Allow
                Action: sns:GetSubscriptionAttributes
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarms:*
                  - !Sub >-
                    arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarms:*
              - Sid: InspectExactAlarmArchives
                Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarm-archive
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarm-routing-drill
                  - !Sub >-
                    arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-production-alarm-archive
              - Sid: RunOnlyBoundedStagingAlarmDeliveryDrill
                Effect: Allow
                Action: cloudwatch:SetAlarmState
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppName}-staging-routing-drill
              - Sid: ReadOnlyStagingAlarmDrillDelivery
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                Resource: !Sub >-
                  arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppName}-staging-alarm-routing-drill
              - Sid: DecryptOnlyStagingAlarmDrillDelivery
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub >-
                  arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "sqs.${AWS::Region}.amazonaws.com"
                    aws:ResourceTag/Application: !Ref AppName
                    aws:ResourceTag/DataClassification: alarm-notifications
                    aws:ResourceTag/ManagedBy: CloudFormation
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: alarm-routing-controls
        - Key: ManagedBy
          Value: CloudFormation

  EdgeControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-edge-controls"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:edge-controls
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: edge-controls
                token.actions.githubusercontent.com:workflow: Manage AWS Edge Controls
      Policies:
        - PolicyName: manage-exact-cloudfront-waf-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PlanAndApplyExactEdgeStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetStackPolicy
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:SetStackPolicy
                  - cloudformation:UpdateTerminationProtection
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-staging-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-production-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/edge-controls-*/*
                Condition:
                  StringLikeIfExists:
                    cloudformation:ChangeSetName:
                      - edge-controls-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/edge-controls-*/*
              # Destructive stack cleanup is intentionally absent. It is
              # isolated in EdgeCleanupRole, whose trust is bound to the
              # separately protected edge-cleanup GitHub environment.
              - Sid: ManageExactCloudFrontWebAcls
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:DeleteLoggingConfiguration
                  - wafv2:PutLoggingConfiguration
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:UpdateWebACL
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/${AppName}-staging-cloudfront/*
                  - !Sub >-
                    arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/${AppName}-production-cloudfront/*
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectExactCloudFrontWebAcls
                Effect: Allow
                Action:
                  - wafv2:GetLoggingConfiguration
                  - wafv2:GetWebACL
                  - wafv2:ListTagsForResource
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/${AppName}-staging-cloudfront/*
                  - !Sub >-
                    arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/${AppName}-production-cloudfront/*
              # AWS WAF documents these account-scoped CloudWatch Logs
              # permissions as mandatory for PutLoggingConfiguration. They
              # cannot be resource-scoped, so they remain CloudFormation-only
              # and region-bound.
              - Sid: ConfigureOnlyCloudFormationEdgeLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:DeleteResourcePolicy
                  - logs:DeleteLogDelivery
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:PutResourcePolicy
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: ManageOnlyNamedEdgeLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:PutRetentionPolicy
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-staging-blocked:*
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-production-blocked:*
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-staging-edge-waf-alarm-archive:*
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-production-edge-waf-alarm-archive:*
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              # CloudWatch Logs tagging APIs require the logGroupArn form,
              # without the trailing :* required by most log-group APIs.
              - Sid: TagOnlyNamedEdgeLogGroups
                Effect: Allow
                Action:
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-staging-blocked
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-production-blocked
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-staging-edge-waf-alarm-archive
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-production-edge-waf-alarm-archive
                Condition:
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: InspectOnlyNamedEdgeLogGroups
                Effect: Allow
                Action: logs:ListTagsForResource
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-staging-blocked
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-production-blocked
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-staging-edge-waf-alarm-archive
                  - !Sub >-
                      arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-production-edge-waf-alarm-archive
              - Sid: DescribeOnlyUsEastOneEdgeLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: PutOnlyExactEdgeAlarmEventRules
                Effect: Allow
                Action: events:PutRule
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:events:us-east-1:${AWS::AccountId}:rule/${AppName}-staging-edge-waf-alarm-events
                  - !Sub >-
                      arn:${AWS::Partition}:events:us-east-1:${AWS::AccountId}:rule/${AppName}-production-edge-waf-alarm-events
                Condition:
                  "ForAllValues:StringEquals":
                    events:source: aws.cloudwatch
                    events:detail-type: CloudWatch Alarm State Change
                  "Null":
                    events:source: "false"
                    events:detail-type: "false"
                  "ForAnyValue:StringEquals":
                    aws:CalledVia: cloudformation.amazonaws.com
              - Sid: PutTargetsOnlyExactEdgeAlarmArchives
                Effect: Allow
                Action: events:PutTargets
                Resource:
                  - !Sub >-
                      arn:${AWS::Partition}:events:us-east-1:${AWS::AccountId}:rule/${AppName}-staging-edge-waf-alarm-events
                  - !Sub >-
                      arn:${AWS::Partition}:events:us-east-1:${AWS::AccountId}:rule/${AppName}-production-edge-waf-alarm-events
                Condition:
                  "ForAllValues:ArnEquals":
                    events:TargetArn:
                      - !Sub >-
