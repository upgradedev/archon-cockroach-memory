                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:edge-cleanup
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: edge-cleanup
                token.actions.githubusercontent.com:workflow: Manage AWS Edge Controls
      Policies:
        - PolicyName: cleanup-exact-cloudfront-waf-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InspectExactEdgeCleanupStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-staging-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-production-edge/*
              - Sid: InspectExactEdgeCleanupSources
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-staging-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-production-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/edge-controls-*/*
              - Sid: DeleteOnlyExactEdgeStacks
                Effect: Allow
                Action: cloudformation:DeleteStack
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-staging-edge/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-production-edge/*
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: edge-cleanup
        - Key: ManagedBy
          Value: CloudFormation

  FinOpsCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-finops-cloudformation-execution"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: finops-cloudformation-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOnlyNamedWorkloadBudgets
                Effect: Allow
                Action:
                  - budgets:ListTagsForResource
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ViewBudget
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${AppName}-workload-monthly-total
              - Sid: CreateOnlyTaggedCostAnomalyControls
                Effect: Allow
                Action:
                  - ce:CreateAnomalyMonitor
                  - ce:CreateAnomalySubscription
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Application: !Ref AppName
                    aws:RequestTag/ApprovalBoundary: explicit-live-activation-required
                    aws:RequestTag/FinOpsScope: workload
              - Sid: ManageOnlyTaggedCostAnomalyControls
                Effect: Allow
                Action:
                  - ce:DeleteAnomalyMonitor
                  - ce:DeleteAnomalySubscription
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalySubscriptions
                  - ce:ListTagsForResource
                  - ce:TagResource
                  - ce:UntagResource
                  - ce:UpdateAnomalyMonitor
                  - ce:UpdateAnomalySubscription
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:ce::${AWS::AccountId}:anomalymonitor/*
                  - !Sub >-
                    arn:${AWS::Partition}:ce::${AWS::AccountId}:anomalysubscription/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: !Ref AppName
                    aws:ResourceTag/ApprovalBoundary: explicit-live-activation-required
                    aws:ResourceTag/FinOpsScope: workload
              - Sid: InspectAccountBoundEncryptedNotificationRoutes
                Effect: Allow
                Action: sns:GetTopicAttributes
                Resource: !Sub >-
                  arn:${AWS::Partition}:sns:us-east-1:${AWS::AccountId}:*
              - Sid: CreateOnlyBudgetsServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub >-
                  arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/budgets.amazonaws.com/*
                Condition:
                  StringEquals:
                    iam:AWSServiceName: budgets.amazonaws.com
              - Sid: RequiredFineGrainedBillingPermissions
                Effect: Allow
                Action:
                  - aws-portal:ModifyBilling
                  - aws-portal:ViewBilling
                  - billing:GetBillingViewData
                Resource: "*"
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: finops-controls
        - Key: ManagedBy
          Value: CloudFormation

  FinOpsControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-finops-controls"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub >-
                  repo:${GitHubOrganization}/${GitHubRepository}:environment:finops-controls
                token.actions.githubusercontent.com:repository: !Sub >-
                  ${GitHubOrganization}/${GitHubRepository}
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:repository_owner_id: !Ref GitHubRepositoryOwnerId
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:environment: finops-controls
                token.actions.githubusercontent.com:workflow: Manage AWS FinOps Controls
      Policies:
        - PolicyName: manage-exact-finops-control-plane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateExactFinOpsChangeSets
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-finops/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/finops-*/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt FinOpsCloudFormationExecutionRole.Arn
                  StringLike:
                    cloudformation:ChangeSetName:
                      - finops-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/finops-*/*
              - Sid: PlanAndApplyExactFinOpsStacks
                Effect: Allow
                Action:
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetStackPolicy
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:SetStackPolicy
                  - cloudformation:UpdateTerminationProtection
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${AppName}-finops/*
                  - !Sub >-
                    arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/finops-*/*
                Condition:
                  StringLikeIfExists:
                    cloudformation:ChangeSetName:
                      - finops-*
                      - !Sub >-
                        arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:changeSet/finops-*/*
              - Sid: PassOnlyFinOpsCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt FinOpsCloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ProveOnlyNamedWorkloadBudgets
                Effect: Allow
                Action:
                  - budgets:ListTagsForResource
                  - budgets:ViewBudget
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${AppName}-workload-monthly-total
              - Sid: ProveActiveApplicationCostAllocationTag
                Effect: Allow
                Action: ce:ListCostAllocationTags
                Resource: "*"
              - Sid: ProveOnlyAccountCostAnomalyControls
                Effect: Allow
                Action:
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalySubscriptions
                  - ce:ListTagsForResource
                Resource:
                  - !Sub >-
                    arn:${AWS::Partition}:ce::${AWS::AccountId}:anomalymonitor/*
                  - !Sub >-
                    arn:${AWS::Partition}:ce::${AWS::AccountId}:anomalysubscription/*
              - Sid: InspectAndTestAccountBoundNotificationRoutes
                Effect: Allow
                Action:
                  - sns:GetTopicAttributes
                  - sns:Publish
                Resource: !Sub >-
                  arn:${AWS::Partition}:sns:us-east-1:${AWS::AccountId}:*
              - Sid: InspectAccountBoundNotificationKeys
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                Resource: !Sub >-
                  arn:${AWS::Partition}:kms:us-east-1:${AWS::AccountId}:key/*
              - Sid: PublishOnlyThroughAccountBoundEncryptedSns
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !Sub >-
                  arn:${AWS::Partition}:kms:us-east-1:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: sns.us-east-1.amazonaws.com
                  StringLike:
                    kms:EncryptionContext:aws:sns:topicArn: !Sub >-
                      arn:${AWS::Partition}:sns:us-east-1:${AWS::AccountId}:*
              - Sid: RequiredFineGrainedBillingReadPermissions
                Effect: Allow
                Action:
                  - aws-portal:ViewBilling
                  - billing:GetBillingViewData
                Resource: "*"
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: finops-controls
        - Key: ManagedBy
          Value: CloudFormation

  FoundationAuthorityRetirementExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-foundation-authority-retirement-execution"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
