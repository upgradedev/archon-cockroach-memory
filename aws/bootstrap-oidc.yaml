  AlarmStateInspectionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AppName}-alarm-state-inspection"
      Roles:
        - !Ref StagingDeployRole
        - !Ref ProductionDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InspectCloudWatchAlarms
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: "*"

  StagingCodeDeployInspectionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AppName}-staging-codedeploy-inspection"
      Roles:
        - !Ref StagingDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOnlyStagingCanaryApplicationRevision
            Effect: Allow
            Action: codedeploy:GetApplicationRevision
            Resource: !Sub >-
              arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${AppName}-staging-*
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: InspectOnlyStagingCanaryDeploymentGroup
            Effect: Allow
            Action:
              - codedeploy:GetDeployment
              - codedeploy:GetDeploymentGroup
              - codedeploy:ListDeployments
            Resource: !Sub >-
              arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${AppName}-staging-*/*
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  StagingAlarmRoutingInspectionPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableAlarmRouting
    Properties:
      PolicyName: !Sub "${AppName}-staging-alarm-routing-inspection"
      Roles:
        - !Ref StagingDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InspectStagingAlarmTopic
            Effect: Allow
            Action:
              - sns:GetSubscriptionAttributes
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:ListTagsForResource
            Resource: !Ref StagingAlarmTopic
          - Sid: InspectStagingAlarmArchive
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
            Resource: !GetAtt StagingAlarmArchiveQueue.Arn
          - Sid: InspectAlarmNotificationKey
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
            Resource: !GetAtt AlarmNotificationsKey.Arn
  ProductionAlarmRoutingInspectionPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableAlarmRouting
    Properties:
      PolicyName: !Sub "${AppName}-production-alarm-routing-inspection"
      Roles:
        - !Ref ProductionDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InspectProductionAlarmTopic
            Effect: Allow
            Action:
              - sns:GetSubscriptionAttributes
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:ListTagsForResource
            Resource: !Ref ProductionAlarmTopic
          - Sid: InspectProductionAlarmArchive
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
            Resource: !GetAtt ProductionAlarmArchiveQueue.Arn
          - Sid: InspectAlarmNotificationKey
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
            Resource: !GetAtt AlarmNotificationsKey.Arn
Outputs:
  ApplicationStorageKeyArn:
    Value: !GetAtt ApplicationStorageKey.Arn
    Export:
      Name: !Sub "${AppName}-storage-kms-key-arn"
  ApplicationStorageKeyAliasArn:
    Value: !Sub >-
      arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${AppName}-storage
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CloudFrontAccessLogBucketName:
    Value: !Ref CloudFrontAccessLogBucket
  StagingOriginVerifySecretArn:
    Value: !Ref StagingOriginVerifySecret
  ProductionOriginVerifySecretArn:
    Value: !Ref ProductionOriginVerifySecret
  S3AccessLogArchiveName:
    Value: !Ref S3AccessLogArchive
  S3AccessLogArchiveArn:
    Value: !GetAtt S3AccessLogArchive.Arn
  S3AccessLogArchiveSuppressionRuleArn:
    Value: !GetAtt S3AccessLogArchiveS39Suppression.RuleArn
  EdgeControlRoleArn:
    Value: !GetAtt EdgeControlRole.Arn
  EdgeCleanupRoleArn:
    Value: !GetAtt EdgeCleanupRole.Arn
  FinOpsControlRoleArn:
    Value: !GetAtt FinOpsControlRole.Arn
  FinOpsCloudFormationExecutionRoleArn:
    Value: !GetAtt FinOpsCloudFormationExecutionRole.Arn
  AlarmRoutingControlRoleArn:
