AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Approval-gated CloudFront WAF control plane for Archon Memory. Deploy only in
  us-east-1 because AWS manages CloudFront-scope WAF resources there; this is
  not an application workload region.

Parameters:
  AppName:
    Type: String
    Default: archon-memory
    MinLength: 3
    MaxLength: 17
    AllowedPattern: "^[a-z][a-z0-9-]{2,16}$"
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
  ApiAggregateRateLimit:
    Type: Number
    Default: 1000
    MinValue: 100
    MaxValue: 10000
    Description: Maximum requests per source IP in the five-minute WAF window for /api/*.
  ResolutionCreateRateLimit:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 1000
    Description: Maximum resolution-session creates per source IP in the five-minute WAF window.

Rules:
  CloudFrontWafControlPlaneRegion:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: CloudFront-scope WAF must be deployed in us-east-1.

Resources:
  WafBlockLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      # CloudWatch Logs encrypts log data at rest with AWS-owned AES-GCM by
      # default. Omitting a customer-managed key reference preserves that
      # managed encryption boundary.
      LogGroupClass: STANDARD
      LogGroupName: !Sub "aws-waf-logs-${AppName}-${Environment}-blocked"
      RetentionInDays: 30
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: blocked-request-security-evidence
        - Key: ManagedBy
          Value: CloudFormation

  EdgeAlarmArchiveLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      # EventBridge cannot target an SQS queue encrypted with an AWS-owned key.
      # CloudWatch Logs provides AWS-owned encryption at rest without a CMK.
      LogGroupClass: STANDARD
      LogGroupName: !Sub >-
        /aws/events/${AppName}-${Environment}-edge-waf-alarm-archive
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: alarm-state-security-evidence
        - Key: ManagedBy
          Value: CloudFormation

  EdgeAlarmArchiveLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PolicyName: !Sub "${AppName}-${Environment}-edge-waf-alarm-archive"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowExactEventBridgeAlarmArchive",
              "Effect": "Allow",
              "Principal": {
                "Service": [
                  "delivery.logs.amazonaws.com",
                  "events.amazonaws.com"
                ]
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-${Environment}-edge-waf-alarm-archive:*",
              "Condition": {
                "ArnEquals": {
                  "aws:SourceArn": "arn:${AWS::Partition}:events:us-east-1:${AWS::AccountId}:rule/${AppName}-${Environment}-edge-waf-alarm-events"
                },
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                }
              }
            }
          ]
        }

  EdgeAlarmStateEventRule:
    Type: AWS::Events::Rule
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    DependsOn:
      - EdgeAlarmArchiveLogGroup
      - EdgeAlarmArchiveLogPolicy
    Properties:
      Description: !Sub >-
        Exact ALARM and OK state-change archive route for the three
        ${AppName} ${Environment} CloudFront WAF alarms.
      EventBusName: default
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        resources:
          - !Sub >-
              arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-${Environment}-waf-any-block
          - !Sub >-
              arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-${Environment}-waf-api-rate-block
          - !Sub >-
              arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:${AppName}-${Environment}-waf-resolution-rate-block
        detail:
          alarmName:
            - !Sub "${AppName}-${Environment}-waf-any-block"
            - !Sub "${AppName}-${Environment}-waf-api-rate-block"
            - !Sub "${AppName}-${Environment}-waf-resolution-rate-block"
          state:
            value:
              - ALARM
              - OK
      Name: !Sub "${AppName}-${Environment}-edge-waf-alarm-events"
      State: ENABLED
      Targets:
        - Arn: !Sub >-
            arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:/aws/events/${AppName}-${Environment}-edge-waf-alarm-archive
          Id: EdgeAlarmArchiveLogGroup
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: EvidenceRoute
          Value: waf-alarm-archive
        - Key: ManagedBy
          Value: CloudFormation

  ArchonCloudFrontWebAcl:
    Type: AWS::WAFv2::WebACL
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${AppName}-${Environment}-cloudfront"
      Description: Managed threat filters and bounded abuse controls for the public Archon demo.
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AppName}-${Environment}-web-acl"
        # WAF logging redaction does not apply to sampled requests. Sampling is
        # disabled so the BLOCK-only encrypted log route is the sole
        # request-level evidence surface.
        SampledRequestsEnabled: false
      Rules:
        - Name: AmazonIpReputation
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: amazon-ip-reputation
            SampledRequestsEnabled: false
        - Name: KnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
            SampledRequestsEnabled: false
        - Name: CommonApplicationThreats
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: common-application-threats
            SampledRequestsEnabled: false
        - Name: ApiAggregateRate
          Priority: 40
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: !Ref ApiAggregateRateLimit
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: api-aggregate-rate
            SampledRequestsEnabled: false
        - Name: ResolutionCreateRate
          Priority: 50
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: !Ref ResolutionCreateRateLimit
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: EXACTLY
                        SearchString: /api/resolution/session
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: resolution-create-rate
            SampledRequestsEnabled: false
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

  WafBlockLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    DependsOn: WafBlockLogGroup
    Properties:
      ResourceArn: !GetAtt ArchonCloudFrontWebAcl.Arn
      LogDestinationConfigs:
        - !Sub >-
            arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:aws-waf-logs-${AppName}-${Environment}-blocked
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Conditions:
              - ActionCondition:
                  Action: BLOCK
            Requirement: MEETS_ALL
      RedactedFields:
        - QueryString: {}
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie
        - SingleHeader:
            Name: referer
        - SingleHeader:
            Name: x-api-key
        - SingleHeader:
            Name: x-archon-origin-verify

  WebAclBlockedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-waf-any-block"
      AlarmDescription: >-
        One or more CloudFront WAF blocks in five minutes; EventBridge archives
        state changes while human paging remains separately governed.
      ActionsEnabled: false
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub "${AppName}-${Environment}-web-acl"
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Unit: Count
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ApiAggregateRateAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-waf-api-rate-block"
      AlarmDescription: >-
        CloudFront WAF aggregate API rate rule blocked one or more requests in
        five minutes.
      ActionsEnabled: false
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub "${AppName}-${Environment}-web-acl"
        - Name: Rule
          Value: api-aggregate-rate
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Unit: Count
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ResolutionCreateRateAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: !Sub "${AppName}-${Environment}-waf-resolution-rate-block"
      AlarmDescription: >-
        CloudFront WAF resolution-create rate rule blocked one or more
        requests in five minutes.
      ActionsEnabled: false
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Sub "${AppName}-${Environment}-web-acl"
        - Name: Rule
          Value: resolution-create-rate
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Unit: Count
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  WebAclArn:
    Description: Pass this ARN to the regional application stack only after approved activation and drills.
    Value: !GetAtt ArchonCloudFrontWebAcl.Arn
  WebAclId:
    Value: !GetAtt ArchonCloudFrontWebAcl.Id
  ControlPlaneRegion:
    Value: !Ref "AWS::Region"
  WafBlockLogGroupName:
    Value: !Ref WafBlockLogGroup
  EdgeAlarmArchiveLogGroupName:
    Value: !Ref EdgeAlarmArchiveLogGroup
  EdgeAlarmStateEventRuleName:
    Value: !Ref EdgeAlarmStateEventRule
  WebAclBlockedRequestsAlarmName:
    Value: !Ref WebAclBlockedRequestsAlarm
  ApiAggregateRateAlarmName:
    Value: !Ref ApiAggregateRateAlarm
  ResolutionCreateRateAlarmName:
    Value: !Ref ResolutionCreateRateAlarm
