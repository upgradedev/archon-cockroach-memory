---
- name: Secure S3 bucket passes the storage rules
  input:
    Resources:
      SecureBucket:
        Type: AWS::S3::Bucket
        Properties:
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          VersioningConfiguration:
            Status: Enabled
  expectations:
    rules:
      s3_buckets_are_encrypted: PASS
      s3_buckets_block_all_public_access: PASS
      s3_buckets_enable_versioning: PASS

- name: Public unencrypted S3 bucket fails the storage rules
  input:
    Resources:
      UnsafeBucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: false
            BlockPublicPolicy: false
            IgnorePublicAcls: false
            RestrictPublicBuckets: false
          VersioningConfiguration:
            Status: Suspended
  expectations:
    rules:
      s3_buckets_are_encrypted: FAIL
      s3_buckets_block_all_public_access: FAIL
      s3_buckets_enable_versioning: FAIL

- name: Encrypted notification resources pass
  input:
    Resources:
      AlarmKey:
        Type: AWS::KMS::Key
        Properties:
          EnableKeyRotation: true
      AlarmTopic:
        Type: AWS::SNS::Topic
        Properties:
          KmsMasterKeyId: key-arn
      AlarmQueue:
        Type: AWS::SQS::Queue
        Properties:
          KmsMasterKeyId: key-arn
  expectations:
    rules:
      kms_keys_enable_rotation: PASS
      sns_topics_are_encrypted: PASS
      sqs_queues_are_encrypted: PASS

- name: Unencrypted notification resources fail
  input:
    Resources:
      AlarmKey:
        Type: AWS::KMS::Key
        Properties:
          EnableKeyRotation: false
      AlarmTopic:
        Type: AWS::SNS::Topic
        Properties: {}
      AlarmQueue:
        Type: AWS::SQS::Queue
        Properties: {}
  expectations:
    rules:
      kms_keys_enable_rotation: FAIL
      sns_topics_are_encrypted: FAIL
      sqs_queues_are_encrypted: FAIL

- name: Bounded logs and HTTPS distribution pass
  input:
    Resources:
      ApiLogs:
        Type: AWS::Logs::LogGroup
        Properties:
          RetentionInDays: 30
      Distribution:
        Type: AWS::CloudFront::Distribution
        Properties:
          DistributionConfig:
            DefaultCacheBehavior:
              ViewerProtocolPolicy: redirect-to-https
  expectations:
    rules:
      log_groups_have_bounded_retention: PASS
      cloudfront_redirects_default_viewers_to_https: PASS

- name: Unbounded logs and HTTP distribution fail
  input:
    Resources:
      ApiLogs:
        Type: AWS::Logs::LogGroup
        Properties:
          RetentionInDays: 365
      Distribution:
        Type: AWS::CloudFront::Distribution
        Properties:
          DistributionConfig:
            DefaultCacheBehavior:
              ViewerProtocolPolicy: allow-all
  expectations:
    rules:
      log_groups_have_bounded_retention: FAIL
      cloudfront_redirects_default_viewers_to_https: FAIL

- name: Observable throttled API and bounded Lambda defaults pass
  input:
    Globals:
      Function:
        Runtime: nodejs22.x
        Timeout: 30
        Tracing: Active
    Resources:
      Api:
        Type: AWS::Serverless::HttpApi
        Properties:
          AccessLogSettings:
            DestinationArn: log-group-arn
          DefaultRouteSettings:
            DetailedMetricsEnabled: true
            ThrottlingBurstLimit: 10
            ThrottlingRateLimit: 5
  expectations:
    rules:
      http_apis_have_access_logs_and_throttling: PASS
      sam_function_defaults_are_bounded: PASS

- name: Unobserved unthrottled API and loose Lambda defaults fail
  input:
    Globals:
      Function:
        Runtime: nodejs20.x
        Timeout: 120
        Tracing: PassThrough
    Resources:
      Api:
        Type: AWS::Serverless::HttpApi
        Properties:
          DefaultRouteSettings:
            DetailedMetricsEnabled: false
  expectations:
    rules:
      http_apis_have_access_logs_and_throttling: FAIL
      sam_function_defaults_are_bounded: FAIL
