AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Approval-gated AWS billing control plane for Archon Memory. This template
  defines a monthly cost budget and immediate service-level anomaly alerts.
  It has no deployment workflow and must not be activated until the FinOps
  owner, thresholds, SNS destination, cost, rollback, and approval reference
  have been reviewed.

Parameters:
  AppName:
    Type: String
    Default: archon-memory
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production
  MonthlyBudgetUsd:
    Type: Number
    MinValue: 1
    MaxValue: 1000000
    Description: >-
      Human-approved monthly AWS cost budget in USD. No default is provided so
      repository code cannot silently select a financial threshold.
  AnomalyImpactUsd:
    Type: Number
    MinValue: 1
    MaxValue: 1000000
    Description: >-
      Human-approved minimum absolute anomaly impact in USD. Combined with the
      percentage threshold to reduce unbounded alert noise.
  AnomalyImpactPercentage:
    Type: Number
    MinValue: 1
    MaxValue: 10000
    Description: Human-approved minimum anomaly impact percentage.
  FinOpsNotificationTopicArn:
    Type: String
    AllowedPattern: "^arn:aws:sns:us-east-1:[0-9]{12}:[A-Za-z0-9_-]+$"
    ConstraintDescription: >-
      Must be an existing, encrypted, human-routed SNS topic in us-east-1.
  FinOpsOwnerReference:
    Type: String
    MinLength: 3
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:/@+-]{2,127}$"
    Description: Non-secret accountable-owner identifier approved for alert routing.
  ActivationApprovalReference:
    Type: String
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$"
    Description: Non-secret reference to the explicit billable-control approval.

Rules:
  BillingControlPlaneRegion:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: >-
          Budgets and Cost Anomaly Detection are managed from the us-east-1
          billing control plane; this is not an application workload region.

Resources:
  MonthlyWorkloadBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AppName}-${Environment}-monthly-total"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

  ServiceCostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: !Sub "${AppName}-${Environment}-services"
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

  ImmediateCostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: !Sub "${AppName}-${Environment}-immediate"
      Frequency: IMMEDIATE
      MonitorArnList:
        - !Ref ServiceCostAnomalyMonitor
      Subscribers:
        - Address: !Ref FinOpsNotificationTopicArn
          Type: SNS
      ThresholdExpression: !Sub >-
        {
          "And": [
            {
              "Dimensions": {
                "Key": "ANOMALY_TOTAL_IMPACT_ABSOLUTE",
                "MatchOptions": ["GREATER_THAN_OR_EQUAL"],
                "Values": ["${AnomalyImpactUsd}"]
              }
            },
            {
              "Dimensions": {
                "Key": "ANOMALY_TOTAL_IMPACT_PERCENTAGE",
                "MatchOptions": ["GREATER_THAN_OR_EQUAL"],
                "Values": ["${AnomalyImpactPercentage}"]
              }
            }
          ]
        }
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

Outputs:
  BudgetName:
    Description: Name of the approval-gated monthly workload budget.
    Value: !Ref MonthlyWorkloadBudget
  AnomalyMonitorArn:
    Description: ARN of the approval-gated service cost anomaly monitor.
    Value: !Ref ServiceCostAnomalyMonitor
  AnomalySubscriptionArn:
    Description: ARN of the approval-gated immediate anomaly subscription.
    Value: !Ref ImmediateCostAnomalySubscription
