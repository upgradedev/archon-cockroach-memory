AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Approval-gated AWS billing control plane for Archon Memory. This template
  defines one application-scoped monthly cost budget and one customer-managed
  application cost monitor with immediate anomaly alerts.
  Its protected manual workflow supports exact-SHA plan, apply, and verify,
  but must not be activated until the FinOps owner, thresholds, encrypted SNS
  destination, cost, rollback, and approval reference have been reviewed.

Parameters:
  AppName:
    Type: String
    Default: archon-memory
    MinLength: 3
    MaxLength: 17
    AllowedPattern: "^[a-z][a-z0-9-]{2,16}$"
  MonthlyBudgetUsd:
    Type: Number
    MinValue: 1
    MaxValue: 1000000
    Description: >-
      Human-approved monthly AWS cost budget in USD. No default is provided so
      repository code cannot silently select a financial threshold.
  AnomalyImpactUsd:
    Type: Number
    MinValue: 1
    MaxValue: 1000000
    Description: >-
      Human-approved minimum absolute anomaly impact in USD. Combined with the
      percentage threshold to reduce unbounded alert noise.
  AnomalyImpactPercentage:
    Type: Number
    MinValue: 1
    MaxValue: 10000
    Description: Human-approved minimum anomaly impact percentage.
  FinOpsNotificationTopicArn:
    Type: String
    AllowedPattern: "^arn:aws:sns:us-east-1:[0-9]{12}:[A-Za-z0-9_-]+$"
    ConstraintDescription: >-
      Must be an existing, encrypted, human-routed SNS topic in us-east-1.
  FinOpsOwnerReference:
    Type: String
    MinLength: 3
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:/@+-]{2,127}$"
    Description: Non-secret accountable-owner identifier approved for alert routing.
  ActivationApprovalReference:
    Type: String
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{7,127}$"
    Description: Non-secret reference to the explicit billable-control approval.

Rules:
  BillingControlPlaneRegion:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: >-
          Budgets and Cost Anomaly Detection are managed from the us-east-1
          billing control plane; this is not an application workload region.

Resources:
  MonthlyWorkloadBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AppName}-workload-monthly-total"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        FilterExpression:
          Tags:
            Key: Application
            Values:
              - !Ref AppName
            MatchOptions:
              - EQUALS
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref FinOpsNotificationTopicArn
              SubscriptionType: SNS
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: FinOpsScope
          Value: workload
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

  WorkloadCostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: !Sub "${AppName}-workload-cost"
      MonitorType: CUSTOM
      MonitorSpecification: !Sub >-
        {
          "Tags": {
            "Key": "Application",
            "Values": ["${AppName}"],
            "MatchOptions": ["EQUALS"]
          }
        }
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: FinOpsScope
          Value: workload
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

  ImmediateCostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: !Sub "${AppName}-workload-immediate"
      Frequency: IMMEDIATE
      MonitorArnList:
        - !Ref WorkloadCostAnomalyMonitor
      Subscribers:
        - Address: !Ref FinOpsNotificationTopicArn
          Type: SNS
      ThresholdExpression: !Sub >-
        {
          "And": [
            {
              "Dimensions": {
                "Key": "ANOMALY_TOTAL_IMPACT_ABSOLUTE",
                "MatchOptions": ["GREATER_THAN_OR_EQUAL"],
                "Values": ["${AnomalyImpactUsd}"]
              }
            },
            {
              "Dimensions": {
                "Key": "ANOMALY_TOTAL_IMPACT_PERCENTAGE",
                "MatchOptions": ["GREATER_THAN_OR_EQUAL"],
                "Values": ["${AnomalyImpactPercentage}"]
              }
            }
          ]
        }
      ResourceTags:
        - Key: Application
          Value: !Ref AppName
        - Key: FinOpsScope
          Value: workload
        - Key: FinOpsOwner
          Value: !Ref FinOpsOwnerReference
        - Key: ActivationApproval
          Value: !Ref ActivationApprovalReference
        - Key: ApprovalBoundary
          Value: explicit-live-activation-required

Outputs:
  BudgetName:
    Description: Name of the approval-gated monthly workload budget.
    Value: !Ref MonthlyWorkloadBudget
  AnomalyMonitorArn:
    Description: ARN of the approval-gated application cost anomaly monitor.
    Value: !Ref WorkloadCostAnomalyMonitor
  AnomalySubscriptionArn:
    Description: ARN of the approval-gated immediate anomaly subscription.
    Value: !Ref ImmediateCostAnomalySubscription
